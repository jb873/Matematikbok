  background:#fff;color:var(--ink);outline:none;padding:0 10px;
}
.mult-rad-input:focus{box-shadow:0 0 0 3px rgba(180,83,9,.15)}
.mult-rad-input.correct{background:var(--success-bg);border-color:var(--success)}
.mult-rad-input.wrong{background:var(--error-bg);border-color:var(--error)}
.mult-exempel{
  background:var(--bg-warm);border-radius:var(--radius);padding:12px 14px;
  margin-bottom:16px;font-size:13px;line-height:1.7;
}
.mult-exempel strong{color:var(--c-metod)}
.mult-exempel .ex-rad{font-family:var(--mono);color:var(--ink);font-size:14px}

/* ==== DEL 3: BERÄKNINGAR ==== */
.rakna-tal{
  font-family:var(--mono);font-size:28px;font-weight:600;color:var(--c-rakna);
  text-align:center;margin:14px 0 8px;word-break:break-word;line-height:1.3;
}
.rakna-svar-rad{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.rakna-svar-fast{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--ink)}
.rakna-svar-input{
  min-width:170px;max-width:340px;height:52px;
  font-family:var(--mono);font-size:24px;font-weight:700;text-align:center;
  border:2.5px solid var(--c-rakna);border-radius:var(--radius);
  background:var(--c-rakna-bg);color:var(--c-rakna);outline:none;padding:0 12px;
}
.rakna-svar-input:focus{background:#fff;box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.rakna-svar-input.correct{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.rakna-svar-input.wrong{background:var(--error-bg);border-color:var(--error);color:var(--error)}
.rakna-kat-exempel{
  background:var(--c-rakna-bg);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:16px;font-size:13px;line-height:1.7;
}
.rakna-kat-exempel strong{color:var(--c-rakna)}
.rakna-kat-exempel .ex-rad{font-family:var(--mono);color:var(--ink);font-size:14px}

/* ==== DEL 3: UPPSTÄLLNING MULTIPLIKATION ==== */
.mult-upp-box{
  display:inline-flex;flex-direction:column;align-items:flex-end;gap:2px;
  font-family:var(--mono);padding:16px 22px;background:var(--bg-card);
  border:1px solid var(--line);border-radius:var(--radius);min-width:160px;
}
.mult-upp-row{display:flex;gap:2px;justify-content:flex-end;align-items:center}
.mult-upp-row .cell{
  width:40px;height:44px;display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:500;color:var(--ink);
}
.mult-upp-row .opcell{width:30px;font-size:24px;font-weight:700;color:var(--c-metod)}
.mult-upp-carry{display:flex;gap:2px;justify-content:flex-end;min-height:22px}
.mult-upp-carry .cell{
  width:40px;height:20px;display:flex;align-items:center;justify-content:center;
  font-size:13px;color:var(--error);font-weight:700;
}
.mult-upp-line{width:100%;height:2px;background:var(--ink);margin:5px 0}
.mult-upp-ans{
  width:40px;height:46px;font-family:var(--mono);font-size:24px;font-weight:600;
  text-align:center;border:2px solid var(--c-metod);border-radius:var(--radius-sm);
  background:var(--primary-bg);color:var(--ink);outline:none;padding:0;
}
.mult-upp-ans:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(180,83,9,.15)}
.mult-upp-ans.correct{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.mult-upp-ans.wrong{background:var(--error-bg);border-color:var(--error);color:var(--error)}
.mult-upp-carrin{
  width:30px;height:24px;font-family:var(--mono);font-size:13px;font-weight:700;
  text-align:center;border:1.5px dashed var(--line);border-radius:4px;
  background:var(--bg-soft);color:var(--error);outline:none;padding:0;
}
.mult-upp-carrin:focus{border-color:var(--error);background:var(--error-bg)}
.mult-demo-steg{
  background:var(--bg-warm);border-radius:var(--radius-sm);padding:10px 14px;
  font-size:13px;line-height:1.6;color:var(--ink);margin-top:12px;min-height:20px;
}

/* ==== UPPSTÄLLNING: LAYOUT MED MINNESSIFFROR TILL HÖGER ==== */
.mult-upp-flex{display:flex;align-items:flex-start;gap:14px}
.mult-upp-rows-wrap{display:flex}
.mult-upp-rows{display:flex;flex-direction:column;gap:2px}
.mult-minne-panel{
  border:1px dashed var(--line);border-radius:var(--radius-sm);
  padding:8px 10px;background:var(--bg-soft);max-width:140px;
}
.mult-minne-rubrik{
  font-size:10px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-faint);margin-bottom:6px;text-align:center;
}
.mult-minne-rutor{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.mult-minne-ruta{
  width:30px;height:30px;font-family:var(--mono);font-size:15px;font-weight:700;
  text-align:center;border:1.5px dashed var(--line);border-radius:4px;
  background:#fff;color:var(--error);outline:none;padding:0;cursor:pointer;
}
.mult-minne-ruta:focus{border-color:var(--error);background:var(--error-bg)}
.mult-minne-ruta.struck{
  position:relative;color:var(--ink-faint);
  background:repeating-linear-gradient(135deg,transparent,transparent 9px,var(--error) 9px,var(--error) 11px);
}
.mult-minne-tips{font-size:10px;color:var(--ink-faint);margin-top:7px;line-height:1.4;text-align:center}
.mult-minne-demo-col{
  display:flex;align-items:center;min-width:34px;padding-top:44px;
}
.mult-minne-demo{
  width:30px;height:32px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:17px;font-weight:700;color:var(--error);
}
.mult-minne-demo.struck{
  position:relative;
}
.mult-minne-demo.struck::after{
  content:'';position:absolute;left:-1px;top:50%;width:calc(100% + 2px);height:2px;
  background:var(--error);transform:rotate(-22deg);
}

/* ==== DEL 5 – DIVISION ==== */
.div-delbar-prompt{
  font-size:16px;font-weight:500;color:var(--ink);text-align:center;
  margin:6px 0 14px;line-height:1.5;
}
.div-tal-grid{
  display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:4px 0 6px;
}
.div-tal-tagg{
  min-width:64px;padding:12px 16px;font-family:var(--mono);font-size:20px;font-weight:600;
  border:2px solid var(--line);border-radius:var(--radius-sm);background:#fff;color:var(--ink);
  cursor:pointer;transition:transform .08s,background .12s,border-color .12s;
}
.div-tal-tagg:hover:not(:disabled){border-color:var(--c-metod);transform:translateY(-1px)}
.div-tal-tagg.is-picked{background:var(--primary-bg);border-color:var(--primary);color:var(--ink)}
.div-tal-tagg:disabled{cursor:default}
.div-tal-tagg.tagg-correct{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.div-tal-tagg.tagg-missad{background:#fef3c7;border-color:#f59e0b;color:#92400e}
.div-tal-tagg.tagg-wrong{background:var(--error-bg);border-color:var(--error);color:var(--error)}
.div-gata-card{
  background:var(--bg-warm);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 20px;margin:6px 0 14px;
}
.div-gata-rubrik{
  font-size:10px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-faint);margin-bottom:8px;
}
.div-gata-lista{margin:0;padding-left:22px}
.div-gata-lista li{font-size:15px;line-height:1.7;color:var(--ink)}
.div-metod-steg{margin:14px 0 0;padding-left:22px}
.div-metod-steg li{font-size:14px;line-height:1.7;color:var(--ink);margin-bottom:4px}
/* Kort division */
.div-kort-box{
  display:inline-flex;align-items:center;gap:16px;
  font-family:var(--mono);padding:18px 24px;background:var(--bg-card);
  border:1px solid var(--line);border-radius:var(--radius);
}
.div-kort-frac{display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.div-frac-line{height:2px;background:var(--ink);margin:4px 0}
.div-kort-eq{font-size:26px;font-weight:700;color:var(--c-metod)}
.div-carry-demo{
  width:30px;height:24px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:14px;font-weight:700;color:var(--error);
}
.div-kort-digcell{position:relative;}
.div-kort-carry{
  position:absolute;left:-11px;bottom:3px;
  width:21px;height:23px;
  font-family:var(--mono);font-size:13px;font-weight:700;text-align:center;
  color:var(--error);border:1.5px dashed var(--line);border-radius:4px;
  background:#fff;outline:none;padding:0;z-index:2;
}
.div-kort-carry:focus{border-color:var(--error);background:var(--error-bg)}
.div-kort-carry.correct{border-style:solid;border-color:var(--success);background:var(--success-bg);color:var(--success)}
.div-kort-carry.wrong{border-style:solid;border-color:var(--error);background:var(--error-bg);color:var(--error)}
.div-kort-carry-demo{
  position:absolute;left:-11px;bottom:3px;
  width:21px;height:23px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:13px;font-weight:700;color:var(--error);
}
/* Lång division */
.div-lang-wall{border-left:2px solid var(--ink);font-weight:500}
.div-step-line{height:2px;background:var(--line);margin:3px 0}

@media (max-width:600px){
  .layout{padding:16px 12px 100px}
  .header-card{padding:20px}
  .header-title{font-size:24px}
  .ko-card{padding:18px;gap:14px}
  .ko-num{width:40px;height:40px;font-size:22px}
  .ko-name{font-size:17px}
  .exercise-card{padding:20px}
  .formaga-grid{grid-template-columns:1fr}
  .mult-rad-input{min-width:150px}
  .tabell-fraga{font-size:36px}
}

/* ==== DEL 7: PRIORITERINGSREGELN OCH LAGAR ==== */
.prio-eq-rad{
  display:flex;align-items:center;justify-content:center;gap:8px;
  flex-wrap:wrap;margin:26px 0;
}
.prio-eq-part{
  font-family:var(--mono);font-size:30px;font-weight:600;color:var(--ink);
}
.prio-box-input{
  width:84px;height:60px;
  font-family:var(--mono);font-size:28px;font-weight:700;text-align:center;
  border:2.5px dashed var(--c-rakna);border-radius:var(--radius-sm);
  background:var(--c-rakna-bg);color:var(--c-rakna);outline:none;padding:0;
}
.prio-box-input:focus{background:#fff;box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.prio-box-input.correct{background:var(--success-bg);border-color:var(--success);border-style:solid;color:var(--success)}
.prio-box-input.wrong{background:var(--error-bg);border-color:var(--error);border-style:solid;color:var(--error)}
.prio-expr-stor{
  font-family:var(--mono);font-size:32px;font-weight:600;
  text-align:center;color:var(--ink);margin:26px 0 6px;
}
.prio-expr-eq{color:var(--ink-faint);}
.prio-metod-trappa{
  margin:22px 0;padding:20px 22px;
  background:var(--bg-warm);border:1px solid var(--line);border-radius:var(--radius);
  display:inline-flex;flex-direction:column;gap:10px;
}
.prio-uppgift-rad,.prio-steg{
  display:grid;
  grid-template-columns:minmax(170px,auto) 30px minmax(130px,auto);
  align-items:center;gap:10px;
}
.prio-uppgift-expr{font-family:var(--mono);font-size:25px;font-weight:600;color:var(--ink);text-align:right;white-space:nowrap;}
.prio-eq{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--ink-faint);text-align:center;}
.prio-vl,.prio-svar{
  height:46px;font-family:var(--mono);font-size:22px;text-align:center;
  border:2px dashed var(--line);border-radius:10px;background:var(--bg-soft);color:var(--ink);
}
.prio-vl{min-width:170px;}
.prio-svar{min-width:130px;}
.prio-vl:focus,.prio-svar:focus{outline:none;background:#fff;border-style:solid;box-shadow:0 0 0 3px rgba(22,163,74,.15);}
.prio-vl.correct,.prio-svar.correct{background:var(--success-bg);border-color:var(--success);border-style:solid;color:var(--success);}
.prio-vl.wrong,.prio-svar.wrong{background:var(--error-bg);border-color:var(--error);border-style:solid;color:var(--error);}
.prio-tom{display:inline-block;}
.prio-metod-trappa-GAMMAL{
  display:grid;

  justify-content:center;align-items:center;

.prio-step-line{display:contents;}
.prio-step-lhs{
  display:flex;align-items:center;flex-wrap:wrap;gap:6px;justify-content:flex-end;
  font-family:var(--mono);font-size:24px;color:var(--ink);
}
.prio-step-eq{
  font-family:var(--mono);font-size:24px;font-weight:600;color:var(--ink-faint);
}
.prio-step-rhs{display:flex;align-items:center;}
.prio-step-expr .prio-step-lhs{font-size:26px;font-weight:600;}
.prio-step-expr .prio-step-eq{font-size:26px;}
.prio-step-fix{color:var(--ink);font-weight:500;}
.prio-step-input{
  width:62px;height:46px;
  font-family:var(--mono);font-size:21px;font-weight:700;text-align:center;
  border:2px solid var(--c-rakna);border-radius:var(--radius-sm);
  background:var(--c-rakna-bg);color:var(--c-rakna);outline:none;padding:0;
}
.prio-step-input:focus{background:#fff;box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.prio-step-input.correct{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.prio-step-input.wrong{background:var(--error-bg);border-color:var(--error);color:var(--error)}
.prio-step-answer{width:90px;height:50px;font-size:24px;border-width:2.5px;}
.prio-step-op{
  width:44px;border-color:var(--c-metod);
  background:var(--primary-bg);color:var(--c-metod);
}
.prio-step-op:focus{background:#fff;box-shadow:0 0 0 3px rgba(180,83,9,.15)}
.prio-rad{
  display:flex;align-items:center;flex-wrap:wrap;gap:7px;justify-content:center;
  margin:24px 0;padding:20px 22px;
  background:var(--bg-warm);border:1px solid var(--line);border-radius:var(--radius);
}
.prio-rad-expr{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--ink);}
.prio-rad-eq{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--ink-faint);}


/* ==== DEL 8: NEGATIVA TAL ==== */
.neg-fraga{text-align:center;margin:22px 0 6px;font-size:18px;color:var(--ink);line-height:1.5;}
.neg-expr{font-family:var(--mono);font-size:30px;font-weight:600;color:var(--ink);}
.neg-hint{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);text-align:center;margin:18px 0 8px;}
.neg-seq{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;margin:22px 0;}
.neg-seq-term{
  min-width:54px;height:50px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:22px;font-weight:600;color:var(--ink);
  background:var(--bg-warm);border:1px solid var(--line);border-radius:var(--radius-sm);padding:0 10px;
}
.neg-seq-input{
  width:74px;height:50px;
  font-family:var(--mono);font-size:21px;font-weight:700;text-align:center;
  border:2.5px dashed var(--c-rakna);border-radius:var(--radius-sm);
  background:var(--c-rakna-bg);color:var(--c-rakna);outline:none;padding:0;
}
.neg-seq-input:focus{background:#fff;box-shadow:0 0 0 3px rgba(22,163,74,.15);}
.neg-seq-input.correct{background:var(--success-bg);border-style:solid;border-color:var(--success);color:var(--success);}
.neg-seq-input.wrong{background:var(--error-bg);border-style:solid;border-color:var(--error);color:var(--error);}
.neg-chip-row,.neg-order-row{display:flex;flex-wrap:wrap;justify-content:center;gap:11px;margin:6px 0;}
.neg-chip{
  min-width:56px;height:48px;padding:0 14px;
  font-family:var(--mono);font-size:20px;font-weight:600;
  border:2px solid var(--c-metod);border-radius:var(--radius-sm);

function isPrime(n){
  if(n<2)return false;
  if(n===2)return true;
  if(n%2===0)return false;
  for(let i=3;i*i<=n;i+=2)if(n%i===0)return false;
  return true;
}
function primeFactorize(n){
  const f=[];let x=n;
  for(let p=2;p*p<=x;p++){while(x%p===0){f.push(p);x/=p}}
  if(x>1)f.push(x);
  return f;
}
function sortAsc(a){return [...a].sort((x,y)=>x-y)}
function randPick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function compositesUpTo(max){
  const out=[];
  for(let i=4;i<=max;i++) if(!isPrime(i)) out.push(i);

}

// ============================================================
// STATE
// ============================================================
const state = {
  currentDel: null,
  currentKO: null,
  currentFormaga: null,
  // Tutor's "verdict" per (ko, formaga)
  tutorScores: {}, // {ko: {formaga: {correct: n, total: m}}}
  // Self-assessment storage
  skattningar: {} // {ko: {key: 'kan'|'osaker'|'kanej', ...}}
};

function getTutorScore(koId, formagaKey){
  if(!state.tutorScores[koId])state.tutorScores[koId]={};
  if(!state.tutorScores[koId][formagaKey])state.tutorScores[koId][formagaKey]={correct:0,total:0,score:0};
  var raw = state.tutorScores[koId][formagaKey];
  // Returnera en proxy som även för in repetitions-bokföring.
  // Befintliga övningar gör t.ex. "ts.total++; if(ok) ts.correct++;" – båda
  // sker i samma "turn". Vi skjuter upp registreringen till nästa mikrotask
  // så att vi hunnit se eventuell correct-ökning innan vi avgör rätt/fel.
  if(typeof repRegister !== 'function') return raw;
  if(raw.__proxied) return raw.__proxy;
  var lastTotal = raw.total, lastCorrect = raw.correct, pending = false;
  function flush(){
    pending = false;
    if(raw.total > lastTotal){
      var blevRatt = raw.correct > lastCorrect;
      lastTotal = raw.total; lastCorrect = raw.correct;
      try{ repRegister(koId, formagaKey, blevRatt); } catch(e){}
    }
  }
  var p = new Proxy(raw, {
    set: function(obj, prop, val){
      obj[prop] = val;
      if((prop === 'total' || prop === 'correct') && !pending){
        pending = true;
        Promise.resolve().then(flush);
      }
      return true;
    }
  });
  raw.__proxied = true;
  raw.__proxy = p;
  return p;
}

const VERDICT_TEXT = {kan:'Kan', osaker:'Osäker', kanej:'Kan ej'};

function tutorVerdictFor(koId, formagaKey){
  const ts = state.tutorScores[koId] && state.tutorScores[koId][formagaKey];
  if(!ts || ts.total === 0) return null;
  if(formagaKey === 'resonera'){
    const avg = (ts.score||0)/ts.total;
    if(avg >= 0.75) return 'kan';
    if(avg >= 0.4) return 'osaker';
    return 'kanej';
  }
  const ratio = ts.correct/ts.total;
  if(ratio >= 0.8) return 'kan';
  if(ratio >= 0.5) return 'osaker';
  return 'kanej';
}

// ============================================================
function getSummaryCopy(right, total){
  if(right === total){
    const msgs = [
      'Helt galet bra – alla rätt! Du har full koll på det här.',
      'Imponerande! Inte ett enda fel.',
      'Fullt hus! Du behärskar verkligen det här.',
      'Felfritt! Du har stenkoll.',
      'Wow, alla rätt! Snyggt jobbat.'
    ];
    return {emoji:'🌟', title:'Alla rätt!', message: randPick(msgs), celebration:true};
  }
  if(right >= total - 1){
    return {emoji:'🎉', title:'Riktigt bra jobbat!', message:'Nästan alla rätt – bara ett misstag. Du är på god väg!', celebration:true};
  }
  if(right >= Math.ceil(total * 0.75)){
    return {emoji:'👍', title:'Bra jobbat!', message:'De flesta rätt. Med lite mer träning sitter det.', celebration:false};
  }
  if(right >= Math.ceil(total * 0.5)){
    return {emoji:'💪', title:'Bra ansträngning!', message:'Du har koll på en del. Träna lite till så blir det säkrare.', celebration:false};
  }
  return {emoji:'🌱', title:'Bra att du försöker!', message:'Här finns lite att jobba på. Titta på förklaringarna och försök igen – det här kommer!', celebration:false};
}

/**
 * Returns HTML for a summary card. Caller wires up the button onclick.
 * level: 1, 2, 3 or null
 * levelChange: 'up' | 'down' | null
 */
function renderSummaryCard(opts){
  const {right, total, level, levelChange, nextLabel='Ny omgång'} = opts;
  const summary = getSummaryCopy(right, total);
  let levelMsg = '';
  if(levelChange === 'up') levelMsg = `↑ Nivå upp till ${level} – nu blir det svårare!`;
  else if(levelChange === 'down') levelMsg = `↓ Nivå ner till ${level} – vi tar det lite lugnare.`;
  return `
    <div class="summary-card ${summary.celebration?'celebration':''}">
      <div class="summary-emoji bounce">${summary.emoji}</div>
      <h3 class="summary-title ${summary.celebration?'celebration':''}">${summary.title}</h3>
      <div class="summary-score">${right} / ${total}</div>
      <p class="summary-message">${summary.message}</p>
      ${levelMsg ? `<div class="summary-level-change ${levelChange==='down'?'down':''}">${levelMsg}</div>` : ''}
      <div class="summary-actions">
        <button class="btn primary" id="summary-next-btn">${nextLabel}</button>
        <button class="btn" onclick="navTo('ko',{koId:'${state.currentKO}'})">Tillbaka</button>
      </div>
    </div>
  `;
}

/**
 * Adaptive level adjustment: ≥(total-1) right = level up, ≤floor(total/3) = level down
 * Returns new {level, change}
 */
function adjustLevel(level, right, total){
  if(right >= total - 1 && level < 3) return {level: level+1, change: 'up'};
  if(right <= Math.floor(total/3) && level > 1) return {level: level-1, change: 'down'};
  return {level, change: null};
}

  else if(view==='ko') renderKO(opts.koId, opts.delId);
  else if(view==='ovning') renderOvning(opts.koId, opts.formaga);
  else if(view==='skattning') renderSkattning();
  else if(view==='test-config') renderTestConfig();
  else if(view==='test-take') renderTestTake();
  else if(view==='test-result') renderTestResult();
}

        ${exerciseHeader('Resonera · förklara med egna ord', `Fråga ${omgangResults.length + 1} av ${OMGANG_SIZE} · tutorn ger återkoppling.`)}
        <div class="res-task">
          <div class="res-question">${currentQ.q}</div>
          <textarea class="res-textarea" id="res-input" placeholder="Skriv din förklaring..."></textarea>
          <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;">
            <button class="btn primary" id="res-submit">Skicka till tutorn</button>
            <button class="btn" id="res-next" style="display:none;">${omgangResults.length + 1 >= OMGANG_SIZE ? 'Se resultat' : 'Nästa fråga'}</button>
            <button class="btn subtle" onclick="navTo('ko',{koId:'primtal'})">Tillbaka</button>
          </div>
          <div class="res-loading" id="res-loading" style="display:none;">Tutorn läser ditt svar...</div>
          <div class="res-feedback" id="res-fb"></div>
        </div>
      </div>
    `;
    answered = false;
    document.getElementById('res-submit').onclick = submitAnswer;
    document.getElementById('res-next').onclick = ()=>{
      if(omgangResults.length >= OMGANG_SIZE){
        showSummary();
      } else {
        currentQ = randPick(RESONERA_FRAGOR.filter(f=>f.q!==currentQ.q));
        render();
      }
    };
  }

  async function submitAnswer(){
    if(answered) return;
    const text = document.getElementById('res-input').value.trim();
    if(!text){ alert('Skriv något i rutan först.'); return; }
    const btn = document.getElementById('res-submit');
    const loading = document.getElementById('res-loading');
    const fb = document.getElementById('res-fb');
    btn.disabled = true;
    loading.style.display = 'block';
    fb.classList.remove('show');

    try{
      const r = await assessReasoning(currentQ.q, currentQ.rubric, text);
      fb.innerHTML = `<strong>Tutorns återkoppling</strong>${r.feedback}`;
      fb.classList.add('show');
      const ts = getTutorScore('primtal','resonera');
      ts.total++;
      ts.score = (ts.score||0) + r.score;
      if(r.score >= 0.7) ts.correct++;
      omgangResults.push(r.score);
      answered = true;
      document.getElementById('res-next').style.display = 'inline-flex';
      btn.style.display = 'none';
    }catch(e){
      fb.innerHTML = `<strong>Tutorns återkoppling</strong>Kunde inte få återkoppling just nu (${e.message}). Försök igen om en stund.`;
      fb.classList.add('show');
      btn.disabled = false;
    }finally{
      loading.style.display = 'none';
    }
  }

  function showSummary(){
    const right = omgangResults.filter(s => s >= 0.7).length;
    const total = omgangResults.length;
    body.innerHTML = `
      <div class="exercise-card">
        ${exerciseHeader('Resonera · förklara med egna ord', `Tutorn bedömde ${right} av ${total} svar som godkända.`)}
        ${renderSummaryCard({right, total})}
      </div>
    `;
    document.getElementById('summary-next-btn').onclick = ()=>{
      omgangResults = [];
      currentQ = randPick(RESONERA_FRAGOR);
      render();
    };
  }

  render();
}

async function assessReasoning(question, rubric, answer){
  const systemPrompt = `Du är en vänlig matematiklärare för svenska högstadieelever (åk 7). Bedöm elevens resonemang om primtal och delbarhet.

Du får tre saker:
1. Frågan eleven besvarade
2. En rubric som beskriver vad ett bra svar innehåller
3. Elevens svar

Ge konstruktiv återkoppling på 2-4 meningar. Lyft fram det eleven gör bra och peka på något som kan utvecklas. Var uppmuntrande men ärlig. Skriv på svenska.

Avsluta med en JSON-rad EXAKT så här: \`\`\`json
{"score": 0.85}
\`\`\`
där score är 0.0–1.0 baserat på hur väl svaret motsvarar rubricen.`;

  const userMsg = `Fråga: ${question}\n\nRubric: ${rubric}\n\nElevens svar: "${answer}"\n\nGe återkoppling och poäng.`;

  const res = await aiFetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 600,
      system: systemPrompt,
      messages: [{role:'user', content: userMsg}]
    })
  });
  if(!res.ok) throw new Error(`API ${res.status}`);
  const data = await res.json();
  const text = data.content.map(c=>c.text||'').join('').trim();
  const scoreMatch = text.match(/```json\s*\{\s*"score"\s*:\s*([\d.]+)\s*\}\s*```/);
  const score = scoreMatch ? parseFloat(scoreMatch[1]) : 0.5;
  const feedback = text.replace(/```json[\s\S]*?```/g,'').trim();
  return {feedback: `<p style="margin:0;white-space:pre-wrap;">${feedback}</p>`, score};
}

function showKapitelComparison(allQuestions, answers){
  const block = document.getElementById('comparison-block');
  block.style.display = 'block';

  let matches = 0, mismatches = 0, untested = 0;

  // Gruppera comparison också per ko
  const sectionsHtml = KUNSKAPSOMRADEN.map(ko=>{
    const fragor = SKATTNINGSFRAGOR[ko.id] || [];
    if(fragor.length === 0) return '';
    const rows = fragor.map(f=>{
      const gi = allQuestions.findIndex(q=>q.koId===ko.id && q.text===f.text);
      const self = answers[gi];
      const tutor = tutorVerdictFor(ko.id, f.key);
      let match = false;
      if(!tutor) untested++;
      else if(tutor === self){ matches++; match = true; }
      else mismatches++;
      return `
        <div class="comparison-row ${tutor?(match?'is-match':'is-mismatch'):''}">
          <div class="comparison-text">${f.text}</div>
          <div class="comparison-cell">
            <div class="comparison-label">Du</div>
            <div class="comparison-value ${self}">${VERDICT_TEXT[self]}</div>

            <div class="comparison-label">Tutorn</div>
            <div class="comparison-value ${tutor||''}">${tutor?VERDICT_TEXT[tutor]:'Ej testat'}</div>

        </h3>
        ${rows}
      </div>
    `;
  }).join('');

  let summary = '';
  if(matches > 0 && mismatches === 0 && untested === 0){

  } else {
    if(mismatches > 0) summary = `Du och tutorn skattade dig olika på ${mismatches} ${mismatches===1?'punkt':'punkter'}. Det är värdefullt att prata med din lärare om var skillnaden ligger. `;
    if(untested > 0) summary += `${untested} ${untested===1?'rad':'rader'} har inte testats än – gör övningarna för att få tutorns bedömning där också.`;

  block.innerHTML = `

      <h2 style="font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 8px;letter-spacing:-.01em;">Din skattning vs tutorns bedömning</h2>

    <div style="text-align:center;margin-top:16px;">
      <button class="btn" onclick="navTo('kapitel')">Tillbaka till kapitlet</button>

  `;

  block.scrollIntoView({behavior:'smooth', block:'start'});
}

const TEST_GENERATORS = {

      // Generator 1: Är talet primtal eller sammansatt?
      function genPrimtalBinary(seen){
        const allTal = [];
        for(let n=4;n<=60;n++) allTal.push(n);
        const candidates = allTal.filter(n => !seen.has(`pb-${n}`));
        if(candidates.length < 3) return null;
        const picked = shuffle(candidates).slice(0,4);
        picked.forEach(n => seen.add(`pb-${n}`));
        return {
          generator: 'primtal-binary',
          title: 'Är talet ett primtal eller ett sammansatt tal?',
          omrade: 'primtal',
          subs: picked.map((n,i) => ({
            label: String.fromCharCode(97+i) + ')',
            type: 'binary',
            q: `${n}`,
            options: ['Primtal', 'Sammansatt'],
            answer: isPrime(n) ? 'Primtal' : 'Sammansatt',
            explanation: isPrime(n)
              ? `${n} är ett primtal (delbart bara med 1 och ${n}).`
              : `${n} = ${primeFactorize(n).join(' · ')}, alltså sammansatt.`
          }))
        };
      },

      // Generator 2: Dela upp i termer
      function genTermer(seen){
        const candidates = [];
        for(let n=10;n<=50;n++) candidates.push(n);
        const pool = candidates.filter(n => !seen.has(`tm-${n}`));
        if(pool.length < 3) return null;

        return {

          subs: picked.map((n,i) => ({

            target: n,
            operator: '+',
            antal: 3,
            answer: null // valideras dynamiskt
          }))
        };
      },

      // Generator 3: Dela upp i faktorer
      function genFaktorer(seen){
        const candidates = [];
        for(let n=12;n<=100;n++){
          if(primeFactorize(n).length >= 3) candidates.push(n);
        }
        const pool = candidates.filter(n => !seen.has(`fk-${n}`));
        if(pool.length < 3) return null;

            target: n,
            operator: '·',
            antal: 3,

              answer: factors,

function generateTest(config){
  const {antal, typ, omraden} = config;
  let numProblem = 0, numSnabb = antal;
  if(typ === 'snabb-och-problem'){
    numProblem = Math.max(1, Math.round(antal * 0.3));
    numSnabb = antal - numProblem;
  }

  const seen = new Set();
  const questions = [];

  // Bygg snabbfrågor – plocka från generatorer per valt område, slumpa
  const snabbGens = [];
  for(const ko of omraden){
    if(TEST_GENERATORS[ko] && TEST_GENERATORS[ko].snabb){
      TEST_GENERATORS[ko].snabb.forEach(g => snabbGens.push({ko, gen:g}));
    }
  }

  // Slumpa men inte samma generator för många gånger i rad
  let gensShuffled = shuffle([...snabbGens]);
  let gIdx = 0;
  let safetyCounter = 0;
  while(questions.filter(q => q.kind === 'snabb').length < numSnabb && safetyCounter < 100){
    safetyCounter++;
    const {gen} = gensShuffled[gIdx % gensShuffled.length];
    gIdx++;
    const q = gen(seen);
    if(q){
      q.kind = 'snabb';
      questions.push(q);
    }
    if(gIdx >= gensShuffled.length){
      gensShuffled = shuffle([...snabbGens]);
      gIdx = 0;
    }
  }

  // Bygg problemfrågor
  const problemGens = [];
  for(const ko of omraden){
    if(TEST_GENERATORS[ko] && TEST_GENERATORS[ko].problem){
      TEST_GENERATORS[ko].problem.forEach(g => problemGens.push({ko, gen:g}));
    }
  }

  safetyCounter = 0;
  while(questions.filter(q => q.kind === 'problem').length < numProblem && safetyCounter < 100){
    safetyCounter++;
    if(problemGens.length === 0) break;
    const {gen} = randPick(problemGens);
    const q = gen(seen);
    if(q){
      q.kind = 'problem';
      questions.push(q);
    } else {
      // No more available
      break;
    }
  }

  // Numrera
  questions.forEach((q, i) => q.number = i + 1);
  return questions;
}

        <p class="ov-desc">Här är översikten. När du börjar tar du en fråga i taget. Du behöver inte svara på alla – det går bra att hoppa över.</p>
        <div class="test-question-list">

            <div class="test-ql-item">
              <div class="test-ql-num">${q.number}</div>
              <div class="test-ql-text">

          `).join('')}

        </div>

    `;
    document.getElementById('start-test').onclick = () => {
      t.currentIdx = 0;
      renderTestTake();
    };
    showView('test-take');
    return;
  }

  // Visa fråga
  const q = t.questions[t.currentIdx];
  const progressPct = ((t.currentIdx) / t.questions.length) * 100;

  body.innerHTML = `
    <div class="test-progress-bar">
      <span class="tp-label">Fråga <span class="tp-num">${q.number}</span> av <span class="tp-num">${t.questions.length}</span></span>
      <div class="test-progress-fill"><div style="width:${progressPct}%"></div></div>

    </div>

    <div class="test-take-question">
      <div class="test-take-num">Fråga ${q.number}${q.kind==='problem'?' · Problemlösning':''}</div>
      <h2 class="test-take-title">${q.title}</h2>
      <div class="test-sub-list">
        ${q.subs.map((s,i) => renderSubInput(q.number, i, s)).join('')}
      </div>
      <div class="test-take-actions">
        <div class="left-actions">
          <button class="btn subtle" id="prev-q" ${t.currentIdx===0?'disabled':''}><- Föregående</button>
        </div>
        <div class="right-actions">
          <button class="btn" id="skip-q">Hoppa över</button>
          <button class="btn primary" id="next-q">${t.currentIdx === t.questions.length-1 ? 'Klar – se resultat' : 'Nästa fråga ->'}</button>
        </div>
      </div>
    </div>
  `;

  // Restore tidigare svar om finns
  q.subs.forEach((s,i) => {
    const key = `q${q.number}-s${i}`;
    if(t.answers[key] !== undefined) restoreSubAnswer(q.number, i, s, t.answers[key]);
  });

  document.getElementById('prev-q').onclick = () => {
    saveCurrentAnswers();
    t.currentIdx--;
    renderTestTake();
  };
  document.getElementById('skip-q').onclick = () => {
    // skip = lämna svar tomma
    q.subs.forEach((s,i) => {
      const key = `q${q.number}-s${i}`;
      if(t.answers[key] === undefined) t.answers[key] = null; // explicit skipped
    });
    advance();
  };
  document.getElementById('next-q').onclick = () => {
    saveCurrentAnswers();
    advance();
  };

  function advance(){
    if(t.currentIdx === t.questions.length - 1){
      navTo('test-result');
    } else {
      t.currentIdx++;
      renderTestTake();
    }
  }

  function saveCurrentAnswers(){
    q.subs.forEach((s,i) => {
      const key = `q${q.number}-s${i}`;
      t.answers[key] = readSubAnswer(q.number, i, s);
    });
  }

  showView('test-take');
}

function renderSubInput(qNum, subIdx, s){
  const idBase = `q${qNum}-s${subIdx}`;
  const label = s.label ? `<div class="test-sub-label">${s.label}</div>` : '';
  let inputHtml = '';

  if(s.type === 'binary'){
    inputHtml = `
      <div class="test-sub-q"><span class="num-inline">${s.q}</span></div>
      <div class="test-sub-binary-row" data-sub-id="${idBase}">
        ${s.options.map(opt => `
          <button class="test-sub-binary-btn" data-val="${opt}">${opt}</button>
        `).join('')}
      </div>
    `;
  } else if(s.type === 'sum' || s.type === 'product'){
    const op = s.operator;
    const inputs = Array.from({length:s.antal}).map((_,i) => `
      ${i>0 ? `<span class="test-sub-operator">${op}</span>` : ''}
      <input type="text" class="test-sub-input" inputmode="numeric" maxlength="3" data-sub-input="${idBase}-${i}">
    `).join('');
    inputHtml = `
      <div class="test-sub-q">Dela upp talet:</div>
      <div class="test-sub-input-row">
        <span class="test-sub-target">${s.target}</span>
        <span class="test-sub-eq">=</span>
        ${inputs}
      </div>
    `;
  } else if(s.type === 'primfakt'){
    inputHtml = `
      <div class="test-sub-q">Skriv talet <span class="num-inline">${s.target}</span> som produkt av enbart primtal:</div>
      <div class="test-sub-input-row">
        <span class="test-sub-target">${s.target}</span>
        <span class="test-sub-eq">=</span>
        <input type="text" class="test-sub-input" style="width:200px;text-align:left;padding:0 10px;" placeholder="t.ex. 2 · 2 · 3" data-sub-input="${idBase}-str">
      </div>
    `;
  } else if(s.type === 'gata'){
    inputHtml = `
      <div class="test-sub-q">${s.q}</div>
      <ul class="test-sub-clues">
        ${s.clues.map(c => `<li>${c}</li>`).join('')}
      </ul>
      <div class="test-sub-input-row">
        <span class="test-sub-eq">Talet är</span>
        <input type="text" class="test-sub-input" inputmode="numeric" maxlength="4" data-sub-input="${idBase}-val">
      </div>
    `;
  }

  return `
    <div class="test-sub-item">
      ${label}
      ${inputHtml}
    </div>
  `;
}

function readSubAnswer(qNum, subIdx, s){
  const idBase = `q${qNum}-s${subIdx}`;
  if(s.type === 'binary'){
    const sel = document.querySelector(`[data-sub-id="${idBase}"] .is-selected`);
    return sel ? sel.dataset.val : null;
  } else if(s.type === 'sum' || s.type === 'product'){
    const vals = [];
    for(let i=0;i<s.antal;i++){
      const inp = document.querySelector(`[data-sub-input="${idBase}-${i}"]`);
      if(inp && inp.value.trim()) vals.push(inp.value.trim());
    }
    return vals.length === 0 ? null : vals;
  } else if(s.type === 'primfakt'){
    const inp = document.querySelector(`[data-sub-input="${idBase}-str"]`);
    return inp && inp.value.trim() ? inp.value.trim() : null;
  } else if(s.type === 'gata'){
    const inp = document.querySelector(`[data-sub-input="${idBase}-val"]`);
    return inp && inp.value.trim() ? inp.value.trim() : null;
  }
  return null;
}

function restoreSubAnswer(qNum, subIdx, s, val){
  if(val === null || val === undefined) return;
  const idBase = `q${qNum}-s${subIdx}`;
  if(s.type === 'binary'){
    const btn = document.querySelector(`[data-sub-id="${idBase}"] [data-val="${val}"]`);
    if(btn){
      btn.classList.add('is-selected');
      // Wire others to deselect
    }
  } else if(s.type === 'sum' || s.type === 'product'){
    if(Array.isArray(val)){
      val.forEach((v,i) => {
        const inp = document.querySelector(`[data-sub-input="${idBase}-${i}"]`);
        if(inp) inp.value = v;
      });
    }
  } else if(s.type === 'primfakt'){
    const inp = document.querySelector(`[data-sub-input="${idBase}-str"]`);
    if(inp) inp.value = val;
  } else if(s.type === 'gata'){
    const inp = document.querySelector(`[data-sub-input="${idBase}-val"]`);
    if(inp) inp.value = val;
  }
}

// ============================================================
// VALIDERING AV SVAR
// ============================================================
function gradeSub(s, ans){
  if(ans === null || ans === undefined || ans === '') return {status:'skipped'};

  if(s.type === 'binary'){
    return {status: ans === s.answer ? 'correct' : 'wrong', given: ans};
  }
  if(s.type === 'sum'){
    if(!Array.isArray(ans)) return {status:'skipped'};
    const nums = ans.map(v => parseInt(v));
    if(nums.some(isNaN) || nums.length !== s.antal) return {status:'wrong', given: ans.join(' + ')};
    if(nums.some(n => n < 1)) return {status:'wrong', given: ans.join(' + ')};
    const sum = nums.reduce((a,b) => a+b, 0);
    return {status: sum === s.target ? 'correct' : 'wrong', given: ans.join(' + ')};
  }
  if(s.type === 'product'){
    if(!Array.isArray(ans)) return {status:'skipped'};
    const nums = ans.map(v => parseInt(v));
    if(nums.some(isNaN) || nums.length !== s.antal) return {status:'wrong', given: ans.join(' · ')};
    if(nums.some(n => n < 2)) return {status:'wrong', given: ans.join(' · ')};
    const prod = nums.reduce((a,b) => a*b, 1);
    return {status: prod === s.target ? 'correct' : 'wrong', given: ans.join(' · ')};
  }
  if(s.type === 'primfakt'){
    // Eleven skrev "2·2·3" eller "2 · 2 · 3" – parsa
    const cleaned = String(ans).replace(/\s/g,'').replace(/[·*x×]/g,',');
    const parts = cleaned.split(',').map(p => parseInt(p)).filter(n => !isNaN(n));
    if(parts.length === 0) return {status:'wrong', given: ans};
    if(parts.some(n => !isPrime(n))) return {status:'wrong', given: ans};
    const prod = parts.reduce((a,b) => a*b, 1);
    return {status: prod === s.target ? 'correct' : 'wrong', given: ans};
  }
  if(s.type === 'gata'){
    const num = parseInt(ans);
    if(isNaN(num)) return {status:'wrong', given: ans};
    if(num === s.answer || (s.alt && s.alt.includes(num))) return {status:'correct', given: String(num)};
    return {status:'wrong', given: String(num)};
  }
  return {status:'skipped'};
}

function renderTestResult(){
  if(!state.test) { navTo('test-config'); return; }
  const t = state.test;
  const body = document.getElementById('test-result-body');

  // Grade alla
  let correctCount = 0, wrongCount = 0, skippedCount = 0;
  const graded = t.questions.map(q => {
    const subResults = q.subs.map((s,i) => {
      const key = `q${q.number}-s${i}`;
      const result = gradeSub(s, t.answers[key]);
      if(result.status === 'correct') correctCount++;
      else if(result.status === 'wrong') wrongCount++;
      else skippedCount++;
      return {sub: s, result, key};
    });
    return {q, subResults};
  });

  const totalSubs = correctCount + wrongCount + skippedCount;
  const pct = totalSubs > 0 ? Math.round(correctCount / totalSubs * 100) : 0;

  // Hitta vilka generatorer som hade fel/överhoppade för föreläsningstips
  const weakGens = new Set();
  graded.forEach(({q, subResults}) => {
    if(subResults.some(sr => sr.result.status !== 'correct')){
      weakGens.add(q.generator);
    }
  });

  let emoji, title, msg;
  if(totalSubs === 0){
    emoji = '🤷'; title = 'Inget besvarat'; msg = 'Du hoppade över alla frågor. Försök igen!';
  } else if(pct === 100){
    emoji = '🌟'; title = 'Alla rätt!'; msg = 'Helt felfritt – imponerande jobb!';
  } else if(pct >= 80){
    emoji = '🎉'; title = 'Riktigt bra!'; msg = `Du klarade ${correctCount} av ${totalSubs} deluppgifter. Nästan i mål.`;
  } else if(pct >= 60){
    emoji = '👍'; title = 'Bra jobbat!'; msg = `${correctCount} av ${totalSubs} rätt. Lite mer träning på det du missade.`;
  } else if(pct >= 40){
    emoji = '💪'; title = 'På väg!'; msg = `${correctCount} av ${totalSubs} rätt. Titta gärna på förklaringarna nedan.`;
  } else {
    emoji = '🌱'; title = 'Bra att du försökte'; msg = `${correctCount} av ${totalSubs} rätt. Det här är ett område att jobba lite mer på.`;
  }

  body.innerHTML = `
    <div class="test-result-header">
      <div class="test-result-emoji">${emoji}</div>
      <h2 class="test-result-title">${title}</h2>
      <div class="test-result-score">${correctCount} / ${totalSubs}</div>
      <p class="test-result-msg">${msg}</p>
    </div>

    ${graded.map(({q, subResults}) => {
      const hasWrong = subResults.some(sr => sr.result.status === 'wrong' || sr.result.status === 'skipped');
      const tip = hasWrong ? FORELASNING_TIPS[q.generator] : null;

      return `
        <div class="test-review-card">
          <div class="test-review-q-num">Fråga ${q.number}${q.kind==='problem'?' · Problem':''}</div>
          <h3 class="test-review-q-title">${q.title}</h3>
          ${subResults.map(sr => renderReviewSub(sr)).join('')}
          ${tip ? `
            <div class="test-review-suggestion">
              💡 Titta gärna på <a href="${tip.url}" target="_blank">${tip.titel}</a> för att repetera.
            </div>
          ` : ''}
        </div>
      `;
    }).join('')}

    <div class="test-result-actions">
      <button class="btn primary" id="retry-test">Gör om samma test</button>
      <button class="btn" id="new-test">Nytt test</button>
      <button class="btn" onclick="window.print()">Skriv ut resultatet</button>
      <button class="btn subtle" onclick="navTo('kapitel')">Tillbaka till kapitlet</button>
    </div>
  `;

  document.getElementById('retry-test').onclick = () => {
    t.answers = {};
    t.currentIdx = -1;
    navTo('test-take');
  };
  document.getElementById('new-test').onclick = () => {
    state.test = null;
    navTo('test-config');
  };

  showView('test-result');
  updateTutorContext();
}

function renderReviewSub(sr){
  const {sub, result} = sr;
  const cls = result.status; // correct, wrong, skipped
  const icon = result.status === 'correct' ? '✓' : result.status === 'wrong' ? '✗' : '–';

  let questionText = '';
  let correctAnswerText = '';

  if(sub.type === 'binary'){
    questionText = `Är ${sub.q} primtal eller sammansatt?`;
    correctAnswerText = sub.answer + (sub.explanation ? ` — ${sub.explanation}` : '');
  } else if(sub.type === 'sum'){
    questionText = `${sub.target} = ___ + ___ + ___`;
    correctAnswerText = `Det finns många lösningar, t.ex. ${exempelTermer(sub.target, sub.antal).join(' + ')}.`;
  } else if(sub.type === 'product'){
    questionText = `${sub.target} = ___ · ___ · ___`;
    correctAnswerText = `Det finns flera lösningar, t.ex. ${exempelFaktorer(sub.target, sub.antal).join(' · ')}.`;
  } else if(sub.type === 'primfakt'){
    questionText = `Primtalsfaktorisera ${sub.target}`;
    correctAnswerText = `${sub.target} = ${sub.answerStr}`;
  } else if(sub.type === 'gata'){
    questionText = `Gåta: ${sub.clues.join(' ')}`;
    correctAnswerText = `Talet är ${sub.answer}${sub.alt && sub.alt.length ? ` (eller ${sub.alt.join(', ')})` : ''}.`;
  }

  return `
    <div class="test-review-sub ${cls}">
      <div class="test-review-sub-icon">${icon}</div>
      <div class="test-review-sub-body">
        ${sub.label ? `<div class="test-review-sub-label">${sub.label}</div>` : ''}
        <div class="test-review-sub-q">${questionText}</div>
        <div class="test-review-sub-ans">
          ${result.status === 'wrong' ? `Ditt svar: <span class="your">${result.given || '(tomt)'}</span> · ` : ''}
          ${result.status === 'skipped' ? '<span style="font-style:italic">Överhoppad. </span>' : ''}
          ${result.status !== 'correct' ? `Rätt svar: <span class="corr">${correctAnswerText}</span>` : `<span class="corr">${correctAnswerText.split('—')[0].trim() || 'Rätt!'}</span>`}
        </div>
      </div>
    </div>
  `;
}

function exempelTermer(target, antal){
  // Bara en exempel-uppdelning
  const result = [];
  let remaining = target;
  for(let i=0;i<antal-1;i++){
    const v = Math.max(1, Math.floor(remaining / (antal-i)));
    result.push(v);
    remaining -= v;
  }
  result.push(remaining);
  return result;
}

function exempelFaktorer(target, antal){
  const pf = primeFactorize(target);
  if(pf.length === antal) return pf;
  if(pf.length > antal){
    // Slå ihop några
    const result = pf.slice(0, antal-1);
    const rest = pf.slice(antal-1).reduce((a,b) => a*b, 1);
    result.push(rest);
    return result;
  }
  // pf.length < antal - kan inte alltid göra antal faktorer
  return pf;
}

- Använd svenska matematiska begrepp: primtal, sammansatt tal, primfaktor, faktorträd, delbarhet, siffersumma.
- Gångertecken skrivs alltid som · (mittpunktsprick), inte × eller *.
- Svara kort (1-3 meningar) om eleven inte behöver längre förklaring.
- Var uppmuntrande men inte överdrivet beröm-givande.`,
        messages: tutorHistory
      })
    });
    if(!res.ok) throw new Error(`API ${res.status}`);
    const data = await res.json();
    const reply = data.content.map(c=>c.text||'').join('').trim();
    loadingEl.textContent = reply;
    tutorHistory.push({role:'assistant', content: reply});
  } catch(e){
    loadingEl.classList.add('error');
    loadingEl.textContent = `Kunde inte nå tutorn (${e.message}).`;
  } finally {
    tutorSend.disabled = false;
    tutorMessages.scrollTop = tutorMessages.scrollHeight;
  }
}

function appendTutor(role, text){
  const el = document.createElement('div');
  el.className = `tutor-msg ${role}`;
  el.textContent = text;
  tutorMessages.appendChild(el);
  tutorMessages.scrollTop = tutorMessages.scrollHeight;
  return el;
}

// Hjälp: visa tal med komma
function posKomma(x){ return String(Math.round(x*1e6)/1e6).replace('.', ','); }
// Jämför elevsvar mot facit (tillåt komma/punkt, mellanslag, unicode-minus)
function jamforTal(a, b){
  if(a == null) return false;
  var s = String(a).replace(/\s/g,'').replace(/\u2212/g,'-').replace(',', '.');
  if(s === '') return false;
  var n = parseFloat(s);
  if(isNaN(n)) return false;
  return Math.abs(n - b) < 1e-9;
}

function posRandTal(intMin, intMax, dec){
  // slumpa ett tal med 'dec' decimaler
  var heltal = d3RandInt(intMin, intMax);
  if(!dec) return heltal;
  var d = d3RandInt(0, Math.pow(10,dec)-1);
  return Math.round((heltal + d/Math.pow(10,dec))*1e6)/1e6;
}

// ---- Tallinje-ritare (samma som plugg-till-prov) ----
function posRitaTallinje(cfg){
  var W = 680, H = 120, mLeft=40, mRight=40, lineY=78;
  var x0=mLeft, x1=W-mRight;
  function px(v){ return x0 + (v-cfg.start)/(cfg.slut-cfg.start)*(x1-x0); }
  var svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:680px;height:auto;font-family:\'Source Serif 4\',Georgia,serif;">';
  svg+='<line x1="'+(x0-10)+'" y1="'+lineY+'" x2="'+(x1+14)+'" y2="'+lineY+'" stroke="#12110f" stroke-width="2"/>';
  svg+='<polygon points="'+(x1+14)+','+lineY+' '+(x1+6)+','+(lineY-5)+' '+(x1+6)+','+(lineY+5)+'" fill="#12110f"/>';
  if(cfg.delstreck && cfg.huvudsteg){
    var litet=cfg.huvudsteg/cfg.delstreck;
    var antal=Math.round((cfg.slut-cfg.start)/litet);
    for(var i=0;i<=antal;i++){
      var varde=cfg.start+i*litet, x=px(varde);
      var arHuvud=Math.abs(Math.round((varde-cfg.start)/cfg.huvudsteg)*cfg.huvudsteg-(varde-cfg.start))<1e-9;
      if(arHuvud){
        svg+='<line x1="'+x+'" y1="'+(lineY-9)+'" x2="'+x+'" y2="'+(lineY+9)+'" stroke="#12110f" stroke-width="2"/>';
        if(cfg.visaTal!==false) svg+='<text x="'+x+'" y="'+(lineY+26)+'" text-anchor="middle" font-size="13" fill="#3d3630">'+posKomma(varde)+'</text>';
      } else {
        svg+='<line x1="'+x+'" y1="'+(lineY-5)+'" x2="'+x+'" y2="'+(lineY+5)+'" stroke="#7a6e65" stroke-width="1"/>';
      }
    }
  } else if(cfg.utsatta){
    cfg.utsatta.forEach(function(u){
      var x=px(u);
      svg+='<line x1="'+x+'" y1="'+(lineY-9)+'" x2="'+x+'" y2="'+(lineY+9)+'" stroke="#12110f" stroke-width="2"/>';
      svg+='<text x="'+x+'" y="'+(lineY+26)+'" text-anchor="middle" font-size="13" fill="#3d3630">'+posKomma(u)+'</text>';
    });
  }
  if(cfg.markeringar){
    cfg.markeringar.forEach(function(m){
      var x=px(m.varde);
      svg+='<line x1="'+x+'" y1="28" x2="'+x+'" y2="'+(lineY-12)+'" stroke="#b91c1c" stroke-width="2"/>';
      svg+='<polygon points="'+x+','+(lineY-10)+' '+(x-5)+','+(lineY-18)+' '+(x+5)+','+(lineY-18)+'" fill="#b91c1c"/>';
      svg+='<circle cx="'+x+'" cy="18" r="13" fill="#b91c1c"/>';
      svg+='<text x="'+x+'" y="23" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">'+m.bok+'</text>';
    });
  }
  svg+='</svg>';
  return svg;
}

function renderUtveckladMetod(body){
  // eleven skriver talet i utvecklad form: 176 = 1·100 + 7·10 + 6·1
  var level=1, omgang=[], idx=0, results=[];
  function gen(){
    var dec, intLen;
    if(level===1){ dec=0; intLen=3; }
    else if(level===2){ dec=1; intLen=d3RandInt(2,3); }
    else { dec=2; intLen=d3RandInt(2,3); }
    var heltal=''; for(var i=0;i<intLen;i++) heltal+=String(d3RandInt(i===0?1:0,9));
    var decDel=''; for(var j=0;j<dec;j++) decDel+=String(d3RandInt(0,9));
    var talStr=dec?heltal+','+decDel:heltal;
    var talNum=parseFloat(talStr.replace(',','.'));
    // bygg facit-termer (bara nollskilda)
    var alla=(heltal+decDel).split('');
    var termer=[];
    for(var k=0;k<alla.length;k++){
      var siffra=parseInt(alla[k],10); if(siffra===0) continue;
      var exp=heltal.length-1-k;
      var platsvarde=Math.pow(10,exp);
      termer.push({siffra:siffra, plats:platsvarde, varde:Math.round(siffra*platsvarde*1e6)/1e6});
    }
    return {talStr:talStr, talNum:talNum, termer:termer};
  }
  function render(){
    if(idx>=omgang.length){
      var right=results.filter(function(x){return x;}).length, total=results.length;
      var adj=adjustLevel(level,right,total); level=adj.level;
      body.innerHTML='<div class="exercise-card">'+exerciseHeader('Utvecklad form','Du klarade '+right+' av '+total+'.',level)
        +renderSummaryCard({right:right,total:total,level:level,levelChange:adj.change})
        +'<div style="margin-top:-8px;text-align:center;"><button class="btn subtle" id="utv-back">Tillbaka till kategorier</button></div></div>';
      document.getElementById('summary-next-btn').onclick=function(){omgang=genOmgang();idx=0;results=[];render();};
      document.getElementById('utv-back').onclick=utvPicker; return;
    }
    var task=omgang[idx];
    body.innerHTML='<div class="exercise-card">'+exerciseHeader('Skriv i utvecklad form',
      'Dela upp talet i platsvärden, t.ex. 176 = 1·100 + 7·10 + 6·1.',level)
      +'<div class="rakna-kat-exempel"><strong>Tänk så här:</strong> Varje siffra · sitt platsvärde, ihopsummerat med +.<br>'
      +'<span class="ex-rad">54,2 = 5·10 + 4·1 + 2·0,1</span></div>'
      +renderScoreBarSimple(results.filter(function(x){return x;}).length,results.filter(function(x){return !x;}).length,omgang.length,idx)
      +'<div class="mult-metod-uppg"><div class="rakna-svar-rad"><span class="rakna-svar-fast">'+task.talStr.replace('.',',')+' =</span>'
        +'<input type="text" class="rakna-svar-input" id="utv-input" autocomplete="off" placeholder="t.ex. 1·100 + 7·10 + 6·1" style="min-width:240px;"></div></div>'
      +'<div class="rakna-uppdela-feedback" id="utv-fb"></div>'
      +keypadHTML(['·','+',','])
      +'<div class="kp-hint">Skriv summan av platsvärdena. Använd · för gånger och + mellan termerna.</div>'
      +'<div style="margin-top:16px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'
      +'<button class="btn primary" id="utv-check">Kontrollera</button>'
      +'<button class="btn subtle" id="utv-back">Tillbaka till kategorier</button></div></div>';
    var card=body.querySelector('.exercise-card'); bindKeypad(card);
    var input=document.getElementById('utv-input');
    setTimeout(function(){input.focus();},50);
    input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();check();}});
    document.getElementById('utv-check').onclick=check;
    document.getElementById('utv-back').onclick=utvPicker;

      var termer=raw.replace(/\u00b7/g,'*').replace(/\u2212/g,'-').split('+').map(function(s){return s.trim();}).filter(function(s){return s!=='';});
      var ok=true, summa=0;
      if(termer.length < task.termer.length){ ok=false; }
      termer.forEach(function(t){
        var v=d3EvalExpr(t.replace(/\*/g,'*'));
        if(v===null){ ok=false; } else summa+=v;
      });
      if(ok && Math.abs(summa-task.talNum)>1e-6) ok=false;
      input.disabled=true; document.getElementById('utv-check').disabled=true;
      var facit=task.termer.map(function(t){return t.siffra+'·'+tuKomma(t.plats);}).join(' + ');
      if(ok){ input.classList.add('correct'); fb.classList.add('correct'); fb.textContent='Rätt! '+task.talStr.replace('.',',')+' = '+facit; ts.correct++; tsG.correct++; }
      else { input.classList.add('wrong'); fb.classList.add('wrong'); fb.textContent='Rätt svar: '+facit; }
      results.push(ok);
      setTimeout(function(){idx++;render();}, ok?2000:3000);
    }
  }
  function genOmgang(){ var a=[]; for(var i=0;i<6;i++) a.push(gen()); return a; }
  omgang=genOmgang(); render();
}

// ============================================================
// HJÄLPFUNKTIONER FÖR ADD/SUB
// ============================================================
function genAddTask(level){
  // level 1: 2-siffriga + 2-siffriga (inga minnessiffror garanterade)
  // level 2: 3-siffriga + 3-siffriga
  // level 3: 4-siffriga + 3-siffriga (mer komplex, minnessiffror)
  const ranges = [[10,99],[100,999],[1000,9999]];
  const [lo, hi] = ranges[Math.min(level-1, 2)];
  const bHi = level === 3 ? 999 : hi;
  const a = lo + Math.floor(Math.random() * (hi - lo + 1));
  const b = (level === 3 ? 100 : lo) + Math.floor(Math.random() * (bHi - (level===3?100:lo) + 1));
  return {a, b, answer: a + b, op:'+'};
}

function genSubTask(level){
  const ranges = [[10,99],[100,999],[1000,9999]];
  const [lo, hi] = ranges[Math.min(level-1, 2)];
  const a = lo + Math.floor(Math.random() * (hi - lo + 1));
  const b = lo + Math.floor(Math.random() * (a - lo + 1)); // b <= a
  return {a, b, answer: a - b, op:'-'};
}

// Bryt ner ett tal i tusen/hundra/tiotal/ental
function breakDown(n){
  const parts = [];
  const t = Math.floor(n/1000); if(t) parts.push({v:t*1000, label:`${t}·1000`});
  const h = Math.floor((n%1000)/100); if(h) parts.push({v:h*100, label:`${h}·100`});
  const ti = Math.floor((n%100)/10); if(ti) parts.push({v:ti*10, label:`${ti}·10`});
  const e = n%10; if(e) parts.push({v:e, label:`${e}`});
  return parts;
}

function renderBegreppASRakna(body){
  let level = 1;
  let omgang = [];
  let idx = 0;
  let omgangResults = [];

  function genOmgang(){
    const seen = new Set();
    const items = [];
    let attempts = 0;
    while(items.length < 8 && attempts < 200){
      attempts++;
      const useAdd = Math.random() < 0.5;
      const task = useAdd ? genAddTask(level) : genSubTask(level);
      const key = `${task.a}${task.op}${task.b}`;
      if(!seen.has(key)){ seen.add(key); items.push(task); }
    }
    return items;
  }

  function render(){
    if(idx >= omgang.length){
      const right = omgangResults.filter(x=>x).length;
      const total = omgangResults.length;
      const adj = adjustLevel(level, right, total);
      level = adj.level;
      body.innerHTML = `<div class="exercise-card">${exerciseHeader('Räkna · addition och subtraktion', `Du klarade ${right} av ${total}.`, level)}${renderSummaryCard({right, total, level, levelChange: adj.change})}</div>`;
      document.getElementById('summary-next-btn').onclick = ()=>{ omgang=genOmgang(); idx=0; omgangResults=[]; render(); };
      return;
    }
    const task = omgang[idx];
    body.innerHTML = `
      <div class="exercise-card">
        ${exerciseHeader('Räkna · addition och subtraktion', 'Räkna ut svaret.', level)}
        ${renderScoreBarSimple(omgangResults.filter(x=>x).length, omgangResults.filter(x=>!x).length, omgang.length, idx)}

            <span class="rakna-uppdela-target">${task.b}</span>
            <span style="color:var(--ink-soft);">=</span>
            <input type="text" class="rakna-factor-input" id="main-input" inputmode="numeric" maxlength="6" style="width:90px;" autofocus>
          </div>
          <div class="rakna-uppdela-feedback" id="fb"></div>
          <div style="margin-top:14px;text-align:center;">
            <button class="btn primary" id="check-btn">Kontrollera</button>
          </div>
        </div>
      </div>
    `;
    const inp = document.getElementById('main-input');

      const val = parseInt(inp.value.trim());
      const fb = document.getElementById('fb');
      fb.classList.add('show');
      inp.disabled = true;
      document.getElementById('check-btn').disabled = true;
      const ts = getTutorScore('begrepp-as','rakna'); ts.total++;
      if(val === task.answer){
        inp.classList.add('correct'); fb.classList.add('correct'); fb.textContent = `Rätt! ${task.a} ${task.op} ${task.b} = ${task.answer}`;
        ts.correct++; omgangResults.push(true);

        omgangResults.push(false);

    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){e.preventDefault();check();} });
    setTimeout(()=>inp.focus(), 50);

  omgang = genOmgang();

      const task = genAddTask(level);
      const key = `${task.a}+${task.b}`;
      if(!seen.has(key)){ seen.add(key); items.push(task); }
    }
    return items;
  }

  function render(){
    if(idx >= omgang.length){
      const right = omgangResults.filter(x=>x).length;
      const total = omgangResults.length;
      const adj = adjustLevel(level, right, total);
      level = adj.level;
      body.innerHTML = `<div class="exercise-card">${exerciseHeader('Räkna · addition', `Du klarade ${right} av ${total}.`, level)}${renderSummaryCard({right, total, level, levelChange: adj.change})}</div>`;
      document.getElementById('summary-next-btn').onclick = ()=>{ omgang=genOmgang(); idx=0; omgangResults=[]; render(); };
      return;
    }
    const task = omgang[idx];
    body.innerHTML = `
      <div class="exercise-card">
        ${exerciseHeader('Räkna · addition', 'Räkna ut summan.', level)}
        ${renderScoreBarSimple(omgangResults.filter(x=>x).length, omgangResults.filter(x=>!x).length, omgang.length, idx)}
        <div class="rakna-uppdela-task">
          <div class="rakna-uppdela-line" style="font-size:28px;gap:14px;padding:24px;">
            <span class="rakna-uppdela-target">${task.a}</span>
            <span style="color:var(--ink-soft);font-weight:600;">+</span>
            <span class="rakna-uppdela-target">${task.b}</span>
            <span style="color:var(--ink-soft);">=</span>
            <input type="text" class="rakna-factor-input" id="main-input" inputmode="numeric" maxlength="6" style="width:90px;">
          </div>
          <div class="rakna-uppdela-feedback" id="fb"></div>
          <div style="margin-top:14px;text-align:center;"><button class="btn primary" id="check-btn">Kontrollera</button></div>
        </div>
      </div>
    `;
    const inp = document.getElementById('main-input');
    const check = ()=>{
      const val = parseInt(inp.value.trim());
      const fb = document.getElementById('fb'); fb.classList.add('show');
      inp.disabled = true; document.getElementById('check-btn').disabled = true;
      const ts = getTutorScore('add','rakna'); ts.total++;
      if(val === task.answer){
        inp.classList.add('correct'); fb.classList.add('correct'); fb.textContent = `Rätt! ${task.a} + ${task.b} = ${task.answer}`;
        ts.correct++; omgangResults.push(true);
      } else {
        inp.classList.add('wrong'); fb.classList.add('wrong'); fb.textContent = `${task.a} + ${task.b} = ${task.answer}`;
        omgangResults.push(false);
      }
      setTimeout(()=>{ idx++; render(); }, 1600);
    };
    document.getElementById('check-btn').onclick = check;
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){e.preventDefault();check();} });
    setTimeout(()=>inp.focus(), 50);
  }
  omgang = genOmgang();
  render();
}
