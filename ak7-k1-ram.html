<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kapitel 1 – Taluppfattning – Matte 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root {
  /* ── Funktionella färger (övningar) ── */
  --primary:      #B45309;
  --primary-soft: #FED7AA;
  --primary-bg:   #FFF7ED;
  --success:      #16a34a;
  --success-bg:   #dcfce7;
  --error:        #dc2626;
  --error-bg:     #fee2e2;
  --line:         #e5e0d8;
  --bg-card:      #ffffff;
  --bg-soft:      #f9f5f0;
  --bg-warm:      #fdf6ec;
  --shadow-sm:    0 1px 3px rgba(0,0,0,.06);
  --shadow:       0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
  --shadow-lg:    0 8px 24px rgba(0,0,0,.1);
  --radius:       10px;
  --radius-sm:    6px;
  --radius-lg:    14px;

  /* ── Navigationsfärger (historia-boksstil) ── */
  --nav-bg:       #0f1e2e;
  --nav-gold:     #c49a40;
  --paper:        #f6f1e8;
  --paper-lt:     #faf7f1;
  --paper-dk:     #ede6d6;
  --ink:          #12110f;
  --ink-soft:     #3d3630;
  --ink-faint:    #7a6e65;
  --gold:         #9a7228;
  --gold-lt:      #c49a40;

  /* ── Kapitelstripe ── */
  --k1-color:     #1b4b8a;

  /* ── Förmågefärger ── */
  --c-begrepp:    #2563EB;
  --c-begrepp-bg: #eff6ff;
  --c-rakna:      #16a34a;
  --c-rakna-bg:   #f0fdf4;
  --c-metod:      #B45309;
  --c-metod-bg:   #FFF7ED;
  --c-kommunikation:    #7c3aed;
  --c-kommunikation-bg: #f5f3ff;
  --c-resonera:   #be185d;
  --c-resonera-bg:#fdf2f8;
  --c-problem:    #d97706;
  --c-problem-bg: #fffbeb;
  --c-komm:       #7c3aed;
  --c-komm-bg:    #f5f3ff;
  --warning:      #B45309;
  --warning-bg:   #FEF3C7;

  /* ── Typografi ── */
  --cinzel:  'Cinzel', 'Times New Roman', serif;
  --display: 'Cormorant Garamond', Georgia, serif;
  --serif:   'Cormorant Garamond', Georgia, serif;
  --sans:    'Source Serif 4', Georgia, serif;
  --mono:    'Source Serif 4', Georgia, serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.layout{max-width:880px;margin:0 auto;padding:0 20px 120px}
.view{display:none}
.view.is-active{display:block;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ── TOPNAV (historia-boksstil) ── */
.topnav-hist{
  position:sticky;top:0;z-index:200;
  background:var(--nav-bg);
  border-bottom:1px solid rgba(255,255,255,.07);
  padding:0 20px;height:50px;
  display:flex;align-items:center;justify-content:space-between;
  margin:0 -20px;
}
.topnav-brand{
  display:flex;align-items:center;gap:10px;
  font-size:13px;
}
.topnav-back{
  font-family:var(--cinzel);font-size:11px;font-weight:500;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold-lt);text-decoration:none;
  padding:5px 12px;border:1px solid rgba(255,255,255,.18);
  border-radius:6px;transition:background .15s,border-color .15s;
}
.topnav-back:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.35)}
.topnav-sep{color:rgba(255,255,255,.18);font-size:11px}
.topnav-kap{
  font-family:var(--cinzel);font-size:11px;
  color:rgba(255,255,255,.5);letter-spacing:.08em;
}
.topnav-title{
  font-size:13px;color:rgba(255,255,255,.7);
  font-family:var(--display);font-style:italic;
}
.topnav-right{display:flex;align-items:center}
.topnav-label{
  font-family:var(--cinzel);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.25);
}

/* ── KAPITEL-HERO ── */
.kap-hero{
  background:var(--nav-bg);
  margin:0 -20px;
  padding:52px 20px 48px;
  position:relative;overflow:hidden;
}
.kap-hero::before{
  content:'';position:absolute;inset:0;
  background:
    linear-gradient(135deg, rgba(27,75,138,.12) 0%, transparent 60%),
    repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,.018) 40px),
    repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,.018) 40px);
  pointer-events:none;
}
.kap-hero-inner{
  max-width:840px;margin:0 auto;
  position:relative;
}
.kap-hero-eyebrow{
  font-family:var(--cinzel);font-size:10px;font-weight:500;
  letter-spacing:.22em;text-transform:uppercase;
  color:var(--gold-lt);margin-bottom:14px;
  display:inline-flex;align-items:center;gap:10px;
}
.kap-hero-eyebrow::before,.kap-hero-eyebrow::after{
  content:'';display:block;width:22px;height:1px;
  background:var(--gold-lt);opacity:.45;
}
.kap-hero h1{
  font-family:var(--display);
  font-size:clamp(38px, 6vw, 60px);
  font-weight:300;line-height:1.1;
  color:#fff;letter-spacing:-.01em;
  margin-bottom:12px;
}
.kap-hero h1 em{font-style:italic;color:var(--gold-lt)}
.kap-hero-desc{
  font-size:15px;color:rgba(255,255,255,.5);
  max-width:520px;line-height:1.6;
  font-family:var(--sans);font-weight:400;
  margin-bottom:24px;
}
.kap-hero-bottom{
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
}
.kap-hero-badge{
  font-family:var(--cinzel);font-size:10px;font-weight:500;
  letter-spacing:.1em;text-transform:uppercase;
  padding:5px 12px;border-radius:2px;
  background:rgba(196,154,64,.15);color:var(--gold-lt);
  border:1px solid rgba(196,154,64,.3);
}
.kap-hero-parts{display:flex;gap:6px;flex-wrap:wrap}
.kap-hero-part{
  font-size:11px;color:rgba(255,255,255,.35);
  background:rgba(255,255,255,.06);
  padding:3px 10px;border-radius:2px;letter-spacing:.02em;
}
.kap-hero-stripe{
  position:absolute;left:0;top:0;bottom:0;
  width:4px;background:var(--k1-color);
  margin-left:-20px;
}

/* ── SECTION LABELS ── */
.hist-section-label{
  font-family:var(--cinzel);font-size:10px;font-weight:500;
  letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-faint);
  display:flex;align-items:center;gap:12px;
  padding:32px 0 16px;
}
.hist-section-label::after{
  content:'';flex:1;height:1px;background:var(--paper-dk);
}

/* ── DEL-CARDS (historia-boksstil) ── */
.hist-del-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.hist-del-card{
  display:flex;align-items:stretch;
  background:var(--paper-lt);border:1px solid var(--paper-dk);
  border-radius:3px;overflow:hidden;cursor:pointer;
  text-align:left;width:100%;font-family:var(--sans);
  transition:box-shadow .15s, transform .15s, border-color .15s;
}
.hist-del-card:hover{
  box-shadow:0 3px 16px rgba(0,0,0,.08);
  transform:translateX(3px);
  border-color:rgba(0,0,0,.1);
}
.hist-del-card.is-soon{opacity:.6;cursor:default;pointer-events:none}
.hist-del-stripe{
  width:5px;flex-shrink:0;
  background:var(--k1-color);
}
.hist-del-body{
  flex:1;padding:16px 18px;
  display:flex;align-items:center;gap:16px;
}
.hist-del-num{
  font-family:var(--cinzel);font-size:12px;font-weight:500;
  letter-spacing:.08em;color:var(--ink-faint);
  flex-shrink:0;min-width:54px;
}
.hist-del-main{flex:1}
.hist-del-title{
  font-family:var(--display);font-size:19px;font-weight:500;
  letter-spacing:-.01em;color:var(--ink);margin-bottom:3px;line-height:1.2;
}
.hist-del-title em{font-style:italic}
.hist-del-desc{font-size:13px;color:var(--ink-faint);line-height:1.45}
.hist-del-meta{
  display:flex;align-items:center;gap:8px;margin-top:7px;
}
.hist-del-pill{
  font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  font-family:var(--cinzel);
  padding:2px 9px;border-radius:2px;
}
.hist-del-pill.open{background:rgba(27,75,138,.08);color:var(--k1-color)}
.hist-del-pill.soon{background:var(--paper-dk);color:var(--ink-faint)}
.hist-del-arrow{
  color:var(--ink-faint);font-size:18px;flex-shrink:0;
  padding-right:16px;transition:color .12s, transform .12s;
}
.hist-del-card:hover .hist-del-arrow{color:var(--ink);transform:translateX(3px)}

/* ── VIDEO (historia-boksstil) ── */
.hist-video-wrap{
  background:var(--nav-bg);
  border-radius:4px;overflow:hidden;
  margin-bottom:0;
}
.hist-video-header{
  padding:16px 18px 12px;
  border-bottom:1px solid rgba(255,255,255,.07);
}
.hist-video-label{
  font-family:var(--cinzel);font-size:10px;font-weight:500;
  letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold-lt);margin-bottom:4px;
}
.hist-video-title{
  font-family:var(--display);font-size:17px;font-weight:400;
  color:rgba(255,255,255,.85);font-style:italic;
}
.hist-video-ratio{
  position:relative;width:100%;padding-bottom:56.25%;
}
.hist-video-ratio iframe{
  position:absolute;top:0;left:0;width:100%;height:100%;border:0;
}

/* ── INFÖR PROV (CTA) ── */
.hist-cta-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
}
.hist-cta-card{
  display:flex;align-items:center;gap:14px;
  background:var(--paper-lt);border:1px solid var(--paper-dk);
  border-radius:3px;padding:16px;cursor:pointer;
  font-family:var(--sans);text-align:left;
  transition:box-shadow .15s, transform .15s;
}
.hist-cta-card:hover{
  box-shadow:0 3px 14px rgba(0,0,0,.07);transform:translateY(-2px);
}
.hist-cta-icon{
  font-size:22px;flex-shrink:0;
  width:42px;height:42px;
  display:flex;align-items:center;justify-content:center;
  border-radius:3px;
}
.hist-cta-card.ova .hist-cta-icon{background:rgba(27,75,138,.08)}
.hist-cta-card.plugga .hist-cta-icon{background:rgba(154,114,40,.08)}
.hist-cta-body{flex:1;min-width:0}
.hist-cta-title{
  font-family:var(--display);font-size:16px;font-weight:500;
  color:var(--ink);margin-bottom:2px;
}
.hist-cta-desc{font-size:12px;color:var(--ink-faint);line-height:1.4}
.hist-cta-arrow{color:var(--ink-faint);font-size:18px;flex-shrink:0}
@media(max-width:560px){
  .hist-cta-grid{grid-template-columns:1fr}
}



/* ==== BREADCRUMB ==== */
.breadcrumb{
  display:flex;align-items:center;gap:6px;
  font-size:13px;color:var(--ink-soft);
  margin-bottom:18px;flex-wrap:wrap;
}
.breadcrumb a{
  color:var(--ink-soft);text-decoration:none;
  padding:4px 8px;margin-left:-8px;border-radius:var(--radius-sm);
  transition:background .15s;
}
.breadcrumb a:hover{background:var(--bg-soft);color:var(--ink)}
.breadcrumb .sep{color:var(--ink-faint)}
.breadcrumb .current{color:var(--ink);font-weight:500}

/* ==== TILLBAKA-KNAPP (topp + botten) ==== */
.nav-back{
  display:inline-flex;align-items:center;gap:8px;
  border:1px solid var(--line);background:var(--bg-card);
  padding:9px 18px 9px 14px;border-radius:var(--radius);
  font-family:var(--sans);font-size:14px;font-weight:500;
  color:var(--ink);cursor:pointer;transition:all .15s;
  text-decoration:none;
}
.nav-back:hover{border-color:var(--ink-soft);background:var(--bg-soft)}
.nav-back .nav-back-arrow{font-size:17px;line-height:1;color:var(--ink-soft)}
.nav-back:hover .nav-back-arrow{color:var(--ink)}
.nav-back-top{margin-bottom:18px}
.nav-back-bottom{
  display:flex;justify-content:center;
  margin:28px 0 8px;padding-top:22px;
  border-top:1px solid var(--line);
}

/* ==== HEADER CARD ==== */
.header-card{
  background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:28px;margin-bottom:24px;
  box-shadow:var(--shadow);
}
.header-eyebrow{
  font-size:12px;color:var(--ink-faint);
  letter-spacing:.06em;text-transform:uppercase;
  font-weight:500;margin-bottom:8px;
}
.header-title{
  font-family:var(--serif);font-weight:500;
  font-size:32px;line-height:1.15;letter-spacing:-.02em;
  margin:0 0 10px;color:var(--ink);
}
.header-sub{color:var(--ink-soft);margin:0;font-size:15px}

/* ==== KUNSKAPSOMRÅDE CARDS ==== */
.ko-grid{display:grid;gap:14px}
.ko-card{
  background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:22px 24px;
  box-shadow:var(--shadow-sm);cursor:pointer;
  transition:all .15s;
  display:flex;align-items:center;gap:18px;
  text-align:left;font-family:var(--sans);width:100%;
  color:var(--ink);
}
.ko-card:hover{border-color:var(--primary);box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.ko-num{
  font-family:var(--serif);font-weight:500;
  font-size:28px;color:var(--primary);
  width:48px;height:48px;flex-shrink:0;
  background:var(--primary-bg);border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;
}
.ko-body{flex:1;min-width:0}
.ko-name{
  font-family:var(--serif);font-weight:500;
  font-size:19px;letter-spacing:-.01em;margin:0 0 6px;color:var(--ink);
}
.ko-desc{font-size:14px;color:var(--ink-soft);margin:0 0 10px}
.ko-formagor{display:flex;gap:5px;flex-wrap:wrap}
.formaga-pill{
  font-size:11px;font-weight:500;
  padding:3px 9px;border-radius:99px;
  letter-spacing:.02em;
}
.p-begrepp{background:var(--c-begrepp-bg);color:var(--c-begrepp)}
.p-rakna{background:var(--c-rakna-bg);color:var(--c-rakna)}
.p-metod{background:var(--c-metod-bg);color:var(--c-metod)}
.p-komm{background:var(--c-komm-bg);color:var(--c-komm)}
.p-resonera{background:var(--c-resonera-bg);color:var(--c-resonera)}
.p-problem{background:var(--c-problem-bg);color:var(--c-problem)}
.ko-arrow{
  color:var(--ink-faint);font-size:24px;flex-shrink:0;
  transition:transform .15s;
}
.ko-card:hover .ko-arrow{color:var(--primary);transform:translateX(2px)}

/* ==== FÖRMÅGE-VAL ==== */
.formaga-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:20px}
.formaga-card{
  background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:20px;
  cursor:pointer;transition:all .15s;
  display:flex;flex-direction:column;gap:8px;
  text-align:left;font-family:var(--sans);
  color:var(--ink);
  border-left:4px solid var(--line);
}
.formaga-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.formaga-card.is-disabled{
  cursor:not-allowed;opacity:.55;
}
.formaga-card.is-disabled:hover{box-shadow:none;transform:none}
.formaga-card[data-formaga="begrepp"]{border-left-color:var(--c-begrepp)}
.formaga-card[data-formaga="rakna"]{border-left-color:var(--c-rakna)}
.formaga-card[data-formaga="metod"]{border-left-color:var(--c-metod)}
.formaga-card[data-formaga="kommunikation"]{border-left-color:var(--c-komm)}
.formaga-card[data-formaga="resonera"]{border-left-color:var(--c-resonera)}
.formaga-card[data-formaga="problem"]{border-left-color:var(--c-problem)}
.formaga-card .formaga-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.formaga-card .formaga-name{
  font-family:var(--serif);font-weight:500;
  font-size:17px;letter-spacing:-.01em;
}
.formaga-card .formaga-tag{
  font-size:11px;text-transform:uppercase;
  letter-spacing:.05em;font-weight:500;
}
.tag-begrepp{color:var(--c-begrepp)}
.tag-rakna{color:var(--c-rakna)}
.tag-metod{color:var(--c-metod)}
.tag-komm{color:var(--c-komm)}
.tag-resonera{color:var(--c-resonera)}
.tag-problem{color:var(--c-problem)}
.formaga-desc{font-size:14px;color:var(--ink-soft);margin:0}
.formaga-status{
  font-size:12px;color:var(--ink-faint);
  margin-top:6px;display:flex;gap:6px;align-items:center;
}
.formaga-stars{display:inline-flex;gap:2px}
.formaga-stars .star{
  width:12px;height:12px;
  background:var(--ink-faint);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z'/></svg>") center/contain no-repeat;
  mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z'/></svg>") center/contain no-repeat;
}
.formaga-stars .star.filled{background:var(--primary)}

/* ==== SELF ASSESSMENT BUTTON ==== */
.self-assess-card{
  background:linear-gradient(135deg,var(--primary-bg),var(--bg-warm));
  border:1px solid var(--primary-soft);
  border-radius:var(--radius-lg);padding:18px 22px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  cursor:pointer;transition:all .15s;
  font-family:var(--sans);width:100%;color:var(--ink);text-align:left;
}
.self-assess-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.self-assess-card .sa-icon{
  width:40px;height:40px;flex-shrink:0;
  background:var(--bg-card);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:500;
  font-size:18px;color:var(--primary);
}
.self-assess-card .sa-body{flex:1}
.self-assess-card .sa-title{
  font-family:var(--serif);font-weight:500;font-size:17px;
  margin:0 0 2px;color:var(--ink);
}
.self-assess-card .sa-sub{font-size:13px;color:var(--ink-soft);margin:0}

/* ==== ÖVNINGSVY ==== */
.exercise-card{
  background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:28px;margin-bottom:20px;
  box-shadow:var(--shadow);
}
.exercise-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.exercise-title{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
.exercise-sub{font-size:14px;color:var(--ink-soft);margin:0}
.difficulty-badge{
  font-size:12px;background:var(--bg-soft);
  padding:5px 12px;border-radius:99px;color:var(--ink-soft);
  display:flex;align-items:center;gap:6px;
  white-space:nowrap;
}
.difficulty-badge .dots{display:inline-flex;gap:3px}
.difficulty-badge .dots i{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);font-style:normal}
.difficulty-badge .dots i.filled{background:var(--primary)}

/* ==== FLASHCARD ==== */
.flashcard{
  background:linear-gradient(180deg,var(--c-begrepp-bg) 0%,var(--bg-card) 100%);
  border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:32px 24px;text-align:center;margin-bottom:14px;
}
.flashcard-prompt{font-size:13px;color:var(--ink-soft);margin-bottom:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:500}
.flashcard-number{font-family:var(--mono);font-size:54px;font-weight:500;color:var(--ink);letter-spacing:-.02em;line-height:1}
.flashcard-explanation{margin-top:18px;font-size:14px;color:var(--ink-soft);font-family:var(--mono);min-height:20px}
.flashcard-actions{display:flex;gap:10px;justify-content:center;margin-top:22px}
.fc-btn,.btn{
  border:1px solid var(--line);background:var(--bg-card);
  padding:10px 22px;border-radius:var(--radius);
  font-family:var(--sans);font-size:15px;font-weight:500;
  cursor:pointer;color:var(--ink);transition:all .15s;
  display:inline-flex;align-items:center;gap:8px;
}
.fc-btn:hover,.btn:hover{border-color:var(--ink-soft)}
.btn.primary,.fc-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.primary:hover,.fc-btn.primary:hover{background:#9A4607}
.btn.subtle{background:transparent;border-color:transparent;color:var(--ink-soft)}
.btn.subtle:hover{background:var(--bg-soft);color:var(--ink)}
.btn.small{padding:6px 12px;font-size:13px}
.fc-btn.correct{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.fc-btn.wrong{background:var(--error-bg);border-color:var(--error);color:var(--error)}

/* Live score bar above flashcard */
.fc-scorebar{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 16px;margin-bottom:14px;
  background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius);
}
.fc-scorebar-left{display:flex;gap:14px;align-items:center}
.fc-score-item{
  display:flex;align-items:center;gap:6px;
  font-size:14px;font-weight:500;
}
.fc-score-item .fc-score-num{
  font-family:var(--mono);font-size:18px;font-weight:600;
  min-width:18px;text-align:right;
}
.fc-score-item.right{color:var(--success)}
.fc-score-item.wrong{color:var(--error)}
.fc-score-item.total{color:var(--ink-soft)}
.fc-score-item .check{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;font-size:13px;
}
.fc-score-item.right .check{background:var(--success-bg);color:var(--success)}
.fc-score-item.wrong .check{background:var(--error-bg);color:var(--error)}
.fc-score-item.total .check{background:var(--bg-soft);color:var(--ink-soft)}
.fc-scorebar-right{font-size:13px;color:var(--ink-soft)}
.fc-scorebar-right .fire{color:var(--primary);margin-right:4px}

.fc-progress{text-align:center;font-size:13px;color:var(--ink-faint);margin-top:10px}

/* Summary screen */
.summary-card{
  background:linear-gradient(180deg,var(--c-begrepp-bg) 0%,var(--bg-card) 100%);
  border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:36px 28px;text-align:center;margin-bottom:14px;
}
.summary-card.celebration{
  background:linear-gradient(180deg,var(--success-bg) 0%,var(--bg-card) 100%);
  border-color:var(--success);
}
.summary-emoji{
  font-size:64px;line-height:1;margin-bottom:14px;
  display:inline-block;
}
.summary-emoji.bounce{animation:bounceIn .6s ease}
@keyframes bounceIn{
  0%{transform:scale(.3);opacity:0}
  50%{transform:scale(1.15)}
  70%{transform:scale(.95)}
  100%{transform:scale(1);opacity:1}
}
.summary-title{
  font-family:var(--serif);font-weight:500;
  font-size:26px;letter-spacing:-.01em;
  margin:0 0 8px;color:var(--ink);
}
.summary-title.celebration{color:var(--success)}
.summary-score{
  font-family:var(--mono);font-size:32px;font-weight:600;
  color:var(--ink);margin-bottom:6px;
}
.summary-message{
  font-size:15px;color:var(--ink-soft);
  margin:0 0 8px;max-width:420px;margin-left:auto;margin-right:auto;
}
.summary-level-change{
  display:inline-block;margin-top:10px;padding:6px 14px;
  background:var(--primary-bg);color:var(--primary);
  border-radius:99px;font-size:13px;font-weight:500;
}
.summary-level-change.down{background:var(--warning-bg);color:var(--warning)}
.summary-actions{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}

/* ==== RÄKNA GRID ==== */
.rakna-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.rakna-item{background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px}
.rakna-question{font-family:var(--mono);font-size:20px;text-align:center;color:var(--ink);font-weight:500}
.rakna-buttons{display:flex;gap:6px}
.rakna-btn{flex:1;border:1px solid var(--line);background:var(--bg-card);padding:7px;border-radius:var(--radius-sm);font-family:var(--sans);font-size:12px;font-weight:500;cursor:pointer;color:var(--ink-soft);transition:all .15s}
.rakna-btn:hover{border-color:var(--ink-soft);color:var(--ink)}
.rakna-btn.correct{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.rakna-btn.wrong{background:var(--error-bg);border-color:var(--error);color:var(--error)}
.rakna-btn:disabled{cursor:default}

/* ==== RÄKNA UPPDELA (termer/faktorer) ==== */
.rakna-uppdela-task{padding:20px;background:var(--c-rakna-bg);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px}
.rakna-uppdela-prompt{font-size:15px;margin-bottom:16px;color:var(--ink);line-height:1.5}
.rakna-uppdela-line{
  display:flex;align-items:center;gap:10px;justify-content:center;
  padding:18px 14px;background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius);font-family:var(--mono);flex-wrap:wrap;
}
.rakna-uppdela-target{font-size:24px;font-weight:600;color:var(--c-rakna)}
.rakna-uppdela-equals{color:var(--ink-soft);font-weight:500;font-size:22px}
.rakna-factor-input{
  font-family:var(--mono);font-size:20px;font-weight:500;
  width:64px;height:48px;text-align:center;
  border:2px solid var(--c-rakna);border-radius:var(--radius-sm);
  background:var(--c-rakna-bg);outline:none;color:var(--c-rakna);padding:0;
}
.rakna-factor-input:focus{background:#fff}
.rakna-factor-input.correct{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.rakna-factor-input.wrong{background:var(--error-bg);border-color:var(--error);color:var(--error)}
.rakna-uppdela-feedback{margin-top:14px;padding:12px 14px;border-radius:var(--radius);font-size:14px;display:none;text-align:center}
.rakna-uppdela-feedback.show{display:block}
.rakna-uppdela-feedback.correct{background:var(--success-bg);color:var(--success)}
.rakna-uppdela-feedback.wrong{background:var(--error-bg);color:var(--error)}

/* ==== FAKTORTRÄD (rekursivt) ==== */
.tree-task{padding:20px;background:var(--bg-warm);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px}
.tree-prompt{font-size:15px;margin-bottom:8px;color:var(--ink)}
.tree-prompt strong{font-family:var(--mono);font-weight:500;font-size:20px;color:var(--c-metod)}
.tree-instructions{font-size:13px;color:var(--ink-soft);font-style:italic;margin-bottom:18px}

.tree-container{
  display:flex;justify-content:center;
  padding:14px 8px;overflow-x:auto;
  min-height:120px;
}
.tnode{
  display:flex;flex-direction:column;align-items:center;
  position:relative;
}
.tnode-label{
  font-family:var(--mono);font-weight:600;
  font-size:18px;
  width:52px;height:52px;
  border:2px solid var(--line);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-card);color:var(--ink);
  flex-shrink:0;
}
.tnode-label.root{background:var(--primary-bg);border-color:var(--primary);color:var(--primary)}
.tnode-label.prime{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.tnode-label.composite{background:var(--bg-card);border-color:var(--ink-soft);color:var(--ink)}
.tnode-label.composite::after{
  content:"";position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);
  width:6px;height:6px;border-radius:50%;background:var(--ink-soft);
}

.tnode-input-row{
  display:inline-flex;gap:6px;align-items:center;
  margin-top:14px;padding:8px 10px;
  background:var(--bg-card);
  border:1.5px dashed var(--c-metod);
  border-radius:var(--radius);
  font-family:var(--mono);font-size:15px;
}
.tnode-input-row .tnode-target{
  font-weight:600;color:var(--c-metod);
  padding:0 4px;
}
.tnode-input-row .tnode-eq{color:var(--ink-soft);margin:0 2px}
.tnode-input{
  font-family:var(--mono);font-size:16px;font-weight:500;
  width:40px;height:36px;
  border:2px solid var(--c-metod);
  border-radius:var(--radius-sm);
  text-align:center;background:var(--primary-bg);
  outline:none;color:var(--ink);padding:0;
}
.tnode-input:focus{background:#fff}
.tnode-input.error{border-color:var(--error);background:var(--error-bg)}
.tnode-mult{font-family:var(--mono);font-size:18px;color:var(--c-metod);font-weight:600}
.tnode-expand-btn{
  font-size:12px;background:var(--c-metod);color:#fff;
  border:none;padding:5px 10px;border-radius:var(--radius-sm);
  cursor:pointer;font-family:var(--sans);font-weight:500;
  margin-left:4px;
}
.tnode-expand-btn:hover{background:#9A4607}
.tnode-expand-btn:disabled{background:var(--ink-faint);cursor:not-allowed}

.tnode-children{
  display:flex;gap:28px;margin-top:14px;
  align-items:flex-start;justify-content:center;
}
.tnode-connector{
  height:14px;width:2px;background:var(--ink-faint);
  margin-top:6px;
}

.tree-result{
  margin-top:18px;padding:14px;
  border-radius:var(--radius);
  text-align:center;font-family:var(--mono);font-size:16px;
  display:none;
}
.tree-result.show{display:block}
.tree-result.correct{background:var(--success-bg);color:var(--success);font-weight:500}
.tree-result.tip{background:var(--c-resonera-bg);color:var(--c-resonera)}
.tree-actions{display:flex;gap:10px;margin-top:14px;justify-content:center;flex-wrap:wrap}

/* ==== KOMMUNIKATION ==== */
.komm-task{padding:20px;background:var(--c-komm-bg);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px}
.komm-question{font-size:16px;margin-bottom:14px;color:var(--ink);font-weight:500}
.komm-question .target{font-family:var(--mono);font-size:20px;color:var(--c-komm);font-weight:600}
.komm-instructions{font-size:13px;color:var(--ink-soft);font-style:italic;margin-bottom:14px}

.komm-input-line{
  display:flex;align-items:center;gap:8px;
  padding:14px;background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius);margin-bottom:10px;
  font-family:var(--mono);font-size:18px;flex-wrap:wrap;
}
.komm-target-label{font-weight:600;color:var(--ink)}
.komm-equals{color:var(--ink-soft);font-weight:500}
.komm-factor-input{
  font-family:var(--mono);font-size:18px;font-weight:500;
  width:60px;height:42px;text-align:center;
  border:2px solid var(--c-komm);border-radius:var(--radius-sm);
  background:var(--c-komm-bg);outline:none;color:var(--c-komm);
  padding:0;
}
.komm-factor-input:focus{background:#fff}
.komm-factor-input.correct{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.komm-factor-input.wrong{background:var(--error-bg);border-color:var(--error);color:var(--error)}
.komm-dot{color:var(--c-komm);font-weight:600;font-size:20px;line-height:1}
.komm-add-btn,.komm-remove-btn{
  background:var(--bg-card);border:1px solid var(--c-komm);
  color:var(--c-komm);font-size:13px;padding:5px 10px;
  border-radius:var(--radius-sm);cursor:pointer;font-family:var(--sans);
}
.komm-add-btn:hover{background:var(--c-komm);color:#fff}
.komm-remove-btn{border-color:var(--ink-faint);color:var(--ink-faint)}
.komm-remove-btn:hover{border-color:var(--error);color:var(--error)}

.komm-feedback{margin-top:14px;padding:12px 14px;border-radius:var(--radius);font-size:14px;display:none}
.komm-feedback.show{display:block}
.komm-feedback.correct{background:var(--success-bg);color:var(--success)}
.komm-feedback.wrong{background:var(--error-bg);color:var(--error)}
.komm-feedback.partial{background:var(--warning-bg);color:var(--warning)}

/* ==== RESONERA ==== */
.res-task{padding:20px;background:var(--c-resonera-bg);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px}
.res-question{font-size:16px;font-weight:500;margin-bottom:14px;color:var(--ink)}
.res-textarea{
  width:100%;min-height:110px;padding:14px;
  font-family:var(--sans);font-size:15px;line-height:1.5;
  border:1px solid var(--line);border-radius:var(--radius);
  background:var(--bg-card);resize:vertical;outline:none;color:var(--ink);
}
.res-textarea:focus{border-color:var(--c-resonera)}
.res-feedback{
  margin-top:14px;padding:14px;background:var(--bg-card);
  border:1px solid var(--line);border-left:3px solid var(--c-resonera);
  border-radius:var(--radius);font-size:14px;line-height:1.55;display:none;color:var(--ink);
}
.res-feedback.show{display:block}
.res-feedback strong{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--c-resonera);margin-bottom:6px;font-weight:600}
.res-loading{font-size:13px;color:var(--ink-faint);margin-top:8px;font-style:italic}

/* ==== PROBLEM ==== */
.prob-task{padding:18px 20px;background:var(--c-problem-bg);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px}
.prob-text{font-size:15px;margin-bottom:10px;color:var(--ink);line-height:1.5;font-weight:500}
.prob-clues{margin:8px 0 14px;padding-left:20px}
.prob-clues li{margin-bottom:4px;color:var(--ink-soft);font-size:14px}
.prob-input-row{display:flex;gap:10px;align-items:center}
.prob-input{font-family:var(--mono);font-size:17px;padding:10px 14px;width:120px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg-card);outline:none;text-align:center;color:var(--ink)}
.prob-input:focus{border-color:var(--c-problem)}
.prob-input.correct{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.prob-input.wrong{background:var(--error-bg);border-color:var(--error);color:var(--error)}
.prob-feedback{font-size:14px;margin-top:10px;display:none}
.prob-feedback.show{display:block}
.prob-feedback.correct{color:var(--success)}
.prob-feedback.wrong{color:var(--error)}

/* ==== DEL 3: LÄSTAL – FOTA LÖSNING ==== */
.prob-svar-rad{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prob-enhet{font-family:var(--mono);font-size:15px;color:var(--ink-soft)}
.prob-foto-rad{margin-top:12px}
.prob-foto-btn{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;padding:7px 12px;border-radius:var(--radius-sm);
  border:1.5px dashed var(--c-problem);background:var(--c-problem-bg);
  color:var(--c-problem);cursor:pointer;font-weight:500;
}
.prob-foto-btn:hover{background:#fff}
.prob-foto-preview{margin-top:10px}
.prob-foto-cap{font-size:12px;color:var(--ink-faint);margin-bottom:5px}
.prob-foto-preview img{
  max-width:100%;max-height:280px;border-radius:var(--radius);
  border:1px solid var(--line);display:block;
}
.prob-foto-preview .prob-foto-remove{
  margin-top:6px;font-size:12px;padding:4px 10px;border-radius:var(--radius-sm);
  border:1px solid var(--line);background:var(--bg-soft);color:var(--ink-soft);cursor:pointer;
}
.prob-niva-val{
  display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;
}

/* ==== SJÄLVSKATTNING ==== */
.skattning-list{display:flex;flex-direction:column;gap:8px}
.skattning-row{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:14px 16px;background:var(--bg-soft);border-radius:var(--radius);border:1px solid transparent;transition:border-color .15s}
.skattning-row.is-answered{border-color:var(--line);background:var(--bg-card)}
.skattning-text{font-size:15px;color:var(--ink)}
.skattning-buttons{display:flex;gap:6px}
.skattning-btn{border:1px solid var(--line);background:var(--bg-card);padding:6px 14px;border-radius:var(--radius-sm);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;color:var(--ink-soft);transition:all .15s}
.skattning-btn:hover{border-color:var(--ink-faint);color:var(--ink)}
.skattning-btn.is-selected[data-value="kan"]{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.skattning-btn.is-selected[data-value="osaker"]{background:var(--warning-bg);border-color:var(--warning);color:var(--warning)}
.skattning-btn.is-selected[data-value="kanej"]{background:var(--error-bg);border-color:var(--error);color:var(--error)}

.comparison-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 16px;background:var(--bg-soft);border-radius:var(--radius);margin-bottom:8px}
.comparison-text{font-size:14px;color:var(--ink)}
.comparison-cell{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:80px}
.comparison-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:500}
.comparison-value{font-size:13px;font-weight:600;padding:4px 10px;border-radius:var(--radius-sm)}
.comparison-value.kan{background:var(--success-bg);color:var(--success)}
.comparison-value.osaker{background:var(--warning-bg);color:var(--warning)}
.comparison-value.kanej{background:var(--error-bg);color:var(--error)}
.comparison-row.is-match{border-left:3px solid var(--success)}
.comparison-row.is-mismatch{border-left:3px solid var(--warning)}

/* ==== SJÄLVSKATTNINGSMATRIS ==== */
.matris-table{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:18px;background:var(--bg-card)}
.matris-head{display:grid;grid-template-columns:1fr 84px 84px 84px;background:var(--bg-soft);border-bottom:2px solid var(--line)}
.matris-head-skill{padding:13px 16px;font-family:var(--serif);font-weight:600;font-size:16px;color:var(--ink)}
.matris-head-opt{padding:13px 4px;text-align:center;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.matris-head-opt.kan{background:var(--success-bg);color:var(--success)}
.matris-head-opt.osaker{background:var(--warning-bg);color:var(--warning)}
.matris-head-opt.kanej{background:var(--error-bg);color:var(--error)}
.matris-row{display:grid;grid-template-columns:1fr 84px 84px 84px;border-bottom:1px solid var(--line)}
.matris-row:last-child{border-bottom:none}
.matris-skill{padding:11px 16px;font-size:13.5px;color:var(--ink);display:flex;align-items:center;line-height:1.4}
.matris-opt{border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s}
.matris-opt.kan{background:rgba(46,138,79,.07)}
.matris-opt.osaker{background:rgba(180,140,30,.09)}
.matris-opt.kanej{background:rgba(170,70,40,.07)}
.matris-opt:hover .matris-box{border-color:var(--ink-faint)}
.matris-box{width:20px;height:20px;border:2px solid var(--line);border-radius:4px;background:var(--bg-card);transition:all .12s;position:relative}
.matris-opt.is-selected .matris-box{border-color:transparent}
.matris-opt.kan.is-selected .matris-box{background:var(--success)}
.matris-opt.osaker.is-selected .matris-box{background:var(--warning)}
.matris-opt.kanej.is-selected .matris-box{background:var(--error)}
.matris-opt.is-selected .matris-box::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700}
.matris-row.is-answered .matris-skill{font-weight:500}
.matris-ai-card{background:linear-gradient(135deg,var(--primary-bg),var(--bg-warm))}
.matris-ai-head{font-family:var(--serif);font-weight:600;font-size:17px;margin-bottom:8px;color:var(--ink)}
.matris-ai-body{font-size:14px;line-height:1.65;color:var(--ink-soft);white-space:pre-wrap}
.matris-ai-body.error{color:var(--error)}
.matris-cta-wrap{margin-top:22px}
.matris-cta{width:100%;display:flex;align-items:center;gap:16px;padding:18px 20px;background:linear-gradient(135deg,var(--primary-bg),var(--bg-warm));border:1px solid var(--line);border-radius:var(--radius-lg);cursor:pointer;text-align:left;transition:all .15s;font-family:inherit}
.matris-cta:hover{border-color:var(--primary);transform:translateY(-1px)}
.matris-cta-icon{font-size:26px;flex-shrink:0}
.matris-cta-body{flex:1}
.matris-cta-title{font-family:var(--serif);font-weight:600;font-size:17px;color:var(--ink);margin-bottom:2px}
.matris-cta-desc{font-size:13px;color:var(--ink-soft);line-height:1.5}
.matris-cta-arrow{font-size:22px;color:var(--ink-faint);flex-shrink:0}
/* ==== UPPSTÄLLNING ADDITION ==== */
.uppadd{display:flex;flex-direction:column;align-items:center;gap:4px;margin:22px 0;font-family:var(--sans)}
.uppadd-row{display:flex;align-items:center;gap:4px}
.uppadd-op{width:26px;text-align:center;font-size:24px;font-weight:600;color:var(--ink-soft)}
.uppadd-cell{width:42px;height:48px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:600;color:var(--ink)}
.uppadd-line{width:100%;max-width:320px;height:3px;background:var(--ink);margin:2px 0}
.uppadd-in{width:42px;height:48px;text-align:center;font-size:26px;font-weight:600;font-family:var(--sans);border:2px solid var(--line);border-radius:8px;background:var(--bg-card);color:var(--ink);padding:0}
.uppadd-in:focus{outline:none;border-color:var(--primary);background:var(--primary-bg)}
.uppadd-in.correct{border-color:var(--success);background:var(--success-bg);color:var(--success)}
.uppadd-in.wrong{border-color:var(--error);background:var(--error-bg);color:var(--error)}
@media(max-width:560px){
  .matris-head,.matris-row{grid-template-columns:1fr 54px 54px 54px}
  .matris-head-skill{font-size:14px;padding:10px 10px}
  .matris-skill{font-size:12.5px;padding:9px 10px}
  .matris-head-opt{font-size:9.5px;padding:10px 2px}
  .matris-box{width:18px;height:18px}
}

/* ==== STUB ==== */
.stub-card{background:var(--bg-card);border:1px dashed var(--line);border-radius:var(--radius-lg);padding:40px 28px;text-align:center;color:var(--ink-soft)}
.stub-card h2{font-family:var(--serif);font-weight:500;margin:0 0 8px;color:var(--ink)}
.stub-card p{margin:0;font-size:15px}

/* ==== SECTION HEADINGS ==== */
.section-h2{
  font-family:var(--serif);font-weight:500;
  font-size:20px;letter-spacing:-0.01em;
  margin:32px 0 14px;color:var(--ink);
}

/* ==== DEL-GRUPP HEADING ==== */
.delgrupp-heading{
  display:flex;align-items:center;gap:12px;
  margin:24px 0 10px;
}
.delgrupp-heading:first-of-type{margin-top:8px}
.delgrupp-label{
  font-family:var(--sans);font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:0.08em;
  color:var(--ink-faint);white-space:nowrap;
}
.delgrupp-line{flex:1;height:1px;background:var(--line)}

/* ==== DEL CARDS ==== */
.del-grid{display:flex;flex-direction:column;gap:8px}
.del-card{
  display:flex;align-items:flex-start;gap:14px;
  background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px 16px;
  cursor:pointer;font-family:var(--sans);text-align:left;
  transition:all .15s;width:100%;
}
.del-card:hover{
  border-color:var(--ink-soft);transform:translateX(2px);
  box-shadow:var(--shadow-sm);
}
.del-card.is-stub{opacity:.7}
.del-card.is-stub:hover{opacity:.9}
.del-card-num{
  flex-shrink:0;width:38px;height:38px;
  background:var(--primary-bg);color:var(--primary);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:500;font-size:18px;
}
.del-card.is-stub .del-card-num{
  background:var(--bg-soft);color:var(--ink-soft);
}
.del-card-body{flex:1;min-width:0;padding-top:2px}
.del-card-title{
  font-weight:600;font-size:15px;color:var(--ink);
  margin-bottom:3px;letter-spacing:-0.005em;
}
.del-card-desc{
  font-size:13px;color:var(--ink-soft);line-height:1.45;
  margin-bottom:6px;
}
.del-card-meta{
  display:flex;align-items:center;gap:8px;
  font-size:12px;color:var(--ink-faint);
}
.del-card-pill{
  display:inline-block;font-size:11px;
  background:var(--success-bg);color:var(--success);
  padding:2px 8px;border-radius:10px;font-weight:500;
}
.del-card.is-stub .del-card-pill{
  background:var(--bg-warm);color:var(--ink-soft);
}
.del-card-arrow{color:var(--ink-faint);font-size:22px;flex-shrink:0;padding-top:6px}
.del-card.is-stub .del-card-arrow{color:var(--ink-faint)}

/* ==== DEL VIEW (stub or implemented) ==== */
.del-header{
  background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:22px;margin-bottom:18px;
}
.del-header-eyebrow{
  font-family:var(--sans);font-size:12px;font-weight:500;
  color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.08em;
  margin-bottom:6px;
}
.del-header-title{
  font-family:var(--serif);font-weight:500;font-size:26px;
  margin:0 0 8px;letter-spacing:-0.015em;color:var(--ink);
}
.del-header-desc{
  margin:0;color:var(--ink-soft);font-size:15px;line-height:1.55;
}

.planned-areas-card{
  background:var(--bg-card);border:1px dashed var(--line);
  border-radius:var(--radius-lg);padding:22px;margin-bottom:14px;
}
.planned-areas-card h3{
  font-family:var(--serif);font-weight:500;font-size:17px;
  margin:0 0 6px;letter-spacing:-.01em;
}
.planned-areas-card .stub-note{
  font-size:13px;color:var(--ink-soft);font-style:italic;margin:0 0 14px;
}
.planned-areas-list{
  display:flex;flex-direction:column;gap:6px;list-style:none;padding:0;margin:0;
}
.planned-areas-list li{
  padding:10px 14px;background:var(--bg-soft);
  border-radius:var(--radius-sm);font-size:14px;color:var(--ink-soft);
  display:flex;align-items:center;gap:10px;
}
.planned-areas-list li::before{
  content:'•';color:var(--ink-faint);font-size:18px;line-height:1;
}

/* ==== VIDEO ==== */
.video-section{
  background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:18px;margin-bottom:22px;
}
.video-header{margin-bottom:14px}
.video-title{
  font-family:var(--serif);font-weight:500;
  font-size:18px;margin:0 0 4px;letter-spacing:-0.01em;
}
.video-sub{margin:0;color:var(--ink-soft);font-size:13px}
.video-wrapper{
  position:relative;width:100%;
  padding-bottom:56.25%; /* 16:9 */
  background:#000;border-radius:var(--radius);overflow:hidden;
}
.video-wrapper iframe{
  position:absolute;top:0;left:0;
  width:100%;height:100%;border:0;
}

/* ==== PRACTICE CTA GRID ==== */
.practice-cta-grid{
  display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
  gap:14px;margin-bottom:24px;
}
.practice-cta{
  display:flex;align-items:center;gap:14px;
  background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:18px;
  text-align:left;cursor:pointer;font-family:var(--sans);
  transition:all .15s;
}
.practice-cta:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);border-color:var(--ink-soft)}
.practice-cta-icon{
  flex-shrink:0;width:44px;height:44px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:22px;
}
.practice-cta.ova-mer .practice-cta-icon{background:var(--c-rakna-bg);color:var(--c-rakna)}
.practice-cta.plugga .practice-cta-icon{background:var(--primary-bg);color:var(--primary)}
.practice-cta-body{flex:1;min-width:0}
.practice-cta-title{
  font-weight:600;font-size:15px;color:var(--ink);margin-bottom:3px;
}
.practice-cta-sub{font-size:13px;color:var(--ink-soft);line-height:1.4}
.practice-cta-arrow{color:var(--ink-faint);font-size:24px;flex-shrink:0}

/* ==== TEST CONFIG ==== */
.test-config-card{
  background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:20px;margin-bottom:16px;
}
.test-config-card h3{
  font-family:var(--serif);font-weight:500;font-size:17px;
  margin:0 0 4px;letter-spacing:-.01em;
}
.test-config-card .config-desc{
  font-size:13px;color:var(--ink-soft);margin:0 0 14px;line-height:1.4;
}
.config-options{
  display:flex;gap:8px;flex-wrap:wrap;
}
.config-option{
  flex:1;min-width:80px;
  padding:12px 8px;border:2px solid var(--line);background:var(--bg-soft);
  border-radius:var(--radius);cursor:pointer;
  font-family:var(--sans);font-size:14px;font-weight:500;color:var(--ink);
  transition:all .15s;text-align:center;
}
.config-option:hover{border-color:var(--ink-soft)}
.config-option.is-selected{
  background:var(--primary-bg);border-color:var(--primary);color:var(--primary);
}
.config-option .opt-sub{
  display:block;font-size:11px;color:var(--ink-faint);font-weight:400;margin-top:2px;
}
.config-option.is-selected .opt-sub{color:var(--primary)}

.config-checkbox-list{display:flex;flex-direction:column;gap:8px}
.config-checkbox{
  display:flex;align-items:center;gap:12px;padding:12px;
  background:var(--bg-soft);border:1px solid var(--line);
  border-radius:var(--radius);cursor:pointer;
  font-family:var(--sans);font-size:14px;
  transition:all .15s;
}
.config-checkbox:hover{background:var(--bg-warm)}
.config-checkbox.is-checked{background:var(--primary-bg);border-color:var(--primary)}
.config-checkbox.is-disabled{opacity:.5;cursor:not-allowed}
.config-checkbox .cb-square{
  width:20px;height:20px;flex-shrink:0;
  border:2px solid var(--ink-soft);border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;background:#fff;
}
.config-checkbox.is-checked .cb-square{background:var(--primary);border-color:var(--primary)}
.config-checkbox .cb-num{
  width:24px;height:24px;background:var(--primary-bg);color:var(--primary);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;flex-shrink:0;
}
.config-checkbox .cb-text{flex:1;color:var(--ink);font-weight:500}
.config-checkbox .cb-stub{font-size:11px;color:var(--ink-faint);font-style:italic;font-weight:400;display:block}

.config-summary{
  background:var(--c-rakna-bg);border:1px solid var(--c-rakna);
  border-radius:var(--radius);padding:14px 16px;
  margin-top:14px;font-size:14px;color:var(--c-rakna);
}

/* ==== TEST OVERVIEW & TAKE ==== */
.test-progress-bar{
  background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius);padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;font-size:14px;
}
.test-progress-bar .tp-label{color:var(--ink-soft)}
.test-progress-bar .tp-num{font-weight:600;color:var(--ink)}
.test-progress-fill{
  flex:1;height:6px;background:var(--bg-soft);
  border-radius:3px;margin:0 14px;overflow:hidden;
}
.test-progress-fill > div{
  height:100%;background:var(--primary);transition:width .3s;
}

.test-overview{
  background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:20px;margin-bottom:16px;
}
.test-overview h2{
  font-family:var(--serif);font-weight:500;font-size:20px;
  margin:0 0 8px;letter-spacing:-.01em;
}
.test-overview .ov-desc{font-size:14px;color:var(--ink-soft);margin:0 0 18px}
.test-question-list{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.test-ql-item{
  display:flex;gap:12px;align-items:flex-start;
  padding:12px 14px;background:var(--bg-soft);
  border:1px solid var(--line);border-radius:var(--radius);
  font-size:14px;
}
.test-ql-num{
  flex-shrink:0;width:26px;height:26px;
  background:var(--primary-bg);color:var(--primary);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:13px;
}
.test-ql-text{flex:1;color:var(--ink)}
.test-ql-text .tag{
  display:inline-block;font-size:11px;
  background:var(--bg-card);color:var(--ink-soft);
  padding:2px 8px;border-radius:10px;margin-left:6px;
  border:1px solid var(--line);
}
.test-ql-text .tag.problem{background:var(--c-problem-bg);color:var(--c-problem);border-color:var(--c-problem)}

.test-take-question{
  background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:22px;margin-bottom:16px;
}
.test-take-num{
  font-family:var(--mono);font-size:13px;
  color:var(--ink-faint);font-weight:500;margin-bottom:6px;letter-spacing:.05em;
}
.test-take-title{
  font-family:var(--serif);font-weight:500;font-size:19px;
  margin:0 0 16px;letter-spacing:-.01em;color:var(--ink);
}
.test-sub-list{display:flex;flex-direction:column;gap:14px}
.test-sub-item{
  padding:14px;background:var(--bg-soft);
  border:1px solid var(--line);border-radius:var(--radius);
}
.test-sub-label{
  font-family:var(--mono);font-weight:600;font-size:14px;
  color:var(--primary);margin-bottom:6px;
}
.test-sub-q{font-size:15px;color:var(--ink);margin-bottom:10px;line-height:1.5}
.test-sub-q .num-inline{
  font-family:var(--mono);font-weight:600;font-size:17px;color:var(--c-metod);
}
.test-sub-input-row{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--mono);
}
.test-sub-input{
  font-family:var(--mono);font-size:17px;font-weight:500;
  width:60px;height:40px;text-align:center;
  border:2px solid var(--c-rakna);border-radius:var(--radius-sm);
  background:#fff;outline:none;color:var(--ink);padding:0;
}
.test-sub-input.binary-input{width:auto;padding:0 10px;min-width:120px}
.test-sub-operator{font-size:18px;color:var(--ink-soft);font-weight:600}
.test-sub-target{font-weight:600;color:var(--c-metod);font-size:17px}
.test-sub-eq{color:var(--ink-soft);font-weight:500;font-size:17px}
.test-sub-binary-row{display:flex;gap:8px;flex-wrap:wrap}
.test-sub-binary-btn{
  flex:1;min-width:100px;
  padding:10px 14px;border:2px solid var(--line);background:#fff;
  border-radius:var(--radius);cursor:pointer;font-size:14px;
  font-family:var(--sans);font-weight:500;color:var(--ink);
  transition:all .15s;
}
.test-sub-binary-btn:hover{border-color:var(--ink-soft)}
.test-sub-binary-btn.is-selected{
  background:var(--primary-bg);border-color:var(--primary);color:var(--primary);
}
.test-sub-clues{
  margin:8px 0;padding-left:20px;color:var(--ink-soft);
  font-size:14px;line-height:1.6;
}
.test-sub-clues li{margin-bottom:4px}

.test-take-actions{
  display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;justify-content:space-between;
}
.test-take-actions .left-actions, .test-take-actions .right-actions{
  display:flex;gap:10px;flex-wrap:wrap;
}

/* ==== TEST RESULT ==== */
.test-result-header{
  background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:22px;margin-bottom:16px;
  text-align:center;
}
.test-result-emoji{font-size:54px;margin-bottom:6px}
.test-result-title{
  font-family:var(--serif);font-weight:500;font-size:24px;
  margin:0 0 6px;letter-spacing:-.01em;color:var(--ink);
}
.test-result-score{
  font-family:var(--mono);font-size:32px;font-weight:600;
  color:var(--primary);margin:8px 0;
}
.test-result-msg{font-size:14px;color:var(--ink-soft);margin:0}

.test-review-card{
  background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:20px;margin-bottom:14px;
}
.test-review-q-num{
  font-family:var(--mono);font-size:13px;color:var(--ink-faint);font-weight:500;margin-bottom:4px;letter-spacing:.05em;
}
.test-review-q-title{font-family:var(--serif);font-weight:500;font-size:17px;margin:0 0 12px}
.test-review-sub{
  display:flex;gap:10px;align-items:flex-start;
  padding:10px 12px;background:var(--bg-soft);
  border-left:3px solid var(--line);
  border-radius:var(--radius-sm);margin-bottom:8px;font-size:14px;
}
.test-review-sub.correct{border-left-color:var(--success);background:var(--success-bg)}
.test-review-sub.wrong{border-left-color:var(--error);background:var(--error-bg)}
.test-review-sub.skipped{border-left-color:var(--ink-faint);background:var(--bg-soft)}
.test-review-sub-icon{font-size:18px;flex-shrink:0;line-height:1}
.test-review-sub-body{flex:1}
.test-review-sub-label{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--ink-soft);margin-bottom:2px}
.test-review-sub-q{color:var(--ink);margin-bottom:4px}
.test-review-sub-ans{font-family:var(--mono);font-size:13px;color:var(--ink-soft)}
.test-review-sub-ans .your{color:var(--error)}
.test-review-sub-ans .corr{color:var(--success);font-weight:600}

.test-review-suggestion{
  margin-top:12px;padding:10px 14px;
  background:var(--c-resonera-bg);border:1px solid var(--c-resonera);
  border-radius:var(--radius);font-size:13px;color:var(--c-resonera);
  display:flex;align-items:center;gap:8px;
}
.test-review-suggestion a{color:var(--c-resonera);font-weight:600;text-decoration:underline}

.test-result-actions{
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px;
}

/* ==== DEL 2: METODVAL ==== */
.metod-val-grid{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.metod-val-card{
  display:flex;align-items:center;gap:14px;
  background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px 16px;
  cursor:pointer;font-family:var(--sans);text-align:left;
  transition:all .15s;width:100%;
}
.metod-val-card:hover{border-color:var(--c-metod);transform:translateX(2px);box-shadow:var(--shadow-sm)}
.metod-val-icon{font-size:24px;flex-shrink:0;width:36px;text-align:center}
.metod-val-body{flex:1}
.metod-val-namn{font-weight:600;font-size:15px;color:var(--ink);margin-bottom:3px}
.metod-val-desc{font-size:13px;color:var(--ink-soft);line-height:1.4}

/* ==== DEL 2: METOD-FÖRKLARING-KORT ==== */
.metod-explain-card{
  background:var(--bg-warm);border:1px solid var(--line);
  border-radius:var(--radius);padding:20px;margin-bottom:14px;
}
.metod-step-title{
  font-family:var(--serif);font-weight:500;font-size:17px;
  margin:0 0 6px;letter-spacing:-.01em;
}
.metod-step-desc{font-size:14px;color:var(--ink-soft);margin:0 0 16px}
.metod-steg-note{
  margin-top:14px;padding:12px 14px;
  background:var(--primary-bg);border-left:3px solid var(--primary);
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  font-size:13px;color:var(--ink);line-height:1.5;
}
.metod-demo-nav{
  display:flex;align-items:center;gap:12px;margin-top:16px;justify-content:center;
}

/* ==== UPPSTÄLLNING – DECIMALKOLUMN & RENSA ==== */
.upp-dec-cell{
  width:16px !important;min-width:16px !important;
  max-width:16px !important;
}
.upp-dec-pt{
  font-family:var(--mono);font-size:22px;font-weight:700;
  color:var(--ink);display:flex;align-items:flex-end;
  justify-content:center;width:16px;line-height:1;
  padding-bottom:4px;
}
.ans-dec{
  color:var(--ink-soft) !important;
  font-size:26px !important;
  padding-bottom:2px !important;
}
.upp-lan-clear{
  padding:5px 12px;border:1px solid var(--line);
  background:var(--bg-soft);color:var(--ink-faint);
  border-radius:var(--radius-sm);cursor:pointer;
  font-size:12px;font-family:var(--sans);
  transition:all .12s;margin-left:auto;
}
.upp-lan-clear:hover{border-color:var(--error);color:var(--error);background:var(--error-bg)}
.sub-sign{
  color:var(--c-metod) !important;
  font-weight:700 !important;
  font-size:24px !important;
}

.upp-lan-row{
  display:flex;align-items:center;gap:12px;
  margin-bottom:16px;
}
.upp-lan-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 16px;
  border:1.5px solid var(--c-metod);
  background:var(--primary-bg);color:var(--c-metod);
  border-radius:var(--radius-sm);cursor:pointer;
  font-family:var(--sans);font-size:13px;font-weight:600;
  transition:all .12s;
}
.upp-lan-btn:hover{background:var(--c-metod);color:#fff}
.upp-lan-btn.is-active{
  background:var(--c-metod);color:#fff;
  box-shadow:0 0 0 3px rgba(180,83,9,.2);
}
.upp-lan-hint{
  font-size:13px;color:var(--ink-soft);font-style:italic;
}

/* Siffra som går att klicka på när lån-läge är aktivt */
.laan-target{
  cursor:pointer !important;
  transition:background .1s, transform .1s;
}
.laan-target:hover{
  background:rgba(180,83,9,.12) !important;
  border-radius:4px;
  transform:scale(1.15);
}

/* Struken siffra: diagonal linje */
.upp-i-digit.is-struck{
  position:relative;
  color:var(--ink-faint);
}
.struck-digit{
  position:relative;
  display:inline-block;
}
.struck-digit::after{
  content:'';
  position:absolute;
  left:-2px; top:50%;
  width:calc(100% + 4px);
  height:2px;
  background:var(--error);
  transform:rotate(-25deg);
  transform-origin:center;
  border-radius:1px;
}

/* "10"-rutan ovanför entalet */
.upp-ten-row{
  min-height:28px;
}
.borrow-ten{
  font-family:var(--mono);font-size:13px;font-weight:700;
  color:var(--error);
  border:1.5px solid var(--error);
  border-radius:4px;
  padding:1px 5px;
  background:var(--error-bg);
  line-height:1.3;
  white-space:nowrap;
  animation:popIn .15s ease;
}
@keyframes popIn{
  from{opacity:0;transform:scale(.7) translateY(4px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}
.uppstallning-interaktiv{
  display:inline-flex;flex-direction:column;align-items:flex-end;
  gap:0;font-family:var(--mono);
  background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius);padding:16px 20px;
}
.upp-i-row{
  display:flex;align-items:center;justify-content:flex-end;
  gap:0;
}
.upp-i-op-cell{
  width:28px;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:700;color:var(--ink-soft);
  padding-right:4px;
}
.opp-sign{color:var(--c-metod)}
.upp-i-cell{
  width:40px;display:flex;align-items:center;justify-content:center;
}
.upp-i-digit{
  font-size:24px;font-weight:500;color:var(--ink);
  width:36px;height:40px;display:flex;align-items:center;justify-content:center;
}
.upp-i-digit.faint{color:transparent}

.carr-input, .ans-input{
  width:32px;height:32px;
  font-family:var(--mono);font-weight:600;
  text-align:center;border-radius:var(--radius-sm);
  outline:none;padding:0;transition:all .12s;
}
.carry-row .carr-input{
  font-size:13px;
  border:1.5px dashed var(--line);
  background:var(--bg-soft);color:var(--error);
}
.carry-row .carr-input:focus{
  border-color:var(--error);background:var(--error-bg);
}
.answer-row .ans-input{
  font-size:22px;
  border:2px solid var(--c-metod);
  background:var(--primary-bg);color:var(--ink);
  height:42px;width:36px;
}
.answer-row .ans-input:focus{
  border-color:var(--primary);background:#fff;
  box-shadow:0 0 0 3px rgba(180,83,9,.15);
}
.answer-row .ans-input.correct{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.answer-row .ans-input.wrong{background:var(--error-bg);border-color:var(--error);color:var(--error)}

.upp-i-line{
  width:100%;height:2px;background:var(--ink);
  margin:6px 0;
}

.carry-row{margin-bottom:2px}
.answer-row{margin-top:0}
.uppstallning-box{
  display:inline-flex;flex-direction:column;align-items:flex-end;
  gap:2px;font-family:var(--mono);font-size:22px;font-weight:500;
  padding:14px 18px;background:var(--bg-card);
  border:1px solid var(--line);border-radius:var(--radius);
  min-width:140px;
}
.upp-row{display:flex;gap:2px;justify-content:flex-end;align-items:center}
.upp-row span{
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;text-align:center;
}
.upp-row.op span:first-child{color:var(--c-metod);font-weight:700}
.upp-carry-row{display:flex;gap:2px;justify-content:flex-end;min-height:20px;font-size:13px}

}
  background:var(--bg-card);border:1px solid var(--line);

.flytta-hint{font-size:12px;color:var(--ink-faint);font-style:italic}

}

}

}

}
.om-annot-input:focus{background:#fff;box-shadow:0 0 0 3px rgba(180,83,9,.18)}
.om-annot-input.correct{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.om-annot-input.wrong{background:var(--error-bg);border-color:var(--error);color:var(--error)}

.om-sub-num{
  font-family:var(--mono);font-size:24px;font-weight:700;
  color:var(--c-metod);padding:0 4px;white-space:nowrap;
}
.om-sub-op{
  font-family:var(--mono);font-size:20px;color:var(--ink-soft);
  padding:0 4px;font-weight:500;
}
.om-sub-eq{padding:0 8px}
.om-sub-input{
  font-family:var(--mono);font-size:22px;font-weight:500;
  width:72px;height:42px;text-align:center;
  border:2px solid var(--c-metod);border-radius:var(--radius-sm);
  background:var(--primary-bg);outline:none;color:var(--ink);padding:0;
}
.om-sub-input:focus{background:#fff;box-shadow:0 0 0 3px rgba(180,83,9,.15)}
.om-sub-input.correct{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.om-sub-input.wrong{background:var(--error-bg);border-color:var(--error);color:var(--error)}
.om-sub-ans{border-color:var(--primary);font-weight:700;width:80px}
.oka-minska-grid{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.om-rad{

  padding:12px 14px;background:var(--bg-card);
  border:1px solid var(--line);border-radius:var(--radius);
  font-family:var(--mono);font-size:15px;
}
.om-rad.om-original{background:var(--bg-soft);border-style:dashed;color:var(--ink-soft)}
.om-rad.om-facit{background:transparent;border:none;padding-top:4px;font-size:12px}
.om-label{color:var(--ink-soft);font-size:13px;font-family:var(--sans);flex:1}
.om-expr{font-weight:600;color:var(--ink)}
.om-eq{color:var(--ink-soft)}
.om-input{
  font-family:var(--mono);font-size:16px;width:80px;height:38px;
  text-align:center;border:2px solid var(--c-metod);border-radius:var(--radius-sm);
  background:var(--primary-bg);outline:none;color:var(--ink);padding:0;
}
.om-input.correct{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.om-input.wrong{background:var(--error-bg);border-color:var(--error);color:var(--error)}

/* ==== ADDITION BAKIFRÅN ==== */
.abakifran-grid{display:flex;flex-direction:column;gap:16px;margin:12px 0}
.abakifran-tallinje{
  position:relative;height:54px;margin:0 20px;
}
.ab-linje{
  position:absolute;top:38px;left:0;right:0;
  height:3px;background:var(--c-metod);border-radius:2px;
}
.ab-punkt{position:absolute;display:flex;flex-direction:column;align-items:center}
.ab-dot{
  width:12px;height:12px;background:var(--c-metod);
  border-radius:50%;position:absolute;top:33px;
  transform:translateX(-50%);
}
.ab-label{
  font-family:var(--mono);font-weight:600;font-size:14px;
  color:var(--c-metod);transform:translateX(-50%);
  white-space:nowrap;
}
.abakifran-steg{display:flex;flex-direction:column;gap:8px}
.ab-steg-rad{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 14px;background:var(--bg-card);
  border:1px solid var(--line);border-radius:var(--radius);
}
.ab-steg-rad.ab-steg-sum{
  background:var(--primary-bg);border-color:var(--primary);
}
.ab-steg-label{font-size:14px;color:var(--ink);flex:1;font-family:var(--sans)}

@media print{
  body{background:#fff !important}
  .topbar, .tutor-fab, .tutor-panel, .breadcrumb, .test-progress-bar, .practice-cta-grid, .video-section, .test-result-actions, .test-take-actions, .btn{display:none !important}
  .view{padding:0 !important;max-width:100% !important}
  .test-take-question, .test-review-card, .test-overview, .header-card{break-inside:avoid;page-break-inside:avoid;box-shadow:none !important;border:1px solid #999 !important;margin-bottom:14px !important}
}

/* ==== AI TUTOR ==== */
.tutor-fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:var(--primary);border:none;color:#fff;font-size:24px;cursor:pointer;box-shadow:var(--shadow-lg);z-index:100;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .15s}
.tutor-fab:hover{background:#9A4607;transform:scale(1.05)}
.tutor-panel{position:fixed;bottom:0;right:0;width:100%;max-width:400px;height:100%;max-height:600px;background:var(--bg-card);border-top-left-radius:var(--radius-lg);border:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:101;display:none;flex-direction:column;overflow:hidden}
.tutor-panel.is-open{display:flex}
@media (min-width:480px){.tutor-panel{bottom:24px;right:24px;max-height:560px;border-radius:var(--radius-lg)}}
.tutor-header{padding:14px 18px;background:var(--primary);color:#fff;display:flex;justify-content:space-between;align-items:center}
.tutor-title{font-family:var(--serif);font-weight:500;font-size:17px}
.tutor-subtitle{font-size:12px;opacity:.85}
.tutor-close{background:transparent;border:none;color:#fff;font-size:24px;cursor:pointer;line-height:1;padding:0;width:28px;height:28px}
.tutor-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.tutor-msg{padding:10px 14px;border-radius:var(--radius);font-size:14px;line-height:1.5;max-width:85%;white-space:pre-wrap}
.tutor-msg.assistant{background:var(--bg-soft);align-self:flex-start;color:var(--ink)}
.tutor-msg.user{background:var(--primary);color:#fff;align-self:flex-end}
.tutor-msg.error{background:var(--error-bg);color:var(--error);align-self:stretch;font-size:13px}
.tutor-input-row{border-top:1px solid var(--line);padding:12px;display:flex;gap:8px}
.tutor-input{flex:1;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;font-family:var(--sans);font-size:14px;outline:none;resize:none;min-height:40px;max-height:100px}
.tutor-input:focus{border-color:var(--primary)}
.tutor-send{background:var(--primary);color:#fff;border:none;border-radius:var(--radius);padding:0 16px;font-size:14px;font-weight:500;cursor:pointer}
.tutor-send:disabled{background:var(--ink-faint);cursor:not-allowed}

/* ==== DEL 3: SKÄRMTANGENTBORD ==== */
.keypad{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.keypad-digits{display:grid;grid-template-columns:repeat(3,46px);gap:6px}
.keypad-ops{display:grid;grid-template-columns:46px;gap:6px;align-content:start}
.keypad-ops.wide2{grid-template-columns:repeat(2,46px)}
.kp-key{
  height:44px;border:1.5px solid var(--line);border-radius:var(--radius-sm);
  background:var(--bg-card);font-family:var(--mono);font-size:19px;font-weight:600;
  color:var(--ink);cursor:pointer;transition:transform .08s,background .1s,border-color .1s;
  display:flex;align-items:center;justify-content:center;user-select:none;
}
.kp-key:hover{background:var(--c-metod-bg);border-color:var(--c-metod)}
.kp-key:active{transform:scale(.92)}
.kp-key.op{color:var(--c-metod);font-weight:700}
.kp-key.util{background:var(--bg-soft);color:var(--ink-soft);font-size:15px}
.kp-key.span2{grid-column:span 2}
.kp-hint{text-align:center;font-size:12px;color:var(--ink-faint);margin-top:8px}

/* ==== DEL 3: TABELLTRÄNING ==== */
.tabell-level-grid{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.tabell-card{

}
.tabell-card:hover{border-color:var(--c-rakna);transform:translateX(2px);box-shadow:var(--shadow-sm)}
.tabell-card-num{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--c-rakna-bg);color:var(--c-rakna);font-weight:700;font-size:18px;
}
.tabell-card-body{flex:1}
.tabell-card-namn{font-weight:600;font-size:15px;color:var(--ink);margin-bottom:2px}
.tabell-card-desc{font-size:13px;color:var(--ink-soft)}
.tabell-fraga{
  font-family:var(--mono);font-size:46px;font-weight:600;color:var(--ink);
  text-align:center;margin:18px 0 6px;letter-spacing:2px;
}
.tabell-fraga .tabell-eq{color:var(--ink-faint)}
.tabell-svar-input{

  text-align:center;border:2.5px solid var(--c-rakna);border-radius:var(--radius);
  background:var(--c-rakna-bg);color:var(--c-rakna);outline:none;display:block;margin:0 auto;
}
.tabell-svar-input:focus{background:#fff;box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.tabell-svar-input.correct{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.tabell-svar-input.wrong{background:var(--error-bg);border-color:var(--error);color:var(--error)}
.tabell-progress{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:14px}
.tabell-progress-bar{
  height:8px;background:var(--bg-soft);border-radius:4px;margin:8px auto 0;max-width:320px;overflow:hidden;
}
.tabell-progress-fill{height:100%;background:var(--c-rakna);transition:width .25s}
.tabell-feedback{
  text-align:center;font-family:var(--mono);font-size:15px;font-weight:600;
  min-height:22px;margin-top:10px;
}
.tabell-feedback.correct{color:var(--success)}
.tabell-feedback.wrong{color:var(--error)}
.tabell-timer{
  text-align:center;font-family:var(--mono);font-size:15px;font-weight:600;
  color:var(--ink-soft);margin-bottom:4px;
}
.tabell-timer .tt-ikon{opacity:.7}
.tabell-tidkort{
  background:var(--c-rakna-bg);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:16px;text-align:center;
}
.tabell-tid-stor{
  font-family:var(--mono);font-size:42px;font-weight:700;color:var(--c-rakna);line-height:1.1;
}
.tabell-tid-rad{font-size:13px;color:var(--ink-soft);margin-top:6px}
.tabell-rekord{
  margin-top:10px;font-size:14px;font-weight:600;
  padding:8px 12px;border-radius:var(--radius-sm);display:inline-block;
}
.tabell-rekord.nytt{background:var(--success-bg);color:var(--success)}
.tabell-rekord.gammalt{background:var(--bg-soft);color:var(--ink-soft)}

/* ==== DEL 3: METODER – ENRADSUPPGIFT ==== */
.mult-metod-uppg{
  background:var(--c-metod-bg);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:16px;
}
.mult-metod-tal{
  font-family:var(--mono);font-size:30px;font-weight:600;color:var(--c-metod);
  text-align:center;margin-bottom:4px;
}
.mult-metod-instr{font-size:13px;color:var(--ink-soft);text-align:center;margin-bottom:14px}
.mult-rad-wrap{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.mult-rad-fast{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--ink)}
.mult-rad-input{
  min-width:220px;flex:1;max-width:420px;height:50px;
  font-family:var(--mono);font-size:22px;font-weight:600;
