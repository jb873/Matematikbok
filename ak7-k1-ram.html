      const tutor = tutorVerdictFor(rad.ko, rad.key);
      const tutorTxt = tutor ? VERDICT_TEXT[tutor] : 'ej testat';
      return '- ' + rad.text + ' | elevens skattning: ' + VERDICT_TEXT[answers[i]] + ' | tutorns bedömning: ' + tutorTxt;
    }).join('\n');
    const userPrompt = 'Här är en elevs självskattning för addition, jämförd med tutorns bedömning (byggd på elevens övningsresultat).\n\n'
      + punkter + '\n\n'
      + 'Skriv en kort, uppmuntrande genomgång på svenska riktad direkt till eleven (åk 7). '
      + 'Lyft först kort det som stämmer bra. Fokusera sedan på raderna där elevens skattning och tutorns bedömning skiljer sig: '
      + 'förklara vänligt vad skillnaden kan bero på och ge ett konkret tips på vad eleven kan träna på. '
      + 'Nämn också om något inte testats än. Håll det till 4–7 meningar, inga punktlistor.';
    try{
      const res = await aiFetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 500,
          system: 'Du är en vänlig matematiktutor för svenska högstadieelever (åk 7). '
            + 'Du hjälper eleven förstå sin egen självskattning i addition. '
            + 'Var konkret, snäll och uppmuntrande utan överdrivet beröm. '
            + 'Gångertecken skrivs alltid som · (mittpunktsprick). Svara på svenska i löpande text.',
          messages: [{role:'user', content: userPrompt}]
        })
      });
      if(!res.ok) throw new Error('API ' + res.status);
      const data = await res.json();
      const reply = data.content.map(function(c){ return c.text || ''; }).join('').trim();
      aiBody.textContent = reply || 'Tutorn hade inget att tillägga just nu.';
    } catch(e){
      aiBody.classList.add('error');
      aiBody.textContent = 'Kunde inte hämta tutorns genomgång (' + e.message + '). '
        + 'Jämförelsen ovan visar ändå var din skattning och tutorns bedömning skiljer sig.';
    }
  }

  render();
  showView('skattning');
  updateTutorContext();
}

// --- KO 1, rakna: dela upp differensen i termer ---
function renderSubBegreppRakna(body){
  let omgang = [], idx = 0, results = [];

  function genOmgang(){
    return [
      {antal:2, mal:d3RandInt(5,13), niva:1},
      {antal:2, mal:d3RandInt(11,19), niva:1},
      {antal:2, mal:d3RandInt(15,24), niva:2},
      {antal:3, mal:d3RandInt(9,18), niva:2},
      {antal:3, mal:d3RandInt(18,28), niva:2},
      {antal:3, mal:d3RandInt(28,45), niva:3}
    ];
  }

  function renderSummary(){
    const right = results.filter(function(x){ return x; }).length;
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Dela upp differensen i termer', 'Du klarade ' + right + ' av ' + results.length + '.')
      + renderSummaryCard({right:right, total:results.length, nextLabel:'Ny omgång'})
      + '<div style="margin-top:-8px;text-align:center;"><button class="btn subtle" id="sub-du-back">Tillbaka</button></div>'
    + '</div>';
    document.getElementById('summary-next-btn').onclick = function(){ omgang = genOmgang(); idx = 0; results = []; render(); };
    document.getElementById('sub-du-back').onclick = function(){ navTo('ko',{koId:'sub-begrepp', delId:'subtraktion'}); };
  }

  function render(){
    if(idx >= omgang.length){ renderSummary(); return; }
    const t = omgang[idx];
    const ordAntal = t.antal === 2 ? 'två' : 'tre';
    const exHint = t.antal === 2
      ? 'ex. 9 − 5 = ' + t.mal
      : 'ex. 30 − 10 − 13 = ' + t.mal;
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Dela upp differensen i termer', 'Skriv talen med − emellan. Talen 1, 2 och 3 är inte godkända.')
      + renderScoreBarSimple(results.filter(function(x){return x;}).length, results.filter(function(x){return !x;}).length, omgang.length, idx)
      + '<div class="mult-metod-uppg">'
        + '<div class="mult-metod-instr">Skriv ' + t.mal + ' som en differens med ' + ordAntal + ' termer. (' + exHint + ')</div>'
        + '<div class="rakna-svar-rad">'
          + '<span class="rakna-svar-fast">' + t.mal + ' =</span>'
          + '<input type="text" class="rakna-svar-input" id="sub-du-input" autocomplete="off" placeholder="' + (t.antal===2?'9 − 5':'30 − 10 − 13') + '">'
        + '</div>'
      + '</div>'
      + '<div class="rakna-uppdela-feedback" id="sub-du-fb"></div>'
      + keypadHTML(['-'])
      + '<div style="margin-top:16px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'
        + '<button class="btn primary" id="sub-du-check">Kontrollera</button>'
        + '<button class="btn subtle" id="sub-du-back">Tillbaka</button>'
      + '</div>'
    + '</div>';
    const card = body.querySelector('.exercise-card');
    bindKeypad(card);
    const input = document.getElementById('sub-du-input');
    input.addEventListener('input', function(){ const f=d3SpaceExpr(input.value); if(f!==input.value) input.value=f; });
    setTimeout(function(){ input.focus(); }, 50);
    input.addEventListener('keydown', function(e){ if(e.key==='Enter'){e.preventDefault(); check();} });
    document.getElementById('sub-du-check').onclick = check;
    document.getElementById('sub-du-back').onclick = function(){ navTo('ko',{koId:'sub-begrepp', delId:'subtraktion'}); };

    function check(){
      const raw = input.value.trim();
      const fb = document.getElementById('sub-du-fb');
      fb.className = 'rakna-uppdela-feedback show';
      const delar = raw.split('-').map(function(s){ return s.trim(); }).filter(function(s){ return s !== ''; });
      let res;
      if(!raw){
        res = {ok:false, msg:'Skriv din differens på raden.'};
      } else if(delar.length !== t.antal){
        res = {ok:false, msg:'Du ska skriva exakt ' + ordAntal + ' termer med − emellan.'};
      } else {
        let bad = null;
        for(let i=0; i<delar.length; i++){
          const v = Number(delar[i]);
          if(!Number.isInteger(v) || v < 0){ bad = '"' + delar[i] + '" är inte ett positivt heltal.'; break; }
          if(v <= 3){ bad = 'Termen ' + v + ' är inte godkänd – talen 1, 2 och 3 får inte användas.'; break; }
        }
        if(bad) res = {ok:false, msg:bad};
        else {
          let diff = Number(delar[0]);
          for(let i=1; i<delar.length; i++) diff -= Number(delar[i]);
          if(diff !== t.mal) res = {ok:false, msg:'Differensen av dina termer blir ' + diff + ', men den ska bli ' + t.mal + '.'};
          else res = {ok:true};
        }
      }
      input.disabled = true;
      document.getElementById('sub-du-check').disabled = true;
      const ts = getTutorScore('sub-begrepp','rakna');
      const tsG = getTutorScore('sub-begrepp','delaupp');
      ts.total++; tsG.total++;
      if(res.ok){
        input.classList.add('correct'); fb.classList.add('correct');
        fb.textContent = 'Rätt! ' + t.mal + ' = ' + raw + '  ✓';
        ts.correct++; tsG.correct++;
      } else {
        input.classList.add('wrong'); fb.classList.add('wrong');
        fb.textContent = res.msg;
      }
      results.push(res.ok);
      setTimeout(function(){ idx++; render(); }, res.ok ? 1800 : 2800);
    }
  }
  omgang = genOmgang(); render();
}

function renderSubHuvudrakning(body){
  const ENKEL = {
    header:'Huvudräkning · enkla tal', formagaKey:'rakna', koId:'sub-rakna', scoreKey:'enkel',
    sub:'Räkna i huvudet – jobba över tiotalsgränsen.',
    backLabel:'Tillbaka till kategorier', ops:[],
    exempel:'<strong>Tänk så här:</strong> Bryt upp subtraktion i steg om tiotalsgränsen är i vägen.<br>'
      + '<span class="ex-rad">17 − 8 = 9</span><br>'
      + '<span class="ex-rad">34 − 8 = 26</span><br>'
      + '<span class="ex-rad">22 − 13 = 9</span><br>'
      + '<span class="ex-rad">34 − 18 = 16</span>',
    gen:function(level){
      let a, b;
      if(level === 1){
        b = d3RandInt(4,9);
        a = (Math.floor(d3RandInt(11,19)/10)*10) + d3RandInt(1, 10-b-1+b);
        // ensure a's units < b so crossing
        const u = a%10; if(u >= b) a = a - u + d3RandInt(1, b-1 < 1 ? 1 : b-1);
        a = Math.max(a, b+1);
      } else if(level === 2){
        a = d3RandInt(21,49); b = d3RandInt(5,9); const ua=a%10; if(ua>=b) a=a-ua+d3RandInt(1,Math.max(1,b-1));
        a = Math.max(a, b+1);
      } else {
        a = d3RandInt(22,99); b = d3RandInt(13,49);
        if(b >= a) b = a - d3RandInt(5,15);
        if(b < 4) b = 4;
      }
      const ans = a - b;
      return {display: a + ' − ' + b, answerNum: ans, answerStr: String(ans)};
    }
  };
  const DECIMAL = {
    header:'Huvudräkning · decimaltal', formagaKey:'rakna', koId:'sub-rakna', scoreKey:'decimal',
    sub:'Subtrahera decimaltal i huvudet.',
    backLabel:'Tillbaka till kategorier', ops:[','],
    exempel:'<strong>Tänk så här:</strong> Håll koll på tiondelar och hundradelar.<br>'
      + '<span class="ex-rad">10,1 − 0,2 = 9,9</span><br>'
      + '<span class="ex-rad">2,4 − 1,7 = 0,7</span><br>'
      + '<span class="ex-rad">12,5 − 3,9 = 8,6</span>',
    gen:function(level){
      let aH, bH;
      if(level === 1){
        // nära tiotal
        const base = d3RandInt(1,9) * 100;
        aH = base + d3RandInt(1,15);
        bH = d3RandInt(2,Math.min(aH-1, 20));
      } else if(level === 2){
        aH = d3RandInt(15,300); bH = d3RandInt(5, aH-1);
      } else {
        aH = d3RandInt(105,1200); bH = d3RandInt(15, aH-1);
      }
      if(bH >= aH) bH = aH - d3RandInt(5,15);
      if(bH < 1) bH = 1;
      return {display: d3DecStr(aH,2) + ' − ' + d3DecStr(bH,2),
              answerNum: (aH-bH)/100,
              answerStr: d3DecStr(aH-bH,2)};
    }
  };
  const FRACBANK = [
    {f:'1/2',d:50},{f:'1/4',d:25},{f:'3/4',d:75},{f:'1/5',d:20},
    {f:'2/5',d:40},{f:'3/5',d:60},{f:'4/5',d:80},{f:'1/10',d:10},{f:'3/10',d:30},{f:'7/10',d:70}
  ];
  const BRAK = {
    header:'Huvudräkning · bråk och blandad form', formagaKey:'rakna', koId:'sub-rakna', scoreKey:'brak',
    sub:'Skriv om bråket till decimalform och subtrahera. Visa mellanledet.',
    instr:'Skriv om och räkna, t.ex. 0,7 − 0,25 = 0,45.',
    placeholder:'t.ex. 0,7 − 0,25 = 0,45', ops:['-',',','='], backLabel:'Tillbaka till kategorier',
    exempel:'<strong>Så funkar det:</strong> Skriv bråket som decimaltal, subtrahera sedan.<br>'
      + '<span class="ex-rad">0,7 − 1/4 = 0,7 − 0,25 = 0,45</span><br>'
      + '<span class="ex-rad">3/5 − 0,25 = 0,6 − 0,25 = 0,35</span>',
    gen:function(level){
      const fr = randPick(FRACBANK);
      let leftText, ansH;
      if(level === 1){
        const decH = d3RandInt(5,12) * 10;
        if(decH <= fr.d){ // ensure positive
          const decH2 = fr.d + d3RandInt(1,5)*10;
          ansH = decH2 - fr.d;
          leftText = d3DecStr(decH2,2) + ' − ' + fr.f + ' =';
        } else {
          ansH = decH - fr.d;
          leftText = d3DecStr(decH,2) + ' − ' + fr.f + ' =';
        }
      } else if(level === 2){
        const w = d3RandInt(1,4);
        const fr2 = randPick(FRACBANK);
        const bigH = w*100 + fr.d;
        if(fr2.d >= bigH){ ansH = fr2.d - bigH; leftText = fr2.f + ' − ' + w + ' ' + fr.f + ' ='; }
        else { ansH = bigH - fr2.d; leftText = w + ' ' + fr.f + ' − ' + d3DecStr(fr2.d,2) + ' ='; }
        if(ansH < 0){ ansH = -ansH; } // failsafe
      } else {
        const fr2 = randPick(FRACBANK);
        const bigger = Math.max(fr.d, fr2.d);
        const smaller = Math.min(fr.d, fr2.d);
        ansH = bigger - smaller;
        if(fr.d > fr2.d) leftText = fr.f + ' − ' + fr2.f + ' =';
        else leftText = fr2.f + ' − ' + fr.f + ' =';
      }
      if(ansH < 0) ansH = 0;
      return {leftText: leftText, answerNum: ansH/100};
    }

  function renderPicker(){

          }).join('')

    + '</div>';
    body.querySelectorAll('[data-kat]').forEach(function(btn){
      btn.onclick = function(){
        const kat = btn.dataset.kat;
        if(kat === 'brak') renderSubEnrad(body, BRAK, renderPicker);
        else renderAddSingle(body, kat === 'enkel' ? ENKEL : DECIMAL, renderPicker);
      };
    });
  }
  renderPicker();
}

          if(v===null){res={ok:false,msg:'Kunde inte tolka "'+segs[i]+'". Använd siffror och räknetecken.'};break;}
          if(Math.abs(v-task.answerNum)>1e-6*Math.max(1,Math.abs(task.answerNum))){
            res={ok:false,msg:'Det stämmer inte. "'+segs[i]+'" blir '+d3FmtNum(v)+', men svaret ska bli '+d3FmtNum(task.answerNum)+'.'};break;}
        }
      }
      input.disabled=true; document.getElementById('sube-check').disabled=true;
      ts.total++; tsG.total++;
      if(res.ok){input.classList.add('correct');fb.classList.add('correct');fb.textContent='Rätt! '+task.leftText+' '+raw+'  ✓';ts.correct++;tsG.correct++;}
      else{input.classList.add('wrong');fb.classList.add('wrong');fb.textContent=res.msg;}
      results.push(res.ok);
      setTimeout(function(){idx++;render();},res.ok?1900:2800);
    }
  }
  omgang=genOmgang(); render();
}

function renderSubMetoder(body){
  // Negativa tal – ny metod med mellanled
  const NEGATIVA = {
    header:'Metod · subtraktion med negativa tal', formagaKey:'metod', koId:'sub-metoder', scoreKey:'negativa',
    sub:'Den andra termen är negativ. Skriv om och visa mellanledet.',
    instr:'Skriv om och visa mellanledet, t.ex. (−9) − (−8) = (−9) + 8 = −1.',
    placeholder:'t.ex. (−9) + 8 = −1', ops:['-','+','(',')',' '], backLabel:'Tillbaka till metoder',
    exempel:'<strong>Så funkar det:</strong> Att subtrahera ett negativt tal = att addera dess positiva värde.<br>'
      + '<span class="ex-rad">6 − (−3) = 6 + 3 = 9</span><br>'
      + '<span class="ex-rad">(−7) − 6 = −13</span><br>'
      + '<span class="ex-rad">(−9) − (−8) = (−9) + 8 = −1</span>',
    gen:function(level){
      const maxMag = level === 1 ? 12 : 29;
      const minMag = level === 1 ? 3 : 5;
      let a, b, ans;
      // Garantera ett av de intressanta mönstren
      const pat = d3RandInt(0,2);
      if(pat === 0){ // pos − neg  →  pos + pos
        a = d3RandInt(minMag, maxMag); b = -d3RandInt(minMag, maxMag);
      } else if(pat === 1){ // neg − pos  → mer neg
        a = -d3RandInt(minMag, maxMag); b = d3RandInt(minMag, maxMag);
      } else { // neg − neg
        a = -d3RandInt(minMag+1, maxMag); b = -d3RandInt(minMag, Math.abs(a)-1);
      }
      ans = a - b;
      function fmt(x){ return x < 0 ? '(−' + (-x) + ')' : '' + x; }
      function fmtAns(x){ return x < 0 ? '−' + (-x) : '' + x; }
      return {leftText: fmt(a) + ' − ' + fmt(b) + ' =',
              answerNum: ans, answerStr: fmtAns(ans)};
    }
  };

  function renderPicker(){
    const kort = [
      {id:'uppstallning', nr:1, namn:'Uppställning',          desc:'Subtrahera siffra för siffra, lån vid behov.'},
      {id:'okaminska',    nr:2, namn:'Öka och minska lika',   desc:'73 − 28 = 75 − 30 = 45'},
      {id:'bakifran',     nr:3, namn:'Addition bakifrån',      desc:'Räkna upp: hur långt är det från b till a?'},
      {id:'negativa',     nr:4, namn:'Negativa tal',           desc:'6 − (−3) = 6 + 3 = 9'}
    ];
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Metoder', 'Välj en metod att lära dig och träna på.')
      + '<div class="tabell-level-grid">'
        + kort.map(function(k){
            return '<button class="tabell-card" data-m="' + k.id + '">'
              + '<div class="tabell-card-num">' + k.nr + '</div>'
              + '<div class="tabell-card-body">'
                + '<div class="tabell-card-namn">' + k.namn + '</div>'
                + '<div class="tabell-card-desc">' + k.desc + '</div>'
              + '</div>'
              + '<div style="color:var(--ink-faint);font-size:20px;">›</div>'
            + '</button>';
          }).join('')
      + '</div>'
    + '</div>';
    body.querySelectorAll('[data-m]').forEach(function(btn){
      btn.onclick = function(){
        const m = btn.dataset.m;
        const metodObj = {id: m === 'uppstallning' ? 'uppstallning-sub' : m === 'okaminska' ? 'oka-minska' : 'addition-bakifran',
                          namn:'', beskrivning:'Välj metod och öva.'};
        if(m === 'uppstallning') renderUppstallningSubEnkel(body, metodObj, renderPicker);
        else if(m === 'okaminska') renderOkaMinska(body, metodObj, renderPicker);
        else if(m === 'bakifran') renderAdditionBakifran(body, metodObj, renderPicker);
        else renderSubEnrad(body, NEGATIVA, renderPicker);
      };
    });
  }

  // Wrappa befintliga metoder med ny poängsättning
  const _origUppEnkel = renderUppstallningSubEnkel;
  const _origOka = renderOkaMinska;
  const _origBak = renderAdditionBakifran;

  renderPicker();
}

function renderSubProblem(body){
  let level = 1, currentSet = [], answered = 0, rightCount = 0;

  function pickSet(){
    const pool = SUB_LASTAL.filter(function(p){ return p.level === level; });
    return shuffle(pool.slice()).slice(0, 3);
  }
  function start(){ currentSet = pickSet(); answered = 0; rightCount = 0; render(); }

  function render(){
    let tasks = '';
    for(let i=0; i<currentSet.length; i++){
      const p = currentSet[i];
      tasks += '<div class="prob-task" data-i="' + i + '">'
        + '<div class="prob-text">Lästal ' + (i+1) + ' av ' + currentSet.length + '</div>'
        + '<div style="font-size:15px;line-height:1.6;color:var(--ink);margin-bottom:12px;">' + p.text + '</div>'
        + '<div class="prob-svar-rad">'
          + '<span style="font-size:14px;color:var(--ink-soft);">Svar:</span>'
          + '<input type="text" class="prob-input" inputmode="text" maxlength="12" data-input="' + i + '" autocomplete="off" placeholder="?">'
          + '<span class="prob-enhet">' + p.enhet + '</span>'

        + '</div>'
        + '<div class="prob-foto-rad">'
          + '<button type="button" class="prob-foto-btn" data-foto="' + i + '">📷 Fota din lösning <span style="opacity:.7;">(frivilligt)</span></button>'
          + '<input type="file" accept="image/*" capture="environment" data-fotoinput="' + i + '" style="display:none;">'
          + '<div class="prob-foto-preview" id="prob-foto-' + i + '"></div>'
        + '</div>'
        + '<div class="prob-feedback" id="prob-fb-' + i + '"></div>'
      + '</div>';
    }
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Problemlösning med lästal', 'Nivå ' + level + ' av 3. Lös de tre lästalen. Du kan fota din uträkning och visa hur du tänkt.')
      + tasks + '<div id="prob-summary-anchor"></div></div>';

    body.querySelectorAll('[data-check]').forEach(function(b){
      b.addEventListener('click', function(){ check(parseInt(b.dataset.check)); });
    });
    body.querySelectorAll('[data-foto]').forEach(function(b){
      const i = b.dataset.foto;
      const fi = body.querySelector('[data-fotoinput="' + i + '"]');
      b.addEventListener('click', function(){ fi.click(); });
      fi.addEventListener('change', function(e){
        const f = e.target.files && e.target.files[0]; if(!f) return;
        const reader = new FileReader();
        reader.onload = function(ev){
          const prev = document.getElementById('prob-foto-' + i);
          prev.innerHTML = '<div class="prob-foto-cap">Din fotograferade lösning</div>'
            + '<img src="' + ev.target.result + '" alt="Fotograferad lösning">'
            + '<div><button type="button" class="prob-foto-remove" data-rmfoto="' + i + '">Ta bort bild</button></div>';
          prev.querySelector('[data-rmfoto]').addEventListener('click', function(){ prev.innerHTML=''; fi.value=''; });
        };
        reader.readAsDataURL(f);
      });
    });
  }

  function check(i){
    const p = currentSet[i];
    const inp = body.querySelector('[data-input="' + i + '"]');
    const fb = document.getElementById('prob-fb-' + i);
    if(inp.disabled) return;
    fb.classList.remove('correct','wrong'); fb.classList.add('show');
    inp.classList.remove('correct','wrong');
    const ts = getTutorScore('sub-problem','problem');
    const stu = d3ParseNum(inp.value);
    if(stu === null){ fb.classList.add('wrong'); fb.textContent = 'Skriv ett tal som svar.'; return; }
    ts.total++;
    let wasRight = false;
    if(Math.abs(stu-p.answer) < 1e-6*Math.max(1,Math.abs(p.answer))){
      inp.classList.add('correct'); fb.classList.add('correct');
      fb.textContent = 'Rätt! ' + p.exp; ts.correct++; wasRight = true;
    } else {
      inp.classList.add('wrong'); fb.classList.add('wrong');
      fb.textContent = 'Inte rätt. Rätt svar: ' + d3FmtNum(p.answer) + ' ' + p.enhet + '. ' + p.exp;
    }
    inp.disabled = true;
    body.querySelector('[data-check="' + i + '"]').disabled = true;
    if(wasRight) rightCount++;
    answered++;
    if(answered >= currentSet.length) setTimeout(showSummary, 700);
  }

  function showSummary(){
    const anchor = document.getElementById('prob-summary-anchor');
    if(!anchor) return;
    let knappar = '<div class="prob-niva-val">';
    if(level < 3) knappar += '<button class="btn primary" id="prob-svarare">Öka svårighetsgrad →</button>';
    knappar += '<button class="btn" id="prob-samma">Samma nivå igen</button>';
    if(level > 1) knappar += '<button class="btn subtle" id="prob-lattare">← Lättare nivå</button>';
    knappar += '</div>';
    anchor.innerHTML = '<div style="margin-top:20px;">' + renderSummaryCard({right:rightCount, total:currentSet.length, nextLabel:'Nya lästal'}) + knappar + '</div>';
    document.getElementById('summary-next-btn').onclick = start;
    const sv = document.getElementById('prob-svarare'); if(sv) sv.onclick = function(){ level=Math.min(3,level+1); start(); };
    const la = document.getElementById('prob-lattare'); if(la) la.onclick = function(){ level=Math.max(1,level-1); start(); };
    document.getElementById('prob-samma').onclick = start;
    anchor.scrollIntoView({behavior:'smooth', block:'start'});
  }
  start();
}

function divDigSum(n){
  n = Math.abs(n); var s = 0;
  while(n > 0){ s += n % 10; n = Math.floor(n / 10); }
  return s;
}

function prioEval(uttryck){
  if(uttryck == null) return null;
  var e = String(uttryck)
    .replace(/[x×]/g, '*')
    .replace(/\u00b7/g, '*')
    .replace(/\u2212/g, '-')
    .replace(/\s/g, '')
    .replace(/,/g, '.');
  if(e === '') return null;
  if(!/^[-+*/().\d]+$/.test(e)) return null;
  try{
    var v = Function('"use strict";return (' + e + ')')();
    if(typeof v !== 'number' || !isFinite(v)) return null;
    return Math.round(v * 1e6) / 1e6;
  }catch(err){ return null; }
}
function prioNum(n){
  var r = Math.round(n * 1e6) / 1e6;
  return (r < 0 ? '−' : '') + String(Math.abs(r)).replace('.', ',');
}
function prioParen(n){
  return n < 0 ? '(' + prioNum(n) + ')' : prioNum(n);
}

// Generisk räknemotor: visar en fråga, ett svarsfält, knappsats, nivåer.
// cfg: {title, sub, koId, forKey, scoreKey, keypadOps, OMG, gen}
// gen(level) returnerar {q: htmlsträng, answer: tal}
function negCalcEngine(body, cfg, backFn){
  var level = 1, omgang = [], idx = 0, results = [], OMG = cfg.OMG || 6;
  function genOmgang(){
    var a = [];
    for(var i=0; i<OMG; i++) a.push(cfg.gen(level));
    return a;
  }
  function render(){
    if(idx >= omgang.length){
      var right = results.filter(function(x){ return x; }).length;
      var total = results.length;
      var adj = adjustLevel(level, right, total);
      level = adj.level;
      body.innerHTML = '<div class="exercise-card">'
        + exerciseHeader(cfg.title, 'Du klarade ' + right + ' av ' + total + '.', level)
        + renderSummaryCard({right:right, total:total, level:level, levelChange:adj.change})
        + '<div style="margin-top:-8px;text-align:center;"><button class="btn subtle" id="neg-back">Tillbaka</button></div>'
      + '</div>';
      document.getElementById('summary-next-btn').onclick = function(){
        omgang = genOmgang(); idx = 0; results = []; render();
      };
      document.getElementById('neg-back').onclick = backFn;
      return;
    }
    var task = omgang[idx];
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader(cfg.title + ' — nivå ' + level, cfg.sub, level)
      + renderScoreBarSimple(results.filter(function(x){return x;}).length, results.filter(function(x){return !x;}).length, omgang.length, idx)
      + '<div class="neg-fraga">' + task.q + '</div>'
      + '<div class="rakna-svar-rad"><input type="text" class="rakna-svar-input" id="neg-input" inputmode="text" maxlength="9" autocomplete="off" placeholder="?"></div>'
      + '<div class="rakna-uppdela-feedback" id="neg-fb"></div>'
      + keypadHTML(cfg.keypadOps || ['−'])
      + '<div style="margin-top:16px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'
        + '<button class="btn primary" id="neg-check">Kontrollera</button>'
        + '<button class="btn subtle" id="neg-tillbaka">Tillbaka</button>'
      + '</div>'
    + '</div>';
    var card = body.querySelector('.exercise-card');
    bindKeypad(card);
    var input = document.getElementById('neg-input');
    setTimeout(function(){ input.focus(); }, 50);
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); check(); }
    });
    document.getElementById('neg-tillbaka').onclick = backFn;
    function check(){
      var fb = document.getElementById('neg-fb');
      fb.className = 'rakna-uppdela-feedback show';
      var stu = d3ParseNum(input.value);
      input.disabled = true;
      document.getElementById('neg-check').disabled = true;
      var ts = getTutorScore(cfg.koId, cfg.forKey);
      var tsG = getTutorScore(cfg.koId, cfg.scoreKey);
      ts.total++; tsG.total++;
      var ok = stu !== null && Math.abs(stu - task.answer) < 1e-6;
      if(ok){
        input.classList.add('correct');
        fb.classList.add('correct');
        fb.textContent = 'Rätt! Svaret är ' + prioNum(task.answer) + '.';
        ts.correct++; tsG.correct++;

// Avrundar n till närmaste multipel av step (t.ex. 10, 100) eller till
// decimaler (step < 1). "Halva uppåt"-regeln.
function avrAvrunda(n, step){
  var q = n / step;
  // hantera flyttalsfel: nudga mot närmaste heltal
  var r = Math.round(q + (q >= 0 ? 1e-9 : -1e-9));
  return Math.round(r * step * 1e6) / 1e6;
}
// Snyggt formaterat tal: − och , , inga onödiga nollor
function avrNum(n){
  var r = Math.round(n * 1e6) / 1e6;
  return (r < 0 ? '−' : '') + String(Math.abs(r)).replace('.', ',');
}
// Tal med fast antal decimaler (för avrundningssvar med t.ex. 12,30)
function avrFixed(n, dec){
  var s = Math.abs(n).toFixed(dec);
  return (n < 0 ? '−' : '') + s.replace('.', ',');
}

// REPETITIONSTUTOR – Steg 1+2: bokföring och pass-väljare
// ============================================================
// Bokförs per (koId, formagaKey) i state.repetition:
//   lastReviewed: ISO-datum, senast övad
//   intervalDays: nästa repetition om så här många dagar
//   streak:       antal korrekta i rad (för SM-2-trappan)
//
// SM-2-lik trappa: 1 → 3 → 7 → 16 → 35 dagar. Missat = tillbaka till 1.

var REP_INTERVAL_TRAPPA = [1, 3, 7, 16, 35];

// Färdigheter (koId+formagaKey) grupperas så att panel + pass kan
// blanda två-och-två inom samma grupp om flera är förfallna samtidigt.
// Grupperna speglar delkapitelindelningen i den nya strukturen.
var REP_GRUPPER = [
  {id:'taluppfattning', titel:'positionssystem och talförståelse',
    items:[
      {ko:'siffror',  f:'begrepp'},
      {ko:'positionssystem', f:'begrepp'},
      {ko:'primtal',  f:'begrepp'}, {ko:'primtal', f:'rakna'},
      {ko:'primtal',  f:'metod'},   {ko:'primtal', f:'kommunikation'},
      {ko:'primtal',  f:'resonera'},{ko:'primtal', f:'problem'}
    ]},
  {id:'addition', titel:'addition',
    items:[{ko:'begrepp-as', f:'begrepp'}, {ko:'begrepp-as', f:'rakna'},
           {ko:'add', f:'rakna'}, {ko:'add', f:'metod'}]},
  {id:'subtraktion', titel:'subtraktion',
    items:[{ko:'sub-rakna', f:'rakna'}, {ko:'sub-rakna', f:'enkel'},
           {ko:'sub-metoder', f:'metod'}]},
  {id:'multiplikation', titel:'multiplikation',
    items:[{ko:'mult-tabell', f:'rakna'}, {ko:'mult-tabell', f:'metod'},
           {ko:'mult-uppstall', f:'metod'}, {ko:'mult-faktorisera', f:'metod'}]},
  {id:'division', titel:'division',
    items:[{ko:'div-begrepp', f:'begrepp'}, {ko:'div-rakna', f:'rakna'},
           {ko:'div-metoder', f:'metod'}, {ko:'div-problem', f:'problem'}]},
  {id:'prio', titel:'prioriteringsregeln och räknelagarna',
    items:[{ko:'prio-samband', f:'rakna'},
           {ko:'prio-prioritering', f:'rakna'}, {ko:'prio-prioritering', f:'metod'},
           {ko:'prio-lagar', f:'rakna'}]},
  {id:'negativa', titel:'negativa tal',
    items:[{ko:'neg-begrepp', f:'begrepp'}, {ko:'neg-rakna', f:'rakna'}]},
  {id:'avrundning', titel:'avrundning',
    items:[{ko:'avr-avrundning', f:'begrepp'}]}
];

// Slå upp gruppen för en given (ko,f) – returnerar grupp-id eller null.
function repGruppFor(koId, fKey){
  for(var i=0; i<REP_GRUPPER.length; i++){
    var g = REP_GRUPPER[i];
    for(var j=0; j<g.items.length; j++){
      if(g.items[j].ko === koId && g.items[j].f === fKey) return g.id;
    }
  }
  return null;
}
function repGruppDef(id){
  for(var i=0; i<REP_GRUPPER.length; i++) if(REP_GRUPPER[i].id === id) return REP_GRUPPER[i];
  return null;
}

// ------------------------------------------------------------
// BOKFÖRING: läs/spara state.repetition + state.tutorScores
// ------------------------------------------------------------
var REP_STORAGE_KEY = 'kapitel1_repetition_v1';
var SCORE_STORAGE_KEY = 'kapitel1_tutorScores_v1';

function repLoad(){
  try{
    var r = localStorage.getItem(REP_STORAGE_KEY);
    if(r) state.repetition = JSON.parse(r) || {};
    var s = localStorage.getItem(SCORE_STORAGE_KEY);
    if(s){
      var loaded = JSON.parse(s) || {};
      // smält ihop utan att skriva över befintliga (tomma vid uppstart)
      for(var ko in loaded){
        if(!state.tutorScores[ko]) state.tutorScores[ko] = loaded[ko];
      }
    }
  } catch(e){ /* tom eller korrupt – starta blankt */ }
  if(!state.repetition) state.repetition = {};
}
function repSave(){
  try{
    localStorage.setItem(REP_STORAGE_KEY, JSON.stringify(state.repetition));
    localStorage.setItem(SCORE_STORAGE_KEY, JSON.stringify(state.tutorScores));
  } catch(e){ /* full eller blockerad – skippa tyst */ }
}

// Hämta/skapa repetitions-post för en färdighet
function repGet(koId, fKey){
  var key = koId + '|' + fKey;
  if(!state.repetition[key]){
    state.repetition[key] = {
      ko: koId, f: fKey,
      lastReviewed: null,   // ISO-datum eller null
      intervalDays: 1,      // nästa repetition om så här många dagar
      streak: 0             // korrekta i rad
    };
  }
  return state.repetition[key];
}

// ------------------------------------------------------------
// SM-2-LIK TRAPPA: hur intervallet förändras
// ------------------------------------------------------------
function repNextInterval(currentDays, correct){
  if(!correct) return 1; // missat -> tillbaka till början
  // hitta nuvarande plats i trappan, gå ett steg framåt
  for(var i=0; i<REP_INTERVAL_TRAPPA.length; i++){
    if(REP_INTERVAL_TRAPPA[i] >= currentDays){
      var next = REP_INTERVAL_TRAPPA[Math.min(i+1, REP_INTERVAL_TRAPPA.length-1)];
      return next;
    }
  }
  return REP_INTERVAL_TRAPPA[REP_INTERVAL_TRAPPA.length-1];
}

// Registrera ett resultat – uppdaterar intervall och senast-övad.
// "correct" är bool. Anropas från befintliga övningar (eller från det
// kommande repetitions-passet).
function repRegister(koId, fKey, correct){
  var p = repGet(koId, fKey);
  if(correct){
    p.streak = (p.streak||0) + 1;
    p.intervalDays = repNextInterval(p.intervalDays||1, true);
  } else {
    p.streak = 0;
    p.intervalDays = 1;
  }
  p.lastReviewed = new Date().toISOString().slice(0,10); // YYYY-MM-DD
  repSave();
}

// ------------------------------------------------------------
// FÖRFALLNA: vilka färdigheter behöver repetition just nu?
// ------------------------------------------------------------
function repDaysBetween(dateStrA, dateStrB){
  var a = new Date(dateStrA + 'T00:00:00');
  var b = new Date(dateStrB + 'T00:00:00');
  return Math.floor((b - a) / 86400000);
}

// Returnerar lista över förfallna poster, sorterad med mest förfallna först.
// En post är förfallen om (dagar sedan senast) >= intervalDays.
// Bara färdigheter som faktiskt har övats minst en gång räknas.
function repFinnsForfallna(today){
  today = today || new Date().toISOString().slice(0,10);
  var ut = [];
  for(var key in state.repetition){
    var p = state.repetition[key];
    if(!p.lastReviewed) continue;
    var d = repDaysBetween(p.lastReviewed, today);
    if(d >= (p.intervalDays||1)){
      ut.push({ko:p.ko, f:p.f, dagarForfallen: d - p.intervalDays, post:p});
    }
  }
  ut.sort(function(a,b){ return b.dagarForfallen - a.dagarForfallen; });
  return ut;
}

// ------------------------------------------------------------
// PASS-VÄLJAREN: vilka uppgifter ska repetitionspasset innehålla?
// ------------------------------------------------------------
// Logik:
//  - Inga förfallna -> null
//  - En förfallen färdighet -> {grupp:..., items:[{ko,f}*4]} (4 ggr samma)
//  - Flera inom SAMMA grupp -> ta de 2 mest förfallna, blanda 2+2 -> 4
//  - Flera olika grupper -> ta gruppen med mest förfallen, behandla
//    som "en eller flera inom samma grupp" enligt ovan.
//
// "items" är vad passet ska köra; varje element = en uppgift.
function repValjPass(today){
  var forf = repFinnsForfallna(today);
  if(forf.length === 0) return null;

  // Gruppera de förfallna per grupp-id
  var perGrupp = {};
  forf.forEach(function(p){
    var gid = repGruppFor(p.ko, p.f);
    if(!gid) return; // okänd färdighet – hoppa över
    if(!perGrupp[gid]) perGrupp[gid] = [];
    perGrupp[gid].push(p);
  });

  // Välj gruppen med MEST förfallen post (högsta dagarForfallen i toppen)
  var valdGruppId = null, max = -1;
  for(var gid in perGrupp){
    if(perGrupp[gid][0].dagarForfallen > max){
      max = perGrupp[gid][0].dagarForfallen;
      valdGruppId = gid;
    }
  }
  if(!valdGruppId) return null;

  var grupp = repGruppDef(valdGruppId);
  var inomGrupp = perGrupp[valdGruppId];
  var items = [];
  if(inomGrupp.length >= 2){
    // 2 + 2: två uppgifter på den mest förfallna, två på näst mest
    var a = inomGrupp[0], b = inomGrupp[1];
    items = [
      {ko:a.ko, f:a.f}, {ko:a.ko, f:a.f},
      {ko:b.ko, f:b.f}, {ko:b.ko, f:b.f}
    ];
  } else {
    // bara en förfallen i gruppen: 4 på samma
    var x = inomGrupp[0];
    items = [
      {ko:x.ko, f:x.f}, {ko:x.ko, f:x.f},
      {ko:x.ko, f:x.f}, {ko:x.ko, f:x.f}
    ];
  }
  return {
    gruppId: valdGruppId,
    gruppTitel: grupp ? grupp.titel : valdGruppId,
    items: items,
    forfallnaIGrupp: inomGrupp.length,
    forfallnaTotalt: forf.length
  };
}

// ------------------------------------------------------------
// HÄLSNINGSTEXT (textfragment – ingen AI)
// ------------------------------------------------------------
function repHalsning(pass){
  if(!pass) return null;
  var antal = pass.forfallnaIGrupp;
  if(antal === 1){
    return 'Välkommen tillbaka! Dags att repetera ' + pass.gruppTitel + '.';
  }
  return 'Välkommen tillbaka! Dags att repetera ' + pass.gruppTitel
    + ' — vi blandar fyra uppgifter från två områden.';
}

// ------------------------------------------------------------
// VÄLKOMSTPANEL ("dags att repetera ...")
// ------------------------------------------------------------
// Visas högst upp på startsidan om något är förfallet. Eleven kan
// starta passet eller välja "Inte just nu" – och då döljs panelen
// resten av dagen (sparas i localStorage så den följer mellan besök).

var REP_SKIP_KEY = 'kapitel1_repSkipDate_v1';

function repSkippadIdag(){
  try{
    var d = localStorage.getItem(REP_SKIP_KEY);
    return d === new Date().toISOString().slice(0,10);
  }catch(e){ return false; }
}
function repMarkeraSkippad(){
  try{ localStorage.setItem(REP_SKIP_KEY, new Date().toISOString().slice(0,10)); }
  catch(e){}
}

function repBannerHTML(){
  if(repSkippadIdag()) return '';
  var pass = repValjPass();
  if(!pass) return '';
  // Spara senaste passet på state så klick-handlers hittar det
  state._aktuelltRepPass = pass;
  var sub;
  if(pass.forfallnaIGrupp === 1){
    sub = 'En kort omgång på fyra uppgifter. Klicka när du är redo att börja.';
  } else {
    sub = 'En kort omgång på fyra uppgifter, blandat från två områden inom gruppen.';
  }
  return '<div class="rep-banner">'
    + '<div class="rep-banner-icon">📘</div>'
    + '<div class="rep-banner-text">'
      + '<div class="rep-banner-eyebrow">Repetition · ' + pass.gruppTitel + '</div>'
      + '<div class="rep-banner-title">' + repHalsning(pass) + '</div>'
      + '<div class="rep-banner-sub">' + sub + '</div>'
    + '</div>'
    + '<button class="rep-banner-btn" onclick="repStartaPass()">Börja repetera</button>'
    + '<button class="rep-banner-skip" onclick="repSkippaPanel()">Inte just nu</button>'
  + '</div>';
}

// Tillfällig stub: visar info tills steg 4 är byggt.
// Steg 4 byter ut denna mot själva repetitions-passet.
function repStartaPass(){
  var pass = state._aktuelltRepPass || repValjPass();
  if(!pass){ alert('Inget att repetera just nu.'); return; }
  var lista = pass.items.map(function(it){ return '• ' + it.ko + ' / ' + it.f; }).join('\n');
  alert('Repetitionspasset är på väg!\n\nGrupp: ' + pass.gruppTitel
    + '\nUppgifter:\n' + lista
    + '\n\n(Själva pass-vyn byggs i nästa steg.)');
}

function repSkippaPanel(){
  repMarkeraSkippad();
  // Rendera om startsidan så bannern försvinner
  if(state.currentView === 'kapitel' || !state.currentView){ renderKapitel(); }
}

// INIT
// ============================================================
// Deeplink: ?del=xxx / #del=xxx hoppar in i en del; view=test-config / view=skattning öppnar de vyerna.
(function(){
  repLoad();
  var hs = location.hash + ' ' + location.search;
  var mv = hs.match(/view=([a-z-]+)/i);
  if(mv && (mv[1] === 'test-config' || mv[1] === 'skattning')){
    renderKapitel();
    navTo(mv[1]);
    return;
  }
  // Deeplink till en KO-förmåga (från arbetssidornas Färdighetsträning): ?ko=xxx&formaga=yyy
  var mk = hs.match(/[?&]ko=([a-z0-9-]+)/i), mf = hs.match(/[?&]formaga=([a-z0-9-]+)/i);
  if(mk && mf && OVNING_RENDERS[mk[1]] && OVNING_RENDERS[mk[1]][mf[1]]){
    renderKapitel();
    navTo('ovning', {koId: mk[1], formaga: mf[1]});
    return;
  }
  var m = hs.match(/del=([a-z0-9-]+)/i);
  if(m){
    var delId = m[1];
    var finns = DELAR.some(function(d){ return d.id === delId; });
    if(finns){
      renderKapitel();
      navTo('del', {delId: delId});
      return;
    }
  }
  renderKapitel();
})();
