// --- METOD: UPPSTÄLLNING (addition) ---
function renderUppstallningAdd(body, metod, backFn){
  let step = 'explain'; // 'explain' | 'practice'
  let omgangResults = [];
  let currentTask = null;

  function renderExplain(){
    const a = 374, b = 286; // fast exempeltal
    body.innerHTML = `
      <div class="exercise-card">
        ${exerciseHeader('Metod · uppställning', metod.beskrivning)}
        <div class="metod-explain-card">
          <h3 class="metod-step-title">Så här fungerar det</h3>
          <p class="metod-step-desc">Vi beräknar <strong>${a} + ${b}</strong> med uppställning.</p>
          <div class="uppstallning-demo" id="demo-container">
            ${renderUppstallningSteg(a, b, -1)}
          </div>
          <div class="metod-demo-nav">
            <button class="btn" id="prev-steg" disabled><- Föregående</button>
            <span id="steg-info" style="font-size:13px;color:var(--ink-soft)">Steg 1 av 4</span>
            <button class="btn primary" id="next-steg">Nästa steg -></button>
          </div>
        </div>
        <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
          <button class="btn primary" id="start-practice">Öva nu -></button>
          <button class="btn subtle" id="back-to-metoder">Tillbaka</button>
        </div>
      </div>
    `;
    document.getElementById('back-to-metoder').onclick = backFn;

    let currentSteg = 0;
    const maxSteg = 4;
    const updateSteg = ()=>{
      document.getElementById('demo-container').innerHTML = renderUppstallningSteg(a, b, currentSteg);
      document.getElementById('steg-info').textContent = `Steg ${currentSteg+1} av ${maxSteg}`;
      document.getElementById('prev-steg').disabled = currentSteg === 0;
      const nextBtn = document.getElementById('next-steg');
      nextBtn.textContent = currentSteg === maxSteg-1 ? 'Klar ✓' : 'Nästa steg ->';
      if(currentSteg === maxSteg-1){ nextBtn.onclick = ()=>renderPractice(); }
      else { nextBtn.onclick = ()=>{ currentSteg++; updateSteg(); }; }
    };
    document.getElementById('prev-steg').onclick = ()=>{ if(currentSteg>0){currentSteg--;updateSteg();} };
    document.getElementById('next-steg').onclick = ()=>{ currentSteg++; updateSteg(); };
    document.getElementById('start-practice').onclick = renderPractice;
  }

  function renderUppstallningSteg(a, b, steg){
    // steg: -1=bara talen, 0=ental, 1=tiotal, 2=hundratal, 3=summa
    const aStr = String(a).padStart(4,' ');
    const bStr = String(b).padStart(4,' ');
    const sum = a + b;

    const entalsCarry = (a%10 + b%10) >= 10 ? 1 : 0;
    const tioCarry = (Math.floor(a/10)%10 + Math.floor(b/10)%10 + entalsCarry) >= 10 ? 1 : 0;

    const stegTexts = [
      `Ental: ${a%10} + ${b%10} = ${a%10+b%10}. ${entalsCarry?'Skriv '+(a%10+b%10-10)+' och för över 1 till tiotalet.':'Skriv '+((a+b)%10)+'.'}`,
      `Tiotal: ${Math.floor(a/10)%10} + ${Math.floor(b/10)%10}${entalsCarry?' + 1 (förd)':', '} = ${Math.floor(a/10)%10+Math.floor(b/10)%10+entalsCarry}. ${tioCarry?'Skriv '+(Math.floor(a/10)%10+Math.floor(b/10)%10+entalsCarry-10)+' och för över 1.':'Skriv '+(Math.floor(a/10)%10+Math.floor(b/10)%10+entalsCarry)+'.'}`,
      `Hundratal: ${Math.floor(a/100)} + ${Math.floor(b/100)}${tioCarry?' + 1 (förd)':', '} = ${Math.floor(a/100)+Math.floor(b/100)+tioCarry}. Skriv ${Math.floor(sum/100)}.`,
      `Svaret är ${sum}.`
    ];

    const highEntals = steg >= 0;
    const highTio = steg >= 1;
    const highHundra = steg >= 2;

    return `
      <div class="uppstallning-box">
        ${entalsCarry && steg >= 1 ? '<div class="upp-carry-row"><span></span><span></span><span></span><span class="carry">¹</span></div>' : '<div class="upp-carry-row"></div>'}
        <div class="upp-row a">${digitSpans(a, 4)}</div>
        <div class="upp-row op"><span>+</span><span></span><span></span></div>
        <div class="upp-row b">${digitSpans(b, 4)}</div>
        <div class="upp-line"></div>
        ${steg >= 3 ? `<div class="upp-row result">${digitSpans(sum, 4, true)}</div>` : '<div class="upp-row result"><span>?</span></div>'}
      </div>
      ${steg >= 0 ? `<div class="metod-steg-note">${stegTexts[steg]}</div>` : ''}
    `;
  }

  function digitSpans(n, width, highlight=false){
    const s = String(n).padStart(width, ' ');
    return s.split('').map((c,i)=>
      c === ' ' ? '<span> </span>' :
      `<span class="${highlight?'result-digit':''}">${c}</span>`
    ).join('');
  }

  function renderPractice(){
    currentTask = genAddTask(1);
    const {a, b, answer} = currentTask;

    // Bestäm antal positioner (kolumner) baserat på svaret
    const cols = String(answer).length; // t.ex. 374+286=660 -> 3, men ev. 4 om tusenöverföring
    const width = Math.max(String(a).length, String(b).length, cols);

    // Hjälp: siffra på given position (0=ental, 1=tiotal, ...)
    const digit = (n, pos) => Math.floor(n / Math.pow(10, pos)) % 10;
    const hasDigit = (n, pos) => Math.floor(n / Math.pow(10, pos)) > 0 || pos === 0;

    // Bygg kolumner höger->vänster
    const positions = Array.from({length: width}, (_, i) => i).reverse(); // [width-1, ..., 1, 0]

    body.innerHTML = `
      <div class="exercise-card">
        ${exerciseHeader('Metod · uppställning', 'Fyll i minnessiffror och svar. Börja från entalskolumnen (längst till höger).')}
        <div class="metod-explain-card">
          <p style="font-size:15px;margin:0 0 6px;color:var(--ink-soft);">Beräkna:</p>

          <div class="uppstallning-practice">
            <div class="uppstallning-interaktiv">

              <!-- Minnessiffre-rad -->
              <div class="upp-i-row carry-row">
                <div class="upp-i-op-cell"></div>
                ${positions.map(pos => `
                  <div class="upp-i-cell">
                    <input type="text" class="carr-input" data-pos="${pos}"
                      inputmode="numeric" maxlength="1"
                      tabindex="${positions.indexOf(pos) + 1}"
                      placeholder="">
                  </div>
                `).join('')}
              </div>

              <!-- Rad A -->
              <div class="upp-i-row">
                <div class="upp-i-op-cell"></div>
                ${positions.map(pos => `
                  <div class="upp-i-cell">
                    <span class="upp-i-digit ${!hasDigit(a,pos) && pos > 0 ? 'faint' : ''}">
                      ${hasDigit(a, pos) ? digit(a, pos) : ''}
                    </span>
                  </div>
                `).join('')}
              </div>

              <!-- Rad B -->
              <div class="upp-i-row">
                <div class="upp-i-op-cell opp-sign">+</div>
                ${positions.map(pos => `
                  <div class="upp-i-cell">
                    <span class="upp-i-digit ${!hasDigit(b,pos) && pos > 0 ? 'faint' : ''}">
                      ${hasDigit(b, pos) ? digit(b, pos) : ''}
                    </span>
                  </div>
                `).join('')}
              </div>

              <!-- Linje -->
              <div class="upp-i-line"></div>

              <!-- Svarsrad -->
              <div class="upp-i-row answer-row">
                <div class="upp-i-op-cell"></div>
                ${positions.map((pos, i) => `
                  <div class="upp-i-cell">
                    <input type="text" class="ans-input" data-pos="${pos}"
                      inputmode="numeric" maxlength="1"
                      tabindex="${width + positions.indexOf(pos) + 1}"
                      placeholder="">
                  </div>
                `).join('')}
              </div>

            </div>
          </div>

          <div class="rakna-uppdela-feedback" id="fb"></div>
          <div style="margin-top:16px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
            <button class="btn primary" id="check-btn">Kontrollera</button>
            <button class="btn subtle" id="back-btn">Tillbaka till metoder</button>
          </div>
        </div>
      </div>
    `;

    // Sätt taborder: ental-input för minnessiffra först, sedan ental-svar, sen nästa kolumn
    // Istället: bygg tab-ordning höger->vänster per rad
    // Minnessiffror: pos 0 -> pos 1 -> ... (höger till vänster)
    // Svar: pos 0 -> pos 1 -> ...
    const carrInputs = Array.from(document.querySelectorAll('.carr-input'))
      .sort((a,b) => parseInt(a.dataset.pos) - parseInt(b.dataset.pos)); // ental först
    const ansInputs = Array.from(document.querySelectorAll('.ans-input'))
      .sort((a,b) => parseInt(a.dataset.pos) - parseInt(b.dataset.pos));

    // Fokusordning: ental-ans -> tiotal-ans -> ... (eleven börjar med svaret ental)
    const allInputsOrdered = [...ansInputs, ...carrInputs];

    ansInputs.forEach((inp, i) => {
      inp.addEventListener('keydown', e => {
        if(e.key === 'Enter' || e.key === 'Tab' && !e.shiftKey) {
          e.preventDefault();
          // Nästa: nästa svar-kolumn, eller om sista -> första minneskolumnen
          if(i < ansInputs.length - 1) ansInputs[i+1].focus();
          else carrInputs[0].focus();
        }
      });
    });

    carrInputs.forEach((inp, i) => {
      inp.addEventListener('keydown', e => {
        if(e.key === 'Enter') {
          e.preventDefault();
          if(i < carrInputs.length - 1) carrInputs[i+1].focus();
          else check();
        }
      });
    });

    // Fokusera ental-svaret direkt
    setTimeout(() => ansInputs[0] && ansInputs[0].focus(), 50);

    const check = () => {
      // Läs in svaret siffra för siffra
      let correct = true;
      ansInputs.forEach(inp => {
        const pos = parseInt(inp.dataset.pos);
        const expected = digit(answer, pos);
        // Tillåt tomt (0) om positionen inte finns i svaret
        const val = inp.value === '' ? 0 : parseInt(inp.value);
        const posExists = Math.floor(answer / Math.pow(10, pos)) > 0 || pos === 0;
        inp.disabled = true;
        if(posExists && val === expected){
          inp.classList.add('correct');
        } else if(!posExists && (inp.value === '' || val === 0)){
          // OK att lämna tom om positionen inte finns
        } else {
          inp.classList.add('wrong');
          correct = false;
        }
      });
      carrInputs.forEach(inp => inp.disabled = true);

      const fb = document.getElementById('fb'); fb.classList.add('show');
      document.getElementById('check-btn').disabled = true;
      const ts = getTutorScore('add','metod'); ts.total++;
      omgangResults.push(correct);

      if(correct){
        fb.classList.add('correct');
        fb.textContent = `Rätt! ${a} + ${b} = ${answer} ✓`;
        ts.correct++;
        setTimeout(() => { currentTask = genAddTask(1); renderPractice(); }, 1800);
      } else {
        fb.classList.add('wrong');
        fb.textContent = `Inte rätt – ${a} + ${b} = ${answer}. Kontrollera position för position.`;
        setTimeout(() => { currentTask = genAddTask(1); renderPractice(); }, 2500);
      }
    };

    document.getElementById('check-btn').onclick = check;
    document.getElementById('back-btn').onclick = backFn;
  }

  renderExplain();
}

// --- METOD: TALSORTERNA VAR FÖR SIG (addition) ---
function renderTalsorternaAdd(body, metod, backFn){
  let task = genAddTask(2);
  let terms = [''];  // state lever utanför render()

  function refreshInputs(){
    const row = document.getElementById('ts-inputs-row');
    if(!row) return;
    row.innerHTML = terms.map((val, i) =>
      (i > 0 ? '<span class="ts-op ts-plus-sep">+</span>' : '') +
      '<input type="text" class="ts-term-input" data-idx="' + i + '" inputmode="numeric" maxlength="5" value="' + val + '" placeholder="___">'
    ).join('');

    row.querySelectorAll('.ts-term-input').forEach((inp, i) => {
      inp.addEventListener('input', () => { terms[i] = inp.value; });
      inp.addEventListener('keydown', e => {
        if(e.key === '+') { e.preventDefault(); addTerm(); }
        else if(e.key === '=' || e.key === 'Enter') {
          e.preventDefault();
          const all = row.querySelectorAll('.ts-term-input');
          if(i === all.length - 1) jumpToFinal();
          else all[i+1].focus();
        }
      });
    });
    const last = row.querySelector('.ts-term-input:last-of-type');
    const finalEl = document.getElementById('ts-final-ans');
    if(last && finalEl && document.activeElement !== finalEl) last.focus();
  }

  function addTerm(){
    terms.push('');
    refreshInputs();
  }
  function removeTerm(){
    if(terms.length > 1){ terms.pop(); refreshInputs(); }
  }
  function jumpToFinal(){
    const el = document.getElementById('ts-final-ans');
    if(el) el.focus();
  }

  function render(){
    const {a, b, answer} = task;
    const divisorer = [1000, 100, 10, 1];
    const delar = divisorer.map(d => {
      const s = (Math.floor(a/d)%10 + Math.floor(b/d)%10) * d;
      return s > 0 ? s : null;
    }).filter(Boolean);
    const rattMellanled = delar.join(' + ');

    body.innerHTML = '<div class="exercise-card">' +
      exerciseHeader('Metod · talsorterna var för sig', metod.beskrivning) +
      '<div class="metod-explain-card">' +
      '<div style="background:var(--bg-warm);padding:12px 14px;border-radius:var(--radius);margin-bottom:18px;font-size:13px;line-height:1.6;">' +
        '<strong>Idén:</strong> Dela upp talen i talsorter, addera varje talsort för sig och summera ihop.<br>' +
        '<span style="color:var(--ink-soft);">Exempel: ' + a + ' + ' + b + ' = ' + rattMellanled + ' = ' + answer + '</span>' +
      '</div>' +
      '<div class="ts-rad-container">' +
        '<div class="ts-rad-fast">' +
          '<span class="ts-num">' + a + '</span>' +
          '<span class="ts-op">+</span>' +
          '<span class="ts-num">' + b + '</span>' +
          '<span class="ts-op">=</span>' +
        '</div>' +
        '<div class="ts-rad-inputs" id="ts-inputs-row"></div>' +
        '<span class="ts-op ts-eq-final">=</span>' +
        '<input type="text" class="ts-ans-input" id="ts-final-ans" inputmode="numeric" maxlength="6" placeholder="?">' +
      '</div>' +
      '<div class="ts-snabbknappar">' +
        '<button class="ts-snabb-btn" id="ts-plus-btn">+ <span style="font-size:11px;opacity:.7">lägg till term</span></button>' +
        '<button class="ts-snabb-btn ts-snabb-eq" id="ts-eq-btn">= <span style="font-size:11px;opacity:.7">hoppa till svar</span></button>' +
        '<button class="ts-snabb-btn ts-snabb-del" id="ts-del-btn">✕ <span style="font-size:11px;opacity:.7">ta bort</span></button>' +
      '</div>' +
      '<div class="rakna-uppdela-feedback" id="fb-ts"></div>' +
      '<div style="margin-top:14px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">' +
        '<button class="btn primary" id="ts-check">Kontrollera</button>' +
        '<button class="btn subtle" id="ts-ny">Ny uppgift</button>' +
        '<button class="btn subtle" id="ts-back">Tillbaka</button>' +
      '</div></div></div>';

    document.getElementById('ts-plus-btn').onclick = addTerm;
    document.getElementById('ts-eq-btn').onclick = jumpToFinal;
    document.getElementById('ts-del-btn').onclick = removeTerm;
    document.getElementById('ts-back').onclick = backFn;
    document.getElementById('ts-ny').onclick = () => { task = genAddTask(2); terms = ['']; render(); };

    document.getElementById('ts-final-ans').addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); check(); }
    });
    document.getElementById('ts-check').onclick = check;

    refreshInputs();

    function check(){
      const termInputs = document.querySelectorAll('.ts-term-input');
      const termVals = Array.from(termInputs).map(i => parseInt(i.value)).filter(v => !isNaN(v));
      const finalVal = parseInt(document.getElementById('ts-final-ans').value);
      const fb = document.getElementById('fb-ts');
      fb.classList.remove('correct','wrong'); fb.classList.add('show');
      document.getElementById('ts-check').disabled = true;
      termInputs.forEach(inp => inp.disabled = true);
      document.getElementById('ts-final-ans').disabled = true;
      const ts = getTutorScore('add','metod'); ts.total++;
      const termSum = termVals.reduce((x,y) => x+y, 0);
      const termsOK = termSum === answer;
      const finalOK = finalVal === answer;
      if(termsOK && finalOK){
        termInputs.forEach(i => i.classList.add('correct'));
        document.getElementById('ts-final-ans').classList.add('correct');
        fb.classList.add('correct');
        fb.textContent = 'Rätt! ' + a + ' + ' + b + ' = ' + termVals.join(' + ') + ' = ' + answer + ' ✓';
        ts.correct++;
        setTimeout(() => { task = genAddTask(2); terms = ['']; render(); }, 2000);
      } else if(termsOK){
        termInputs.forEach(i => i.classList.add('correct'));
        document.getElementById('ts-final-ans').classList.add('wrong');
        fb.classList.add('wrong');
        fb.textContent = 'Termerna stämmer! Men slutsvaret är fel. Summan är ' + answer + '.';
        setTimeout(() => { task = genAddTask(2); terms = ['']; render(); }, 2500);
      } else {
        termInputs.forEach(i => i.classList.add('wrong'));
        fb.classList.add('wrong');
        fb.textContent = 'Termerna summeras till ' + termSum + ', men rätt svar är ' + answer + '. Rätt mellanled: ' + rattMellanled + '.';
        setTimeout(() => { task = genAddTask(2); terms = ['']; render(); }, 2800);
      }
    }
  }

  render();
}


// --- METOD: ÖKA OCH MINSKA LIKA (addition) ---
function renderFlyttaOver(body, metod, backFn){
  function newTask(){
    for(let i=0; i<200; i++){
      const a = 20 + Math.floor(Math.random()*80);
      const b = 20 + Math.floor(Math.random()*80);
      const bMod = b % 10;
      if(bMod >= 7 || (bMod >= 1 && bMod <= 3)) return {a, b, answer: a+b};
    }
    return {a:47, b:35, answer:82};
  }

  let task = newTask();
  let riktning = 'vanster';

  function drawArrow(a, b){
    const rad   = document.getElementById('om-lika-rad');
    const svg   = document.getElementById('om-pil-svg');
    const numA  = document.getElementById('om-num-a');
    const numB  = document.getElementById('om-num-b');
    const bWrap = document.getElementById('om-belopp-wrap');
    if(!rad||!svg||!numA||!numB||!bWrap) return;

    const radRect = rad.getBoundingClientRect();
    const aRect   = numA.getBoundingClientRect();
    const bRect   = numB.getBoundingClientRect();
    const ax = aRect.left + aRect.width/2 - radRect.left;
    const bx = bRect.left + bRect.width/2 - radRect.left;
    const baseY = 52, topY = 8;
    const fromX = riktning === 'vanster' ? bx : ax;
    const toX   = riktning === 'vanster' ? ax : bx;
    const midX  = (fromX + toX) / 2;

    svg.setAttribute('viewBox', '0 0 ' + radRect.width + ' 60');
    svg.style.width = radRect.width + 'px';

    // Bygg SVG med string concat
    const marker = '<defs><marker id="om-arr" markerWidth="9" markerHeight="9" refX="4.5" refY="9" orient="auto">'
      + '<path d="M0,0 L4.5,9 L9,0" fill="none" stroke="var(--c-metod)" stroke-width="2" stroke-linejoin="round"/>'
      + '</marker></defs>';
    const lineUp   = '<line x1="' + fromX + '" y1="' + baseY + '" x2="' + fromX + '" y2="' + (topY+4) + '" stroke="var(--c-metod)" stroke-width="2.5" stroke-linecap="round"/>';
    const lineHorz = '<line x1="' + fromX + '" y1="' + (topY+4) + '" x2="' + toX + '" y2="' + (topY+4) + '" stroke="var(--c-metod)" stroke-width="2.5" stroke-linecap="round"/>';
    const lineDown = '<line x1="' + toX + '" y1="' + (topY+4) + '" x2="' + toX + '" y2="' + (baseY-6) + '" stroke="var(--c-metod)" stroke-width="2.5" stroke-linecap="round" marker-end="url(#om-arr)"/>';
    svg.innerHTML = marker + lineUp + lineHorz + lineDown;

    bWrap.style.left = (midX - 26) + 'px';
    bWrap.style.top  = '0px';
  }

  function render(){
    const {a, b, answer} = task;
    const bMod = b % 10;
    const hintFlytt = bMod >= 7 ? 10-bMod : (bMod >= 1 && bMod <= 3 ? bMod : 5);

    // Bygg HTML med string concat – inga nästlade template literals
    const aktiveVanster = riktning === 'vanster' ? ' is-active' : '';
    const aktiveHoger   = riktning === 'hoger'   ? ' is-active' : '';

    body.innerHTML =
      '<div class="exercise-card">'
      + exerciseHeader('Metod · öka och minska lika', 'Rita en pil som visar hur du flyttar. Skriv sedan mellanledet och svaret.')
      + '<div class="metod-explain-card">'
        + '<div style="background:var(--bg-warm);padding:12px 14px;border-radius:var(--radius);margin-bottom:18px;font-size:13px;line-height:1.6;">'
          + '<strong>Idén:</strong> Flytta ett värde från ett tal till det andra – summan ändras inte.<br>'
          + '<span style="color:var(--ink-soft);">Exempel: 47 + 35 &rarr; flytta 3 &rarr; 50 + 32 = 82</span>'
        + '</div>'
        + '<div class="om-rikt-row">'
          + '<span style="font-size:13px;color:var(--ink-soft);">Pilens riktning:</span>'
          + '<button class="om-rikt-btn' + aktiveVanster + '" id="rikt-vanster">&larr; höger till vänster</button>'
          + '<button class="om-rikt-btn' + aktiveHoger   + '" id="rikt-hoger">&rarr; vänster till höger</button>'
        + '</div>'
        + '<div class="om-lika-rad" id="om-lika-rad">'
          + '<svg class="om-pil-svg" id="om-pil-svg" aria-hidden="true"></svg>'
          + '<div class="om-belopp-wrap" id="om-belopp-wrap">'
            + '<input type="text" class="om-belopp-input" id="om-flytt" inputmode="numeric" maxlength="3" placeholder="">'
          + '</div>'
          + '<div class="om-uttryck-rad">'
            + '<span class="om-u-num" id="om-num-a">' + a + '</span>'
            + '<span class="om-u-op">+</span>'
            + '<span class="om-u-num" id="om-num-b">' + b + '</span>'
            + '<span class="om-u-op">=</span>'
            + '<input type="text" class="om-u-input" id="ml-a" inputmode="numeric" maxlength="5" placeholder="___">'
            + '<span class="om-u-op">+</span>'
            + '<input type="text" class="om-u-input" id="ml-b" inputmode="numeric" maxlength="5" placeholder="___">'
            + '<span class="om-u-op">=</span>'
            + '<input type="text" class="om-u-input om-u-input-sum" id="ml-sum" inputmode="numeric" maxlength="6" placeholder="?">'
          + '</div>'
        + '</div>'
        + '<div class="rakna-uppdela-feedback" id="fb-fo"></div>'
        + '<div style="margin-top:16px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'
          + '<button class="btn primary" id="fo-check">Kontrollera</button>'
          + '<button class="btn subtle" id="fo-ny">Ny uppgift</button>'
          + '<button class="btn subtle" id="fo-back">Tillbaka</button>'
        + '</div>'
      + '</div></div>';

    // Rita pil efter DOM är klar
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      drawArrow(a, b);
      var flytt = document.getElementById('om-flytt');
      if(flytt) flytt.focus();
    }); });

    document.getElementById('rikt-vanster').onclick = function(){ riktning='vanster'; render(); };
    document.getElementById('rikt-hoger').onclick   = function(){ riktning='hoger';  render(); };
    document.getElementById('fo-back').onclick = backFn;
    document.getElementById('fo-ny').onclick   = function(){ task=newTask(); render(); };

    var mlA   = document.getElementById('ml-a');
    var mlB   = document.getElementById('ml-b');
    var mlSum = document.getElementById('ml-sum');
    var flEl  = document.getElementById('om-flytt');

    flEl.addEventListener('keydown', function(e){ if(e.key==='Enter'){e.preventDefault(); mlA.focus();} });
    mlA.addEventListener('keydown',  function(e){ if(e.key==='Enter'){e.preventDefault(); mlB.focus();} });
    mlB.addEventListener('keydown',  function(e){ if(e.key==='Enter'){e.preventDefault(); mlSum.focus();} });
    mlSum.addEventListener('keydown',function(e){ if(e.key==='Enter'){e.preventDefault(); check();} });
    document.getElementById('fo-check').onclick = check;

    function check(){
      var flytt  = parseInt(flEl.value) || 0;
      var aVal   = parseInt(mlA.value);
      var bVal   = parseInt(mlB.value);
      var sumVal = parseInt(mlSum.value);
      var fb = document.getElementById('fb-fo');
      fb.classList.remove('correct','wrong'); fb.classList.add('show');
      [mlA,mlB,mlSum].forEach(function(i){ i.classList.remove('correct','wrong'); i.disabled=true; });
      flEl.disabled=true;
      document.getElementById('fo-check').disabled=true;

      var ts = getTutorScore('add','metod'); ts.total++;
      var fromRight  = riktning === 'vanster';
      var expA = fromRight ? a+flytt : a-flytt;
      var expB = fromRight ? b-flytt : b+flytt;
      var mellanledOK = !isNaN(aVal) && !isNaN(bVal) && (aVal+bVal===answer);
      var pilStammer  = flytt>0 && aVal===expA && bVal===expB;
      var sumOK       = !isNaN(sumVal) && sumVal===answer;

      if(mellanledOK && sumOK){
        [mlA,mlB,mlSum].forEach(function(i){ i.classList.add('correct'); });
        fb.classList.add('correct');
        fb.textContent = pilStammer
          ? 'Rätt! Pilen och mellanledet stämmer. ' + a + ' + ' + b + ' = ' + aVal + ' + ' + bVal + ' = ' + answer + ' ✓'
          : 'Rätt! ' + a + ' + ' + b + ' = ' + aVal + ' + ' + bVal + ' = ' + answer + ' ✓';
        ts.correct++;
        setTimeout(function(){ task=newTask(); render(); }, 2200);
      } else if(mellanledOK && !sumOK){
        mlA.classList.add('correct'); mlB.classList.add('correct'); mlSum.classList.add('wrong');
        fb.classList.add('wrong');
        fb.textContent = 'Mellanledet stämmer (' + aVal + ' + ' + bVal + ' = ' + answer + '), men slutsvaret är fel.';
        setTimeout(function(){ task=newTask(); render(); }, 2500);
      } else {
        [mlA,mlB,mlSum].forEach(function(i){ i.classList.add('wrong'); });
        fb.classList.add('wrong');
        var bMod3 = b%10;
        var tips = bMod3>=7
          ? 'flytta ' + (10-bMod3) + ' från ' + b + ' till ' + a + ': ' + (a+(10-bMod3)) + ' + ' + (b-(10-bMod3))
          : 'flytta ' + (bMod3||5) + ' från ' + a + ' till ' + b + ': ' + (a-(bMod3||5)) + ' + ' + (b+(bMod3||5));
        fb.textContent = 'Mellanledet stämmer inte. Tips: ' + tips + ' = ' + answer + '.';
        [mlA,mlB,mlSum,flEl].forEach(function(i){ i.disabled=false; });
        document.getElementById('fo-check').disabled=false;
      }
    }
  }

  render();
}

function renderSubRakna(body){
  let level = 1;
  let omgang = [];
  let idx = 0;
  let omgangResults = [];

  function genOmgang(){
    const seen = new Set();
    const items = [];
    let attempts = 0;
    while(items.length < 8 && attempts < 200){
      attempts++;
      const task = genSubTask(level);
      const key = `${task.a}-${task.b}`;
      if(!seen.has(key)){ seen.add(key); items.push(task); }
    }
    return items;
  }

  function render(){
    if(idx >= omgang.length){
      const right = omgangResults.filter(x=>x).length;
      const total = omgangResults.length;
      const adj = adjustLevel(level, right, total);
      level = adj.level;
      body.innerHTML = `<div class="exercise-card">${exerciseHeader('Räkna · subtraktion', `Du klarade ${right} av ${total}.`, level)}${renderSummaryCard({right, total, level, levelChange: adj.change})}</div>`;
      document.getElementById('summary-next-btn').onclick = ()=>{ omgang=genOmgang(); idx=0; omgangResults=[]; render(); };
      return;
    }
    const task = omgang[idx];
    body.innerHTML = `
      <div class="exercise-card">
        ${exerciseHeader('Räkna · subtraktion', 'Räkna ut differensen.', level)}
        ${renderScoreBarSimple(omgangResults.filter(x=>x).length, omgangResults.filter(x=>!x).length, omgang.length, idx)}
        <div class="rakna-uppdela-task">
          <div class="rakna-uppdela-line" style="font-size:28px;gap:14px;padding:24px;">
            <span class="rakna-uppdela-target">${task.a}</span>
            <span style="color:var(--ink-soft);font-weight:600;">−</span>
            <span class="rakna-uppdela-target">${task.b}</span>
            <span style="color:var(--ink-soft);">=</span>
            <input type="text" class="rakna-factor-input" id="main-input" inputmode="numeric" maxlength="6" style="width:90px;">
          </div>
          <div class="rakna-uppdela-feedback" id="fb"></div>
          <div style="margin-top:14px;text-align:center;"><button class="btn primary" id="check-btn">Kontrollera</button></div>
        </div>
      </div>
    `;
    const inp = document.getElementById('main-input');
    const check = ()=>{
      const val = parseInt(inp.value.trim());
      const fb = document.getElementById('fb'); fb.classList.add('show');
      inp.disabled = true; document.getElementById('check-btn').disabled = true;
      const ts = getTutorScore('sub-rakna','rakna'); ts.total++;
      const tsGr = getTutorScore('sub-rakna','enkel'); tsGr.total++;
      if(val === task.answer){
        inp.classList.add('correct'); fb.classList.add('correct'); fb.textContent = `Rätt! ${task.a} − ${task.b} = ${task.answer}`;
        ts.correct++; tsGr.correct++; omgangResults.push(true);
      } else {
        inp.classList.add('wrong'); fb.classList.add('wrong'); fb.textContent = `${task.a} − ${task.b} = ${task.answer}`;
        omgangResults.push(false);
      }
      setTimeout(()=>{ idx++; render(); }, 1600);
    };
    document.getElementById('check-btn').onclick = check;
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){e.preventDefault();check();} });
    setTimeout(()=>inp.focus(), 50);
  }
  omgang = genOmgang();
  render();
}

// --- SUB METOD: UPPSTÄLLNING (subtraktion) ---
// 15 nivåer: heltal (1-10) + decimaltal (11-15)
// Blandade tal-storlekar, t.ex. 435 - 63
function renderUppstallningSubEnkel(body, metod, backFn){
  var level   = 1;
  var laan    = false;
  var borrows = new Set();
  var omgangResults = [];
  var currentTask   = null;
  var OMGANG  = 5;
  var MAX_LVL = 6;

  function rnd(lo,hi){ return lo + Math.floor(Math.random()*(hi-lo+1)); }

  function countBorrows(a,b){
    var n=0,carry=0,ta=a,tb=b;
    while(tb>0||carry>0){
      var ad=ta%10, bd=(tb%10)+carry;
      carry = (ad<bd) ? 1 : 0;
      if(carry) n++;
      ta=Math.floor(ta/10); tb=Math.floor(tb/10);
    }
    return n;
  }

  function hasZeroMiddle(n){
    var s=String(n);
    return s.length>=3 && s.slice(1,-1).indexOf('0')>=0;
  }

  function genTask(lvl){
    for(var i=0;i<600;i++){
      var aInt,bInt,dec=0;
      switch(lvl){
        case 1: // 2-3 siff, inget lån, blandade storlekar
          aInt=rnd(100,999);
          bInt = Math.random()<0.4 ? rnd(1,9)
               : Math.random()<0.6 ? rnd(10,99)
               : rnd(100,aInt-2);
          break;
        case 2: // 2-3 siff, 1 lån, blandade storlekar
          aInt=rnd(100,999);
          bInt = Math.random()<0.4 ? rnd(10,99) : rnd(100,aInt-2);
          break;
        case 3: // 3-4 siff, 2 lån, blandade storlekar
          aInt = Math.random()<0.5 ? rnd(200,999) : rnd(1000,9999);
          bInt = Math.random()<0.4 ? rnd(10,99)
               : Math.random()<0.5 ? rnd(100,999)
               : rnd(1000,Math.min(aInt-2,9999));
          break;
        case 4: // 4 siff, 2-3 lån, nollor i mitten
          if(Math.random()<0.5){
            // Garanterad nolla i mitten: X00Y eller X0Y0 etc.
            var h=rnd(1,9),t=0,e=rnd(1,9);
            aInt = h*1000 + t*100 + rnd(0,9)*10 + e;
            if(aInt<100) aInt+=1000;
          } else {
            aInt=rnd(1000,9999);
          }
          bInt = Math.random()<0.4 ? rnd(100,999) : rnd(1000,aInt-2);
          break;
        case 5: // 1 decimal, 1-2 lån, blandade storlekar
          dec=1;
          aInt = Math.random()<0.5 ? rnd(11,99) : rnd(101,999);
          bInt = Math.random()<0.4 ? rnd(1,9) : rnd(10,aInt-2);
          break;
        default: // 6: 2 decimaler, 1-2 lån
          dec=2;
          aInt = rnd(101,999);
          bInt = Math.random()<0.4 ? rnd(1,99) : rnd(100,aInt-2);
          break;
      }

      if(aInt<=bInt) continue;
      var nb = countBorrows(aInt,bInt);

      var ok=false;
      switch(lvl){
        case 1: ok=(nb===0); break;
        case 2: ok=(nb===1); break;
        case 3: ok=(nb>=2); break;
        case 4: ok=(nb>=2 && (hasZeroMiddle(aInt)||nb>=3)); break;
        case 5: ok=(nb>=1); break;
        default: ok=(nb>=1); break;
      }
      if(ok) return {aInt:aInt,bInt:bInt,ansInt:aInt-bInt,dec:dec};
    }
    return {aInt:523,bInt:278,ansInt:245,dec:0};
  }

  function displayNum(n,dec){
    if(dec===0) return String(n);
    var s=String(n).padStart(dec+1,'0');
    return s.slice(0,-dec)+'.'+s.slice(-dec);
  }

  // Bygger kolumn-struktur: [{type:'digit',pos:N}|{type:'decimal'}]
  function buildCols(task){
    var a=task.aInt, b=task.bInt, dec=task.dec;
    var maxInt = Math.max(a,b);
    var intPart = dec>0 ? Math.floor(maxInt/Math.pow(10,dec)) : maxInt;
    var intDigits = String(intPart).length;
    var totalDigits = intDigits + dec;
    var cols=[];
    for(var p=totalDigits-1; p>=0; p--){
      cols.push({type:'digit',pos:p});
      if(dec>0 && p===dec) cols.push({type:'decimal'});
    }
    return cols;
  }

  function dgt(n,p){ return Math.floor(n/Math.pow(10,p))%10; }
  function hasP(n,p){ return Math.floor(n/Math.pow(10,p))>0||p===0; }

  function adjustLvl(lvl,right,total){
    if(right>=total-1 && lvl<MAX_LVL) return {level:lvl+1,change:'up'};
    if(right<=Math.floor(total/3) && lvl>1) return {level:lvl-1,change:'down'};
    return {level:lvl,change:null};
  }

  function lvlName(l){
    if(l===1) return 'Inget lån';
    if(l===2) return '1 lån';
    if(l===3) return '2+ lån, blandade tal';
    if(l===4) return '4 siffror, nollor';
    if(l===5) return 'Decimaltal (1 decimal)';
    return 'Decimaltal (2 decimaler)';
  }

  function showSummary(){
    var right=omgangResults.filter(function(x){return x;}).length;
    var total=omgangResults.length;
    var adj=adjustLvl(level,right,total);
    level=adj.level;
    body.innerHTML='<div class="exercise-card">'
      +exerciseHeader('Metod · uppställning (subtraktion)','Du klarade '+right+' av '+total+' uppgifter.',level)
      +renderSummaryCard({right:right,total:total,level:level,levelChange:adj.change})
      +'</div>';
    document.getElementById('summary-next-btn').onclick=function(){
      omgangResults=[];borrows=new Set();laan=false;
      currentTask=genTask(level);render();
    };
  }

  function render(){
    if(!currentTask) currentTask=genTask(level);
    var task=currentTask;
    var cols=buildCols(task);
    var a=task.aInt,b=task.bInt,ans=task.ansInt,dec=task.dec;
    var aDisp=displayNum(a,dec), bDisp=displayNum(b,dec), ansDisp=displayNum(ans,dec);
    var done=omgangResults.length;

    // ── Rad: 10-annoteringar ──
    var tenRow='<div class="upp-i-op-cell"></div>';
    cols.forEach(function(col){
      if(col.type==='decimal'){
        tenRow+='<div class="upp-i-cell upp-dec-cell"></div>';
      } else {
        var hasTen=borrows.has(col.pos+1);
        tenRow+='<div class="upp-i-cell">'
          +(hasTen?'<div class="borrow-ten">10</div>':'')
        +'</div>';
      }
    });

    // ── Rad A ──
    var rowA='<div class="upp-i-op-cell"></div>';
    cols.forEach(function(col){
      if(col.type==='decimal'){
        rowA+='<div class="upp-i-cell upp-dec-cell"><span class="upp-dec-pt">.</span></div>';
      } else {
        var pos=col.pos;
        var d=hasP(a,pos)?dgt(a,pos):null;
        var struck=borrows.has(pos);
        var cc=(laan?' laan-target':'')+(struck?' is-struck':'');
        if(d===null){
          rowA+='<div class="upp-i-cell"><span class="upp-i-digit faint"></span></div>';
        } else {
          rowA+='<div class="upp-i-cell"><span class="upp-i-digit'+cc+'" data-bpos="'+pos+'">'
            +(struck?'<span class="struck-digit">'+d+'</span>':d)
          +'</span></div>';
        }
      }
    });

    // ── Rad B ──
    var rowB='<div class="upp-i-op-cell sub-sign">−</div>';
    cols.forEach(function(col){
      if(col.type==='decimal'){
        rowB+='<div class="upp-i-cell upp-dec-cell"><span class="upp-dec-pt">.</span></div>';
      } else {
        var pos=col.pos;
        var d=hasP(b,pos)?dgt(b,pos):null;
        rowB+='<div class="upp-i-cell"><span class="upp-i-digit'+(d===null?' faint':'')+'">'+
          (d!==null?d:'')+'</span></div>';
      }
    });

    // ── Svarsrad ──
    var rowAns='<div class="upp-i-op-cell"></div>';
    cols.forEach(function(col){
      if(col.type==='decimal'){
        rowAns+='<div class="upp-i-cell upp-dec-cell"><span class="upp-dec-pt ans-dec">.</span></div>';
      } else {
        rowAns+='<div class="upp-i-cell">'
          +'<input type="text" class="ans-input" data-pos="'+col.pos+'" inputmode="numeric" maxlength="1">'
        +'</div>';
      }
    });

    body.innerHTML='<div class="exercise-card">'
      +exerciseHeader('Metod · uppställning (subtraktion)',lvlName(level)+' · Uppgift '+(done+1)+' av '+OMGANG,level)
      +'<div class="metod-explain-card">'

        +'<div class="upp-lan-row">'
          +'<button class="upp-lan-btn'+(laan?' is-active':'')+'" id="lan-btn">'
            +(laan?'✕ Avbryt':'↖ Lån')
          +'</button>'
          +'<span class="upp-lan-hint">'
            +(laan?'Klicka på siffran du lånar av':'Tryck och klicka sedan på siffran du lånar av')
          +'</span>'
          +(borrows.size>0?'<button class="upp-lan-clear" id="clear-borrows">Rensa lån</button>':'')
        +'</div>'

        +'<div class="uppstallning-practice">'
          +'<div class="uppstallning-interaktiv">'
            +'<div class="upp-i-row upp-ten-row">'+tenRow+'</div>'
            +'<div class="upp-i-row">'+rowA+'</div>'
            +'<div class="upp-i-row">'+rowB+'</div>'
            +'<div class="upp-i-line"></div>'
            +'<div class="upp-i-row answer-row">'+rowAns+'</div>'
          +'</div>'
        +'</div>'

      +'<div class="rakna-uppdela-feedback" id="fb"></div>'
      +'<div style="margin-top:16px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'
        +'<button class="btn primary" id="check-btn">Kontrollera</button>'
        +'<button class="btn subtle" id="ny-btn">Ny uppgift</button>'
        +'<button class="btn subtle" id="back-btn">Tillbaka</button>'
      +'</div></div></div>';

    // Koppla knappar
    document.getElementById('lan-btn').onclick=function(){laan=!laan;render();};
    var cb=document.getElementById('clear-borrows');
    if(cb) cb.onclick=function(){borrows=new Set();laan=false;render();};
    document.getElementById('ny-btn').onclick=function(){
      borrows=new Set();laan=false;currentTask=genTask(level);render();
    };
    document.getElementById('back-btn').onclick=backFn;

    // Lån-klick på siffror
    document.querySelectorAll('[data-bpos]').forEach(function(el){
      el.addEventListener('click',function(){
        if(!laan) return;
        var pos=parseInt(el.dataset.bpos);
        if(borrows.has(pos)) borrows.delete(pos); else borrows.add(pos);
        laan=false; render();
      });
    });

    // Svars-inputs: focus höger→vänster (pos 0 = entalet = sist till höger = börja där)
    var ansInputs=Array.from(document.querySelectorAll('.ans-input'))
      .sort(function(x,y){return parseInt(x.dataset.pos)-parseInt(y.dataset.pos);});
    ansInputs.forEach(function(inp,i){
      inp.addEventListener('keydown',function(e){
        if(e.key==='Enter'){e.preventDefault();
          if(i<ansInputs.length-1) ansInputs[i+1].focus(); else check();
        }
      });
    });
    setTimeout(function(){if(ansInputs[0])ansInputs[0].focus();},50);
    document.getElementById('check-btn').onclick=check;

    function check(){
      var allRight=true;
      ansInputs.forEach(function(inp){
        var pos=parseInt(inp.dataset.pos);
        var expected=dgt(ans,pos);
        var val=inp.value===''?-1:parseInt(inp.value);
        var posExists=Math.floor(ans/Math.pow(10,pos))>0||pos===0;
        inp.disabled=true;
        inp.classList.remove('correct','wrong');
        if(!posExists&&(inp.value===''||val===0)){/*ok*/}
        else if(val===expected){inp.classList.add('correct');}
        else{inp.classList.add('wrong');allRight=false;}
      });
      var fb=document.getElementById('fb');
      fb.classList.add('show');
      document.getElementById('check-btn').disabled=true;
      var ts=getTutorScore('sub-metoder','metod');ts.total++;
      var tsGU=getTutorScore('sub-metoder','uppstallning');tsGU.total++;
      omgangResults.push(allRight);
      if(allRight){
        fb.classList.add('correct');
        fb.textContent='Rätt! '+aDisp+' − '+bDisp+' = '+ansDisp+' ✓';
        ts.correct++; tsGU.correct++;
      } else {
        fb.classList.add('wrong');
        fb.textContent='Inte rätt. '+aDisp+' − '+bDisp+' = '+ansDisp+'. Räkna höger till vänster.';
      }
      setTimeout(function(){
        if(omgangResults.length>=OMGANG) showSummary();
        else{borrows=new Set();laan=false;currentTask=genTask(level);render();}
      },1900);
    }
  }

  render();
}


// --- SUB METOD: ÖKA OCH MINSKA LIKA ---
function renderOkaMinska(body, metod, backFn){
  let level = 1;
  let omgangResults = [];
  const OMGANG = 6;

  function newTask(){
    const ranges = [
      { aLo:30, aHi:99,  bLo:9,  bHi:49  },
      { aLo:100,aHi:399, bLo:19, bHi:199 },
      { aLo:200,aHi:999, bLo:49, bHi:499 }
    ];
    const r = ranges[Math.min(level-1, 2)];
    for(let i=0; i<300; i++){
      const a = r.aLo + Math.floor(Math.random()*(r.aHi-r.aLo+1));
      const b = r.bLo + Math.floor(Math.random()*(Math.min(r.bHi,a-5)-r.bLo+1));
      if(b >= a) continue;
      const bMod = b % 10;
      if(a - b < 8) continue;
      if(bMod >= 7 || (bMod >= 1 && bMod <= 3)) return {a, b, answer: a-b};
    }
    return [{a:62,b:29,answer:33},{a:156,b:79,answer:77},{a:534,b:298,answer:236}][Math.min(level-1,2)];
  }

  let task = newTask();

  function render(){
    const {a, b, answer} = task;
    const lvlSub = level===1 ? 'Tvåsiffriga tal' : level===2 ? 'Tresiffriga tal' : 'Blandade tal';

    body.innerHTML =
      '<div class="exercise-card">'
      + exerciseHeader('Metod · öka och minska lika', lvlSub + ' · Uppgift '+(omgangResults.length+1)+' av '+OMGANG, level)
      + '<div class="metod-explain-card">'
        + '<div style="background:var(--bg-warm);padding:12px 14px;border-radius:var(--radius);margin-bottom:20px;font-size:13px;line-height:1.6;">'
          + 'Skriv ett mellanled på raden. Visa <strong>vad du gör</strong> genom att skriva t.ex. <strong>+1</strong> eller <strong>−2</strong> i rutan ovanför det första uttrycket.'
        + '</div>'

        + '<div class="om-sub-card">'
          // CSS grid: 9 kolumner – annot spänner kol 1-3 (a, −, b)
          + '<div class="om-sub-grid" id="om-sub-grid">'

            // Rad 1: annot ovanför a−b, sedan tomt
            + '<div class="om-sub-annot-cell">'
              + '<input type="text" class="om-annot-input" id="om-annot" placeholder="+?" maxlength="4" autocomplete="off">'
            + '</div>'
            + '<div style="grid-column:4/10"></div>'

            // Rad 2: hela uttrycket
            + '<span class="om-sub-num">' + a + '</span>'
            + '<span class="om-sub-op">−</span>'
            + '<span class="om-sub-num">' + b + '</span>'
            + '<span class="om-sub-op om-sub-eq">=</span>'
            + '<input type="text" class="om-sub-input" id="om-new-a" inputmode="numeric" maxlength="6" placeholder="___">'
            + '<span class="om-sub-op">−</span>'
            + '<input type="text" class="om-sub-input" id="om-new-b" inputmode="numeric" maxlength="6" placeholder="___">'
            + '<span class="om-sub-op om-sub-eq">=</span>'
            + '<input type="text" class="om-sub-input om-sub-ans" id="om-final" inputmode="numeric" maxlength="6" placeholder="?">'

          + '</div>'
        + '</div>'

        + '<div class="rakna-uppdela-feedback" id="fb-om"></div>'
        + '<div style="margin-top:16px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'
          + '<button class="btn primary" id="om-check">Kontrollera</button>'
          + '<button class="btn subtle" id="om-ny">Ny uppgift</button>'
          + '<button class="btn subtle" id="om-back">Tillbaka</button>'
        + '</div>'
      + '</div></div>';

    const annotInp = document.getElementById('om-annot');
    const newAInp  = document.getElementById('om-new-a');
    const newBInp  = document.getElementById('om-new-b');
    const finalInp = document.getElementById('om-final');
    const allInps  = [annotInp, newAInp, newBInp, finalInp];

    allInps.forEach((inp, i) => {
      inp.addEventListener('keydown', e => {
        if(e.key === 'Enter') { e.preventDefault();
          if(i < allInps.length-1) allInps[i+1].focus(); else check();
        }
      });
    });
    setTimeout(() => annotInp.focus(), 50);

    document.getElementById('om-check').onclick = check;
    document.getElementById('om-ny').onclick    = () => { task=newTask(); render(); };
    document.getElementById('om-back').onclick  = backFn;

    function check(){
      const raw    = annotInp.value.trim();
      const aVal   = parseInt(newAInp.value);
      const bVal   = parseInt(newBInp.value);
      const finVal = parseInt(finalInp.value);

      const fb = document.getElementById('fb-om');
      fb.classList.remove('correct','wrong'); fb.classList.add('show');
      allInps.forEach(i => { i.classList.remove('correct','wrong'); i.disabled=true; });
      document.getElementById('om-check').disabled = true;

      const ts = getTutorScore('sub-metoder','metod'); ts.total++;
      const tsGOM = getTutorScore('sub-metoder','okaminska'); tsGOM.total++;

      // Parsa annotering: "+1", "-2", "1" etc.
      const delta    = parseInt(raw.replace('+',''));
      const deltaOK  = !isNaN(delta) && delta !== 0 && aVal===a+delta && bVal===b+delta;
      const midledOK = !isNaN(aVal) && !isNaN(bVal) && (aVal - bVal === answer);
      const finalOK  = !isNaN(finVal) && finVal === answer;

      if(midledOK && finalOK){
        allInps.forEach(i => i.classList.add('correct'));
        fb.classList.add('correct');
        fb.textContent = (deltaOK?'Rätt! ':'Rätt svar! ')
          + a + ' − ' + b + ' = ' + aVal + ' − ' + bVal + ' = ' + answer + ' ✓';
        ts.correct++; tsGOM.correct++;
        omgangResults.push(true);
      } else if(midledOK && !finalOK){
        newAInp.classList.add('correct'); newBInp.classList.add('correct');
        finalInp.classList.add('wrong');
        fb.classList.add('wrong');
        fb.textContent = 'Mellanledet stämmer! Men ' + aVal + ' − ' + bVal + ' = ' + answer + ', inte ' + finVal + '.';
        omgangResults.push(false);
      } else {
        [newAInp,newBInp,finalInp].forEach(i => i.classList.add('wrong'));
        const bMod = b % 10;
        const hint = bMod >= 7
          ? 'Lägg till '+(10-bMod)+' på båda: '+(a+(10-bMod))+' − '+(b+(10-bMod))
          : 'Ta bort '+bMod+' från båda: '+(a-bMod)+' − '+(b-bMod);
        fb.classList.add('wrong');
        fb.textContent = 'Mellanledet stämmer inte. Tips: ' + hint + ' = ' + answer + '.';
        omgangResults.push(false);
      }

      setTimeout(() => {
        if(omgangResults.length >= OMGANG) showSummary();
        else { task=newTask(); render(); }
      }, omgangResults[omgangResults.length-1] ? 2000 : 2700);
    }
  }

  function showSummary(){
    const right = omgangResults.filter(x=>x).length;
    const total = omgangResults.length;
    const adj   = adjustLevel(level, right, total);
    level = adj.level;
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Metod · öka och minska lika','Du klarade '+right+' av '+total+'.',level)
      + renderSummaryCard({right, total, level, levelChange:adj.change})
      + '</div>';
    document.getElementById('summary-next-btn').onclick = () => {
      omgangResults=[]; task=newTask(); render();
    };
  }

  render();
}

// --- SUB METOD: ADDITION BAKIFRÅN ---
function renderAdditionBakifran(body, metod, backFn){
  function newTask(){
    // Välj tal som passar metoden: b ska ha ett gap till nästa tiotal
    for(let i=0; i<100; i++){
      const a = 20 + Math.floor(Math.random()*80);
      const b = 10 + Math.floor(Math.random()*(a-15));
      if(b%10 !== 0 && a-b > 5) return {a, b, answer: a-b, op:'-'};
    }
    return {a:43, b:17, answer:26, op:'-'};
  }
  let task = newTask();

  function render(){
    const {a, b, answer} = task;
    // Steg: b -> nästa tiotal -> a
    const nextTio = Math.ceil(b/10)*10;
    const steg1 = nextTio - b;          // från b till nästa tiotal
    const steg2 = a - nextTio;          // från nästa tiotal till a
    const useTwoSteps = steg2 > 0;

    body.innerHTML = `
      <div class="exercise-card">
        ${exerciseHeader('Metod · addition bakifrån', metod.beskrivning)}
        <div class="metod-explain-card">
          <div style="background:var(--bg-warm);padding:14px;border-radius:var(--radius);margin-bottom:16px;font-size:13px;">
            <strong>Idén:</strong> Istället för att subtrahera räknar vi hur mycket vi måste lägga till för att komma från <strong>${b}</strong> till <strong>${a}</strong>.
            Resultatet (differensen) är summan av stegen.
          </div>

          <p style="font-size:15px;margin:0 0 18px;">Beräkna <strong style="font-family:var(--mono);font-size:18px;">${a} − ${b}</strong>.</p>

          <div class="abakifran-grid">
            <div class="abakifran-tallinje">
              <div class="ab-punkt" style="left:0%">
                <div class="ab-label">${b}</div>
                <div class="ab-dot"></div>
              </div>
              <div class="ab-punkt" style="left:${steg1/(answer)*50}%">
                <div class="ab-label">${nextTio}</div>
                <div class="ab-dot"></div>
              </div>
              <div class="ab-punkt" style="left:100%">
                <div class="ab-label">${a}</div>
                <div class="ab-dot"></div>
              </div>
              <div class="ab-linje"></div>
            </div>

            <div class="abakifran-steg">
              <div class="ab-steg-rad">
                <span class="ab-steg-label">Från ${b} till ${nextTio}:</span>
                <input type="text" class="rakna-factor-input" id="ab-s1" inputmode="numeric" maxlength="4" data-ans="${steg1}" style="width:70px;" placeholder="?">
              </div>
              ${useTwoSteps ? `
              <div class="ab-steg-rad">
                <span class="ab-steg-label">Från ${nextTio} till ${a}:</span>
                <input type="text" class="rakna-factor-input" id="ab-s2" inputmode="numeric" maxlength="4" data-ans="${steg2}" style="width:70px;" placeholder="?">
              </div>
              ` : ''}
              <div class="ab-steg-rad ab-steg-sum">
                <span class="ab-steg-label" style="font-weight:600;">Summa (= differens):</span>
                <input type="text" class="rakna-factor-input" id="ab-sum" inputmode="numeric" maxlength="5" data-ans="${answer}" style="width:80px;" placeholder="?">
              </div>
            </div>
          </div>

          <div class="rakna-uppdela-feedback" id="fb-ab"></div>
          <div style="margin-top:16px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
            <button class="btn primary" id="ab-check">Kontrollera</button>
            <button class="btn subtle" id="ab-ny">Ny uppgift</button>
            <button class="btn subtle" id="ab-back">Tillbaka</button>
          </div>
        </div>
      </div>
    `;

    const allInputs = [
      document.getElementById('ab-s1'),
      useTwoSteps ? document.getElementById('ab-s2') : null,
      document.getElementById('ab-sum')
    ].filter(Boolean);

    const check = ()=>{
      let allRight = true;
      allInputs.forEach(inp=>{
        inp.disabled = true;
        const correct = parseInt(inp.value) === parseInt(inp.dataset.ans);
        inp.classList.add(correct?'correct':'wrong');
        if(!correct) allRight = false;
      });
      const fb = document.getElementById('fb-ab'); fb.classList.add('show');
      const ts = getTutorScore('sub-metoder','metod'); ts.total++;
      const tsGB = getTutorScore('sub-metoder','bakifran'); tsGB.total++;
      if(allRight){
        fb.classList.add('correct');
        fb.textContent = `Rätt! ${b} + ${steg1}${useTwoSteps?' + '+steg2:''} = ${a}, alltså ${a} − ${b} = ${answer}`;
        ts.correct++; tsGB.correct++;
        setTimeout(()=>{ task=newTask(); render(); }, 2200);
      } else {
        fb.classList.add('wrong');
        fb.textContent = `${b} + ${steg1} = ${nextTio}${useTwoSteps?', ' + nextTio + ' + ' + steg2 + ' = ' + a : ''}. Differensen är ${steg1}${useTwoSteps?' + '+steg2:''} = ${answer}.`;
        setTimeout(()=>{ task=newTask(); render(); }, 2800);
      }
    };
    document.getElementById('ab-check').onclick = check;
    document.getElementById('ab-ny').onclick = ()=>{ task=newTask(); render(); };
    document.getElementById('ab-back').onclick = backFn;
    allInputs.forEach((inp,i)=>{
      inp.addEventListener('keydown', e=>{
        if(e.key==='Enter'){ e.preventDefault();
          if(i<allInputs.length-1) allInputs[i+1].focus(); else check();
        }
      });
    });
    setTimeout(()=>allInputs[0].focus(), 50);
  }
  render();
}

// RÄKNETRÄNING ADD/SUB (blandat, adaptiv)
// ============================================================
function renderRaknetraningAS(body){
  let level = 1;
  let omgang = [];
  let idx = 0;
  let omgangResults = [];

  function genOmgang(){
    const seen = new Set();
    const items = [];
    let attempts = 0;
    while(items.length < 10 && attempts < 300){
      attempts++;
      const useAdd = Math.random() < 0.5;
      const task = useAdd ? genAddTask(level) : genSubTask(level);
      const key = `${task.a}${task.op}${task.b}`;
      if(!seen.has(key)){ seen.add(key); items.push(task); }
    }
    return items;
  }

  function render(){
    if(idx >= omgang.length){
      const right = omgangResults.filter(x=>x).length;
      const total = omgangResults.length;
      const adj = adjustLevel(level, right, total);
      level = adj.level;
      body.innerHTML = `<div class="exercise-card">${exerciseHeader('Räkneträning · add & sub', `Du klarade ${right} av ${total}.`, level)}${renderSummaryCard({right, total, level, levelChange: adj.change})}</div>`;
      document.getElementById('summary-next-btn').onclick = ()=>{ omgang=genOmgang(); idx=0; omgangResults=[]; render(); };
      return;
    }
    const task = omgang[idx];
    body.innerHTML = `
      <div class="exercise-card">
        ${exerciseHeader('Räkneträning · addition och subtraktion', 'Välj valfri metod.', level)}
        ${renderScoreBarSimple(omgangResults.filter(x=>x).length, omgangResults.filter(x=>!x).length, omgang.length, idx)}
        <div class="rakna-uppdela-task">
          <div class="rakna-uppdela-line" style="font-size:28px;gap:14px;padding:24px;">
            <span class="rakna-uppdela-target">${task.a}</span>
            <span style="color:var(--ink-soft);font-weight:600;">${task.op}</span>
            <span class="rakna-uppdela-target">${task.b}</span>
            <span style="color:var(--ink-soft);">=</span>
            <input type="text" class="rakna-factor-input" id="main-input" inputmode="numeric" maxlength="6" style="width:90px;">
          </div>
          <div class="rakna-uppdela-feedback" id="fb"></div>
          <div style="margin-top:14px;text-align:center;"><button class="btn primary" id="check-btn">Kontrollera</button></div>
        </div>
      </div>
    `;
    const inp = document.getElementById('main-input');
    const check = ()=>{
      const val = parseInt(inp.value.trim());
      const fb = document.getElementById('fb'); fb.classList.add('show');
      inp.disabled = true; document.getElementById('check-btn').disabled = true;
      const ts = getTutorScore('raknetraning-as','rakna'); ts.total++;
      if(val === task.answer){
        inp.classList.add('correct'); fb.classList.add('correct'); fb.textContent = `Rätt! ${task.a} ${task.op} ${task.b} = ${task.answer}`;
        ts.correct++; omgangResults.push(true);
      } else {
        inp.classList.add('wrong'); fb.classList.add('wrong'); fb.textContent = `${task.a} ${task.op} ${task.b} = ${task.answer}`;
        omgangResults.push(false);
      }
      setTimeout(()=>{ idx++; render(); }, 1600);
    };
    document.getElementById('check-btn').onclick = check;
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){e.preventDefault();check();} });
    setTimeout(()=>inp.focus(), 50);
  }
  omgang = genOmgang();
  render();
}

function renderMultFaktorisera(body){
  let level = 1;
  let omgang = [];
  let idx = 0;
  let omgangResults = [];

  function pickAntal(){
    // Nivå 1: bara 2 faktorer. Nivå 2: jämn blandning av 2 och 3. Nivå 3: 3 faktorer.
    if(level === 1) return 2;
    if(level === 2) return randPick([2,2,3,3]);
    return 3;
  }

  function pickTarget(antal){
    // Talintervallet beror på både nivå och antal faktorer
    let lo, hi;
    if(level === 1){
      lo = 12; hi = 50;
    } else if(level === 2){
      if(antal === 2){ lo = 48; hi = 150; }   // svårare tvåfaktorstal
      else            { lo = 36; hi = 120; }   // trefaktorstal, mellansvårt
    } else {
      lo = 60; hi = 220;                        // stora trefaktorstal
    }
    const pool = [];
    for(let n=lo; n<=hi; n++){
      if(primeFactorize(n).length >= antal) pool.push(n);
    }
    return randPick(pool);
  }

  function genOmgang(){
    const items = [];
    const seen = new Set();
    let attempts = 0;
    while(items.length < 8 && attempts < 300){
      attempts++;
      const antal = pickAntal();
      const target = pickTarget(antal);
      const key = target + '-' + antal;
      if(!seen.has(key)){
        seen.add(key);
        items.push({target:target, antal:antal});
      }
    }
    return items;
  }

  function validate(task, values){
    if(values.length !== task.antal) return {ok:false, msg:'Fyll i alla ' + task.antal + ' rutor.'};
    if(values.some(function(v){ return isNaN(v); })) return {ok:false, msg:'Skriv heltal i alla rutor.'};
    if(values.some(function(v){ return v < 2; })) return {ok:false, msg:'Alla faktorer ska vara minst 2.'};
    const product = values.reduce(function(a,b){ return a*b; }, 1);
    if(product !== task.target) return {ok:false, msg:'Produkten blir ' + product + ', men den ska bli ' + task.target + '.'};
    return {ok:true};
  }

  function render(){
    if(idx >= omgang.length){
      const right = omgangResults.filter(x=>x).length;
      const total = omgangResults.length;
      const adj = adjustLevel(level, right, total);
      level = adj.level;
      body.innerHTML = '<div class="exercise-card">'
        + exerciseHeader('Räkna · faktorisera ett tal', 'Du klarade ' + right + ' av ' + total + '.', level)
        + renderSummaryCard({right:right, total:total, level:level, levelChange:adj.change})
        + '</div>';
      document.getElementById('summary-next-btn').onclick = function(){
        omgang = genOmgang(); idx = 0; omgangResults = []; render();
      };
      return;
    }
    const task = omgang[idx];
    let inputs = '';
    for(let i=0; i<task.antal; i++){
      if(i > 0) inputs += '<span style="font-family:var(--mono);font-size:22px;color:var(--c-rakna);font-weight:600;">·</span>';
      inputs += '<input type="text" class="rakna-factor-input" data-i="' + i + '" inputmode="numeric" maxlength="3">';
    }
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Räkna · faktorisera ett tal', 'Dela upp talet i faktorer som multipliceras till talet.', level)
      + renderScoreBarSimple(omgangResults.filter(x=>x).length, omgangResults.filter(x=>!x).length, omgang.length, idx)
      + '<div class="rakna-uppdela-task">'
        + '<div class="rakna-uppdela-prompt">Dela upp ' + task.target + ' i ' + task.antal + ' faktorer. Alla faktorer ska vara minst 2.</div>'
        + '<div class="rakna-uppdela-line">'
          + '<span class="rakna-uppdela-target">' + task.target + '</span>'
          + '<span class="rakna-uppdela-equals">=</span>'
          + inputs
        + '</div>'
        + '<div class="rakna-uppdela-feedback" id="rakna-fb"></div>'
        + '<div style="margin-top:16px;text-align:center;"><button class="btn primary" id="rakna-check">Kontrollera</button></div>'
      + '</div>'
    + '</div>';

    const inputEls = document.querySelectorAll('.rakna-factor-input');
    inputEls.forEach(function(inp, i){
      inp.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){
          e.preventDefault();
          if(i < inputEls.length - 1) inputEls[i+1].focus();
          else check();
        }
      });
    });
    setTimeout(function(){ if(inputEls[0]) inputEls[0].focus(); }, 50);

    function check(){
      const values = Array.from(inputEls).map(function(inp){ return parseInt(inp.value.trim()); });
      const result = validate(task, values);
      const fb = document.getElementById('rakna-fb');
      inputEls.forEach(function(i){ i.classList.remove('correct','wrong'); });
      fb.classList.remove('correct','wrong');
      fb.classList.add('show');
      const ts = getTutorScore('mult-begrepp','rakna');
      ts.total++;
      if(result.ok){
        inputEls.forEach(function(i){ i.classList.add('correct'); });
        fb.classList.add('correct');
        const sorted = values.slice().sort(function(a,b){ return a-b; });
        fb.textContent = 'Rätt! ' + task.target + ' = ' + sorted.join(' · ');
        ts.correct++;
        omgangResults.push(true);
      } else {
        inputEls.forEach(function(i){ i.classList.add('wrong'); });
        fb.classList.add('wrong');
        fb.textContent = result.msg;
        omgangResults.push(false);
      }
      inputEls.forEach(function(i){ i.disabled = true; });
      document.getElementById('rakna-check').disabled = true;
      setTimeout(function(){ idx++; render(); }, 1800);
    }
    document.getElementById('rakna-check').onclick = check;
  }
  omgang = genOmgang();
  render();
}

function d3RandInt(lo, hi){ return lo + Math.floor(Math.random() * (hi - lo + 1)); }

function d3FmtNum(n){
  const r = Math.round(n * 1e6) / 1e6;
  return String(r).replace('.', ',');
}

function keypadHTML(ops){
  ops = ops || [];
  const digits = ['7','8','9','4','5','6','1','2','3'];
  let html = '<div class="keypad">';
  html += '<div class="keypad-digits">';
  for(let i=0; i<digits.length; i++){
    html += '<button type="button" class="kp-key" data-key="' + digits[i] + '">' + digits[i] + '</button>';
  }
  html += '<button type="button" class="kp-key span2" data-key="0">0</button>';
  html += '<button type="button" class="kp-key util" data-key="back">\u232B</button>';
  html += '</div>';
  if(ops.length){
    const cls = ops.length > 5 ? 'keypad-ops wide2' : 'keypad-ops';
    html += '<div class="' + cls + '">';
    for(let j=0; j<ops.length; j++){
      html += '<button type="button" class="kp-key op" data-key="' + ops[j] + '">' + ops[j] + '</button>';
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function bindKeypad(cardEl){
  let active = cardEl.querySelector('input');
  cardEl.addEventListener('focusin', function(e){
    if(e.target.tagName === 'INPUT') active = e.target;
  });
  cardEl.querySelectorAll('.kp-key').forEach(function(btn){
    btn.addEventListener('mousedown', function(e){
      e.preventDefault();
      if(!active || active.disabled){
        const first = cardEl.querySelector('input:not([disabled])');
        if(first) active = first; else return;
      }
      const k = btn.dataset.key;
      if(k === 'back'){
        active.value = active.value.slice(0, -1);
      } else {
        const max = parseInt(active.getAttribute('maxlength'));
        if(max && active.value.length >= max){ active.focus(); return; }
        active.value += k;
      }
      active.dispatchEvent(new Event('input', {bubbles:true}));
      active.focus();
    });
  });
}

// Evaluerar ett uttryck: tillåter · , och implicit multiplikation (20-1)(30-1)
function d3EvalExpr(seg){
  let s = seg.replace(/\s/g,'').replace(/[·×]/g,'*').replace(/,/g,'.');
  s = s.replace(/\)\(/g,')*(').replace(/(\d)\(/g,'$1*(').replace(/\)(\d)/g,')*$1');
  if(s === '' || !/^[0-9+\-*/().]+$/.test(s)) return null;
  try {
    const v = Function('"use strict";return (' + s + ')')();
    return (typeof v === 'number' && isFinite(v)) ? v : null;
  } catch(e){ return null; }
}

function renderMultTabell(body){
  const TABELL_NIVAER = [
    {nr:1, namn:'Tal upp till 5', desc:'Ena talet 0–5, andra talet 2–5.', ra:[0,5], rb:[2,5]},
    {nr:2, namn:'Tal 5 till 10',  desc:'Båda talen är mellan 5 och 10.',  ra:[5,10], rb:[5,10]},
    {nr:3, namn:'Tal 6 till 12',  desc:'Båda talen är mellan 6 och 12.',  ra:[6,12], rb:[6,12]}
  ];
  let nivå = null;
  let omgang = [];
  let idx = 0;
  let results = [];
  let startTime = 0;
  let timerInterval = null;

  if(!state.tabellBest) state.tabellBest = {};

  function stopTimer(){
    if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  }
  function formatTid(ms){
    const s = ms / 1000;
    if(s < 60) return s.toFixed(1).replace('.', ',') + ' s';
    const m = Math.floor(s / 60);
    const rest = Math.round(s - m * 60);
    return m + ' min ' + (rest < 10 ? '0' : '') + rest + ' s';
  }

  function buildOmgang(lv){
    const pool = [];
    for(let a=lv.ra[0]; a<=lv.ra[1]; a++){
      for(let b=lv.rb[0]; b<=lv.rb[1]; b++){
        pool.push({a:a, b:b});
      }
    }
    return shuffle(pool).slice(0, Math.min(25, pool.length));
  }

  function startaOmgang(){
    omgang = buildOmgang(nivå);
    idx = 0;
    results = [];
    startTime = Date.now();
    renderFraga();
  }

  function renderValjNiva(){
    stopTimer();
    let cards = '';
    for(let i=0; i<TABELL_NIVAER.length; i++){
      const lv = TABELL_NIVAER[i];
      const best = state.tabellBest[lv.nr];
      const bestTxt = best ? '🏆 Rekord: ' + formatTid(best) : 'Inget rekord än';
      cards += '<button class="tabell-card" data-niva="' + i + '">'
        + '<div class="tabell-card-num">' + lv.nr + '</div>'
        + '<div class="tabell-card-body">'
          + '<div class="tabell-card-namn">Nivå ' + lv.nr + ' · ' + lv.namn + '</div>'
          + '<div class="tabell-card-desc">' + lv.desc + ' &nbsp;·&nbsp; ' + bestTxt + '</div>'
        + '</div>'
        + '<div style="color:var(--ink-faint);font-size:20px;">›</div>'
      + '</button>';
    }
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Multiplikationstabellen', 'Välj en nivå. Tiden startar direkt – försök slå rekordet!')
      + '<div class="tabell-level-grid">' + cards + '</div>'
    + '</div>';
    body.querySelectorAll('[data-niva]').forEach(function(btn){
      btn.onclick = function(){
        nivå = TABELL_NIVAER[parseInt(btn.dataset.niva)];
        startaOmgang();
      };
    });
  }

  function renderSummary(){
    stopTimer();
    const elapsed = Date.now() - startTime;
    const right = results.filter(function(x){ return x; }).length;
    const total = results.length;
    const alltRatt = right === total && total > 0;
    const snitt = total > 0 ? elapsed / total : 0;

    // Rekord: bara helt felfria omgångar räknas
    const tidigare = state.tabellBest[nivå.nr];
    let nyttRekord = false;
    if(alltRatt && (!tidigare || elapsed < tidigare)){
      state.tabellBest[nivå.nr] = elapsed;
      nyttRekord = true;
    }
    let rekordHTML = '';
    if(nyttRekord){
      rekordHTML = '<div class="tabell-rekord nytt">🏆 Nytt rekord på nivå ' + nivå.nr + '!</div>';
    } else if(alltRatt && tidigare){
      const diff = elapsed - tidigare;
      rekordHTML = '<div class="tabell-rekord gammalt">Rekordet är ' + formatTid(tidigare)
        + ' – du var ' + formatTid(diff) + ' långsammare</div>';
    } else if(!alltRatt){
      rekordHTML = '<div class="tabell-rekord gammalt">Alla rätt krävs för att sätta rekord</div>';
    }

    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Multiplikationstabellen · nivå ' + nivå.nr, 'Du klarade ' + right + ' av ' + total + ' tal.')
      + '<div class="tabell-tidkort">'
        + '<div class="tabell-tid-stor">' + formatTid(elapsed) + '</div>'
        + '<div class="tabell-tid-rad">' + total + ' tal · ' + formatTid(snitt) + ' per tal · ' + right + ' rätt</div>'
        + rekordHTML
      + '</div>'
      + renderSummaryCard({right:right, total:total, level:nivå.nr, levelChange:null, nextLabel:'Kör igen – ta tid'})
      + '<div style="margin-top:-8px;text-align:center;">'
        + '<button class="btn subtle" id="tabell-byt">Välj en annan nivå</button>'
      + '</div>'
    + '</div>';
    document.getElementById('summary-next-btn').onclick = startaOmgang;
    document.getElementById('tabell-byt').onclick = renderValjNiva;
  }

  function renderFraga(){
    if(idx >= omgang.length){ renderSummary(); return; }
    const t = omgang[idx];
    const facit = String(t.a * t.b);
    const right = results.filter(function(x){ return x; }).length;
    const pct = Math.round((idx / omgang.length) * 100);

    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Multiplikationstabellen · nivå ' + nivå.nr, 'Skriv produkten. Rätt svar → nästa tal direkt.')
      + '<div class="tabell-timer" id="tabell-timer"><span class="tt-ikon">⏱</span> <span id="tabell-timer-val">0,0 s</span></div>'
      + '<div class="tabell-fraga">' + t.a + ' · ' + t.b + ' <span class="tabell-eq">=</span></div>'
      + '<input type="text" class="tabell-svar-input" id="tabell-input" inputmode="numeric" maxlength="3" autocomplete="off">'
      + '<div class="tabell-feedback" id="tabell-fb"></div>'
      + keypadHTML([])
      + '<div class="tabell-progress">Tal ' + (idx+1) + ' av ' + omgang.length + ' · ' + right + ' rätt'
        + '<div class="tabell-progress-bar"><div class="tabell-progress-fill" style="width:' + pct + '%"></div></div>'
      + '</div>'
      + '<div style="margin-top:14px;text-align:center;">'
        + '<button class="btn primary" id="tabell-svara">Svara</button>'
        + '<button class="btn subtle" id="tabell-back">Avbryt</button>'
      + '</div>'
    + '</div>';

    // Live-tidtagning
    stopTimer();
    const timerVal = document.getElementById('tabell-timer-val');
    function tick(){
      const s = (Date.now() - startTime) / 1000;
      timerVal.textContent = s.toFixed(1).replace('.', ',') + ' s';
    }
    tick();
    timerInterval = setInterval(tick, 100);

    const card = body.querySelector('.exercise-card');
    bindKeypad(card);
    const input = document.getElementById('tabell-input');
    setTimeout(function(){ input.focus(); }, 50);
    let done = false;

    function advance(correct){
      if(done) return;
      done = true;
      results.push(correct);
      const ts = getTutorScore('mult-tabell','rakna');
      ts.total++;
      if(correct) ts.correct++;
      const fb = document.getElementById('tabell-fb');
      input.disabled = true;
      document.getElementById('tabell-svara').disabled = true;
      if(correct){
        input.classList.add('correct');
        fb.className = 'tabell-feedback correct';
        fb.textContent = 'Rätt!';
        setTimeout(function(){ idx++; renderFraga(); }, 350);
      } else {
        input.classList.add('wrong');
        fb.className = 'tabell-feedback wrong';
        fb.textContent = t.a + ' · ' + t.b + ' = ' + facit;
        setTimeout(function(){ idx++; renderFraga(); }, 200);
      }
    }

    // Rätt svar → byt direkt
    input.addEventListener('input', function(){
      if(input.value.trim() === facit) advance(true);
    });
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        e.preventDefault();
        if(input.value.trim() !== '') advance(input.value.trim() === facit);
      }
    });
    document.getElementById('tabell-svara').onclick = function(){
      if(input.value.trim() !== '') advance(input.value.trim() === facit);
    };
    document.getElementById('tabell-back').onclick = renderValjNiva;
  }

  renderValjNiva();
}

function d3SpaceExpr(s){
  let t = s.replace(/\s+/g,'');
  t = t.replace(/([+\-=·])/g, ' $1 ');
  t = t.replace(/\s+/g,' ').trim();
  if(/[+\-=·]$/.test(s.replace(/\s+/g,''))) t += ' ';
  return t;
}
