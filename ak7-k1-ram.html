        + '<div style="color:var(--ink-faint);font-size:20px;">›</div>'
      + '</button>';
    }
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Metoder för multiplikation', 'Välj en metod att öva på. Varje metod har ett räknat exempel.')
      + '<div class="metod-val-grid">' + cards + '</div>'
    + '</div>';
    body.querySelectorAll('[data-metod]').forEach(function(btn){
      btn.onclick = function(){ openMetod(btn.dataset.metod); };
    });
  }

  function openMetod(id){
    const back = function(){ renderValjMetod(); };
    if(id === 'uppstallning'){ renderUppstallningMult(body, back); return; }
    const cfg = ENRADS[id];
    cfg.scoreKey = id;
    renderEnradsMetod(body, cfg, back);
  }

  // --- Konfiguration för enradsmetoderna ---
  // --- Konfiguration för enradsmetoderna ---
  const ENRADS = {
    talsorterna:{
      header:'Metod · talsorterna var för sig',
      sub:'Dela upp talet i talsorter, multiplicera var för sig och addera ihop.',
      instr:'Skriv mellanledet och svaret på raden, åtskilda med =.',
      placeholder:'t.ex. 180 + 42 = 222',
      ops:['+','='],
      exempel:'<strong>Så funkar det:</strong> Dela upp det större talet i talsorter och multiplicera varje del.<br>'
        + '<span class="ex-rad">37 · 6 = 180 + 42 = 222</span><br>'
        + '<span class="ex-rad">234 · 7 = 1400 + 210 + 28 = 1638</span>',
      buildOmgang:function(){
        return [
          mkTask(d3RandInt(31,55), d3RandInt(3,9)),
          mkTask(d3RandInt(42,75), d3RandInt(3,9)),
          mkTask(d3RandInt(58,99), d3RandInt(3,9)),
          mkTask(d3RandInt(112,449), d3RandInt(3,8)),
          mkTask(d3RandInt(238,899), d3RandInt(3,8))
        ];
      }
    },
    dubbla:{
      header:'Metod · dubbla och halvera',
      sub:'Dubbla ena talet och halvera det andra. Båda nya talen blir lättare – antingen blir ena 10, eller så blir båda ental.',
      instr:'Skriv mellanledet (dubblat och halverat) och svaret. T.ex. 7 · 10 = 70 eller 6 · 9 = 54.',
      placeholder:'t.ex. 6 · 9 = 54',
      ops:['·','='],
      exempel:'<strong>Så funkar det:</strong> Båda talen blir lättare efter dubbla-och-halvera. Antingen blir ena 10 (när 5 dubblas), eller så blir båda ental.<br>'
        + '<span class="ex-rad">14 · 5 = 7 · 10 = 70</span><br>'
        + '<span class="ex-rad">38 · 5 = 19 · 10 = 190</span><br>'
        + '<span class="ex-rad">3 · 18 = 6 · 9 = 54</span><br>'
        + '<span class="ex-rad">4 · 16 = 8 · 8 = 64</span>',
      buildOmgang:function(){
        // Två varianter blandade:
        //   A) "tiotal": 5 dubblas till 10, andra faktorn jämn (12 och uppåt)
        //   B) "tabell": båda blir ental – jämn 12-18 halveras, 3 eller 4 dubblas
        function tiotal(jamntMin, jamntMax){
          const jamn = 2 * d3RandInt(Math.ceil(jamntMin/2), Math.floor(jamntMax/2));
          if(Math.random() < 0.5) return mkTask(jamn, 5);
          return mkTask(5, jamn);
        }
        function tabell(){
          // Jämna talet: 12, 14, 16 eller 18 (halveras till 6, 7, 8, 9)
          const jamn = 2 * d3RandInt(6, 9);
          // Lilla talet: 3 eller 4 (dubblas till 6 eller 8)
          const litet = d3RandInt(3, 4);
          if(Math.random() < 0.5) return mkTask(jamn, litet);
          return mkTask(litet, jamn);
        }
        const tasks = [];
        // 3 stycken tabellvarianter
        tasks.push(tabell());
        tasks.push(tabell());
        tasks.push(tabell());
        // 2 stycken tiotalsvarianter med mindre jämna tal (12-18)
        tasks.push(tiotal(12, 18));
        tasks.push(tiotal(12, 18));
        // 1 stycken tiotalsvariant med större jämna tal (20-80)
        tasks.push(tiotal(20, 80));
        // Blanda ordningen
        for(let i=tasks.length-1; i>0; i--){
          const j = Math.floor(Math.random()*(i+1));
          const t = tasks[i]; tasks[i] = tasks[j]; tasks[j] = t;
        }
        return tasks;
      }
    },
    kompensation:{
      header:'Metod · kompensationsmetoden',
      sub:'Räkna med ett runt tal och justera sedan för skillnaden.',
      instr:'Skriv hela uträkningen på raden, t.ex. 20 · 6 - 1 · 6 = 120 - 6 = 114.',
      placeholder:'t.ex. 20 · 6 - 1 · 6 = 120 - 6 = 114',
      ops:['·','+','-','='],
      exempel:'<strong>Så funkar det:</strong> Ett tal nära ett tiotal byts mot det runda talet – sedan kompenserar du.<br>'
        + '<span class="ex-rad">19 · 6 = 20 · 6 − 1 · 6 = 120 − 6 = 114</span><br>'
        + '<span class="ex-rad">21 · 7 = 20 · 7 + 1 · 7 = 140 + 7 = 147</span>',
      buildOmgang:function(){
        function near(basLo, basHi, maxOffset, bLo, bHi){
          const bas = 10 * d3RandInt(basLo, basHi);
          const a = bas + (Math.random() < 0.5 ? -1 : 1) * d3RandInt(1, maxOffset);
          return mkTask(a, d3RandInt(bLo, bHi));
        }
        return [
          near(2, 5, 1, 3, 6),   // enklare: nära ett tiotal, ±1, litet andra tal
          near(2, 8, 2, 3, 8),   // medel
          near(3, 9, 2, 4, 9)    // svårare
        ];
      }
    },
    dubbelparentes:{
      header:'Metod · dubbelparentes',
      sub:'Skriv båda talen som parenteser nära runda tal och multiplicera ut allt.',
      instr:'Skriv hela uträkningen på raden, t.ex. (20-1)(30-1) = 600-20-30+1 = 551.',
      placeholder:'t.ex. (20-1)(30-1) = 600-20-30+1 = 551',
      ops:['(',')','·','+','-','='],
      exempel:'<strong>Så funkar det:</strong> Båda talen skrivs nära ett runt tal. Multiplicera ihop alla delar.<br>'
        + '<span class="ex-rad">19 · 29 = (20−1)(30−1) = 600−20−30+1 = 551</span><br>'
        + '<span class="ex-rad">32 · 39 = (30+2)(40−1) = 1200−30+80−2 = 1248</span>',
      buildOmgang:function(){
        function near(basLo, basHi, maxOffset){
          const bas = 10 * d3RandInt(basLo, basHi);
          return bas + (Math.random() < 0.5 ? -1 : 1) * d3RandInt(1, maxOffset);
        }
        return [
          mkTask(near(2,3,1), near(2,4,1)),   // enklare: båda nära ett tiotal, ±1
          mkTask(near(2,4,2), near(2,5,2)),   // medel
          mkTask(near(2,5,2), near(2,5,2))    // svårare
        ];
      }
    }
  };

  function mkTask(a, b){ return {a:a, b:b, answer:a * b}; }

  function renderEnradsMetod(host, cfg, backFn){
    let omgang = cfg.buildOmgang();
    let idx = 0;
    let results = [];

    function render(){
      if(idx >= omgang.length){
        const right = results.filter(function(x){ return x; }).length;
        const total = results.length;
        host.innerHTML = '<div class="exercise-card">'
          + exerciseHeader(cfg.header, 'Du klarade ' + right + ' av ' + total + '.')
          + renderSummaryCard({right:right, total:total, nextLabel:'Ny omgång'})
          + '<div style="margin-top:-8px;text-align:center;"><button class="btn subtle" id="metod-tillmetoder">Tillbaka till metoder</button></div>'
        + '</div>';
        document.getElementById('summary-next-btn').onclick = function(){
          omgang = cfg.buildOmgang(); idx = 0; results = []; render();
        };
        document.getElementById('metod-tillmetoder').onclick = backFn;
        return;
      }
      const task = omgang[idx];
      host.innerHTML = '<div class="exercise-card">'
        + exerciseHeader(cfg.header, cfg.sub)
        + '<div class="mult-exempel">' + cfg.exempel + '</div>'
        + renderScoreBarSimple(results.filter(function(x){return x;}).length, results.filter(function(x){return !x;}).length, omgang.length, idx)
        + '<div class="mult-metod-uppg">'
          + '<div class="mult-metod-instr">' + cfg.instr + '</div>'
          + '<div class="mult-rad-wrap">'
            + '<span class="mult-rad-fast">' + task.a + ' · ' + task.b + ' =</span>'
            + '<input type="text" class="mult-rad-input" id="metod-rad" autocomplete="off" placeholder="' + cfg.placeholder + '">'
          + '</div>'
        + '</div>'
        + '<div class="rakna-uppdela-feedback" id="metod-fb"></div>'
        + keypadHTML(cfg.ops)
        + '<div class="kp-hint">Skriv hela uträkningen på en rad. Använd tangentbordet eller knapparna.</div>'
        + '<div style="margin-top:16px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'
          + '<button class="btn primary" id="metod-check">Kontrollera</button>'
          + '<button class="btn subtle" id="metod-back">Tillbaka till metoder</button>'
        + '</div>'
      + '</div>';

      const card = host.querySelector('.exercise-card');
      bindKeypad(card);
      const input = document.getElementById('metod-rad');
      // mellanrum runt + - = · medan eleven skriver
      input.addEventListener('input', function(){
        const f = d3SpaceExpr(input.value);
        if(f !== input.value) input.value = f;
      });
      setTimeout(function(){ input.focus(); }, 50);
      input.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){ e.preventDefault(); check(); }
      });
      document.getElementById('metod-check').onclick = check;
      document.getElementById('metod-back').onclick = backFn;

      function check(){
        const raw = input.value.trim();
        const fb = document.getElementById('metod-fb');
        fb.className = 'rakna-uppdela-feedback show';
        const ts = getTutorScore('mult-metoder','metod');
        const tsG = getTutorScore('mult-metoder', cfg.scoreKey);

        const segs = raw.split('=').map(function(s){ return s.trim(); })
                        .filter(function(s){ return s !== ''; });
        let res;
        if(!raw){
          res = {ok:false, msg:'Skriv din uträkning på raden.'};
        } else if(segs.length < 2){
          res = {ok:false, msg:'Visa metoden – skriv minst ett mellanled och svaret, åtskilda med =.'};
        } else {
          res = {ok:true};
          for(let i=0; i<segs.length; i++){
            const v = d3EvalExpr(segs[i]);
            if(v === null){
              res = {ok:false, msg:'Kunde inte tolka "' + segs[i] + '". Använd siffror och räknetecken.'};
              break;
            }
            if(Math.abs(v - task.answer) > 1e-6){
              res = {ok:false, msg:'Det stämmer inte. "' + segs[i] + '" blir ' + d3FmtNum(v)
                + ', men ' + task.a + ' · ' + task.b + ' = ' + d3FmtNum(task.answer) + '.'};
              break;
            }
          }
        }

        input.disabled = true;
        document.getElementById('metod-check').disabled = true;
        ts.total++; tsG.total++;
        if(res.ok){
          input.classList.add('correct');
          fb.classList.add('correct');
          fb.textContent = 'Rätt! ' + task.a + ' · ' + task.b + ' = ' + raw + '  ✓';
          ts.correct++; tsG.correct++;
        } else {
          input.classList.add('wrong');
          fb.classList.add('wrong');
          fb.textContent = res.msg;
        }
        results.push(res.ok);
        setTimeout(function(){ idx++; render(); }, res.ok ? 1900 : 2800);
      }
    }
    render();
  }

  renderValjMetod();
}

// --- METOD: UPPSTÄLLNING (multiplikation) ---
// Nivå 1: tvåsiffrigt · ensiffrigt   Nivå 2: tresiffrigt · ensiffrigt
// Nivå 3: decimaltal · ensiffrigt    Nivå 4: tvåsiffrigt · tvåsiffrigt
function renderUppstallningMult(body, backFn){
  let level = 1;
  let omgangResults = [];
  const OMG = 5;

  const LEVELNAMN = {
    1:'tvåsiffrigt tal · ensiffrigt',
    2:'tresiffrigt tal · ensiffrigt',
    3:'decimaltal · ensiffrigt',
    4:'tvåsiffrigt · tvåsiffrigt'
  };

  function adjustUpp(lv, right, total){
    if(right >= total-1 && lv < 4) return {level:lv+1, change:'up'};
    if(right <= Math.floor(total/3) && lv > 1) return {level:lv-1, change:'down'};
    return {level:lv, change:null};
  }

  function genTask(){
    if(level === 1){
      const m = d3RandInt(12,98), d = d3RandInt(3,9);
      return {kind:'enkel', mDisplay:String(m), d:d, answer:m*d};
    }
    if(level === 2){
      const m = d3RandInt(112,989), d = d3RandInt(3,9);
      return {kind:'enkel', mDisplay:String(m), d:d, answer:m*d};
    }
    if(level === 3){
      const whole = d3RandInt(11,98), frac = d3RandInt(1,9);
      const mInt = whole*10 + frac;       // 367 = 36,7
      const d = d3RandInt(3,9);
      return {kind:'decimal', mDisplay:String(whole)+','+String(frac), dec:1,
              d:d, answerIntStr:String(mInt*d), answerValue:(mInt/10)*d};
    }
    const m = d3RandInt(13,89);
    let d; do { d = d3RandInt(12,39); } while(d % 10 < 2);
    return {kind:'tva', mDisplay:String(m), d:d, answer:m*d,
            ones:d%10, tens:Math.floor(d/10), p1:m*(d%10), p2:m*Math.floor(d/10)};
  }

  // En cell: digit (fast), comma (fast), input (svar), eller empty
  function cellHTML(c){
    if(c.t === 'fixed')  return '<div class="cell">' + c.v + '</div>';
    if(c.t === 'comma')  return '<div class="cell" style="color:var(--c-metod);font-weight:700;">,</div>';
    if(c.t === 'op')     return '<div class="cell opcell">' + c.v + '</div>';
    if(c.t === 'input')  return '<div class="cell"><input type="text" class="mult-upp-ans" data-expect="' + c.v + '" inputmode="numeric" maxlength="1" autocomplete="off"></div>';
    return '<div class="cell"></div>'; // empty
  }
  function rowHTML(opCell, cells, W){
    let pad = [];
    for(let i=0; i<W-cells.length; i++) pad.push({t:'empty'});
    const all = pad.concat(cells);
    let h = '<div class="mult-upp-row">' + cellHTML(opCell);
    for(let i=0; i<all.length; i++) h += cellHTML(all[i]);
    return h + '</div>';
  }
  // gör cellrad av en sträng: siffror -> input, komma -> comma
  function strToInputCells(str){
    return str.split('').map(function(ch){
      return ch === ',' ? {t:'comma'} : {t:'input', v:ch};
    });
  }
  function strToFixedCells(str){
    return str.split('').map(function(ch){
      return ch === ',' ? {t:'comma'} : {t:'fixed', v:ch};
    });
  }

  function minnesPanel(){
    let h = '<div class="mult-minne-panel"><div class="mult-minne-rubrik">minnessiffror</div><div class="mult-minne-rutor">';
    for(let i=0; i<5; i++){
      h += '<input type="text" class="mult-minne-ruta" inputmode="numeric" maxlength="1" autocomplete="off">';
    }
    h += '</div><div class="mult-minne-tips">Klicka på en siffra för att stryka den när den är använd.</div></div>';
    return h;
  }
  function bindMinne(card){
    card.querySelectorAll('.mult-minne-ruta').forEach(function(inp){
      inp.addEventListener('click', function(){
        if(inp.value.trim() !== '' && document.activeElement !== inp){
          inp.classList.toggle('struck');
        }
      });
      inp.addEventListener('dblclick', function(){ inp.classList.toggle('struck'); });
    });
  }

  // ---------- FÖRKLARING / DEMO ----------
  function renderExplain(){
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Metod · uppställning', 'Multiplicera kolumn för kolumn. Minnessiffran skrivs till höger om talet och stryks när den använts.')
      + '<div class="metod-explain-card">'
        + '<h3 class="metod-step-title">Så här fungerar det</h3>'
        + '<p class="metod-step-desc">Vi beräknar <strong>67 · 4</strong>. Klicka dig genom stegen.</p>'
        + '<div style="display:flex;justify-content:center;"><div class="mult-upp-box" id="demo-box"></div></div>'
        + '<div class="mult-demo-steg" id="demo-text"></div>'
        + '<div class="metod-demo-nav">'
          + '<button class="btn" id="demo-prev" disabled>← Föregående</button>'
          + '<span id="demo-info" style="font-size:13px;color:var(--ink-soft)">Steg 1 av 3</span>'
          + '<button class="btn primary" id="demo-next">Nästa steg →</button>'
        + '</div>'
      + '</div>'
      + '<div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'
        + '<button class="btn primary" id="start-practice">Öva nu →</button>'
        + '<button class="btn subtle" id="explain-back">Tillbaka till metoder</button>'
      + '</div>'
    + '</div>';

    // demo: 67 · 4. minnessiffra '2' till höger, struken i steg 2.
    const steps = [
      {minne:'', minneStruck:false, ans:['','',''],
       text:'Vi räknar 67 · 4. Börja längst till höger: 4 · 7 = 28. Skriv 8 i entalen och minnessiffran 2 till höger om talet.'},
      {minne:'2', minneStruck:false, ans:['','','8'],
       text:'Nästa kolumn: 4 · 6 = 24. Lägg till minnessiffran 2 → 26. Skriv 6, och stryk minnessiffran eftersom den nu är använd.'},
      {minne:'2', minneStruck:true, ans:['','2','6'],
       text:'Det finns inga fler kolumner. Den sista 2:an skrivs direkt. Svaret är 268.'}
    ];
    let s = 0;
    function draw(){
      const st = steps[s];
      const minneCell = st.minne === ''
        ? '<span class="mult-minne-demo"></span>'
        : '<span class="mult-minne-demo' + (st.minneStruck?' struck':'') + '">' + st.minne + '</span>';
      let h = '<div class="mult-upp-rows">';
      h += '<div class="mult-upp-row"><div class="cell opcell"></div><div class="cell"></div><div class="cell">6</div><div class="cell">7</div></div>';
      h += '<div class="mult-upp-row"><div class="cell opcell">·</div><div class="cell"></div><div class="cell"></div><div class="cell">4</div></div>';
      h += '<div class="mult-upp-line"></div>';
      h += '<div class="mult-upp-row"><div class="cell opcell"></div>'
         + '<div class="cell" style="color:var(--success);font-weight:700;">' + st.ans[0] + '</div>'
         + '<div class="cell" style="color:var(--success);font-weight:700;">' + st.ans[1] + '</div>'
         + '<div class="cell" style="color:var(--success);font-weight:700;">' + st.ans[2] + '</div></div>';
      h += '</div>';
      // minnessiffra till höger om talet
      h = '<div class="mult-upp-flex"><div class="mult-upp-rows-wrap">' + h + '</div>'
        + '<div class="mult-minne-demo-col">' + minneCell + '</div></div>';
      document.getElementById('demo-box').innerHTML = h;
      document.getElementById('demo-text').textContent = st.text;
      document.getElementById('demo-info').textContent = 'Steg ' + (s+1) + ' av ' + steps.length;
      document.getElementById('demo-prev').disabled = s === 0;
      document.getElementById('demo-next').textContent = s === steps.length-1 ? 'Klar ✓' : 'Nästa steg →';
    }
    document.getElementById('demo-prev').onclick = function(){ if(s>0){ s--; draw(); } };
    document.getElementById('demo-next').onclick = function(){
      if(s < steps.length-1){ s++; draw(); } else renderPractice();
    };
    document.getElementById('start-practice').onclick = renderPractice;
    document.getElementById('explain-back').onclick = backFn;
    draw();
  }

  // ---------- ÖVNING ----------
  function renderPractice(){
    const task = genTask();
    let boxHTML, infoHTML;

    if(task.kind === 'enkel' || task.kind === 'decimal'){
      const ansStr = task.kind === 'enkel' ? String(task.answer)
        : (function(){
            const s = task.answerIntStr;
            return s.slice(0, s.length-task.dec) + ',' + s.slice(s.length-task.dec);
          })();
      const ansCells = strToInputCells(ansStr);
      const mCells = strToFixedCells(task.mDisplay);
      const W = ansCells.length;
      let rows = '';
      rows += rowHTML({t:'op',v:''}, mCells, W);
      rows += rowHTML({t:'op',v:'·'}, [{t:'fixed',v:String(task.d)}], W);
      rows += '<div class="mult-upp-line"></div>';
      rows += rowHTML({t:'op',v:''}, ansCells, W);
      boxHTML = '<div class="mult-upp-box"><div class="mult-upp-flex">'
        + '<div class="mult-upp-rows-wrap"><div class="mult-upp-rows">' + rows + '</div></div>'
        + minnesPanel()
      + "</div></div>";
      infoHTML = task.kind === 'decimal'
        ? 'Räkna som vanligt med siffrorna. <strong>Decimalkommat förs rakt ner</strong> i svaret – det står redan på plats.'
        : 'Multiplicera kolumn för kolumn från höger. Använd minnesrutorna till höger som stöd.';
    } else {
      // tvåsiffrig multiplikator: två delprodukter + summa
      const sumStr = String(task.answer);
      const W = sumStr.length;
      const p1Cells = strToInputCells(String(task.p1));
      // delprodukt 2 skiftas ett steg vänster: en tom cell längst till höger
      const p2Cells = strToInputCells(String(task.p2)).concat([{t:'empty'}]);
      const sumCells = strToInputCells(sumStr);
      const mCells = strToFixedCells(task.mDisplay);
      const dCells = strToFixedCells(String(task.d));
      let rows = '';
      rows += rowHTML({t:'op',v:''}, mCells, W);
      rows += rowHTML({t:'op',v:'·'}, dCells, W);
      rows += '<div class="mult-upp-line"></div>';
      rows += rowHTML({t:'op',v:''}, p1Cells, W);
      rows += rowHTML({t:'op',v:'+'}, p2Cells, W);
      rows += '<div class="mult-upp-line"></div>';
      rows += rowHTML({t:'op',v:''}, sumCells, W);
      boxHTML = '<div class="mult-upp-box"><div class="mult-upp-flex">'
        + '<div class="mult-upp-rows-wrap"><div class="mult-upp-rows">' + rows + '</div></div>'
        + minnesPanel()
      + "</div></div>";
      infoHTML = 'Räkna <strong>' + task.mDisplay + ' · ' + task.ones + '</strong> på första raden och '
        + '<strong>' + task.mDisplay + ' · ' + task.tens + '</strong> på andra raden. '
        + 'Andra raden flyttas ett steg åt vänster (den multipliceras med tiotal). Addera ihop raderna.';
    }

    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Metod · uppställning — nivå ' + level, 'Nivå ' + level + ': ' + LEVELNAMN[level] + '.')
      + '<div class="metod-explain-card">'
        + '<p style="font-size:15px;margin:0 0 4px;color:var(--ink-soft);">Beräkna <strong style="font-family:var(--mono);color:var(--c-metod);">' + task.mDisplay + ' · ' + task.d + '</strong></p>'
        + '<p style="font-size:13px;margin:0 0 12px;color:var(--ink-soft);">' + infoHTML + '</p>'
        + '<div style="display:flex;justify-content:center;">' + boxHTML + '</div>'
        + '<div class="rakna-uppdela-feedback" id="upp-fb"></div>'
        + keypadHTML([])

  }

function d3DecStr(intVal, dec){
  const neg = intVal < 0;
  let s = String(Math.abs(intVal));
  if(dec === 0) return (neg ? '-' : '') + s;
  while(s.length <= dec) s = '0' + s;
  const whole = s.slice(0, s.length - dec);
  const frac = s.slice(s.length - dec).replace(/0+$/, '');
  return (neg ? '-' : '') + (frac === '' ? whole : whole + ',' + frac);
}
function d3ParseNum(str){
  const s = str.trim().replace(/\s/g,'').replace('−','-').replace(',', '.');
  if(s === '' || !/^-?[0-9]*\.?[0-9]+$/.test(s)) return null;
  return Number(s);
}

        else { aInt = d3RandInt(1,9); aDec = 2; bInt = d3RandInt(2,9); bDec = 1; }
        const prodInt = aInt * bInt, prodDec = aDec + bDec;
        return {display: d3DecStr(aInt,aDec) + ' · ' + d3DecStr(bInt,bDec),

// --- Motor: 10/100/1000 – fast stegring, auto-byte, ingen tid ---
function renderRaknaPow10(body, cfg, backFn){
  let omgang = [], idx = 0, results = [];

  function nzDigits(n){
    let v = 0;
    for(let i=0; i<n; i++) v = v*10 + d3RandInt(1,9);
    return v;
  }

  function genTask(typ){
    const mult = randPick([10,100,1000]);
    let dec, opInt;
    if(typ === 'heltal'){
      dec = 0;
      opInt = d3RandInt(12,999);
    } else if(typ === 'decimal'){
      dec = randPick([1,2]);
      if(dec === 1){
        opInt = nzDigits(randPick([1,2])) * 10 + d3RandInt(1,9);
      } else {
        opInt = nzDigits(2) * 100 + d3RandInt(1,9) * 10 + d3RandInt(1,9);
      }
    } else { // decimal-nolla: en nolla inne i talet
      dec = 2;
      if(Math.random() < 0.6){
        // mönster  X,0Z  (nolla på tiondelsplatsen)
        opInt = d3RandInt(11,99) * 100 + d3RandInt(1,9);
      } else {
        // mönster  X0,YZ  (heltalet slutar på noll)
        opInt = (d3RandInt(1,9) * 10) * 100 + d3RandInt(1,9) * 10 + d3RandInt(1,9);
      }
    }
    const prodInt = opInt * mult;
    return {display: mult + ' · ' + d3DecStr(opInt,dec),
            facit: d3DecStr(prodInt,dec),
            answerNum: prodInt / Math.pow(10,dec)};
  }

  function genOmgang(){
    // 2 heltal → 3 decimaltal → 3 decimaltal med nolla i
    return ['heltal','heltal','decimal','decimal','decimal','decimal-nolla','decimal-nolla','decimal-nolla']
      .map(genTask);
  }

  function renderSummary(){
    const right = results.filter(function(x){ return x; }).length;
    const total = results.length;
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader(cfg.header, 'Du klarade ' + right + ' av ' + total + '.')
      + renderSummaryCard({right:right, total:total, nextLabel:'Kör igen'})
      + '<div style="margin-top:-8px;text-align:center;"><button class="btn subtle" id="rakna-kat-back">Tillbaka till kategorier</button></div>'
    + '</div>';
    document.getElementById('summary-next-btn').onclick = function(){
      omgang = genOmgang(); idx = 0; results = []; renderFraga();
    };
    document.getElementById('rakna-kat-back').onclick = backFn;
  }

  function renderFraga(){
    if(idx >= omgang.length){ renderSummary(); return; }
    const t = omgang[idx];
    const right = results.filter(function(x){ return x; }).length;
    const pct = Math.round((idx / omgang.length) * 100);

    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader(cfg.header, cfg.sub)
      + '<div class="rakna-kat-exempel">' + cfg.exempel + '</div>'
      + '<div class="rakna-tal">' + t.display + ' =</div>'
      + '<div class="rakna-svar-rad"><input type="text" class="rakna-svar-input" id="pow-input" inputmode="text" maxlength="14" autocomplete="off" placeholder="?"></div>'
      + '<div class="tabell-feedback" id="pow-fb"></div>'
      + keypadHTML([','])
      + '<div class="tabell-progress">Tal ' + (idx+1) + ' av ' + omgang.length + ' · ' + right + ' rätt'
        + '<div class="tabell-progress-bar"><div class="tabell-progress-fill" style="width:' + pct + '%"></div></div>'
      + '</div>'
      + '<div style="margin-top:14px;text-align:center;">'
        + '<button class="btn primary" id="pow-svara">Svara</button>'
        + '<button class="btn subtle" id="pow-back">Tillbaka till kategorier</button>'
      + '</div>'
    + '</div>';

    const card = body.querySelector('.exercise-card');
    bindKeypad(card);
    const input = document.getElementById('pow-input');
    setTimeout(function(){ input.focus(); }, 50);
    let done = false;

    function matches(){
      const v = d3ParseNum(input.value);
      return v !== null && Math.abs(v - t.answerNum) < 1e-6 * Math.max(1, Math.abs(t.answerNum));
    }
    function advance(correct){
      if(done) return;
      done = true;
      results.push(correct);
      const ts = getTutorScore('mult-rakna','rakna');
      const tsG = getTutorScore('mult-rakna', cfg.scoreKey);
      ts.total++; tsG.total++;
      if(correct){ ts.correct++; tsG.correct++; }
      const fb = document.getElementById('pow-fb');
      input.disabled = true;
      document.getElementById('pow-svara').disabled = true;
      if(correct){
        input.classList.add('correct');
        fb.className = 'tabell-feedback correct';
        fb.textContent = 'Rätt!';
        setTimeout(function(){ idx++; renderFraga(); }, 400);
      } else {
        input.classList.add('wrong');
        fb.className = 'tabell-feedback wrong';
        fb.textContent = t.display + ' = ' + t.facit;
        setTimeout(function(){ idx++; renderFraga(); }, 1200);
      }
    }

    // Rätt svar → byt direkt
    input.addEventListener('input', function(){ if(matches()) advance(true); });
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        e.preventDefault();
        if(input.value.trim() !== '') advance(matches());
      }
    });
    document.getElementById('pow-svara').onclick = function(){
      if(input.value.trim() !== '') advance(matches());
    };
    document.getElementById('pow-back').onclick = backFn;
  }

  omgang = genOmgang();
  renderFraga();
}

    const input = document.getElementById('rakna-input');
    setTimeout(function(){ input.focus(); }, 50);
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); check(); }
    });
    document.getElementById('rakna-check').onclick = check;
    document.getElementById('rakna-back').onclick = backFn;

    function check(){
      const raw = input.value.trim();
      const fb = document.getElementById('rakna-fb');
      fb.className = 'rakna-uppdela-feedback show';
      const ts = getTutorScore('mult-rakna','rakna');
      const tsG = getTutorScore('mult-rakna', cfg.scoreKey);
      const segs = raw.split('=').map(function(s){ return s.trim(); })
                      .filter(function(s){ return s !== ''; });
      let res;
      if(!raw){
        res = {ok:false, msg:'Skriv din uträkning på raden.'};
      } else if(segs.length < 2){
        res = {ok:false, msg:'Visa mellanledet – skriv mellanled och svar, åtskilda med =.'};
      } else {
        res = {ok:true};
        for(let i=0; i<segs.length; i++){
          const v = d3EvalExpr(segs[i]);
          if(v === null){
            res = {ok:false, msg:'Kunde inte tolka "' + segs[i] + '". Använd siffror och räknetecken.'};
            break;
          }
          if(Math.abs(v - task.answerNum) > 1e-6 * Math.max(1, Math.abs(task.answerNum))){
            res = {ok:false, msg:'Det stämmer inte. "' + segs[i] + '" blir ' + d3FmtNum(v)
              + ', men svaret ska bli ' + d3FmtNum(task.answerNum) + '.'};
            break;
          }
        }
      }
      input.disabled = true;
      document.getElementById('rakna-check').disabled = true;
      ts.total++; tsG.total++;
      if(res.ok){
        input.classList.add('correct');
        fb.classList.add('correct');
        fb.textContent = 'Rätt! ' + task.leftText + ' ' + raw + '  ✓';
        ts.correct++; tsG.correct++;
      } else {
        input.classList.add('wrong');
        fb.classList.add('wrong');
        fb.textContent = res.msg;
      }
      results.push(res.ok);
      setTimeout(function(){ idx++; render(); }, res.ok ? 1900 : 2800);
    }
  }
  omgang = genOmgang();
  render();
}

function renderMultProblem(body){
  let level = 1;
  let currentSet = [];
  let answered = 0;
  let rightCount = 0;

  function pickSet(){
    const pool = MULT_LASTAL.filter(function(p){ return p.level === level; });
    return shuffle(pool.slice()).slice(0, 3);
  }

  function start(){
    currentSet = pickSet();
    answered = 0;
    rightCount = 0;
    render();
  }

  function render(){
    let tasks = '';
    for(let i=0; i<currentSet.length; i++){
      const p = currentSet[i];
      tasks += '<div class="prob-task" data-i="' + i + '">'
        + '<div class="prob-text">Lästal ' + (i+1) + ' av ' + currentSet.length + '</div>'
        + '<div style="font-size:15px;line-height:1.6;color:var(--ink);margin-bottom:12px;">' + p.text + '</div>'
        + '<div class="prob-svar-rad">'
          + '<span style="font-size:14px;color:var(--ink-soft);">Svar:</span>'
          + '<input type="text" class="prob-input" inputmode="text" maxlength="10" data-input="' + i + '" autocomplete="off" placeholder="?">'
          + '<span class="prob-enhet">' + p.enhet + '</span>'
          + '<button class="btn primary" data-check="' + i + '">Kontrollera</button>'
        + '</div>'
        + '<div class="prob-foto-rad">'
          + '<button type="button" class="prob-foto-btn" data-foto="' + i + '">📷 Fota din lösning <span style="opacity:.7;">(frivilligt)</span></button>'
          + '<input type="file" accept="image/*" capture="environment" data-fotoinput="' + i + '" style="display:none;">'
          + '<div class="prob-foto-preview" id="prob-foto-' + i + '"></div>'
        + '</div>'
        + '<div class="prob-feedback" id="prob-fb-' + i + '"></div>'
      + '</div>';
    }
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Problemlösning med lästal', 'Nivå ' + level + ' av 3. Lös de tre lästalen. Du kan fota din uträkning och visa hur du tänkt.')
      + tasks
      + '<div id="prob-summary-anchor"></div>'
    + '</div>';

    body.querySelectorAll('[data-check]').forEach(function(b){
      b.addEventListener('click', function(){ check(parseInt(b.dataset.check)); });
    });
    // Foto-knappar
    body.querySelectorAll('[data-foto]').forEach(function(b){
      const i = b.dataset.foto;
      const fileInput = body.querySelector('[data-fotoinput="' + i + '"]');
      b.addEventListener('click', function(){ fileInput.click(); });
      fileInput.addEventListener('change', function(e){
        const f = e.target.files && e.target.files[0];
        if(!f) return;
        const reader = new FileReader();
        reader.onload = function(ev){
          const prev = document.getElementById('prob-foto-' + i);
          prev.innerHTML = '<div class="prob-foto-cap">Din fotograferade lösning</div>'
            + '<img src="' + ev.target.result + '" alt="Fotograferad lösning">'
            + '<div><button type="button" class="prob-foto-remove" data-rmfoto="' + i + '">Ta bort bild</button></div>';
          prev.querySelector('[data-rmfoto]').addEventListener('click', function(){
            prev.innerHTML = '';
            fileInput.value = '';
          });
        };
        reader.readAsDataURL(f);
      });
    });
  }

  function check(i){
    const p = currentSet[i];
    const inp = body.querySelector('[data-input="' + i + '"]');
    const fb = document.getElementById('prob-fb-' + i);
    if(inp.disabled) return;

    fb.classList.remove('correct','wrong');
    fb.classList.add('show');
    inp.classList.remove('correct','wrong');
    const ts = getTutorScore('mult-problem','problem');
    ts.total++;

    const stu = d3ParseNum(inp.value);
    let wasRight = false;
    if(stu === null){
      fb.classList.add('wrong');
      fb.textContent = 'Skriv ett tal som svar.';
      return; // låt eleven försöka igen
    }
    if(Math.abs(stu - p.answer) < 1e-6 * Math.max(1, Math.abs(p.answer))){
      inp.classList.add('correct');
      fb.classList.add('correct');
      fb.textContent = 'Rätt! ' + p.exp;
      ts.correct++;
      wasRight = true;
    } else {
      inp.classList.add('wrong');
      fb.classList.add('wrong');
      fb.textContent = 'Inte rätt. Rätt svar: ' + d3FmtNum(p.answer) + ' ' + p.enhet + '. ' + p.exp;
    }

    inp.disabled = true;
    body.querySelector('[data-check="' + i + '"]').disabled = true;
    if(wasRight) rightCount++;
    answered++;
    if(answered >= currentSet.length){
      setTimeout(showSummary, 700);
    }
  }

  function showSummary(){
    const anchor = document.getElementById('prob-summary-anchor');
    if(!anchor) return;
    let nivaKnappar = '<div class="prob-niva-val">';
    if(level < 3) nivaKnappar += '<button class="btn primary" id="prob-svarare">Öka svårighetsgrad →</button>';
    nivaKnappar += '<button class="btn" id="prob-samma">Samma nivå igen</button>';
    if(level > 1) nivaKnappar += '<button class="btn subtle" id="prob-lattare">← Lättare nivå</button>';
    nivaKnappar += '</div>';

    anchor.innerHTML = '<div style="margin-top:20px;">'
      + renderSummaryCard({right:rightCount, total:currentSet.length, nextLabel:'Nya lästal'})
      + nivaKnappar
    + '</div>';
    document.getElementById('summary-next-btn').onclick = start;
    const svarare = document.getElementById('prob-svarare');
    if(svarare) svarare.onclick = function(){ level = Math.min(3, level+1); start(); };
    const lattare = document.getElementById('prob-lattare');
    if(lattare) lattare.onclick = function(){ level = Math.max(1, level-1); start(); };
    document.getElementById('prob-samma').onclick = start;
    anchor.scrollIntoView({behavior:'smooth', block:'start'});
  }

  start();
}

    const aiBody = document.getElementById('matris-ai-body');

      const tutor = tutorVerdictFor(rad.ko, rad.key);

    const userPrompt = 'Här är en elevs självskattning för multiplikation, jämförd med tutorns bedömning (byggd på elevens övningsresultat).\n\n'
      + punkter + '\n\n'
      + 'Skriv en kort, uppmuntrande genomgång på svenska riktad direkt till eleven (åk 7). '
      + 'Lyft först kort det som stämmer bra. Fokusera sedan på raderna där elevens skattning och tutorns bedömning skiljer sig: '

      + 'Nämn också om något inte testats än. Håll det till 4–7 meningar, inga punktlistor.';

    try{
      const res = await aiFetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 500,
          system: 'Du är en vänlig matematiktutor för svenska högstadieelever (åk 7). '
            + 'Du hjälper eleven förstå sin egen självskattning i multiplikation. '
            + 'Var konkret, snäll och uppmuntrande utan överdrivet beröm. '
            + 'Gångertecken skrivs alltid som · (mittpunktsprick). Svara på svenska i löpande text.',
          messages: [{role:'user', content: userPrompt}]
        })
      });
      if(!res.ok) throw new Error('API ' + res.status);
      const data = await res.json();
      const reply = data.content.map(function(c){ return c.text || ''; }).join('').trim();
      aiBody.textContent = reply || 'Tutorn hade inget att tillägga just nu.';
    } catch(e){
      aiBody.classList.add('error');
      aiBody.textContent = 'Kunde inte hämta tutorns genomgång (' + e.message + '). '
        + 'Jämförelsen ovan visar ändå var din skattning och tutorns bedömning skiljer sig.';
    }
  }

  render();
  showView('skattning');
  updateTutorContext();
}

// --- Tiokompisar och hundrakompisar ---
function renderKompisar(body, backFn){
  let omgang = [];
  let idx = 0;
  let results = [];

  function genOmgang(){
    const tio = [];
    shuffle([1,2,3,4,5,6,7,8,9]).slice(0,4).forEach(function(x){
      tio.push({typ:'tio', x:x, svar:10 - x});
    });
    const hundra = [];
    const huKand = [];
    for(let n=11; n<=89; n++){ if(n % 10 !== 0) huKand.push(n); }
    shuffle(huKand).slice(0,4).forEach(function(x){
      hundra.push({typ:'hundra', x:x, svar:100 - x});
    });
    return tio.concat(hundra);
  }

  function renderSummary(){
    const right = results.filter(function(x){ return x; }).length;
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Tiokompisar och hundrakompisar', 'Du klarade ' + right + ' av ' + results.length + '.')
      + renderSummaryCard({right:right, total:results.length, nextLabel:'Kör igen'})
      + '<div style="margin-top:-8px;text-align:center;"><button class="btn subtle" id="kompis-back">Tillbaka</button></div>'
    + '</div>';
    document.getElementById('summary-next-btn').onclick = function(){
      omgang = genOmgang(); idx = 0; results = []; renderFraga();
    };
    document.getElementById('kompis-back').onclick = backFn;
  }

  function renderFraga(){
    if(idx >= omgang.length){ renderSummary(); return; }
    const t = omgang[idx];
    const right = results.filter(function(x){ return x; }).length;
    const fragetext = t.typ === 'tio'
      ? 'Vilket tal är tiokompis till ' + t.x + '?'
      : 'Vilket tal är hundrakompis till ' + t.x + '?';
    const hint = t.typ === 'tio'
      ? 'Tiokompisar är två tal som tillsammans blir 10.'
      : 'Hundrakompisar är två tal som tillsammans blir 100.';
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Tiokompisar och hundrakompisar', hint)
      + '<div class="rakna-tal">' + fragetext + '</div>'
      + '<div class="rakna-svar-rad"><input type="text" class="rakna-svar-input" id="kompis-input" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="?"></div>'
      + '<div class="tabell-feedback" id="kompis-fb"></div>'
      + keypadHTML([])
      + '<div class="tabell-progress">Tal ' + (idx+1) + ' av ' + omgang.length + ' · ' + right + ' rätt'
        + '<div class="tabell-progress-bar"><div class="tabell-progress-fill" style="width:' + Math.round((idx/omgang.length)*100) + '%"></div></div>'
      + '</div>'
      + '<div style="margin-top:14px;text-align:center;">'
        + '<button class="btn primary" id="kompis-svara">Svara</button>'
        + '<button class="btn subtle" id="kompis-back">Tillbaka</button>'
      + '</div>'
    + '</div>';
    const card = body.querySelector('.exercise-card');
    bindKeypad(card);
    const input = document.getElementById('kompis-input');
    setTimeout(function(){ input.focus(); }, 50);
    let done = false;

    function advance(correct){
      if(done) return;
      done = true;
      results.push(correct);
      const ts = getTutorScore('add-begrepp','rakna');
      const tsG = getTutorScore('add-begrepp','kompisar');
      ts.total++; tsG.total++;
      if(correct){ ts.correct++; tsG.correct++; }
      const fb = document.getElementById('kompis-fb');
      input.disabled = true;
      document.getElementById('kompis-svara').disabled = true;
      if(correct){
        input.classList.add('correct');
        fb.className = 'tabell-feedback correct';
        fb.textContent = 'Rätt!';
        setTimeout(function(){ idx++; renderFraga(); }, 400);
      } else {
        input.classList.add('wrong');
        fb.className = 'tabell-feedback wrong';
        fb.textContent = t.x + ' + ' + t.svar + ' = ' + (t.typ==='tio'?'10':'100');
        setTimeout(function(){ idx++; renderFraga(); }, 1300);
      }
    }
    function matches(){
      const v = parseInt(input.value, 10);
      return !isNaN(v) && v === t.svar;
    }
    input.addEventListener('input', function(){ if(matches()) advance(true); });
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); if(input.value.trim() !== '') advance(matches()); }
    });
    document.getElementById('kompis-svara').onclick = function(){
      if(input.value.trim() !== '') advance(matches());
    };
    document.getElementById('kompis-back').onclick = backFn;
  }

  omgang = genOmgang();
  renderFraga();
}

function renderDelaUpp(body, backFn){
  let omgang = [];
  let idx = 0;
  let results = [];

  function genOmgang(){
    return [
      {antal:2, mal:d3RandInt(9,16)},
      {antal:2, mal:d3RandInt(15,24)},
      {antal:2, mal:d3RandInt(22,30)},
      {antal:3, mal:d3RandInt(15,24)},
      {antal:3, mal:d3RandInt(24,33)},
      {antal:3, mal:d3RandInt(31,42)}
    ];
  }

  function renderSummary(){
    const right = results.filter(function(x){ return x; }).length;
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Dela upp i termer', 'Du klarade ' + right + ' av ' + results.length + '.')
      + renderSummaryCard({right:right, total:results.length, nextLabel:'Ny omgång'})
      + '<div style="margin-top:-8px;text-align:center;"><button class="btn subtle" id="delaupp-back">Tillbaka</button></div>'
    + '</div>';
    document.getElementById('summary-next-btn').onclick = function(){
      omgang = genOmgang(); idx = 0; results = []; render();
    };
    document.getElementById('delaupp-back').onclick = backFn;
  }

  function render(){
    if(idx >= omgang.length){ renderSummary(); return; }
    const t = omgang[idx];
    const right = results.filter(function(x){ return x; }).length;
    const ordAntal = t.antal === 2 ? 'två' : 'tre';
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Dela upp i termer', 'Skriv termerna med + emellan. Talen 1, 2 och 3 räknas inte som godkända termer.')
      + renderScoreBarSimple(results.filter(function(x){return x;}).length, results.filter(function(x){return !x;}).length, omgang.length, idx)
      + '<div class="mult-metod-uppg">'
        + '<div class="mult-metod-instr">Dela upp talet <strong>' + t.mal + '</strong> i ' + ordAntal + ' termer.</div>'
        + '<div class="mult-rad-wrap">'
          + '<span class="mult-rad-fast">' + t.mal + ' =</span>'
          + '<input type="text" class="mult-rad-input" id="delaupp-input" autocomplete="off" placeholder="t.ex. ' + (t.antal===2?'7 + 5':'5 + 9 + 11') + '">'
        + '</div>'
      + '</div>'
      + '<div class="rakna-uppdela-feedback" id="delaupp-fb"></div>'
      + keypadHTML(['+'])
      + '<div style="margin-top:16px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'
        + '<button class="btn primary" id="delaupp-check">Kontrollera</button>'
        + '<button class="btn subtle" id="delaupp-back">Tillbaka</button>'
      + '</div>'
    + '</div>';
    const card = body.querySelector('.exercise-card');
    bindKeypad(card);
    const input = document.getElementById('delaupp-input');
    input.addEventListener('input', function(){
      const f = d3SpaceExpr(input.value);
      if(f !== input.value) input.value = f;
    });
    setTimeout(function(){ input.focus(); }, 50);
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); check(); }
    });
    document.getElementById('delaupp-check').onclick = check;
    document.getElementById('delaupp-back').onclick = backFn;

    function check(){
      const raw = input.value.trim();
      const fb = document.getElementById('delaupp-fb');
      fb.className = 'rakna-uppdela-feedback show';
      const delar = raw.split('+').map(function(s){ return s.trim(); }).filter(function(s){ return s !== ''; });
      let res;
      if(!raw){
        res = {ok:false, msg:'Skriv dina termer på raden, t.ex. 7 + 5.'};
      } else if(delar.length !== t.antal){
        res = {ok:false, msg:'Du ska skriva exakt ' + ordAntal + ' termer med + emellan.'};
      } else {
        let summa = 0, fel = null;
        for(let i=0; i<delar.length; i++){
          const v = Number(delar[i]);
          if(!Number.isInteger(v) || v < 0){ fel = '"' + delar[i] + '" är inte ett helt tal.'; break; }
          if(v <= 3){ fel = 'Termen ' + v + ' är inte godkänd – talen 1, 2 och 3 får inte användas.'; break; }
          summa += v;
        }
        if(fel) res = {ok:false, msg:fel};
        else if(summa !== t.mal) res = {ok:false, msg:'Termerna blir tillsammans ' + summa + ', men de ska bli ' + t.mal + '.'};
        else res = {ok:true};
      }

      input.disabled = true;
      document.getElementById('delaupp-check').disabled = true;
      const ts = getTutorScore('add-begrepp','rakna');
      const tsG = getTutorScore('add-begrepp','delaupp');
      ts.total++; tsG.total++;
      if(res.ok){
        input.classList.add('correct');
        fb.classList.add('correct');
        fb.textContent = 'Rätt! ' + t.mal + ' = ' + raw + '  ✓';
        ts.correct++; tsG.correct++;
      } else {
        input.classList.add('wrong');
        fb.classList.add('wrong');
        fb.textContent = res.msg;
      }
      results.push(res.ok);
      setTimeout(function(){ idx++; render(); }, res.ok ? 1800 : 2800);
    }
  }

  omgang = genOmgang();
  render();
}

    if(lvl === 1){ a = d3RandInt(14,89); b = d3RandInt(14,89); }
    else if(lvl === 2){ a = d3RandInt(115,889); b = d3RandInt(15,89); }
    else { a = d3RandInt(135,889); b = d3RandInt(135,889); }
    return {a:a, b:b, answer:a + b};
  }
  function genOmgang(){
    const arr = [];
    for(let i=0; i<6; i++) arr.push(genTask(level));
    return arr;
  }

  function render(){
    if(idx >= omgang.length){
      const right = results.filter(function(x){ return x; }).length;
      const total = results.length;
      const adj = adjustLevel(level, right, total);
      level = adj.level;
      body.innerHTML = '<div class="exercise-card">'
        + exerciseHeader('Metod · uppställning', 'Du klarade ' + right + ' av ' + total + '.', level)
        + renderSummaryCard({right:right, total:total, level:level, levelChange:adj.change})
        + '<div style="margin-top:-8px;text-align:center;"><button class="btn subtle" id="uppadd-back">Tillbaka till metoder</button></div>'
      + '</div>';
      document.getElementById('summary-next-btn').onclick = function(){
        omgang = genOmgang(); idx = 0; results = []; render();
      };
      document.getElementById('uppadd-back').onclick = backFn;
      return;
    }
    const t = omgang[idx];
    const ansStr = String(t.answer);
    const cols = ansStr.length;
    const aStr = String(t.a), bStr = String(t.b);

    function digitRow(str, op){
      let cells = '';
      for(let c=0; c<cols; c++){
        const fromRight = cols - 1 - c;
        const d = fromRight < str.length ? str[str.length - 1 - fromRight] : '';
        cells += '<span class="uppadd-cell">' + d + '</span>';
      }
      return '<div class="uppadd-row"><span class="uppadd-op">' + (op || '') + '</span>' + cells + '</div>';
    }
    let ansCells = '';
    for(let c=0; c<cols; c++){
      ansCells += '<input type="text" class="uppadd-in" data-c="' + c + '" inputmode="numeric" maxlength="1" autocomplete="off">';
    }

    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Metod · uppställning', 'Addera siffra för siffra, från höger. Tänk på minnessiffrorna.', level)
      + renderScoreBarSimple(results.filter(function(x){return x;}).length, results.filter(function(x){return !x;}).length, omgang.length, idx)
      + '<div class="uppadd">'
        + digitRow(aStr, '')
        + digitRow(bStr, '+')
        + '<div class="uppadd-line"></div>'
        + '<div class="uppadd-row"><span class="uppadd-op"></span>' + ansCells + '</div>'
      + '</div>'
      + '<div class="rakna-uppdela-feedback" id="uppadd-fb"></div>'
      + '<div style="margin-top:16px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'
        + '<button class="btn primary" id="uppadd-check">Kontrollera</button>'
        + '<button class="btn subtle" id="uppadd-back">Tillbaka till metoder</button>'
      + '</div>'
    + '</div>';

    const inputs = Array.prototype.slice.call(body.querySelectorAll('.uppadd-in'));
    inputs.forEach(function(inp, i){
      inp.addEventListener('input', function(){
        inp.value = inp.value.replace(/[^0-9]/g,'');
        if(inp.value && i < inputs.length - 1) inputs[i+1].focus();
      });
      inp.addEventListener('keydown', function(e){
        if(e.key === 'Backspace' && !inp.value && i > 0) inputs[i-1].focus();
        if(e.key === 'Enter'){ e.preventDefault(); check(); }
      });
    });
    setTimeout(function(){ if(inputs[0]) inputs[0].focus(); }, 50);
    document.getElementById('uppadd-check').onclick = check;
    document.getElementById('uppadd-back').onclick = backFn;

    function check(){
      const fb = document.getElementById('uppadd-fb');
      fb.className = 'rakna-uppdela-feedback show';
      let svar = '';
      let tomma = false;
      inputs.forEach(function(inp){
        if(inp.value === '') tomma = true;
        svar += inp.value;
      });
      if(tomma){
        fb.classList.add('wrong');
        fb.textContent = 'Fyll i alla rutor i svaret.';
        return;
      }
      const num = parseInt(svar, 10);
      const ok = num === t.answer;
      const ts = getTutorScore('add-metoder','metod');
      const tsG = getTutorScore('add-metoder','uppstallning');
      ts.total++; tsG.total++;
      inputs.forEach(function(inp){ inp.disabled = true; });
      document.getElementById('uppadd-check').disabled = true;
      if(ok){
        inputs.forEach(function(inp){ inp.classList.add('correct'); });
        fb.classList.add('correct');
        fb.textContent = 'Rätt! ' + t.a + ' + ' + t.b + ' = ' + t.answer + '  ✓';
        ts.correct++; tsG.correct++;
      } else {
        inputs.forEach(function(inp){ inp.classList.add('wrong'); });
        fb.classList.add('wrong');
        fb.textContent = 'Inte rätt. ' + t.a + ' + ' + t.b + ' = ' + t.answer + '. Kontrollera kolumn för kolumn.';
      }
      results.push(ok);
      setTimeout(function(){ idx++; render(); }, ok ? 1800 : 2800);
    }
  }
  omgang = genOmgang();
  render();
}

      b.addEventListener('click', function(){ fileInput.click(); });
      fileInput.addEventListener('change', function(e){
        const f = e.target.files && e.target.files[0];
        if(!f) return;
        const reader = new FileReader();
        reader.onload = function(ev){
          const prev = document.getElementById('prob-foto-' + i);
          prev.innerHTML = '<div class="prob-foto-cap">Din fotograferade lösning</div>'
            + '<img src="' + ev.target.result + '" alt="Fotograferad lösning">'
            + '<div><button type="button" class="prob-foto-remove" data-rmfoto="' + i + '">Ta bort bild</button></div>';
          prev.querySelector('[data-rmfoto]').addEventListener('click', function(){
            prev.innerHTML = '';
            fileInput.value = '';
          });
        };
        reader.readAsDataURL(f);
      });
    });
  }

  function check(i){
    const p = currentSet[i];
    const inp = body.querySelector('[data-input="' + i + '"]');
    const fb = document.getElementById('prob-fb-' + i);
    if(inp.disabled) return;
    fb.classList.remove('correct','wrong');
    fb.classList.add('show');
    inp.classList.remove('correct','wrong');
    const ts = getTutorScore('add-problem','problem');

    const stu = d3ParseNum(inp.value);
    let wasRight = false;
    if(stu === null){
      fb.classList.add('wrong');
      fb.textContent = 'Skriv ett tal som svar.';
      return;
    }
    ts.total++;
    if(Math.abs(stu - p.answer) < 1e-6 * Math.max(1, Math.abs(p.answer))){
      inp.classList.add('correct');
      fb.classList.add('correct');
      fb.textContent = 'Rätt! ' + p.exp;
      ts.correct++;
      wasRight = true;
    } else {
      inp.classList.add('wrong');
      fb.classList.add('wrong');
      fb.textContent = 'Inte rätt. Rätt svar: ' + d3FmtNum(p.answer) + ' ' + p.enhet + '. ' + p.exp;
    }
    inp.disabled = true;
    body.querySelector('[data-check="' + i + '"]').disabled = true;
    if(wasRight) rightCount++;
    answered++;
    if(answered >= currentSet.length){
      setTimeout(showSummary, 700);
    }
  }

  function showSummary(){
    const anchor = document.getElementById('prob-summary-anchor');
    if(!anchor) return;
    let nivaKnappar = '<div class="prob-niva-val">';
    if(level < 3) nivaKnappar += '<button class="btn primary" id="prob-svarare">Öka svårighetsgrad →</button>';
    nivaKnappar += '<button class="btn" id="prob-samma">Samma nivå igen</button>';
    if(level > 1) nivaKnappar += '<button class="btn subtle" id="prob-lattare">← Lättare nivå</button>';
    nivaKnappar += '</div>';
    anchor.innerHTML = '<div style="margin-top:20px;">'
      + renderSummaryCard({right:rightCount, total:currentSet.length, nextLabel:'Nya lästal'})
      + nivaKnappar
    + '</div>';
    document.getElementById('summary-next-btn').onclick = start;
    const svarare = document.getElementById('prob-svarare');
    if(svarare) svarare.onclick = function(){ level = Math.min(3, level+1); start(); };
    const lattare = document.getElementById('prob-lattare');
    if(lattare) lattare.onclick = function(){ level = Math.max(1, level-1); start(); };
    document.getElementById('prob-samma').onclick = start;
    anchor.scrollIntoView({behavior:'smooth', block:'start'});
  }
  start();
}

// --- KO 1, rakna: dela upp differensen i termer ---
function renderSubBegreppRakna(body){
  let omgang = [], idx = 0, results = [];

  function genOmgang(){
    return [
      {antal:2, mal:d3RandInt(5,13), niva:1},
      {antal:2, mal:d3RandInt(11,19), niva:1},
      {antal:2, mal:d3RandInt(15,24), niva:2},
      {antal:3, mal:d3RandInt(9,18), niva:2},
      {antal:3, mal:d3RandInt(18,28), niva:2},
      {antal:3, mal:d3RandInt(28,45), niva:3}
    ];
  }

  function renderSummary(){
    const right = results.filter(function(x){ return x; }).length;
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Dela upp differensen i termer', 'Du klarade ' + right + ' av ' + results.length + '.')
      + renderSummaryCard({right:right, total:results.length, nextLabel:'Ny omgång'})
      + '<div style="margin-top:-8px;text-align:center;"><button class="btn subtle" id="sub-du-back">Tillbaka</button></div>'
    + '</div>';
    document.getElementById('summary-next-btn').onclick = function(){ omgang = genOmgang(); idx = 0; results = []; render(); };
    document.getElementById('sub-du-back').onclick = function(){ navTo('ko',{koId:'sub-begrepp', delId:'subtraktion'}); };
  }

  function render(){
    if(idx >= omgang.length){ renderSummary(); return; }
    const t = omgang[idx];
    const ordAntal = t.antal === 2 ? 'två' : 'tre';
    const exHint = t.antal === 2
      ? 'ex. 9 − 5 = ' + t.mal
      : 'ex. 30 − 10 − 13 = ' + t.mal;
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Dela upp differensen i termer', 'Skriv talen med − emellan. Talen 1, 2 och 3 är inte godkända.')
      + renderScoreBarSimple(results.filter(function(x){return x;}).length, results.filter(function(x){return !x;}).length, omgang.length, idx)
      + '<div class="mult-metod-uppg">'
        + '<div class="mult-metod-instr">Skriv ' + t.mal + ' som en differens med ' + ordAntal + ' termer. (' + exHint + ')</div>'
        + '<div class="rakna-svar-rad">'
          + '<span class="rakna-svar-fast">' + t.mal + ' =</span>'
          + '<input type="text" class="rakna-svar-input" id="sub-du-input" autocomplete="off" placeholder="' + (t.antal===2?'9 − 5':'30 − 10 − 13') + '">'
        + '</div>'
      + '</div>'
      + '<div class="rakna-uppdela-feedback" id="sub-du-fb"></div>'
      + keypadHTML(['-'])
      + '<div style="margin-top:16px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'
        + '<button class="btn primary" id="sub-du-check">Kontrollera</button>'
        + '<button class="btn subtle" id="sub-du-back">Tillbaka</button>'
      + '</div>'
    + '</div>';
    const card = body.querySelector('.exercise-card');
    bindKeypad(card);
    const input = document.getElementById('sub-du-input');
    input.addEventListener('input', function(){ const f=d3SpaceExpr(input.value); if(f!==input.value) input.value=f; });
    setTimeout(function(){ input.focus(); }, 50);
    input.addEventListener('keydown', function(e){ if(e.key==='Enter'){e.preventDefault(); check();} });
    document.getElementById('sub-du-check').onclick = check;
    document.getElementById('sub-du-back').onclick = function(){ navTo('ko',{koId:'sub-begrepp', delId:'subtraktion'}); };

    function check(){
      const raw = input.value.trim();
      const fb = document.getElementById('sub-du-fb');
      fb.className = 'rakna-uppdela-feedback show';
      const delar = raw.split('-').map(function(s){ return s.trim(); }).filter(function(s){ return s !== ''; });
      let res;
      if(!raw){
        res = {ok:false, msg:'Skriv din differens på raden.'};
      } else if(delar.length !== t.antal){
        res = {ok:false, msg:'Du ska skriva exakt ' + ordAntal + ' termer med − emellan.'};
      } else {
        let bad = null;
        for(let i=0; i<delar.length; i++){
          const v = Number(delar[i]);
          if(!Number.isInteger(v) || v < 0){ bad = '"' + delar[i] + '" är inte ett positivt heltal.'; break; }
          if(v <= 3){ bad = 'Termen ' + v + ' är inte godkänd – talen 1, 2 och 3 får inte användas.'; break; }
        }
        if(bad) res = {ok:false, msg:bad};
        else {
          let diff = Number(delar[0]);
          for(let i=1; i<delar.length; i++) diff -= Number(delar[i]);
          if(diff !== t.mal) res = {ok:false, msg:'Differensen av dina termer blir ' + diff + ', men den ska bli ' + t.mal + '.'};
          else res = {ok:true};
        }
      }
      input.disabled = true;
      document.getElementById('sub-du-check').disabled = true;
      const ts = getTutorScore('sub-begrepp','rakna');
      const tsG = getTutorScore('sub-begrepp','delaupp');
      ts.total++; tsG.total++;
      if(res.ok){
        input.classList.add('correct'); fb.classList.add('correct');
        fb.textContent = 'Rätt! ' + t.mal + ' = ' + raw + '  ✓';
        ts.correct++; tsG.correct++;
      } else {
        input.classList.add('wrong'); fb.classList.add('wrong');
        fb.textContent = res.msg;
      }
      results.push(res.ok);
      setTimeout(function(){ idx++; render(); }, res.ok ? 1800 : 2800);
    }
  }
  omgang = genOmgang(); render();
}

      if(level === 1){
        b = d3RandInt(4,9);
        a = (Math.floor(d3RandInt(11,19)/10)*10) + d3RandInt(1, 10-b-1+b);
        // ensure a's units < b so crossing
        const u = a%10; if(u >= b) a = a - u + d3RandInt(1, b-1 < 1 ? 1 : b-1);
        a = Math.max(a, b+1);
      } else if(level === 2){
        a = d3RandInt(21,49); b = d3RandInt(5,9); const ua=a%10; if(ua>=b) a=a-ua+d3RandInt(1,Math.max(1,b-1));
        a = Math.max(a, b+1);
      } else {
        a = d3RandInt(22,99); b = d3RandInt(13,49);
        if(b >= a) b = a - d3RandInt(5,15);
        if(b < 4) b = 4;
      }
      const ans = a - b;
      return {display: a + ' − ' + b, answerNum: ans, answerStr: String(ans)};
    }
  };
  const DECIMAL = {
    header:'Huvudräkning · decimaltal', formagaKey:'rakna', koId:'sub-rakna', scoreKey:'decimal',
    sub:'Subtrahera decimaltal i huvudet.',
    backLabel:'Tillbaka till kategorier', ops:[','],
    exempel:'<strong>Tänk så här:</strong> Håll koll på tiondelar och hundradelar.<br>'
      + '<span class="ex-rad">10,1 − 0,2 = 9,9</span><br>'
      + '<span class="ex-rad">2,4 − 1,7 = 0,7</span><br>'
      + '<span class="ex-rad">12,5 − 3,9 = 8,6</span>',
    gen:function(level){
      let aH, bH;
      if(level === 1){
        // nära tiotal
        const base = d3RandInt(1,9) * 100;
        aH = base + d3RandInt(1,15);
        bH = d3RandInt(2,Math.min(aH-1, 20));
      } else if(level === 2){
        aH = d3RandInt(15,300); bH = d3RandInt(5, aH-1);
      } else {
        aH = d3RandInt(105,1200); bH = d3RandInt(15, aH-1);
      }
      if(bH >= aH) bH = aH - d3RandInt(5,15);
      if(bH < 1) bH = 1;
      return {display: d3DecStr(aH,2) + ' − ' + d3DecStr(bH,2),
              answerNum: (aH-bH)/100,
              answerStr: d3DecStr(aH-bH,2)};
    }
  };
  const FRACBANK = [
    {f:'1/2',d:50},{f:'1/4',d:25},{f:'3/4',d:75},{f:'1/5',d:20},
    {f:'2/5',d:40},{f:'3/5',d:60},{f:'4/5',d:80},{f:'1/10',d:10},{f:'3/10',d:30},{f:'7/10',d:70}
  ];
  const BRAK = {
    header:'Huvudräkning · bråk och blandad form', formagaKey:'rakna', koId:'sub-rakna', scoreKey:'brak',
    sub:'Skriv om bråket till decimalform och subtrahera. Visa mellanledet.',
    instr:'Skriv om och räkna, t.ex. 0,7 − 0,25 = 0,45.',
    placeholder:'t.ex. 0,7 − 0,25 = 0,45', ops:['-',',','='], backLabel:'Tillbaka till kategorier',
    exempel:'<strong>Så funkar det:</strong> Skriv bråket som decimaltal, subtrahera sedan.<br>'
      + '<span class="ex-rad">0,7 − 1/4 = 0,7 − 0,25 = 0,45</span><br>'
      + '<span class="ex-rad">3/5 − 0,25 = 0,6 − 0,25 = 0,35</span>',
    gen:function(level){
      const fr = randPick(FRACBANK);
      let leftText, ansH;
      if(level === 1){
        const decH = d3RandInt(5,12) * 10;
        if(decH <= fr.d){ // ensure positive
          const decH2 = fr.d + d3RandInt(1,5)*10;
          ansH = decH2 - fr.d;
          leftText = d3DecStr(decH2,2) + ' − ' + fr.f + ' =';
        } else {
          ansH = decH - fr.d;
          leftText = d3DecStr(decH,2) + ' − ' + fr.f + ' =';
        }
      } else if(level === 2){
        const w = d3RandInt(1,4);
        const fr2 = randPick(FRACBANK);
        const bigH = w*100 + fr.d;
        if(fr2.d >= bigH){ ansH = fr2.d - bigH; leftText = fr2.f + ' − ' + w + ' ' + fr.f + ' ='; }
        else { ansH = bigH - fr2.d; leftText = w + ' ' + fr.f + ' − ' + d3DecStr(fr2.d,2) + ' ='; }
        if(ansH < 0){ ansH = -ansH; } // failsafe
      } else {
        const fr2 = randPick(FRACBANK);
        const bigger = Math.max(fr.d, fr2.d);
        const smaller = Math.min(fr.d, fr2.d);
        ansH = bigger - smaller;
        if(fr.d > fr2.d) leftText = fr.f + ' − ' + fr2.f + ' =';
        else leftText = fr2.f + ' − ' + fr.f + ' =';
      }
      if(ansH < 0) ansH = 0;
      return {leftText: leftText, answerNum: ansH/100};
    }
  };

  function renderPicker(){
    const kort = [
      {id:'enkel',   nr:1, namn:'Enkla tal (över tiotalsgränsen)', desc:'17 − 8 = 9,  34 − 18 = 16'},
      {id:'decimal', nr:2, namn:'Decimaltal',                      desc:'10,1 − 0,2 = 9,9'},
      {id:'brak',    nr:3, namn:'Bråk och blandad form',           desc:'0,7 − 1/4 = 0,7 − 0,25 = 0,45'}

    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Huvudräkning', 'Välj vad du vill träna på. Nivån anpassar sig medan du räknar.')

                + '<div class="tabell-card-desc">' + k.desc + '</div>'
              + '</div>'
              + '<div style="color:var(--ink-faint);font-size:20px;">›</div>'
            + '</button>';
          }).join('')
      + '</div>'
    + '</div>';
    body.querySelectorAll('[data-kat]').forEach(function(btn){
      btn.onclick = function(){
        const kat = btn.dataset.kat;
        if(kat === 'brak') renderSubEnrad(body, BRAK, renderPicker);
        else renderAddSingle(body, kat === 'enkel' ? ENKEL : DECIMAL, renderPicker);
      };
    });
  }
  renderPicker();
}

// Motor: enradsuppgift för subtraktion med mellanled (återanvänder mönstret från addition)
function renderSubEnrad(body, cfg, backFn){
  let level = 1, omgang = [], idx = 0, results = [];
  function genOmgang(){ const a=[]; for(let i=0;i<6;i++) a.push(cfg.gen(level)); return a; }
  function render(){
    if(idx >= omgang.length){
      const right=results.filter(function(x){return x;}).length, total=results.length;
      const adj=adjustLevel(level,right,total); level=adj.level;
      body.innerHTML='<div class="exercise-card">'+exerciseHeader(cfg.header,'Du klarade '+right+' av '+total+'.',level)
        +renderSummaryCard({right:right,total:total,level:level,levelChange:adj.change})
        +'<div style="margin-top:-8px;text-align:center;"><button class="btn subtle" id="sube-back">'+cfg.backLabel+'</button></div></div>';
      document.getElementById('summary-next-btn').onclick=function(){omgang=genOmgang();idx=0;results=[];render();};
      document.getElementById('sube-back').onclick=backFn; return;
    }
    const task=omgang[idx];
    body.innerHTML='<div class="exercise-card">'+exerciseHeader(cfg.header,cfg.sub,level)
      +'<div class="rakna-kat-exempel">'+cfg.exempel+'</div>'
      +renderScoreBarSimple(results.filter(function(x){return x;}).length,results.filter(function(x){return !x;}).length,omgang.length,idx)
      +'<div class="mult-metod-uppg"><div class="mult-metod-instr">'+cfg.instr+'</div>'
        +'<div class="rakna-svar-rad"><span class="rakna-svar-fast">'+task.leftText+'</span>'
          +'<input type="text" class="rakna-svar-input" id="sube-input" autocomplete="off" placeholder="'+cfg.placeholder+'"></div></div>'
      +'<div class="rakna-uppdela-feedback" id="sube-fb"></div>'
      +keypadHTML(cfg.ops)
      +'<div class="kp-hint">Skriv hela uträkningen på raden. Använd tangentbordet eller knapparna.</div>'
      +'<div style="margin-top:16px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'
        +'<button class="btn primary" id="sube-check">Kontrollera</button>'
        +'<button class="btn subtle" id="sube-back">'+cfg.backLabel+'</button></div></div>';
    const card=body.querySelector('.exercise-card'); bindKeypad(card);
    const input=document.getElementById('sube-input');
    input.addEventListener('input',function(){const f=d3SpaceExpr(input.value);if(f!==input.value)input.value=f;});
    setTimeout(function(){input.focus();},50);
    input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();check();}});
    document.getElementById('sube-check').onclick=check;
    document.getElementById('sube-back').onclick=backFn;
    function check(){
      const raw=input.value.trim(), fb=document.getElementById('sube-fb');
      fb.className='rakna-uppdela-feedback show';
      const ts=getTutorScore(cfg.koId,cfg.formagaKey), tsG=getTutorScore(cfg.koId,cfg.scoreKey);
      const segs=raw.split('=').map(function(s){return s.trim();}).filter(function(s){return s!=='';});
      let res;
      if(!raw){ res={ok:false,msg:'Skriv din uträkning på raden.'}; }
      else if(segs.length<2){ res={ok:false,msg:'Visa mellanledet – skriv mellanled och svar, åtskilda med =.'}; }
      else{
        res={ok:true};
        for(let i=0;i<segs.length;i++){
          const v=d3EvalExpr(segs[i]);
          if(v===null){res={ok:false,msg:'Kunde inte tolka "'+segs[i]+'". Använd siffror och räknetecken.'};break;}
          if(Math.abs(v-task.answerNum)>1e-6*Math.max(1,Math.abs(task.answerNum))){
            res={ok:false,msg:'Det stämmer inte. "'+segs[i]+'" blir '+d3FmtNum(v)+', men svaret ska bli '+d3FmtNum(task.answerNum)+'.'};break;}
        }
      }
      input.disabled=true; document.getElementById('sube-check').disabled=true;
      ts.total++; tsG.total++;
      if(res.ok){input.classList.add('correct');fb.classList.add('correct');fb.textContent='Rätt! '+task.leftText+' '+raw+'  ✓';ts.correct++;tsG.correct++;}
      else{input.classList.add('wrong');fb.classList.add('wrong');fb.textContent=res.msg;}
      results.push(res.ok);
      setTimeout(function(){idx++;render();},res.ok?1900:2800);
    }
  }
  omgang=genOmgang(); render();
}

function renderSubMetoder(body){
  // Negativa tal – ny metod med mellanled
  const NEGATIVA = {
    header:'Metod · subtraktion med negativa tal', formagaKey:'metod', koId:'sub-metoder', scoreKey:'negativa',
    sub:'Den andra termen är negativ. Skriv om och visa mellanledet.',
    instr:'Skriv om och visa mellanledet, t.ex. (−9) − (−8) = (−9) + 8 = −1.',
    placeholder:'t.ex. (−9) + 8 = −1', ops:['-','+','(',')',' '], backLabel:'Tillbaka till metoder',
    exempel:'<strong>Så funkar det:</strong> Att subtrahera ett negativt tal = att addera dess positiva värde.<br>'
      + '<span class="ex-rad">6 − (−3) = 6 + 3 = 9</span><br>'
      + '<span class="ex-rad">(−7) − 6 = −13</span><br>'
      + '<span class="ex-rad">(−9) − (−8) = (−9) + 8 = −1</span>',
    gen:function(level){
      const maxMag = level === 1 ? 12 : 29;
      const minMag = level === 1 ? 3 : 5;
      let a, b, ans;
      // Garantera ett av de intressanta mönstren
      const pat = d3RandInt(0,2);
      if(pat === 0){ // pos − neg  →  pos + pos
        a = d3RandInt(minMag, maxMag); b = -d3RandInt(minMag, maxMag);
      } else if(pat === 1){ // neg − pos  → mer neg
        a = -d3RandInt(minMag, maxMag); b = d3RandInt(minMag, maxMag);
      } else { // neg − neg
        a = -d3RandInt(minMag+1, maxMag); b = -d3RandInt(minMag, Math.abs(a)-1);
      }
      ans = a - b;
      function fmt(x){ return x < 0 ? '(−' + (-x) + ')' : '' + x; }
      function fmtAns(x){ return x < 0 ? '−' + (-x) : '' + x; }
      return {leftText: fmt(a) + ' − ' + fmt(b) + ' =',
              answerNum: ans, answerStr: fmtAns(ans)};
    }
  };

  function renderPicker(){
    const kort = [
      {id:'uppstallning', nr:1, namn:'Uppställning',          desc:'Subtrahera siffra för siffra, lån vid behov.'},
      {id:'okaminska',    nr:2, namn:'Öka och minska lika',   desc:'73 − 28 = 75 − 30 = 45'},
      {id:'bakifran',     nr:3, namn:'Addition bakifrån',      desc:'Räkna upp: hur långt är det från b till a?'},
      {id:'negativa',     nr:4, namn:'Negativa tal',           desc:'6 − (−3) = 6 + 3 = 9'}
    ];
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Metoder', 'Välj en metod att lära dig och träna på.')
      + '<div class="tabell-level-grid">'
        + kort.map(function(k){
            return '<button class="tabell-card" data-m="' + k.id + '">'
              + '<div class="tabell-card-num">' + k.nr + '</div>'
              + '<div class="tabell-card-body">'
                + '<div class="tabell-card-namn">' + k.namn + '</div>'
                + '<div class="tabell-card-desc">' + k.desc + '</div>'
              + '</div>'
              + '<div style="color:var(--ink-faint);font-size:20px;">›</div>'
            + '</button>';
          }).join('')
      + '</div>'
    + '</div>';
    body.querySelectorAll('[data-m]').forEach(function(btn){
      btn.onclick = function(){
        const m = btn.dataset.m;
        const metodObj = {id: m === 'uppstallning' ? 'uppstallning-sub' : m === 'okaminska' ? 'oka-minska' : 'addition-bakifran',
                          namn:'', beskrivning:'Välj metod och öva.'};
        if(m === 'uppstallning') renderUppstallningSubEnkel(body, metodObj, renderPicker);
        else if(m === 'okaminska') renderOkaMinska(body, metodObj, renderPicker);
        else if(m === 'bakifran') renderAdditionBakifran(body, metodObj, renderPicker);
        else renderSubEnrad(body, NEGATIVA, renderPicker);
      };
    });
  }

  // Wrappa befintliga metoder med ny poängsättning
  const _origUppEnkel = renderUppstallningSubEnkel;
  const _origOka = renderOkaMinska;
  const _origBak = renderAdditionBakifran;

  renderPicker();
}

function renderSubProblem(body){
  let level = 1, currentSet = [], answered = 0, rightCount = 0;

  function pickSet(){
    const pool = SUB_LASTAL.filter(function(p){ return p.level === level; });
    return shuffle(pool.slice()).slice(0, 3);
  }
  function start(){ currentSet = pickSet(); answered = 0; rightCount = 0; render(); }

  function render(){
    let tasks = '';
    for(let i=0; i<currentSet.length; i++){
      const p = currentSet[i];
      tasks += '<div class="prob-task" data-i="' + i + '">'
        + '<div class="prob-text">Lästal ' + (i+1) + ' av ' + currentSet.length + '</div>'
        + '<div style="font-size:15px;line-height:1.6;color:var(--ink);margin-bottom:12px;">' + p.text + '</div>'

          + '<input type="text" class="prob-input" inputmode="text" maxlength="12" data-input="' + i + '" autocomplete="off" placeholder="?">'

        + '</div>'
        + '<div class="prob-foto-rad">'
          + '<button type="button" class="prob-foto-btn" data-foto="' + i + '">📷 Fota din lösning <span style="opacity:.7;">(frivilligt)</span></button>'
          + '<input type="file" accept="image/*" capture="environment" data-fotoinput="' + i + '" style="display:none;">'
          + '<div class="prob-foto-preview" id="prob-foto-' + i + '"></div>'
        + '</div>'
        + '<div class="prob-feedback" id="prob-fb-' + i + '"></div>'
      + '</div>';
    }
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Problemlösning med lästal', 'Nivå ' + level + ' av 3. Lös de tre lästalen. Du kan fota din uträkning och visa hur du tänkt.')
      + tasks + '<div id="prob-summary-anchor"></div></div>';

    body.querySelectorAll('[data-check]').forEach(function(b){
      b.addEventListener('click', function(){ check(parseInt(b.dataset.check)); });
    });
    body.querySelectorAll('[data-foto]').forEach(function(b){
      const i = b.dataset.foto;
      const fi = body.querySelector('[data-fotoinput="' + i + '"]');
      b.addEventListener('click', function(){ fi.click(); });
      fi.addEventListener('change', function(e){
        const f = e.target.files && e.target.files[0]; if(!f) return;
        const reader = new FileReader();
        reader.onload = function(ev){
          const prev = document.getElementById('prob-foto-' + i);
          prev.innerHTML = '<div class="prob-foto-cap">Din fotograferade lösning</div>'
            + '<img src="' + ev.target.result + '" alt="Fotograferad lösning">'
            + '<div><button type="button" class="prob-foto-remove" data-rmfoto="' + i + '">Ta bort bild</button></div>';
          prev.querySelector('[data-rmfoto]').addEventListener('click', function(){ prev.innerHTML=''; fi.value=''; });
        };
        reader.readAsDataURL(f);
      });
    });
  }

  function check(i){
    const p = currentSet[i];
    const inp = body.querySelector('[data-input="' + i + '"]');
    const fb = document.getElementById('prob-fb-' + i);
    if(inp.disabled) return;
    fb.classList.remove('correct','wrong'); fb.classList.add('show');
    inp.classList.remove('correct','wrong');
    const ts = getTutorScore('sub-problem','problem');
    const stu = d3ParseNum(inp.value);
    if(stu === null){ fb.classList.add('wrong'); fb.textContent = 'Skriv ett tal som svar.'; return; }
    ts.total++;
    let wasRight = false;
    if(Math.abs(stu-p.answer) < 1e-6*Math.max(1,Math.abs(p.answer))){
      inp.classList.add('correct'); fb.classList.add('correct');
      fb.textContent = 'Rätt! ' + p.exp; ts.correct++; wasRight = true;
    } else {
      inp.classList.add('wrong'); fb.classList.add('wrong');
      fb.textContent = 'Inte rätt. Rätt svar: ' + d3FmtNum(p.answer) + ' ' + p.enhet + '. ' + p.exp;
    }
    inp.disabled = true;
    body.querySelector('[data-check="' + i + '"]').disabled = true;
    if(wasRight) rightCount++;
    answered++;
    if(answered >= currentSet.length) setTimeout(showSummary, 700);
  }

  function showSummary(){
    const anchor = document.getElementById('prob-summary-anchor');
    if(!anchor) return;
    let knappar = '<div class="prob-niva-val">';
    if(level < 3) knappar += '<button class="btn primary" id="prob-svarare">Öka svårighetsgrad →</button>';
    knappar += '<button class="btn" id="prob-samma">Samma nivå igen</button>';
    if(level > 1) knappar += '<button class="btn subtle" id="prob-lattare">← Lättare nivå</button>';
    knappar += '</div>';
    anchor.innerHTML = '<div style="margin-top:20px;">' + renderSummaryCard({right:rightCount, total:currentSet.length, nextLabel:'Nya lästal'}) + knappar + '</div>';
    document.getElementById('summary-next-btn').onclick = start;
    const sv = document.getElementById('prob-svarare'); if(sv) sv.onclick = function(){ level=Math.min(3,level+1); start(); };
    const la = document.getElementById('prob-lattare'); if(la) la.onclick = function(){ level=Math.max(1,level-1); start(); };
    document.getElementById('prob-samma').onclick = start;
    anchor.scrollIntoView({behavior:'smooth', block:'start'});
  }
  start();
}

function divDigSum(n){
  n = Math.abs(n); var s = 0;
  while(n > 0){ s += n % 10; n = Math.floor(n / 10); }
  return s;
}
