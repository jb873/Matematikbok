function renderDivDelbarhet(body, katId, backFn){
  var level = 1, omgang = [], idx = 0, results = [], OMG = 6;
  var REGLER_KAT = katId === 'del49' ? ['4','9'] : ['2','3','5','10'];
  var HEADER = katId === 'del49' ? 'Delbarhet med 4 och 9' : 'Delbarhet med 2, 3, 5 och 10';
  function genTal(lo, hi, predikat, antalSann){
    var sanna = [], falska = [], guard = 0;
    while((sanna.length < antalSann || falska.length < (6 - antalSann)) && guard < 4000){
      guard++;
      var n = d3RandInt(lo, hi);
      if(predikat(n)){
        if(sanna.length < antalSann && sanna.indexOf(n) === -1) sanna.push(n);
      } else {
        if(falska.length < (6 - antalSann) && falska.indexOf(n) === -1) falska.push(n);
      }
    }
    return shuffle(sanna.concat(falska));
  }
  function genTask(){
    var lo, hi;
    if(level === 1){ lo = 10; hi = 99; } else { lo = 100; hi = 999; }
    var typ;
    if(level === 1) typ = 'enkel';
    else if(level === 2) typ = randPick(['enkel','enkel','kombo']);
    else typ = randPick(['kombo','inte','enkel']);
    var r1 = randPick(REGLER_KAT), predikat, prompt, facittext;
    if(typ === 'kombo' && REGLER_KAT.length > 1){
      var r2 = r1;
      while(r2 === r1) r2 = randPick(REGLER_KAT);
      predikat = function(n){ return DIV_REGLER[r1].test(n) && DIV_REGLER[r2].test(n); };
      prompt = 'Vilka tal är delbara med både ' + DIV_REGLER[r1].namn + ' och ' + DIV_REGLER[r2].namn + '?';
      facittext = 'delbara med både ' + DIV_REGLER[r1].namn + ' och ' + DIV_REGLER[r2].namn;
    } else if(typ === 'inte'){
      predikat = function(n){ return !DIV_REGLER[r1].test(n); };
      prompt = 'Vilka tal är INTE delbara med ' + DIV_REGLER[r1].namn + '?';
      facittext = 'inte delbara med ' + DIV_REGLER[r1].namn;
    } else {
      predikat = function(n){ return DIV_REGLER[r1].test(n); };
      prompt = 'Vilka av talen är delbara med ' + DIV_REGLER[r1].namn + '?';
      facittext = 'delbara med ' + DIV_REGLER[r1].namn;
    }
    var antalSann = d3RandInt(2, 4);
    var tal = genTal(lo, hi, predikat, antalSann);
    return {tal:tal, predikat:predikat, prompt:prompt, facittext:facittext, ratta:tal.filter(predikat)};
  }
  function genOmgang(){ var a = []; for(var i=0; i<OMG; i++) a.push(genTask()); return a; }
  function render(){
    if(idx >= omgang.length){
      var right = results.filter(function(x){ return x; }).length;
      var total = results.length;
      var adj = adjustLevel(level, right, total);
      level = adj.level;
      body.innerHTML = '<div class="exercise-card">'
        + exerciseHeader(HEADER, 'Du klarade ' + right + ' av ' + total + '.', level)
        + renderSummaryCard({right:right, total:total, level:level, levelChange:adj.change})
        + '<div style="margin-top:-8px;text-align:center;"><button class="btn subtle" id="del-back">Tillbaka till delbarhet</button></div>'
      + '</div>';
      document.getElementById('summary-next-btn').onclick = function(){
        omgang = genOmgang(); idx = 0; results = []; render();
      };
      document.getElementById('del-back').onclick = backFn;
      return;
    }
    var task = omgang[idx];
    var picked = {};
    var taggar = task.tal.map(function(n, i){
      return '<button type="button" class="div-tal-tagg" data-i="' + i + '" data-n="' + n + '">' + n + '</button>';
    }).join('');
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader(HEADER, 'Markera alla tal som passar. Klicka igen för att avmarkera.', level)
      + renderScoreBarSimple(results.filter(function(x){return x;}).length, results.filter(function(x){return !x;}).length, omgang.length, idx)
      + '<div class="div-delbar-prompt">' + task.prompt + '</div>'
      + '<div class="div-tal-grid">' + taggar + '</div>'
      + '<div class="rakna-uppdela-feedback" id="del-fb"></div>'
      + '<div style="margin-top:16px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'
        + '<button class="btn primary" id="del-check">Kontrollera</button>'
        + '<button class="btn subtle" id="del-back">Tillbaka till delbarhet</button>'
      + '</div>'
    + '</div>';
    body.querySelectorAll('.div-tal-tagg').forEach(function(btn){
      btn.addEventListener('click', function(){
        if(btn.disabled) return;
        var i = btn.dataset.i;
        if(picked[i]){ delete picked[i]; btn.classList.remove('is-picked'); }
        else { picked[i] = true; btn.classList.add('is-picked'); }
      });
    });
    document.getElementById('del-back').onclick = backFn;
    function check(){
      var fb = document.getElementById('del-fb');
      fb.className = 'rakna-uppdela-feedback show';
      var allRatt = true;
      body.querySelectorAll('.div-tal-tagg').forEach(function(btn){
        var i = btn.dataset.i;
        var n = parseInt(btn.dataset.n, 10);
        var borde = task.predikat(n);
        var valde = !!picked[i];
        btn.disabled = true;
        if(borde && valde){ btn.classList.add('tagg-correct'); }
        else if(borde && !valde){ btn.classList.add('tagg-missad'); allRatt = false; }
        else if(!borde && valde){ btn.classList.add('tagg-wrong'); allRatt = false; }
      });
      document.getElementById('del-check').disabled = true;
      var ts = getTutorScore('div-begrepp','rakna');
      var tsG = getTutorScore('div-begrepp', katId);
      ts.total++; tsG.total++;
      if(allRatt){
        fb.classList.add('correct');
        fb.textContent = 'Rätt! Du hittade alla tal som är ' + task.facittext + '.';
        ts.correct++; tsG.correct++;
        results.push(true);
      } else {
        fb.classList.add('wrong');
        var facit = task.ratta.length
          ? 'Rätt svar: ' + task.ratta.join(', ') + ' är ' + task.facittext + '.'
          : 'Inget av talen var ' + task.facittext + '.';
        fb.textContent = 'Inte riktigt. ' + facit + ' Grönt = rätt, gult = missat, rött = fel markering.';
        results.push(false);
      }
      setTimeout(function(){ idx++; render(); }, allRatt ? 2000 : 3200);
    }
    document.getElementById('del-check').onclick = check;
  }
  omgang = genOmgang();
  render();
}

function renderDivGata(body, backFn){
  var level = 1, omgang = [], idx = 0, results = [], OMG = 5;
  function genTask(){
    var guard = 0;
    while(guard < 600){
      guard++;
      var tiotal = d3RandInt(2, 8);
      var lo = tiotal * 10, hi = lo + 10;
      var target = d3RandInt(lo + 1, hi - 1);
      var tio = Math.floor(target / 10), ent = target % 10;
      var ledtradar = ['Talet är större än ' + lo + ' men mindre än ' + hi + '.'];
      var villkor = [function(n){ return n > lo && n < hi; }];
      ledtradar.push(target % 2 === 0 ? 'Talet är jämnt.' : 'Talet är udda.');
      villkor.push(target % 2 === 0
        ? function(n){ return n % 2 === 0; }
        : function(n){ return n % 2 !== 0; });
      var deltal = shuffle(['3','5']).filter(function(d){ return target % parseInt(d,10) === 0; });
      if(level >= 2 && target % 6 === 0 && Math.random() < 0.6){
        ledtradar.push('Talet är delbart med både 2 och 3.');
        villkor.push(function(n){ return n % 6 === 0; });
      } else if(deltal.length){
        var d = parseInt(deltal[0], 10);
        ledtradar.push('Talet är delbart med ' + d + '.');
        villkor.push((function(dd){ return function(n){ return n % dd === 0; }; })(d));
      } else if(ent !== tio){
        if(ent > tio){
          ledtradar.push('Entalssiffran är större än tiotalssiffran.');
          villkor.push(function(n){ return (n % 10) > Math.floor(n / 10) % 10; });
        } else {
          ledtradar.push('Entalssiffran är mindre än tiotalssiffran.');
          villkor.push(function(n){ return (n % 10) < Math.floor(n / 10) % 10; });
        }
      } else { continue; }
      var losningar = [];
      for(var n = lo + 1; n < hi; n++){
        var ok = true;
        for(var v = 0; v < villkor.length; v++){ if(!villkor[v](n)){ ok = false; break; } }
        if(ok) losningar.push(n);
      }
      if(losningar.length >= 1){
        return {target:target, ledtradar:ledtradar, villkor:villkor, losningar:losningar};
      }
    }
    return {target:48,
            ledtradar:['Talet är större än 40 men mindre än 50.','Entalssiffran är större än tiotalssiffran.','Talet är delbart med både 2 och 3.'],
            villkor:[function(n){return n>40&&n<50;},function(n){return (n%10)>Math.floor(n/10)%10;},function(n){return n%6===0;}],
            losningar:[48]};
  }
  function genOmgang(){ var a = []; for(var i=0; i<OMG; i++) a.push(genTask()); return a; }
  function render(){
    if(idx >= omgang.length){
      var right = results.filter(function(x){ return x; }).length;
      var total = results.length;
      var adj = adjustLevel(level, right, total);
      level = adj.level;
      body.innerHTML = '<div class="exercise-card">'
        + exerciseHeader('Talgåtor', 'Du klarade ' + right + ' av ' + total + '.', level)
        + renderSummaryCard({right:right, total:total, level:level, levelChange:adj.change})
        + '<div style="margin-top:-8px;text-align:center;"><button class="btn subtle" id="gata-back">Tillbaka till delbarhet</button></div>'
      + '</div>';
      document.getElementById('summary-next-btn').onclick = function(){
        omgang = genOmgang(); idx = 0; results = []; render();
      };
      document.getElementById('gata-back').onclick = backFn;
      return;
    }
    var task = omgang[idx];
    var ledHTML = task.ledtradar.map(function(t){ return '<li>' + t + '</li>'; }).join('');
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Talgåta · vilket är talet?', 'Läs ledtrådarna och skriv talet de beskriver.', level)
      + renderScoreBarSimple(results.filter(function(x){return x;}).length, results.filter(function(x){return !x;}).length, omgang.length, idx)
      + '<div class="div-gata-card">'
        + '<div class="div-gata-rubrik">Ledtrådar</div>'
        + '<ul class="div-gata-lista">' + ledHTML + '</ul>'
      + '</div>'
      + '<div class="rakna-svar-rad"><input type="text" class="rakna-svar-input" id="gata-input" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="?"></div>'
      + '<div class="rakna-uppdela-feedback" id="gata-fb"></div>'
      + keypadHTML([])
      + '<div style="margin-top:16px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'
        + '<button class="btn primary" id="gata-check">Kontrollera</button>'
        + '<button class="btn subtle" id="gata-back">Tillbaka till delbarhet</button>'
      + '</div>'
    + '</div>';
    var card = body.querySelector('.exercise-card');
    bindKeypad(card);
    var input = document.getElementById('gata-input');
    setTimeout(function(){ input.focus(); }, 50);
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); check(); }
    });
    document.getElementById('gata-back').onclick = backFn;
    function check(){
      var fb = document.getElementById('gata-fb');
      fb.className = 'rakna-uppdela-feedback show';
      var stu = parseInt(input.value.trim(), 10);
      input.disabled = true;
      document.getElementById('gata-check').disabled = true;
      var ts = getTutorScore('div-begrepp','rakna');
      var tsG = getTutorScore('div-begrepp','gata');
      ts.total++; tsG.total++;
      var ok = false;
      if(isNaN(stu)){
        fb.classList.add('wrong');
        fb.textContent = 'Skriv ett tal som svar.';
      } else {
        ok = true;
        for(var v = 0; v < task.villkor.length; v++){ if(!task.villkor[v](stu)){ ok = false; break; } }
        if(ok){
          input.classList.add('correct');
          fb.classList.add('correct');
          fb.textContent = 'Rätt! ' + stu + ' passar alla ledtrådar.';
          ts.correct++; tsG.correct++;
        } else {
          input.classList.add('wrong');
          fb.classList.add('wrong');
          fb.textContent = 'Inte rätt. Ett tal som passar är ' + task.losningar[0] + '.';
        }
      }
      results.push(ok);
      setTimeout(function(){ idx++; render(); }, ok ? 1900 : 3000);
    }
    document.getElementById('gata-check').onclick = check;
  }
  omgang = genOmgang();
  render();
}

function renderDivTabell(body){
  var TABELL_NIVAER = [
    {nr:1, namn:'Nämnare upp till 5', desc:'Nämnaren är 2–5.', nLo:2, nHi:5},
    {nr:2, namn:'Nämnare 5 till 9',   desc:'Nämnaren är 5–9.', nLo:5, nHi:9},
    {nr:3, namn:'Nämnare 6 till 12',  desc:'Nämnaren är 6–12.', nLo:6, nHi:12}
  ];
  var niva = null, omgang = [], idx = 0, results = [], startTime = 0, timerInterval = null;
  if(!state.divTabellBest) state.divTabellBest = {};
  function stopTimer(){ if(timerInterval){ clearInterval(timerInterval); timerInterval = null; } }
  function formatTid(ms){
    var s = ms / 1000;
    if(s < 60) return s.toFixed(1).replace('.', ',') + ' s';
    var m = Math.floor(s / 60);
    var rest = Math.round(s - m * 60);
    return m + ' min ' + (rest < 10 ? '0' : '') + rest + ' s';
  }
  function buildOmgang(lv){
    var pool = [];
    for(var n = lv.nLo; n <= lv.nHi; n++){
      for(var q = 2; q <= 10; q++){
        if(lv.nr === 3 && n === 10 && Math.random() < 0.6) continue;
        pool.push({n:n, q:q, taljare:n * q});
      }
    }
    return shuffle(pool).slice(0, Math.min(25, pool.length));
  }
  function startaOmgang(){
    omgang = buildOmgang(niva); idx = 0; results = []; startTime = Date.now(); renderFraga();
  }
  function renderValjNiva(){
    stopTimer();
    var cards = '';
    for(var i=0; i<TABELL_NIVAER.length; i++){
      var lv = TABELL_NIVAER[i];
      var best = state.divTabellBest[lv.nr];
      var bestTxt = best ? '🏆 Rekord: ' + formatTid(best) : 'Inget rekord än';
      cards += '<button class="tabell-card" data-niva="' + i + '">'
        + '<div class="tabell-card-num">' + lv.nr + '</div>'
        + '<div class="tabell-card-body">'
          + '<div class="tabell-card-namn">Nivå ' + lv.nr + ' · ' + lv.namn + '</div>'
          + '<div class="tabell-card-desc">' + lv.desc + ' &nbsp;·&nbsp; ' + bestTxt + '</div>'
        + '</div>'
        + '<div style="color:var(--ink-faint);font-size:20px;">›</div>'
      + '</button>';
    }
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Divisionstabellen', 'Välj en nivå. Tiden startar direkt – försök slå rekordet!')
      + '<div class="tabell-level-grid">' + cards + '</div>'
    + '</div>';
    body.querySelectorAll('[data-niva]').forEach(function(btn){
      btn.onclick = function(){
        niva = TABELL_NIVAER[parseInt(btn.dataset.niva, 10)];
        startaOmgang();
      };
    });
  }
  function renderSummary(){
    stopTimer();
    var elapsed = Date.now() - startTime;
    var right = results.filter(function(x){ return x; }).length;
    var total = results.length;
    var alltRatt = right === total && total > 0;
    var snitt = total > 0 ? elapsed / total : 0;
    var tidigare = state.divTabellBest[niva.nr];
    var nyttRekord = false;
    if(alltRatt && (!tidigare || elapsed < tidigare)){
      state.divTabellBest[niva.nr] = elapsed; nyttRekord = true;
    }
    var rekordHTML = '';
    if(nyttRekord){
      rekordHTML = '<div class="tabell-rekord nytt">🏆 Nytt rekord på nivå ' + niva.nr + '!</div>';
    } else if(alltRatt && tidigare){
      rekordHTML = '<div class="tabell-rekord gammalt">Rekordet är ' + formatTid(tidigare)
        + ' – du var ' + formatTid(elapsed - tidigare) + ' långsammare</div>';
    } else if(!alltRatt){
      rekordHTML = '<div class="tabell-rekord gammalt">Alla rätt krävs för att sätta rekord</div>';
    }
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Divisionstabellen · nivå ' + niva.nr, 'Du klarade ' + right + ' av ' + total + ' tal.')
      + '<div class="tabell-tidkort">'
        + '<div class="tabell-tid-stor">' + formatTid(elapsed) + '</div>'
        + '<div class="tabell-tid-rad">' + total + ' tal · ' + formatTid(snitt) + ' per tal · ' + right + ' rätt</div>'
        + rekordHTML
      + '</div>'
      + renderSummaryCard({right:right, total:total, level:niva.nr, levelChange:null, nextLabel:'Kör igen – ta tid'})
      + '<div style="margin-top:-8px;text-align:center;"><button class="btn subtle" id="divtab-byt">Välj en annan nivå</button></div>'
    + '</div>';
    document.getElementById('summary-next-btn').onclick = startaOmgang;
    document.getElementById('divtab-byt').onclick = renderValjNiva;
  }
  function renderFraga(){
    if(idx >= omgang.length){ renderSummary(); return; }
    var t = omgang[idx];
    var facit = String(t.q);
    var right = results.filter(function(x){ return x; }).length;
    var pct = Math.round((idx / omgang.length) * 100);
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Divisionstabellen · nivå ' + niva.nr, 'Skriv kvoten. Rätt svar → nästa tal direkt.')
      + '<div class="tabell-timer" id="divtab-timer"><span class="tt-ikon">⏱</span> <span id="divtab-timer-val">0,0 s</span></div>'
      + '<div class="tabell-fraga">' + t.taljare + ' / ' + t.n + ' <span class="tabell-eq">=</span></div>'
      + '<input type="text" class="tabell-svar-input" id="divtab-input" inputmode="numeric" maxlength="3" autocomplete="off">'
      + '<div class="tabell-feedback" id="divtab-fb"></div>'
      + keypadHTML([])
      + '<div class="tabell-progress">Tal ' + (idx+1) + ' av ' + omgang.length + ' · ' + right + ' rätt'
        + '<div class="tabell-progress-bar"><div class="tabell-progress-fill" style="width:' + pct + '%"></div></div>'
      + '</div>'
      + '<div style="margin-top:14px;text-align:center;">'
        + '<button class="btn primary" id="divtab-svara">Svara</button>'
        + '<button class="btn subtle" id="divtab-back">Avbryt</button>'
      + '</div>'
    + '</div>';
    stopTimer();
    var timerVal = document.getElementById('divtab-timer-val');
    function tick(){
      var s = (Date.now() - startTime) / 1000;
      timerVal.textContent = s.toFixed(1).replace('.', ',') + ' s';
    }
    tick();
    timerInterval = setInterval(tick, 100);
    var card = body.querySelector('.exercise-card');
    bindKeypad(card);
    var input = document.getElementById('divtab-input');
    setTimeout(function(){ input.focus(); }, 50);
    var done = false;
    function advance(correct){
      if(done) return;
      done = true;
      results.push(correct);
      var ts = getTutorScore('div-tabell','rakna');
      ts.total++;
      if(correct) ts.correct++;
      var fb = document.getElementById('divtab-fb');
      input.disabled = true;
      document.getElementById('divtab-svara').disabled = true;
      if(correct){
        input.classList.add('correct');
        fb.className = 'tabell-feedback correct';
        fb.textContent = 'Rätt!';
        setTimeout(function(){ idx++; renderFraga(); }, 350);
      } else {
        input.classList.add('wrong');
        fb.className = 'tabell-feedback wrong';
        fb.textContent = t.taljare + ' / ' + t.n + ' = ' + facit;
        setTimeout(function(){ idx++; renderFraga(); }, 200);
      }
    }
    input.addEventListener('input', function(){
      if(input.value.trim() === facit) advance(true);
    });
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        e.preventDefault();
        if(input.value.trim() !== '') advance(input.value.trim() === facit);
      }
    });
    document.getElementById('divtab-svara').onclick = function(){
      if(input.value.trim() !== '') advance(input.value.trim() === facit);
    };
    document.getElementById('divtab-back').onclick = renderValjNiva;
  }
  renderValjNiva();
}

function renderDivKort(body, backFn){
  var level = 1, omgangResults = [], OMG = 5;
  var LEVELNAMN = {1:'tresiffrig täljare · nämnare 2–5', 2:'tresiffrig täljare · nämnare 3–9', 3:'fyrsiffrig täljare · nämnare 4–9'};
  function adjustK(lv, right, total){
    if(right >= total-1 && lv < 3) return {level:lv+1, change:'up'};
    if(right <= Math.floor(total/3) && lv > 1) return {level:lv-1, change:'down'};
    return {level:lv, change:null};
  }
  function genTask(){
    var k = level === 3 ? 4 : 3;
    var nLo = level === 1 ? 2 : (level === 2 ? 3 : 4);
    var nHi = level === 1 ? 5 : 9;
    for(var tries=0; tries<800; tries++){
      var n = d3RandInt(nLo, nHi);
      var Q = d3RandInt(Math.pow(10, k-1), Math.pow(10, k) - 1);
      var N = Q * n;
      var ns = String(N);
      if(ns.length !== k) continue;
      var digs = ns.split('').map(Number);
      if(digs[0] < n) continue;
      var carry = 0, carryInto = [0], q = [];
      for(var i=0; i<k; i++){
        var val = carry * 10 + digs[i];
        var qi = Math.floor(val / n);
        carry = val - qi * n;
        q.push(qi);
        if(i < k-1) carryInto.push(carry);
      }
      if(carry !== 0) continue;
      var hasCarry = carryInto.slice(1).some(function(c){ return c > 0; });
      if(level > 1 && !hasCarry) continue;
      return {n:n, digs:digs, carryInto:carryInto, q:q, N:N, k:k};
    }
    return {n:6, digs:[8,5,2], carryInto:[0,2,1], q:[1,4,2], N:852, k:3};
  }
  function fixedCell(v){ return '<div class="cell">' + v + '</div>'; }
  function carrySlot(i, task, demo){
    // minnessiffran för siffra i (i >= 1): liten ruta nedanför-vänster om siffran
    if(demo){
      return task.carryInto[i] === 0 ? ''
        : '<span class="div-kort-carry-demo">' + task.carryInto[i] + '</span>';
    }
    return '<input type="text" class="div-kort-carry" data-expect="' + task.carryInto[i]
      + '" inputmode="numeric" maxlength="1" autocomplete="off">';
  }
  function buildBox(task, demo){
    var k = task.k;
    var fracW = (k * 40 + (k - 1) * 2);
    var taljRow = '<div class="mult-upp-row">';
    for(var j=0; j<k; j++){
      var carry = j >= 1 ? carrySlot(j, task, demo) : '';
      taljRow += '<div class="cell div-kort-digcell">' + carry + '<span>' + task.digs[j] + '</span></div>';
    }
    taljRow += '</div>';
    var lineRow = '<div class="div-frac-line" style="width:' + fracW + 'px;"></div>';
    var namnRow = '<div class="mult-upp-row" style="justify-content:center;width:' + fracW + 'px;">' + fixedCell(task.n) + '</div>';
    var kvotRow = '<div class="mult-upp-row">';
    for(var m=0; m<k; m++){
      kvotRow += demo
        ? fixedCell('<span style="color:var(--success);font-weight:700;">' + task.q[m] + '</span>')
        : '<div class="cell"><input type="text" class="mult-upp-ans div-kort-q" data-expect="' + task.q[m] + '" inputmode="numeric" maxlength="1" autocomplete="off"></div>';
    }
    kvotRow += '</div>';
    return '<div class="div-kort-box">'
      + '<div class="div-kort-frac">' + taljRow + lineRow + namnRow + '</div>'
      + '<div class="div-kort-eq">=</div>'
      + '<div>' + kvotRow + '</div>'
    + '</div>';
  }
  function renderExplain(){
    var demoTask = {n:6, digs:[8,5,2], carryInto:[0,2,1], q:[1,4,2], N:852, k:3};
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Metod · kort division', 'Dela siffra för siffra. Minnessiffran skrivs framför nästa siffra i täljaren.')
      + '<div class="metod-explain-card">'
        + '<h3 class="metod-step-title">Så här fungerar det</h3>'
        + '<p class="metod-step-desc">Vi beräknar <strong>852 / 6</strong>.</p>'
        + '<div style="display:flex;justify-content:center;">' + buildBox(demoTask, true) + '</div>'
        + '<ol class="div-metod-steg">'
          + '<li><strong>8 / 6</strong> = 1, rest 2. Skriv <strong>1</strong> i kvoten och minnessiffran <strong>2</strong> framför nästa siffra.</li>'
          + '<li>Minnessiffran framför nästa siffra ger <strong>25</strong>. <strong>25 / 6</strong> = 4, rest 1. Skriv <strong>4</strong>, minnessiffra <strong>1</strong>.</li>'
          + '<li>Sista siffran med minnessiffra blir <strong>12</strong>. <strong>12 / 6</strong> = 2, rest 0. Skriv <strong>2</strong>. Kvoten är <strong>142</strong>.</li>'
        + '</ol>'
      + '</div>'
      + '<div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'
        + '<button class="btn primary" id="kort-start">Öva nu →</button>'
        + '<button class="btn subtle" id="kort-back">Tillbaka till metoder</button>'
      + '</div>'
    + '</div>';
    document.getElementById('kort-start').onclick = function(){ omgangResults = []; renderPractice(); };
    document.getElementById('kort-back').onclick = backFn;
  }
  function renderPractice(){
    var task = genTask();
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Metod · kort division — nivå ' + level, 'Nivå ' + level + ': ' + LEVELNAMN[level] + '.')
      + '<div class="metod-explain-card">'
        + '<p style="font-size:15px;margin:0 0 4px;color:var(--ink-soft);">Beräkna <strong style="font-family:var(--mono);color:var(--c-metod);">' + task.N + ' / ' + task.n + '</strong></p>'
        + '<p style="font-size:13px;margin:0 0 14px;color:var(--ink-soft);">Skriv kvoten i de gröna rutorna och minnessiffran i de små rutorna framför nästa siffra. Lämna en minnesruta tom om resten är 0.</p>'
        + '<div style="display:flex;justify-content:center;">' + buildBox(task, false) + '</div>'
        + '<div class="rakna-uppdela-feedback" id="kort-fb"></div>'
        + keypadHTML([])
        + '<div style="margin-top:16px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'
          + '<button class="btn primary" id="kort-check">Kontrollera</button>'
          + '<button class="btn subtle" id="kort-tillbaka">Tillbaka till metoder</button>'
        + '</div>'
      + '</div>'
    + '</div>';
    var card = body.querySelector('.exercise-card');
    bindKeypad(card);
    // Ordning: kvotsiffra, sedan minnessiffran in i nästa kolumn, osv.
    // Markören startar därför på första kvotrutan – inte på en minnessiffra.
    var qs = Array.from(card.querySelectorAll('.div-kort-q'));
    var cs = Array.from(card.querySelectorAll('.div-kort-carry'));
    var allInputs = [];
    for(var qi=0; qi<qs.length; qi++){
      allInputs.push(qs[qi]);
      if(qi < cs.length) allInputs.push(cs[qi]);
    }

function renderDivLang(body, backFn){
  var level = 1, omgangResults = [], OMG = 4;
  var LEVELNAMN = {1:'tresiffrig täljare · nämnare 2–5', 2:'tresiffrig täljare · nämnare 3–9', 3:'tresiffrig täljare · nämnare 6–9'};
  function adjustL(lv, right, total){
    if(right >= total-1 && lv < 3) return {level:lv+1, change:'up'};
    if(right <= Math.floor(total/3) && lv > 1) return {level:lv-1, change:'down'};
    return {level:lv, change:null};
  }
  function bygg(D, digs){
    var carry = 0, steps = [];
    for(var i=0; i<digs.length; i++){
      var cur = carry * 10 + digs[i];
      var qi = Math.floor(cur / D), sub = qi * D, rem = cur - sub;
      steps.push({cur:cur, qi:qi, sub:sub, rem:rem, broughtDigit:(i < digs.length-1 ? digs[i+1] : null)});
      carry = rem;
    }
    return {D:D, digs:digs, steps:steps, slutRest:carry, k:digs.length};
  }
  function genTask(){
    var nLo = level === 1 ? 2 : (level === 2 ? 3 : 6);
    var nHi = level === 1 ? 5 : 9;
    for(var tries=0; tries<800; tries++){
      var D = d3RandInt(nLo, nHi);
      var Q = d3RandInt(100, 999);
      var N = Q * D;
      var ns = String(N);
      if(ns.length !== 3) continue;
      var digs = ns.split('').map(Number);
      if(digs[0] < D) continue;
      var t = bygg(D, digs);
      if(t.slutRest !== 0) continue;
      t.N = N; t.Q = Q;
      return t;
    }
    var fb = bygg(4, [7,8,4]); fb.N = 784; fb.Q = 196; return fb;
  }
  function fixedCell(v, cls){ return '<div class="cell ' + (cls||'') + '">' + v + '</div>'; }
  function emptyCell(){ return '<div class="cell"></div>'; }
  function inputCell(expect, cls){
    return '<div class="cell"><input type="text" class="mult-upp-ans ' + cls + '" data-expect="' + expect + '" inputmode="numeric" maxlength="1" autocomplete="off"></div>';
  }
  function opCell(v){ return '<div class="cell opcell">' + (v||'') + '</div>'; }
  function rowFromCells(opV, cellHtmls){
    return '<div class="mult-upp-row">' + opCell(opV) + cellHtmls.join('') + '</div>';
  }
  function buildBox(task, demo){
    var k = task.k;
    var fracW = (k * 40 + (k - 1) * 2);
    var rows = '';
    var kvotCells = [];
    for(var i=0; i<k; i++){
      kvotCells.push(demo
        ? fixedCell('<span style="color:var(--success);font-weight:700;">' + task.steps[i].qi + '</span>')
        : inputCell(task.steps[i].qi, 'div-lang-q'));
    }
    rows += rowFromCells('', kvotCells);
    rows += '<div class="mult-upp-row"><div class="cell opcell"></div><div class="div-frac-line" style="width:' + fracW + 'px;"></div></div>';
    var taljCells = [];
    for(var t=0; t<k; t++) taljCells.push(fixedCell(task.digs[t]));
    rows += '<div class="mult-upp-row">' + opCell('') + taljCells.join('')
      + '<div class="cell div-lang-wall">' + task.D + '</div></div>';
    for(var s=0; s<k; s++){
      var st = task.steps[s];
      var subStr = String(st.sub);
      var subLen = subStr.length;
      var subCells = [];
      for(var c=0; c<k; c++){
        if(c > s - subLen && c <= s){
          subCells.push(fixedCell('<span style="color:var(--error);">' + subStr[c - (s - subLen + 1)] + '</span>'));
        } else { subCells.push(emptyCell()); }
      }
      rows += rowFromCells('−', subCells);
      rows += '<div class="mult-upp-row"><div class="cell opcell"></div><div class="div-step-line" style="width:' + fracW + 'px;"></div></div>';
      var diffCells = [];
      for(var d=0; d<k; d++){
        if(d === s){
          diffCells.push(demo
            ? fixedCell('<span style="color:var(--success);font-weight:700;">' + st.rem + '</span>')
            : inputCell(st.rem, 'div-lang-rem'));
        } else if(d === s + 1 && st.broughtDigit !== null){
          diffCells.push(fixedCell('<span style="color:var(--c-metod);font-weight:700;">' + st.broughtDigit + '</span>', 'div-lang-brought'));
        } else { diffCells.push(emptyCell()); }
      }
      rows += rowFromCells('', diffCells);
    }
    return '<div class="mult-upp-box"><div class="mult-upp-rows">' + rows + '</div></div>';
  }
  function renderExplain(){
    var demoTask = bygg(4, [7,8,4]); demoTask.N = 784; demoTask.Q = 196;
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Metod · lång division', 'Liggande stolen: dividera, multiplicera, subtrahera och flytta ner.')
      + '<div class="metod-explain-card">'
        + '<h3 class="metod-step-title">Så här fungerar det</h3>'
        + '<p class="metod-step-desc">Vi beräknar <strong>784 / 4</strong>.</p>'
        + '<div style="display:flex;justify-content:center;">' + buildBox(demoTask, true) + '</div>'
        + '<ol class="div-metod-steg">'
          + '<li><strong>Dividera:</strong> 7 / 4 = 1. Skriv 1 i kvoten.</li>'
          + '<li><strong>Multiplicera:</strong> 1 · 4 = 4. Skriv 4 under 7.</li>'
          + '<li><strong>Subtrahera:</strong> 7 − 4 = 3.</li>'
          + '<li><strong>Flytta ner:</strong> ta ner 8 → 38. 38 / 4 = 9, 9 · 4 = 36, 38 − 36 = 2.</li>'
          + '<li>Flytta ner 4 → 24. 24 / 4 = 6, 6 · 4 = 24, 24 − 24 = 0. Kvoten är <strong>196</strong>.</li>'
        + '</ol>'
      + '</div>'
      + '<div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'
        + '<button class="btn primary" id="lang-start">Öva nu →</button>'
        + '<button class="btn subtle" id="lang-back">Tillbaka till metoder</button>'
      + '</div>'
    + '</div>';
    document.getElementById('lang-start').onclick = function(){ omgangResults = []; renderPractice(); };
    document.getElementById('lang-back').onclick = backFn;
  }
  function renderPractice(){
    var task = genTask();
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Metod · lång division — nivå ' + level, 'Nivå ' + level + ': ' + LEVELNAMN[level] + '.')
      + '<div class="metod-explain-card">'
        + '<p style="font-size:15px;margin:0 0 4px;color:var(--ink-soft);">Beräkna <strong style="font-family:var(--mono);color:var(--c-metod);">' + task.N + ' / ' + task.D + '</strong> med liggande stolen.</p>'
        + '<p style="font-size:13px;margin:0 0 14px;color:var(--ink-soft);">Subtraktionsraderna (röda) är ifyllda. Skriv <strong>kvoten</strong> överst och <strong>differensen</strong> efter varje subtraktion.</p>'
        + '<div style="display:flex;justify-content:center;">' + buildBox(task, false) + '</div>'
        + '<div class="rakna-uppdela-feedback" id="lang-fb"></div>'
        + keypadHTML([])
        + '<div style="margin-top:16px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'
          + '<button class="btn primary" id="lang-check">Kontrollera</button>'
          + '<button class="btn subtle" id="lang-tillbaka">Tillbaka till metoder</button>'
        + '</div>'
      + '</div>'
    + '</div>';
    var card = body.querySelector('.exercise-card');
    bindKeypad(card);
    var allInputs = Array.from(card.querySelectorAll('.div-lang-q, .div-lang-rem'));
    setTimeout(function(){ if(allInputs.length) allInputs[0].focus(); }, 50);
    allInputs.forEach(function(inp, i){
      inp.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){
          e.preventDefault();
          if(i < allInputs.length - 1) allInputs[i+1].focus();
          else check();
        }
      });
    });
    function check(){
      var correct = true;
      allInputs.forEach(function(inp){
        inp.disabled = true;
        if(inp.value.trim() === inp.dataset.expect){ inp.classList.add('correct'); }
        else { inp.classList.add('wrong'); correct = false; }
      });
      var fb = document.getElementById('lang-fb');
      fb.className = 'rakna-uppdela-feedback show';
      document.getElementById('lang-check').disabled = true;
      var ts = getTutorScore('div-metoder','metod');
      var tsG = getTutorScore('div-metoder','lang');
      ts.total++; tsG.total++;
      omgangResults.push(correct);
      if(correct){
        fb.classList.add('correct');
        fb.textContent = 'Rätt! ' + task.N + ' / ' + task.D + ' = ' + task.Q + '  ✓';
        ts.correct++; tsG.correct++;
      } else {
        fb.classList.add('wrong');
        fb.textContent = 'Inte rätt – ' + task.N + ' / ' + task.D + ' = ' + task.Q + '. Kontrollera kvoten och differenserna.';
      }
      if(omgangResults.length >= OMG) setTimeout(showSummary, correct ? 1900 : 3000);
      else setTimeout(renderPractice, correct ? 1900 : 3000);
    }
    document.getElementById('lang-check').onclick = check;
    document.getElementById('lang-tillbaka').onclick = backFn;
  }
  function showSummary(){
    var right = omgangResults.filter(function(x){ return x; }).length;
    var total = omgangResults.length;
    var adj = adjustL(level, right, total);
    level = adj.level;
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Metod · lång division', 'Du klarade ' + right + ' av ' + total + '.')
      + renderSummaryCard({right:right, total:total, level:level, levelChange:adj.change, nextLabel:'Ny omgång'})
      + '<div style="margin-top:-8px;text-align:center;"><button class="btn subtle" id="lang-tillmetoder">Tillbaka till metoder</button></div>'
    + '</div>';
    document.getElementById('summary-next-btn').onclick = function(){ omgangResults = []; renderPractice(); };

function renderDivProblem(body){
  var level = 1, currentSet = [], answered = 0, rightCount = 0;
  function pickSet(){
    var pool = DIV_LASTAL.filter(function(p){ return p.level === level; });
    return shuffle(pool.slice()).slice(0, 3);
  }
  function start(){ currentSet = pickSet(); answered = 0; rightCount = 0; render(); }
  function render(){
    var tasks = '';
    for(var i=0; i<currentSet.length; i++){
      var p = currentSet[i];
      tasks += '<div class="prob-task" data-i="' + i + '">'
        + '<div class="prob-text">Lästal ' + (i+1) + ' av ' + currentSet.length + '</div>'
        + '<div style="font-size:15px;line-height:1.6;color:var(--ink);margin-bottom:12px;">' + p.text + '</div>'
        + '<div class="prob-svar-rad">'
          + '<span style="font-size:14px;color:var(--ink-soft);">Svar:</span>'
          + '<input type="text" class="prob-input" inputmode="text" maxlength="10" data-input="' + i + '" autocomplete="off" placeholder="?">'
          + '<span class="prob-enhet">' + p.enhet + '</span>'
          + '<button class="btn primary" data-check="' + i + '">Kontrollera</button>'
        + '</div>'
        + '<div class="prob-foto-rad">'
          + '<button type="button" class="prob-foto-btn" data-foto="' + i + '">📷 Fota din lösning <span style="opacity:.7;">(frivilligt)</span></button>'
          + '<input type="file" accept="image/*" capture="environment" data-fotoinput="' + i + '" style="display:none;">'
          + '<div class="prob-foto-preview" id="div-prob-foto-' + i + '"></div>'
        + '</div>'
        + '<div class="prob-feedback" id="div-prob-fb-' + i + '"></div>'
      + '</div>';
    }
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Problemlösning med lästal', 'Nivå ' + level + ' av 3. Lös de tre lästalen. Du kan fota din uträkning och visa hur du tänkt.')
      + tasks
      + '<div id="div-prob-summary-anchor"></div>'
    + '</div>';
    body.querySelectorAll('[data-check]').forEach(function(b){
      b.addEventListener('click', function(){ check(parseInt(b.dataset.check, 10)); });
    });
    body.querySelectorAll('[data-foto]').forEach(function(b){
      var i = b.dataset.foto;
      var fileInput = body.querySelector('[data-fotoinput="' + i + '"]');
      b.addEventListener('click', function(){ fileInput.click(); });
      fileInput.addEventListener('change', function(e){
        var f = e.target.files && e.target.files[0];
        if(!f) return;
        var reader = new FileReader();
        reader.onload = function(ev){
          var prev = document.getElementById('div-prob-foto-' + i);
          prev.innerHTML = '<div class="prob-foto-cap">Din fotograferade lösning</div>'
            + '<img src="' + ev.target.result + '" alt="Fotograferad lösning">'
            + '<div><button type="button" class="prob-foto-remove" data-rmfoto="' + i + '">Ta bort bild</button></div>';
          prev.querySelector('[data-rmfoto]').addEventListener('click', function(){
            prev.innerHTML = '';
            fileInput.value = '';
          });
        };
        reader.readAsDataURL(f);
      });
    });
  }
  function check(i){
    var p = currentSet[i];
    var inp = body.querySelector('[data-input="' + i + '"]');
    var fb = document.getElementById('div-prob-fb-' + i);
    if(inp.disabled) return;
    fb.classList.remove('correct','wrong');
    fb.classList.add('show');
    inp.classList.remove('correct','wrong');
    var ts = getTutorScore('div-problem','problem');
    ts.total++;
    var stu = d3ParseNum(inp.value);
    var wasRight = false;
    if(stu === null){
      fb.classList.add('wrong');
      fb.textContent = 'Skriv ett tal som svar.';
      ts.total--;
      return;
    }
    if(Math.abs(stu - p.answer) < 1e-6 * Math.max(1, Math.abs(p.answer))){
      inp.classList.add('correct');
      fb.classList.add('correct');
      fb.textContent = 'Rätt! ' + p.exp;
      ts.correct++;
      wasRight = true;
    } else {
      inp.classList.add('wrong');
      fb.classList.add('wrong');
      fb.textContent = 'Inte rätt. Rätt svar: ' + d3FmtNum(p.answer) + ' ' + p.enhet + '. ' + p.exp;
    }
    inp.disabled = true;
    body.querySelector('[data-check="' + i + '"]').disabled = true;
    if(wasRight) rightCount++;
    answered++;
    if(answered >= currentSet.length){ setTimeout(showSummary, 700); }
  }
  function showSummary(){
    var anchor = document.getElementById('div-prob-summary-anchor');
    if(!anchor) return;
    var nivaKnappar = '<div class="prob-niva-val">';
    if(level < 3) nivaKnappar += '<button class="btn primary" id="div-prob-svarare">Öka svårighetsgrad →</button>';
    nivaKnappar += '<button class="btn" id="div-prob-samma">Samma nivå igen</button>';
    if(level > 1) nivaKnappar += '<button class="btn subtle" id="div-prob-lattare">← Lättare nivå</button>';
    nivaKnappar += '</div>';
    anchor.innerHTML = '<div style="margin-top:20px;">'
      + renderSummaryCard({right:rightCount, total:currentSet.length, nextLabel:'Nya lästal'})
      + nivaKnappar
    + '</div>';
    document.getElementById('summary-next-btn').onclick = start;
    var svarare = document.getElementById('div-prob-svarare');
    if(svarare) svarare.onclick = function(){ level = Math.min(3, level+1); start(); };
    var lattare = document.getElementById('div-prob-lattare');
    if(lattare) lattare.onclick = function(){ level = Math.max(1, level-1); start(); };
    document.getElementById('div-prob-samma').onclick = start;
    anchor.scrollIntoView({behavior:'smooth', block:'start'});
  }
  start();
}

function prioEval(uttryck){
  if(uttryck == null) return null;
  var e = String(uttryck)
    .replace(/[x×]/g, '*')
    .replace(/\u00b7/g, '*')
    .replace(/\u2212/g, '-')
    .replace(/\s/g, '')
    .replace(/,/g, '.');
  if(e === '') return null;
  if(!/^[-+*/().\d]+$/.test(e)) return null;
  try{
    var v = Function('"use strict";return (' + e + ')')();
    if(typeof v !== 'number' || !isFinite(v)) return null;
    return Math.round(v * 1e6) / 1e6;
  }catch(err){ return null; }
}
function prioNum(n){
  var r = Math.round(n * 1e6) / 1e6;
  return (r < 0 ? '−' : '') + String(Math.abs(r)).replace('.', ',');
}
function prioParen(n){
  return n < 0 ? '(' + prioNum(n) + ')' : prioNum(n);
}

function renderSambandEngine(body, mode, backFn){
  var level = 1, omgang = [], idx = 0, results = [], OMG = 6;
  var HEADER = mode === 'multdiv' ? 'Samband · multiplikation och division'
                                  : 'Samband · addition och subtraktion';

  function genAddSub(){
    var box, other, sum;
    if(level === 1){ box = d3RandInt(2, 18); other = d3RandInt(2, 18); }
    else if(level === 2){ box = d3RandInt(10, 95); other = d3RandInt(10, 95); }
    else {
      box = d3RandInt(15, 240); other = d3RandInt(15, 240);
      if(Math.random() < 0.5){ box = box / 10; other = other / 10; }
    }
    sum = box + other;
    var form = randPick(['a','b','c','d']);
    if(form === 'a') return {parts:[prioNum(other),' + ','□',' = ',prioNum(sum)], answer:box};
    if(form === 'b') return {parts:['□',' + ',prioNum(other),' = ',prioNum(sum)], answer:box};
    if(form === 'c') return {parts:[prioNum(sum),' − ','□',' = ',prioNum(other)], answer:box};
    return {parts:['□',' − ',prioNum(other),' = ',prioNum(box)], answer:sum};
  }
  function genMultDiv(){
    var box, other, prod;
    if(level === 1){ box = d3RandInt(2, 10); other = d3RandInt(2, 10); }
    else if(level === 2){ box = d3RandInt(3, 12); other = d3RandInt(11, 25); }
    else {
      box = d3RandInt(2, 9); other = randPick([0.5, 1.5, 2.5, 0.2, 0.4, 4, 6, 8]);
    }
    prod = Math.round(box * other * 100) / 100;
    var form = randPick(['a','b','c','d']);
    if(form === 'a') return {parts:[prioNum(other),' · ','□',' = ',prioNum(prod)], answer:box};
    if(form === 'b') return {parts:['□',' · ',prioNum(other),' = ',prioNum(prod)], answer:box};
    if(form === 'c') return {parts:[prioNum(prod),' / ','□',' = ',prioNum(other)], answer:box};
    return {parts:['□',' / ',prioNum(other),' = ',prioNum(box)], answer:prod};
  }
  function genTask(){ return mode === 'multdiv' ? genMultDiv() : genAddSub(); }
  function genOmgang(){ var a = []; for(var i=0; i<OMG; i++) a.push(genTask()); return a; }

  function render(){
    if(idx >= omgang.length){
      var right = results.filter(function(x){ return x; }).length;
      var total = results.length;
      var adj = adjustLevel(level, right, total);
      level = adj.level;
      body.innerHTML = '<div class="exercise-card">'
        + exerciseHeader(HEADER, 'Du klarade ' + right + ' av ' + total + '.', level)
        + renderSummaryCard({right:right, total:total, level:level, levelChange:adj.change})
        + '<div style="margin-top:-8px;text-align:center;"><button class="btn subtle" id="smb-back">Tillbaka till samband</button></div>'
      + '</div>';
      document.getElementById('summary-next-btn').onclick = function(){
        omgang = genOmgang(); idx = 0; results = []; render();
      };
      document.getElementById('smb-back').onclick = backFn;
      return;
    }
    var task = omgang[idx];
    var eqHTML = '';
    for(var i=0; i<task.parts.length; i++){
      if(task.parts[i] === '□'){
        eqHTML += '<input type="text" class="prio-box-input" id="smb-input" inputmode="text" maxlength="7" autocomplete="off">';
      } else {
        eqHTML += '<span class="prio-eq-part">' + task.parts[i] + '</span>';
      }
    }
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader(HEADER, 'Skriv talet som saknas i rutan.', level)
      + renderScoreBarSimple(results.filter(function(x){return x;}).length, results.filter(function(x){return !x;}).length, omgang.length, idx)
      + '<div class="prio-eq-rad">' + eqHTML + '</div>'
      + '<div class="rakna-uppdela-feedback" id="smb-fb"></div>'
      + keypadHTML(mode === 'multdiv' ? [','] : [])
      + '<div style="margin-top:16px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'
        + '<button class="btn primary" id="smb-check">Kontrollera</button>'

// ============================================================
// KO 2: PRIORITERINGSREGELN – delade uttrycksmallar
// ============================================================
// Varje mall returnerar {expr, answer, steps}.
// steg: lista av rader; varje rad = lista av segment {t:'fix'|'blank', v}.
// Sista raden = [{t:'blank', v:answer}].
// steg: lista av reduktionsrader (utan likhetstecken). Likhetstecknet ritas
// strukturellt av trappan; svaret (answer) blir högerledet på SISTA raden.
// Varje steg-rad = lista av celler. Cell = {t:'num',v:tal} eller {t:'op',v:tecken}.
// ALLA celler är elevinmatningar – eleven för själv ned varje tal och tecken.
// Nivå 1–2 har enkla tal och inga negativa tal; negativa tal först på nivå 3.
var PRIO_TPL = {
  1: [
    function(){ // a + b·c
      var a=d3RandInt(2,9), b=d3RandInt(2,6), c=d3RandInt(2,6);
      var bc=b*c, ans=a+bc;
      return {expr:a+' + '+b+' · '+c, answer:ans,
        steps:[[{t:'num',v:a},{t:'op',v:'+'},{t:'num',v:bc}]]};
    },
    function(){ // a·b + c
      var a=d3RandInt(2,6), b=d3RandInt(2,6), c=d3RandInt(2,9);
      var ab=a*b, ans=ab+c;
      return {expr:a+' · '+b+' + '+c, answer:ans,
        steps:[[{t:'num',v:ab},{t:'op',v:'+'},{t:'num',v:c}]]};
    },
    function(){ // a·b + c·d
      var a=d3RandInt(2,5), b=d3RandInt(2,5), c=d3RandInt(2,5), d=d3RandInt(2,5);
      var ab=a*b, cd=c*d, ans=ab+cd;
      return {expr:a+' · '+b+' + '+c+' · '+d, answer:ans,
        steps:[[{t:'num',v:ab},{t:'op',v:'+'},{t:'num',v:cd}]]};
    },
    function(){ // a·b − c  (ab > c, alltid positivt)
      var a=d3RandInt(2,6), b=d3RandInt(2,6), ab=a*b, c=d3RandInt(1,ab-1);
      var ans=ab-c;
      return {expr:a+' · '+b+' − '+c, answer:ans,
        steps:[[{t:'num',v:ab},{t:'op',v:'−'},{t:'num',v:c}]]};
    }
  ],
  2: [
    function(){ // (a−b) + (c+d)
      var b=d3RandInt(2,15), ab=d3RandInt(3,20), a=b+ab, c=d3RandInt(2,15), d=d3RandInt(2,15);
      var cd=c+d, ans=ab+cd;
      return {expr:'('+a+' − '+b+') + ('+c+' + '+d+')', answer:ans,
        steps:[[{t:'num',v:ab},{t:'op',v:'+'},{t:'num',v:cd}]]};
    },
    function(){ // a − b/c + d
      var c=d3RandInt(2,9), q=d3RandInt(2,9), b=c*q, a=d3RandInt(q+2,q+30), d=d3RandInt(2,15);
      var ans=a-q+d;
      return {expr:a+' − '+b+' / '+c+' + '+d, answer:ans,
        steps:[[{t:'num',v:a},{t:'op',v:'−'},{t:'num',v:q},{t:'op',v:'+'},{t:'num',v:d}]]};
    },
    function(){ // (a−b)/c + d
      var c=d3RandInt(2,9), q=d3RandInt(2,9), diff=c*q, b=d3RandInt(2,20), a=b+diff, d=d3RandInt(2,15);
      var ans=q+d;
      return {expr:'('+a+' − '+b+') / '+c+' + '+d, answer:ans,
        steps:[
          [{t:'num',v:diff},{t:'op',v:'/'},{t:'num',v:c},{t:'op',v:'+'},{t:'num',v:d}],
          [{t:'num',v:q},{t:'op',v:'+'},{t:'num',v:d}]
        ]};
    }
  ],
  3: [
    function(){ // a − b·c + d·e
      var a=d3RandInt(20,60), b=d3RandInt(3,12), c=d3RandInt(2,5), d=d3RandInt(2,9), e=d3RandInt(2,5);
      var bc=b*c, de=d*e, ans=a-bc+de;
      return {expr:a+' − '+b+' · '+c+' + '+d+' · '+e, answer:ans,
        steps:[[{t:'num',v:a},{t:'op',v:'−'},{t:'num',v:bc},{t:'op',v:'+'},{t:'num',v:de}]]};
    },
    function(){ // a + (−b)·c − d/(−e)  (negativa tal)
      var b=d3RandInt(2,9), c=d3RandInt(2,9), e=d3RandInt(2,9), q=d3RandInt(2,9), d=e*q, a=d3RandInt(2,20);
      var t1=-(b*c), t2=-q, ans=a+t1-t2;
      return {expr:a+' + (−'+b+') · '+c+' − '+d+' / (−'+e+')', answer:ans,
        steps:[[{t:'num',v:a},{t:'op',v:'+'},{t:'num',v:t1},{t:'op',v:'−'},{t:'num',v:t2}]]};
    },
    function(){ // a − b·(−c) + d  (negativa tal, stora tal)
      var a=d3RandInt(100,900), b=d3RandInt(2,9), c=d3RandInt(2,9), d=d3RandInt(50,300);
      var bc=b*(-c), ans=a-bc+d;
      return {expr:a+' − '+b+' · (−'+c+') + '+d, answer:ans,
        steps:[[{t:'num',v:a},{t:'op',v:'−'},{t:'num',v:bc},{t:'op',v:'+'},{t:'num',v:d}]]};
    }
  ]
};
var PRIO_NIVANAMN = {1:'enkla uttryck', 2:'parenteser och division', 3:'komplexare uttryck med negativa tal'};

// ---- Gemensam trappa-rendering: likhetstecknen i en kolumn ----
// Rad = LHS | = | RHS. Varje cell (tal OCH tecken) är en elevinmatning –
// eleven för själv ned alla tal och tecken. RHS = svaret på sista raden.
function prioTrappaHTML(task){
  // Lodrät uppställning enligt kapitel 3-modellen:
  // uppgiftsrad överst, sedan en steg-rad per förenklingsvarv med en
  // vänsterled-ruta (rättas på värde) och, på sista raden, en svarsruta.
  // Varje steg-rads värde räknas ur cellerna i task.steps.
  function radVarde(line){
    var s = '';
    for(var i=0; i<line.length; i++){
      var c = line[i];
      if(c.t === 'op'){
        s += prioNormOp(c.v).replace('−','-').replace('·','*');
      } else {
        // negativa tal sätts i parentes så uttrycket blir giltigt (t.ex. 17 - (-5))
        var raw = String(c.v).replace('−','-');
        if(/^-/.test(raw)) raw = '(' + raw + ')';
        s += raw;
      }
    }
    return prioEval(s);
  }
  var html = '<div class="prio-metod-trappa">'
    + '<div class="prio-uppgift-rad"><span class="prio-uppgift-expr">' + task.expr + '</span><span class="prio-eq">=</span></div>';
  for(var s=0; s<task.steps.length; s++){
    var isLast = (s === task.steps.length - 1);
    var vlValue = radVarde(task.steps[s]);
    html += '<div class="prio-steg">'
      + '<input type="text" class="prio-step-input prio-vl" data-vl="' + vlValue + '" inputmode="text" autocomplete="off" placeholder="förenkla">'
      + '<span class="prio-eq">=</span>'
      + (isLast
          ? '<input type="text" class="prio-step-input prio-svar prio-step-answer" data-answer="' + task.answer + '" inputmode="text" autocomplete="off" placeholder="svar">'
          : '<span class="prio-tom"></span>')
    + '</div>';
  }
  return html + '</div>';
}
// ---- Räknelagar på EN rad: en horisontell likhetskedja, inte en trappa ----
function prioRadHTML(task){
  function cell(c, extra){
    var base = c.t === 'op' ? 'prio-step-input prio-step-op' : 'prio-step-input prio-step-num';
    if(extra) base += ' ' + extra;
    var ml = c.t === 'op' ? '1' : '6';
    return '<input type="text" class="' + base + '" data-expect="' + c.v
      + '" inputmode="text" maxlength="' + ml + '" autocomplete="off">';
  }
  var html = '<div class="prio-rad">'
    + '<span class="prio-rad-expr">' + task.expr + '</span>'
    + '<span class="prio-rad-eq">=</span>';
  for(var s=0; s<task.steps.length; s++){
    var line = task.steps[s];
    for(var i=0; i<line.length; i++) html += cell(line[i]);
    html += '<span class="prio-rad-eq">=</span>';
  }
  html += cell({t:'num', v:task.answer}, 'prio-step-answer');
  return html + '</div>';
}
// Normaliserar operatortecken så att t.ex. - och −, * och · jämställs.
function prioNormOp(c){
  return String(c == null ? '' : c).trim()
    .replace(/\*/g, '·').replace(/[xX]/g, '·').replace(/-/g, '−');
}
// Rättar den lodräta uppställningen: varje vänsterled på värde, svaret exakt.
// Returnerar true om allt är rätt.
function prioCheckStaircase(card){
  var correct = true;
  Array.from(card.querySelectorAll('.prio-vl')).forEach(function(inp){
    inp.disabled = true;
    var elevVarde = prioEval(inp.value);
    var mal = Number(inp.dataset.vl);
    var ok = elevVarde !== null && Math.abs(elevVarde - mal) < 1e-6;
    inp.classList.add(ok ? 'correct' : 'wrong');
    if(!ok) correct = false;
  });
  var ans = card.querySelector('.prio-svar');
  if(ans){
    ans.disabled = true;
    var sv = d3ParseNum(ans.value);
    var okA = sv !== null && Math.abs(sv - Number(ans.dataset.answer)) < 1e-6;
    ans.classList.add(okA ? 'correct' : 'wrong');
    if(!okA) correct = false;
  }
  return correct;
}

// ---- KO 2, förmåga METOD: räkna nedåt steg för steg ----
function renderPrioMetod(body){
  var level = 1, omgangResults = [], OMG = 4;
  function renderTask(){
    var task = randPick(PRIO_TPL[level])();
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Visa metoden — nivå ' + level, 'Nivå ' + level + ': ' + PRIO_NIVANAMN[level]
          + '. Räkna nedåt. Skriv det förenklade ledet i rutan före likhetstecknet och svaret i rutan efter.', level)
      + prioTrappaHTML(task)
      + '<div class="rakna-uppdela-feedback" id="met-fb"></div>'
      + keypadHTML(['+','−','·','/'])
      + '<div style="margin-top:16px;text-align:center;">'
        + '<button class="btn primary" id="met-check">Kontrollera</button>'
      + '</div>'
    + '</div>';
    var card = body.querySelector('.exercise-card');
    bindKeypad(card);
    var allInputs = Array.from(card.querySelectorAll('.prio-step-input'));
    setTimeout(function(){ if(allInputs.length) allInputs[0].focus(); }, 50);
    allInputs.forEach(function(inp, i){
      inp.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){
          e.preventDefault();
          if(i < allInputs.length - 1) allInputs[i+1].focus();
          else check();
        }
      });
    });
    function check(){
      var correct = prioCheckStaircase(card);
      var fb = document.getElementById('met-fb');
      fb.className = 'rakna-uppdela-feedback show';
      document.getElementById('met-check').disabled = true;
      var ts = getTutorScore('prio-prioritering','metod');
      ts.total++;
      omgangResults.push(correct);
      if(correct){
        fb.classList.add('correct');
        fb.textContent = 'Rätt! Du följde prioriteringsregeln hela vägen ned. ' + task.expr + ' = ' + prioNum(task.answer) + '.';
        ts.correct++;
      } else {
        fb.classList.add('wrong');
        fb.textContent = 'Något steg blev fel. Rätt svar: ' + task.expr + ' = ' + prioNum(task.answer)
          + '. Kontrollera raderna uppifrån och ned.';
      }
      if(omgangResults.length >= OMG) setTimeout(showSummary, correct ? 2000 : 3400);
      else setTimeout(renderTask, correct ? 2000 : 3400);
    }
    document.getElementById('met-check').onclick = check;
  }
  function showSummary(){
    var right = omgangResults.filter(function(x){ return x; }).length;
    var total = omgangResults.length;
    var adj = adjustLevel(level, right, total);
    level = adj.level;
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Visa metoden för prioriteringsregeln', 'Du klarade ' + right + ' av ' + total + ' uträkningar.', level)
      + renderSummaryCard({right:right, total:total, level:level, levelChange:adj.change})
    + '</div>';
    document.getElementById('summary-next-btn').onclick = function(){
      omgangResults = []; renderTask();
    };
  }
  renderTask();
}

// Generatorer – var och en returnerar {expr, answer, steps, sub}
var LAG_GEN = {
  kommutativa: function(level){
    var op = randPick(['+','·']);
    var a, b;
    if(op === '+'){
      if(level === 1){ a=d3RandInt(3,20); b=d3RandInt(3,20); }
      else if(level === 2){ a=d3RandInt(12,90); b=d3RandInt(12,90); }
      else { a=d3RandInt(40,400); b=d3RandInt(40,400); }
      var s=a+b;
      return {expr:a+' + '+b, answer:s,
        sub:'Kommutativa lagen: a + b = b + a. Skriv samma summa med termerna i omvänd ordning.',
        steps:[[{t:'num',v:b},{t:'op',v:'+'},{t:'num',v:a}]]};
    } else {
      if(level === 1){ a=d3RandInt(2,10); b=d3RandInt(2,10); }
      else if(level === 2){ a=d3RandInt(3,12); b=d3RandInt(4,20); }
      else { a=d3RandInt(3,12); b=d3RandInt(12,40); }
      var p=a*b;
      return {expr:a+' · '+b, answer:p,
        sub:'Kommutativa lagen: a · b = b · a. Skriv samma produkt med faktorerna i omvänd ordning.',
        steps:[[{t:'num',v:b},{t:'op',v:'·'},{t:'num',v:a}]]};
    }
  },
  associativa: function(level){
    var op = randPick(['+','·']);
    if(op === '·'){
      var parL = {1:[[5,2],[2,5],[4,5],[5,4]],
                  2:[[5,2],[2,5],[4,5],[5,4],[5,6],[6,5],[5,8],[8,5]],
                  3:[[25,4],[4,25],[5,20],[20,5],[5,8],[8,5],[2,50],[50,2]]};
      var pr = randPick(parL[level]);
      var p=pr[0], r=pr[1], comb=p*r;
      var m = level===1 ? d3RandInt(2,9) : (level===2 ? d3RandInt(3,15) : d3RandInt(4,20));
      var ans=comb*m;
      return {expr:p+' · '+m+' · '+r, answer:ans,
        sub:'Associativa lagen: gruppera om så att du först multiplicerar de två tal som ger ett enkelt tal.',
        steps:[[{t:'num',v:comb},{t:'op',v:'·'},{t:'num',v:m}]]};
    } else {
      var parA = {1:[[2,8],[8,2],[3,7],[7,3],[4,6],[6,4],[1,9],[9,1]],
                  2:[[2,8],[8,2],[3,7],[7,3],[15,5],[5,15],[12,8],[8,12]],
                  3:[[15,5],[5,15],[12,8],[8,12],[25,5],[5,25],[35,15],[15,35]]};
      var pa = randPick(parA[level]);
      var pp=pa[0], rr=pa[1], cb=pp+rr;
      var mm = level===1 ? d3RandInt(3,30) : (level===2 ? d3RandInt(10,90) : d3RandInt(20,200));
      var an=cb+mm;
      return {expr:pp+' + '+mm+' + '+rr, answer:an,
        sub:'Associativa lagen: gruppera om så att du först adderar de två tal som ger ett jämnt tal.',
        steps:[[{t:'num',v:cb},{t:'op',v:'+'},{t:'num',v:mm}]]};
    }
  },
  distributiva: function(level){
    var a, b, c;
    if(level === 1){ a=d3RandInt(2,5); b=d3RandInt(2,9); c=d3RandInt(2,9); }
    else if(level === 2){ a=d3RandInt(3,9); b=d3RandInt(3,12); c=d3RandInt(3,12); }
    else { a=d3RandInt(4,12); b=d3RandInt(5,19); c=d3RandInt(5,19); }
    var ab=a*b, ac=a*c, ans=ab+ac;
    return {expr:a+' · ('+b+' + '+c+')', answer:ans,
      sub:'Distributiva lagen: a · (b + c) = a · b + a · c. Multiplicera in talet i parentesen, term för term.',
      steps:[
        [{t:'num',v:a},{t:'op',v:'·'},{t:'num',v:b},{t:'op',v:'+'},{t:'num',v:a},{t:'op',v:'·'},{t:'num',v:c}],
        [{t:'num',v:ab},{t:'op',v:'+'},{t:'num',v:ac}]
      ]};
  }
};
var LAG_NAMN = {kommutativa:'Kommutativa lagen', associativa:'Associativa lagen', distributiva:'Distributiva lagen'};
var LAG_OMG  = {kommutativa:6, associativa:5, distributiva:4};

function renderLagOvning(body, katId, backFn){
  var level = 1, omgangResults = [], OMG = LAG_OMG[katId];
  function renderTask(){
    var task = LAG_GEN[katId](level);
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader(LAG_NAMN[katId] + ' — nivå ' + level, task.sub, level)
      + prioRadHTML(task)
      + '<div class="rakna-uppdela-feedback" id="lag-fb"></div>'
      + keypadHTML(['+','·'])
      + '<div style="margin-top:16px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'
        + '<button class="btn primary" id="lag-check">Kontrollera</button>'
        + '<button class="btn subtle" id="lag-back">Tillbaka till räknelagar</button>'
      + '</div>'
    + '</div>';
    var card = body.querySelector('.exercise-card');
    bindKeypad(card);
    var allInputs = Array.from(card.querySelectorAll('.prio-step-input'));
    setTimeout(function(){ if(allInputs.length) allInputs[0].focus(); }, 50);
    allInputs.forEach(function(inp, i){
      inp.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){
          e.preventDefault();
          if(i < allInputs.length - 1) allInputs[i+1].focus();
          else check();
        }
      });
    });
    document.getElementById('lag-back').onclick = backFn;
    function check(){
      var correct = prioCheckStaircase(card);
      var fb = document.getElementById('lag-fb');
      fb.className = 'rakna-uppdela-feedback show';
      document.getElementById('lag-check').disabled = true;
      var ts = getTutorScore('prio-lagar','rakna');
      var tsG = getTutorScore('prio-lagar', katId);
      ts.total++; tsG.total++;
      omgangResults.push(correct);
      if(correct){
        fb.classList.add('correct');
        fb.textContent = 'Rätt! ' + task.expr + ' = ' + prioNum(task.answer) + '.';
        ts.correct++; tsG.correct++;
      } else {
        fb.classList.add('wrong');
        fb.textContent = 'Inte rätt. ' + task.expr + ' = ' + prioNum(task.answer) + '. Kontrollera mellanleden.';
      }
      if(omgangResults.length >= OMG) setTimeout(showSummary, correct ? 1900 : 3200);
      else setTimeout(renderTask, correct ? 1900 : 3200);
    }
    document.getElementById('lag-check').onclick = check;
  }
  function showSummary(){
    var right = omgangResults.filter(function(x){ return x; }).length;
    var total = omgangResults.length;
    var adj = adjustLevel(level, right, total);
    level = adj.level;
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader(LAG_NAMN[katId], 'Du klarade ' + right + ' av ' + total + '.', level)
      + renderSummaryCard({right:right, total:total, level:level, levelChange:adj.change})
      + '<div style="margin-top:-8px;text-align:center;"><button class="btn subtle" id="lag-tillbaka">Tillbaka till räknelagar</button></div>'
    + '</div>';
    document.getElementById('summary-next-btn').onclick = function(){ omgangResults = []; renderTask(); };
    document.getElementById('lag-tillbaka').onclick = backFn;
  }
  renderTask();
}

// Generisk räknemotor: visar en fråga, ett svarsfält, knappsats, nivåer.
// cfg: {title, sub, koId, forKey, scoreKey, keypadOps, OMG, gen}
// gen(level) returnerar {q: htmlsträng, answer: tal}
function negCalcEngine(body, cfg, backFn){
  var level = 1, omgang = [], idx = 0, results = [], OMG = cfg.OMG || 6;
  function genOmgang(){
    var a = [];
    for(var i=0; i<OMG; i++) a.push(cfg.gen(level));
    return a;
  }
  function render(){
    if(idx >= omgang.length){
      var right = results.filter(function(x){ return x; }).length;
      var total = results.length;
      var adj = adjustLevel(level, right, total);
      level = adj.level;
      body.innerHTML = '<div class="exercise-card">'
        + exerciseHeader(cfg.title, 'Du klarade ' + right + ' av ' + total + '.', level)
        + renderSummaryCard({right:right, total:total, level:level, levelChange:adj.change})
        + '<div style="margin-top:-8px;text-align:center;"><button class="btn subtle" id="neg-back">Tillbaka</button></div>'
      + '</div>';
      document.getElementById('summary-next-btn').onclick = function(){
        omgang = genOmgang(); idx = 0; results = []; render();
      };
      document.getElementById('neg-back').onclick = backFn;
      return;
    }
    var task = omgang[idx];
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader(cfg.title + ' — nivå ' + level, cfg.sub, level)
      + renderScoreBarSimple(results.filter(function(x){return x;}).length, results.filter(function(x){return !x;}).length, omgang.length, idx)
      + '<div class="neg-fraga">' + task.q + '</div>'
      + '<div class="rakna-svar-rad"><input type="text" class="rakna-svar-input" id="neg-input" inputmode="text" maxlength="9" autocomplete="off" placeholder="?"></div>'
      + '<div class="rakna-uppdela-feedback" id="neg-fb"></div>'
      + keypadHTML(cfg.keypadOps || ['−'])
      + '<div style="margin-top:16px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'
        + '<button class="btn primary" id="neg-check">Kontrollera</button>'
        + '<button class="btn subtle" id="neg-tillbaka">Tillbaka</button>'
      + '</div>'
    + '</div>';
    var card = body.querySelector('.exercise-card');
    bindKeypad(card);
    var input = document.getElementById('neg-input');
    setTimeout(function(){ input.focus(); }, 50);
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); check(); }
    });
    document.getElementById('neg-tillbaka').onclick = backFn;
    function check(){
      var fb = document.getElementById('neg-fb');
      fb.className = 'rakna-uppdela-feedback show';
      var stu = d3ParseNum(input.value);
      input.disabled = true;
      document.getElementById('neg-check').disabled = true;
      var ts = getTutorScore(cfg.koId, cfg.forKey);
      var tsG = getTutorScore(cfg.koId, cfg.scoreKey);
      ts.total++; tsG.total++;
      var ok = stu !== null && Math.abs(stu - task.answer) < 1e-6;
      if(ok){
        input.classList.add('correct');
        fb.classList.add('correct');
        fb.textContent = 'Rätt! Svaret är ' + prioNum(task.answer) + '.';
        ts.correct++; tsG.correct++;
      } else {
        input.classList.add('wrong');
        fb.classList.add('wrong');
        fb.textContent = 'Inte rätt. Rätt svar är ' + prioNum(task.answer) + '.';
      }
      results.push(ok);
      setTimeout(function(){ idx++; render(); }, ok ? 1700 : 2900);
    }
    document.getElementById('neg-check').onclick = check;
  }
  omgang = genOmgang();
  render();
}

function negMotsattaGen(level){
  var n;
  if(level === 1){ n = d3RandInt(1,15); }
  else if(level === 2){ n = d3RandInt(10,99); }
  else { n = d3RandInt(11,199) / 10; }
  if(Math.random() < 0.5) n = -n;
  return {
    q: 'Vilket är det motsatta talet till <span class="neg-expr">' + prioNum(n) + '</span>?',
    answer: -n
  };
}

// ---- KO 1: TALFÖLJDER ----
function renderNegTalfoljd(body, backFn){
  var level = 1, omgangResults = [], OMG = 5;
  function genSeq(){
    var step, start;
    if(level === 1){ step = d3RandInt(1,4); start = -d3RandInt(3,12); }
    else if(level === 2){ step = d3RandInt(1,5)/10; start = -d3RandInt(8,40)/10; }
    else { step = d3RandInt(2,9)/10; start = -d3RandInt(15,55)/10; }
    if(Math.random() < 0.4) step = -step;
    var terms = [];
    for(var i=0; i<6; i++) terms.push(Math.round((start + i*step)*100)/100);
    return {given: terms.slice(0,3), answers: terms.slice(3)};
  }
  function render(task){
    var cells = '';
    task.given.forEach(function(t){
      cells += '<span class="neg-seq-term">' + prioNum(t) + '</span>';
    });
    for(var i=0; i<3; i++){
      cells += '<input type="text" class="neg-seq-input" data-i="' + i + '" inputmode="text" maxlength="7" autocomplete="off">';
    }
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Talföljder — nivå ' + level, 'Vilka tre tal kommer härnäst? Hitta mönstret och fyll i.', level)
      + '<div class="neg-seq">' + cells + '</div>'
      + '<div class="rakna-uppdela-feedback" id="seq-fb"></div>'
      + keypadHTML(['−',','])
      + '<div style="margin-top:16px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'
        + '<button class="btn primary" id="seq-check">Kontrollera</button>'
        + '<button class="btn subtle" id="seq-back">Tillbaka till begrepp</button>'
      + '</div>'
    + '</div>';
    var card = body.querySelector('.exercise-card');
    bindKeypad(card);
    var inputs = Array.from(card.querySelectorAll('.neg-seq-input'));
    setTimeout(function(){ if(inputs.length) inputs[0].focus(); }, 50);
    inputs.forEach(function(inp, i){
      inp.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){
          e.preventDefault();
          if(i < inputs.length - 1) inputs[i+1].focus(); else check();
        }
      });
    });
    document.getElementById('seq-back').onclick = backFn;
    function check(){
      var correct = true;
      inputs.forEach(function(inp, i){
        var stu = d3ParseNum(inp.value);
        inp.disabled = true;
        if(stu !== null && Math.abs(stu - task.answers[i]) < 1e-6){ inp.classList.add('correct'); }
        else { inp.classList.add('wrong'); correct = false; }
      });
      var fb = document.getElementById('seq-fb');
      fb.className = 'rakna-uppdela-feedback show';
      document.getElementById('seq-check').disabled = true;
      var ts = getTutorScore('neg-begrepp','begrepp');
      var tsG = getTutorScore('neg-begrepp','talfoljd');
      ts.total++; tsG.total++;
      omgangResults.push(correct);
      if(correct){
        fb.classList.add('correct');
        fb.textContent = 'Rätt! Mönstret fortsätter ' + task.answers.map(prioNum).join(', ') + '.';
        ts.correct++; tsG.correct++;
      } else {
        fb.classList.add('wrong');
        fb.textContent = 'Inte riktigt. Talföljden fortsätter ' + task.answers.map(prioNum).join(', ') + '.';
      }
      if(omgangResults.length >= OMG) setTimeout(showSummary, correct ? 1900 : 3100);
      else setTimeout(function(){ render(genSeq()); }, correct ? 1900 : 3100);
    }
    document.getElementById('seq-check').onclick = check;
  }
  function showSummary(){
    var right = omgangResults.filter(function(x){ return x; }).length;
    var total = omgangResults.length;
    var adj = adjustLevel(level, right, total);
    level = adj.level;
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Talföljder', 'Du klarade ' + right + ' av ' + total + '.', level)
      + renderSummaryCard({right:right, total:total, level:level, levelChange:adj.change})
      + '<div style="margin-top:-8px;text-align:center;"><button class="btn subtle" id="seq-tillbaka">Tillbaka till begrepp</button></div>'
    + '</div>';
    document.getElementById('summary-next-btn').onclick = function(){ omgangResults = []; render(genSeq()); };
    document.getElementById('seq-tillbaka').onclick = backFn;
  }
  render(genSeq());
}

// ---- KO 1: STORLEKSORDNA ----
function renderNegStorleksordna(body, backFn){
  var level = 1, omgangResults = [], OMG = 5;
  var nums = [], shuffledNums = [], placed = [], checked = false;
  function genNums(){
    var pool = [], seen = {};
    function add(v){ var k = String(v); if(!seen[k]){ seen[k] = 1; pool.push(v); } }
    var guard = 0;
    while(pool.length < 5 && guard < 500){
      guard++;
      if(level === 1) add(d3RandInt(-20,20));
      else if(level === 2) add(d3RandInt(-45,45));
      else add(Math.random() < 0.5 ? d3RandInt(-90,90)/10 : d3RandInt(-900,900)/100);
    }
    return pool;
  }
  function newRound(){
    nums = genNums();
    shuffledNums = shuffle(nums);
    placed = [];
    checked = false;
    render();
  }
  function sorted(){
    return nums.slice().sort(function(a,b){ return a-b; });
  }
  function render(){
    var srt = sorted();
    var chips = shuffledNums.map(function(v){
      var isPlaced = placed.indexOf(v) >= 0;
      return '<button class="neg-chip' + (isPlaced ? ' is-placed' : '') + '" data-v="' + v + '"'
        + (isPlaced || checked ? ' disabled' : '') + '>' + prioNum(v) + '</button>';
    }).join('');
    var slots = '';
    for(var i=0; i<nums.length; i++){
      if(i < placed.length){
        var cls = 'neg-slot is-filled';
        if(checked) cls += (Math.abs(placed[i] - srt[i]) < 1e-9) ? ' is-right' : ' is-wrong';
        slots += '<button class="' + cls + '" data-i="' + i + '"' + (checked ? ' disabled' : '') + '>'
          + '<span class="neg-slot-badge">' + (i+1) + '</span>' + prioNum(placed[i]) + '</button>';
      } else {
        slots += '<div class="neg-slot is-empty"><span class="neg-slot-badge">' + (i+1) + '</span></div>';
      }
    }
    var done = placed.length === nums.length;
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Storleksordna — nivå ' + level, 'Klicka på talen i ordning från minst till störst. Klicka i din ordning för att ångra.', level)
      + '<p class="neg-hint">Tal att ordna</p>'
      + '<div class="neg-chip-row">' + chips + '</div>'
      + '<p class="neg-hint">Din ordning — minst först</p>'
      + '<div class="neg-order-row">' + slots + '</div>'
      + '<div class="rakna-uppdela-feedback" id="stor-fb"></div>'
      + '<div style="margin-top:16px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'
        + '<button class="btn primary" id="stor-check"' + (done && !checked ? '' : ' disabled') + '>Kontrollera</button>'
        + '<button class="btn subtle" id="stor-back">Tillbaka till begrepp</button>'
      + '</div>'
    + '</div>';
    body.querySelectorAll('.neg-chip:not([disabled])').forEach(function(btn){
      btn.onclick = function(){ placed.push(parseFloat(btn.dataset.v)); render(); };
    });
    body.querySelectorAll('.neg-slot.is-filled:not([disabled])').forEach(function(btn){
      btn.onclick = function(){ placed.splice(parseInt(btn.dataset.i,10), 1); render(); };
    });
    document.getElementById('stor-back').onclick = backFn;
    var checkBtn = document.getElementById('stor-check');
    if(checkBtn && done && !checked) checkBtn.onclick = check;
  }
  function check(){
    checked = true;
    var srt = sorted();
    var correct = placed.every(function(v,i){ return Math.abs(v - srt[i]) < 1e-9; });
    render();
    var fb = document.getElementById('stor-fb');
    fb.className = 'rakna-uppdela-feedback show ' + (correct ? 'correct' : 'wrong');
    fb.textContent = correct
      ? 'Rätt ordning!'
      : 'Inte riktigt. Rätt ordning: ' + srt.map(prioNum).join('  <  ') + '.';
    var ts = getTutorScore('neg-begrepp','begrepp');
    var tsG = getTutorScore('neg-begrepp','storleksordna');
    ts.total++; tsG.total++;
    if(correct){ ts.correct++; tsG.correct++; }
    omgangResults.push(correct);
    if(omgangResults.length >= OMG) setTimeout(showSummary, correct ? 2000 : 3400);
    else setTimeout(newRound, correct ? 2000 : 3400);
  }
  function showSummary(){
    var right = omgangResults.filter(function(x){ return x; }).length;
    var total = omgangResults.length;
    var adj = adjustLevel(level, right, total);
    level = adj.level;
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Storleksordna', 'Du klarade ' + right + ' av ' + total + '.', level)
      + renderSummaryCard({right:right, total:total, level:level, levelChange:adj.change})
      + '<div style="margin-top:-8px;text-align:center;"><button class="btn subtle" id="stor-tillbaka">Tillbaka till begrepp</button></div>'
    + '</div>';
    document.getElementById('summary-next-btn').onclick = function(){ omgangResults = []; newRound(); };
    document.getElementById('stor-tillbaka').onclick = backFn;
  }
  newRound();
}

function negExpr(s, ans){ return {q:'<span class="neg-expr">' + s + ' =</span>', answer:ans}; }

function negAddSubGen(level){
  var a, b, c;
  if(level === 1){
    a = d3RandInt(1,20); b = d3RandInt(1,20);
    var t1 = randPick([1,2,3]);
    if(t1 === 1) return negExpr(prioNum(a) + ' − ' + prioNum(b), a - b);
    if(t1 === 2) return negExpr(prioNum(a) + ' + ' + prioParen(-b), a - b);
    return negExpr(prioParen(-a) + ' + ' + prioParen(-b), -a - b);
  }
  if(level === 2){
    a = d3RandInt(1,20); b = d3RandInt(1,20);
    var t2 = randPick([1,2,3]);
    if(t2 === 1) return negExpr(prioNum(a) + ' − ' + prioParen(-b), a + b);
    if(t2 === 2) return negExpr(prioParen(-a) + ' − ' + prioNum(b), -a - b);
    return negExpr(prioParen(-a) + ' − ' + prioParen(-b), -a + b);
  }
  var t3 = randPick([1,2,3]);
  if(t3 === 1){
    var x = d3RandInt(11,99)/10, y = d3RandInt(11,99)/10;
    return negExpr(prioNum(x) + ' + ' + prioParen(-y), Math.round((x - y)*100)/100);
  }
  if(t3 === 2){
    var x2 = d3RandInt(11,99)/10, y2 = d3RandInt(11,99)/10;
    return negExpr(prioParen(-x2) + ' + ' + prioParen(-y2), Math.round((-x2 - y2)*100)/100);
  }
  a = d3RandInt(1,20); b = d3RandInt(1,25); c = d3RandInt(1,20);
  return negExpr(prioNum(a) + ' + ' + prioParen(-b) + ' + ' + prioNum(c), a - b + c);
}

function negMultDivGen(level){
  if(level === 1){
    var a = d3RandInt(2,9), b = d3RandInt(2,9), t = randPick([1,2,3]);
    if(t === 1) return negExpr(prioNum(a) + ' · ' + prioParen(-b), -a*b);
    if(t === 2) return negExpr(prioParen(-a) + ' · ' + prioNum(b), -a*b);
    return negExpr(prioParen(-a) + ' · ' + prioParen(-b), a*b);
  }
  if(level === 2){
    var q = d3RandInt(2,9), d = d3RandInt(2,9), D = q*d, t2 = randPick([1,2,3]);
    if(t2 === 1) return negExpr(prioParen(-D) + ' / ' + prioNum(d), -q);
    if(t2 === 2) return negExpr(prioNum(D) + ' / ' + prioParen(-d), -q);
    return negExpr(prioParen(-D) + ' / ' + prioParen(-d), q);
  }
  if(Math.random() < 0.5){
    var a3 = d3RandInt(6,12), b3 = d3RandInt(6,12), s = randPick([1,2,3]);
    if(s === 1) return negExpr(prioNum(a3) + ' · ' + prioParen(-b3), -a3*b3);
    if(s === 2) return negExpr(prioParen(-a3) + ' · ' + prioParen(-b3), a3*b3);
    return negExpr(prioParen(-a3) + ' · ' + prioNum(b3), -a3*b3);
  }
  var q3 = d3RandInt(3,12), d3v = d3RandInt(3,9), D3 = q3*d3v, s2 = randPick([1,2]);
  if(s2 === 1) return negExpr(prioParen(-D3) + ' / ' + prioNum(d3v), -q3);
  return negExpr(prioParen(-D3) + ' / ' + prioParen(-d3v), q3);
}

function negFaktorerGen(level){
  var count = level === 1 ? 3 : (level === 2 ? randPick([3,4]) : 4);
  var maxMag = level === 3 ? 7 : 6;
  var factors = [], guard = 0;
  while(guard < 200){
    guard++;
    factors = [];
    for(var i=0; i<count; i++){
      var sign = Math.random() < 0.55 ? -1 : 1;
      factors.push(d3RandInt(2,maxMag) * sign);
    }
    if(factors.filter(function(v){ return v < 0; }).length >= 2) break;
  }
  var ans = factors.reduce(function(p,v){ return p*v; }, 1);
  return negExpr(factors.map(prioParen).join(' · '), ans);
}

// Avrundar n till närmaste multipel av step (t.ex. 10, 100) eller till
// decimaler (step < 1). "Halva uppåt"-regeln.
function avrAvrunda(n, step){
  var q = n / step;
  // hantera flyttalsfel: nudga mot närmaste heltal
  var r = Math.round(q + (q >= 0 ? 1e-9 : -1e-9));
  return Math.round(r * step * 1e6) / 1e6;
}
// Snyggt formaterat tal: − och , , inga onödiga nollor
function avrNum(n){
  var r = Math.round(n * 1e6) / 1e6;
  return (r < 0 ? '−' : '') + String(Math.abs(r)).replace('.', ',');
}
// Tal med fast antal decimaler (för avrundningssvar med t.ex. 12,30)
function avrFixed(n, dec){
  var s = Math.abs(n).toFixed(dec);
  return (n < 0 ? '−' : '') + s.replace('.', ',');
}
