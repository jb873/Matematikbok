  background:var(--primary-bg);border-color:var(--primary);
}
.ab-steg-label{font-size:14px;color:var(--ink);flex:1;font-family:var(--sans)}

@media print{
  body{background:#fff !important}
  .topbar, .tutor-fab, .tutor-panel, .breadcrumb, .test-progress-bar, .practice-cta-grid, .video-section, .test-result-actions, .test-take-actions, .btn{display:none !important}
  .view{padding:0 !important;max-width:100% !important}
  .test-take-question, .test-review-card, .test-overview, .header-card{break-inside:avoid;page-break-inside:avoid;box-shadow:none !important;border:1px solid #999 !important;margin-bottom:14px !important}
}

/* ==== AI TUTOR ==== */
.tutor-fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:var(--primary);border:none;color:#fff;font-size:24px;cursor:pointer;box-shadow:var(--shadow-lg);z-index:100;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .15s}
.tutor-fab:hover{background:#9A4607;transform:scale(1.05)}
.tutor-panel{position:fixed;bottom:0;right:0;width:100%;max-width:400px;height:100%;max-height:600px;background:var(--bg-card);border-top-left-radius:var(--radius-lg);border:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:101;display:none;flex-direction:column;overflow:hidden}
.tutor-panel.is-open{display:flex}
@media (min-width:480px){.tutor-panel{bottom:24px;right:24px;max-height:560px;border-radius:var(--radius-lg)}}
.tutor-header{padding:14px 18px;background:var(--primary);color:#fff;display:flex;justify-content:space-between;align-items:center}
.tutor-title{font-family:var(--serif);font-weight:500;font-size:17px}
.tutor-subtitle{font-size:12px;opacity:.85}
.tutor-close{background:transparent;border:none;color:#fff;font-size:24px;cursor:pointer;line-height:1;padding:0;width:28px;height:28px}
.tutor-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.tutor-msg{padding:10px 14px;border-radius:var(--radius);font-size:14px;line-height:1.5;max-width:85%;white-space:pre-wrap}
.tutor-msg.assistant{background:var(--bg-soft);align-self:flex-start;color:var(--ink)}
.tutor-msg.user{background:var(--primary);color:#fff;align-self:flex-end}
.tutor-msg.error{background:var(--error-bg);color:var(--error);align-self:stretch;font-size:13px}
.tutor-input-row{border-top:1px solid var(--line);padding:12px;display:flex;gap:8px}
.tutor-input{flex:1;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;font-family:var(--sans);font-size:14px;outline:none;resize:none;min-height:40px;max-height:100px}
.tutor-input:focus{border-color:var(--primary)}
.tutor-send{background:var(--primary);color:#fff;border:none;border-radius:var(--radius);padding:0 16px;font-size:14px;font-weight:500;cursor:pointer}
.tutor-send:disabled{background:var(--ink-faint);cursor:not-allowed}

/* ==== DEL 3: SKÄRMTANGENTBORD ==== */
.keypad{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.keypad-digits{display:grid;grid-template-columns:repeat(3,46px);gap:6px}
.keypad-ops{display:grid;grid-template-columns:46px;gap:6px;align-content:start}
.keypad-ops.wide2{grid-template-columns:repeat(2,46px)}
.kp-key{
  height:44px;border:1.5px solid var(--line);border-radius:var(--radius-sm);
  background:var(--bg-card);font-family:var(--mono);font-size:19px;font-weight:600;
  color:var(--ink);cursor:pointer;transition:transform .08s,background .1s,border-color .1s;
  display:flex;align-items:center;justify-content:center;user-select:none;
}
.kp-key:hover{background:var(--c-metod-bg);border-color:var(--c-metod)}
.kp-key:active{transform:scale(.92)}
.kp-key.op{color:var(--c-metod);font-weight:700}
.kp-key.util{background:var(--bg-soft);color:var(--ink-soft);font-size:15px}
.kp-key.span2{grid-column:span 2}
.kp-hint{text-align:center;font-size:12px;color:var(--ink-faint);margin-top:8px}

/* ==== DEL 3: TABELLTRÄNING ==== */
.tabell-level-grid{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.tabell-card{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:16px 18px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--bg-card);cursor:pointer;transition:border-color .12s,transform .12s;
}
.tabell-card:hover{border-color:var(--c-rakna);transform:translateX(2px);box-shadow:var(--shadow-sm)}
.tabell-card-num{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--c-rakna-bg);color:var(--c-rakna);font-weight:700;font-size:18px;
}
.tabell-card-body{flex:1}
.tabell-card-namn{font-weight:600;font-size:15px;color:var(--ink);margin-bottom:2px}
.tabell-card-desc{font-size:13px;color:var(--ink-soft)}
.tabell-fraga{
  font-family:var(--mono);font-size:46px;font-weight:600;color:var(--ink);
  text-align:left;margin:18px 0 6px;letter-spacing:2px;
}
.tabell-fraga .tabell-eq{color:var(--ink-faint)}
.tabell-svar-input{
  width:120px;height:60px;font-family:var(--mono);font-size:34px;font-weight:700;
  text-align:center;border:2.5px solid var(--c-rakna);border-radius:var(--radius);
  background:var(--c-rakna-bg);color:var(--c-rakna);outline:none;display:block;margin:0;
}
.tabell-svar-input:focus{background:#fff;box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.tabell-svar-input.correct{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.tabell-svar-input.wrong{background:var(--error-bg);border-color:var(--error);color:var(--error)}
.tabell-progress{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:14px}
.tabell-progress-bar{
  height:8px;background:var(--bg-soft);border-radius:4px;margin:8px auto 0;max-width:320px;overflow:hidden;
}
.tabell-progress-fill{height:100%;background:var(--c-rakna);transition:width .25s}
.tabell-feedback{
  text-align:center;font-family:var(--mono);font-size:15px;font-weight:600;
  min-height:22px;margin-top:10px;
}
.tabell-feedback.correct{color:var(--success)}
.tabell-feedback.wrong{color:var(--error)}
.tabell-timer{
  text-align:center;font-family:var(--mono);font-size:15px;font-weight:600;
  color:var(--ink-soft);margin-bottom:4px;
}
.tabell-timer .tt-ikon{opacity:.7}
.tabell-tidkort{
  background:var(--c-rakna-bg);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:16px;text-align:center;
}
.tabell-tid-stor{
  font-family:var(--mono);font-size:42px;font-weight:700;color:var(--c-rakna);line-height:1.1;
}
.tabell-tid-rad{font-size:13px;color:var(--ink-soft);margin-top:6px}
.tabell-rekord{
  margin-top:10px;font-size:14px;font-weight:600;
  padding:8px 12px;border-radius:var(--radius-sm);display:inline-block;
}
.tabell-rekord.nytt{background:var(--success-bg);color:var(--success)}
.tabell-rekord.gammalt{background:var(--bg-soft);color:var(--ink-soft)}

/* ==== DEL 3: METODER – ENRADSUPPGIFT ==== */
.mult-metod-uppg{
  background:var(--c-metod-bg);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:16px;
}
.mult-metod-tal{
  font-family:var(--mono);font-size:30px;font-weight:600;color:var(--c-metod);
  text-align:center;margin-bottom:4px;
}
.mult-metod-instr{font-size:13px;color:var(--ink-soft);text-align:center;margin-bottom:14px}
.mult-rad-wrap{display:flex;align-items:center;justify-content:flex-start;gap:8px;flex-wrap:wrap}
.mult-rad-fast{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--ink)}
.mult-rad-input{
  min-width:220px;flex:1 1 100%;max-width:none;height:50px;
  font-family:var(--mono);font-size:18px;font-weight:600;
  text-align:left;border:2px solid var(--c-metod);border-radius:var(--radius);
  background:#fff;color:var(--ink);outline:none;padding:0 10px;
}
.mult-rad-input:focus{box-shadow:0 0 0 3px rgba(180,83,9,.15)}
.mult-rad-input.correct{background:var(--success-bg);border-color:var(--success)}
.mult-rad-input.wrong{background:var(--error-bg);border-color:var(--error)}
.mult-exempel{
  background:var(--bg-warm);border-radius:var(--radius);padding:12px 14px;
  margin-bottom:16px;font-size:13px;line-height:1.7;
}
.mult-exempel strong{color:var(--c-metod)}
.mult-exempel .ex-rad{font-family:var(--mono);color:var(--ink);font-size:14px}

/* ==== DEL 3: BERÄKNINGAR ==== */
.rakna-tal{
  font-family:var(--mono);font-size:28px;font-weight:600;color:var(--c-rakna);
  text-align:center;margin:14px 0 8px;word-break:break-word;line-height:1.3;
}
.rakna-svar-rad{display:flex;align-items:center;justify-content:flex-start;gap:10px;flex-wrap:wrap}
/* Svarsrutan växer och ligger kvar på samma rad som "… =", vänsterjusterat (breda uttrycksrutor undantagna) */
.rakna-svar-rad .rakna-svar-input:not(.rakna-svar-bred){min-width:120px;flex:1 1 140px}
.rakna-svar-fast{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--ink)}
.rakna-svar-input{
  min-width:170px;max-width:340px;height:52px;
  font-family:var(--mono);font-size:24px;font-weight:700;text-align:left;
  border:2.5px solid var(--c-rakna);border-radius:var(--radius);
  background:var(--c-rakna-bg);color:var(--c-rakna);outline:none;padding:0 12px;
}
/* Rutor som håller en hel uträkning (dubbla/halvera, dubbelparentes …) – breda så allt syns */
.rakna-svar-input.rakna-svar-bred{
  min-width:260px;max-width:none;flex:1 1 320px;width:auto;font-size:18px;text-align:left;
}
.rakna-svar-input:focus{background:#fff;box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.rakna-svar-input.correct{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.rakna-svar-input.wrong{background:var(--error-bg);border-color:var(--error);color:var(--error)}
/* Beräkningar – små tal genom förlängning: rakt bråkstreck med två mellanled-rutor + svarsruta */
.div-forlang-rad{display:flex;align-items:center;justify-content:flex-start;gap:14px;flex-wrap:wrap;margin:8px 0 4px}
.div-forlang-lika{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--ink)}
.div-forlang-brak{display:inline-flex;flex-direction:column;align-items:stretch;gap:5px}
.div-forlang-streck{height:3px;background:var(--ink);border-radius:2px;width:100%}
.div-forlang-in,.div-forlang-svar{min-width:96px;max-width:150px;width:96px;text-align:center;padding:0 8px}
.div-forlang-svar{min-width:120px;width:120px}
/* Kompisar (flytta över) – mellanled som tre rutor: [jämnt tal] + [rest] = [svar] */
.kompis-tre-rad{display:flex;align-items:center;justify-content:flex-start;gap:10px;flex-wrap:wrap;margin:6px 0}
.kompis-tre-op{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--ink)}
.kompis-tre-in{min-width:90px;max-width:130px;width:90px;text-align:center;padding:0 8px}
/* Sekvens-rutor (storleksordna + talföljder): rutor växer med innehållet, radbryter i stället för att scrolla */
.seq-block{max-width:100%;margin:16px 0 6px}
.seq-rad{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-start;align-items:center;margin:8px 0}
.seq-ruta{min-width:60px;height:54px;border-radius:var(--radius);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:23px;font-weight:700;padding:0 12px;box-sizing:border-box}
.seq-given{border:2px solid var(--line,#e5e0d8);background:var(--bg-soft,#f5f2ec);color:var(--ink)}
.seq-svar{border:2.5px solid var(--c-rakna);background:var(--c-rakna-bg);color:var(--c-rakna);text-align:center;outline:none}
.seq-svar:focus{background:#fff;box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.seq-svar.correct{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.seq-svar.wrong{background:var(--error-bg);border-color:var(--error);color:var(--error)}
.seq-instr{text-align:center;color:var(--ink-soft,#5a5148);font-size:13.5px;margin:4px 0 2px}
.seq-pil{font-size:24px;color:var(--ink-faint,#8a8177);margin:0 4px}
.kp-nasta{font-weight:700}
.rakna-kat-exempel{
  background:var(--c-rakna-bg);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:16px;font-size:13px;line-height:1.7;
}
.rakna-kat-exempel strong{color:var(--c-rakna)}
.rakna-kat-exempel .ex-rad{font-family:var(--mono);color:var(--ink);font-size:14px}

/* ==== DEL 3: UPPSTÄLLNING MULTIPLIKATION ==== */
.mult-upp-box{
  display:inline-flex;flex-direction:column;align-items:flex-end;gap:2px;
  font-family:var(--mono);padding:16px 22px;background:var(--bg-card);
  border:1px solid var(--line);border-radius:var(--radius);min-width:160px;
}
.mult-upp-row{display:flex;gap:2px;justify-content:flex-end;align-items:center}
.mult-upp-row .cell{
  width:40px;height:44px;display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:500;color:var(--ink);
}
.mult-upp-row .opcell{width:30px;font-size:24px;font-weight:700;color:var(--c-metod)}
.mult-upp-carry{display:flex;gap:2px;justify-content:flex-end;min-height:22px}
.mult-upp-carry .cell{
  width:40px;height:20px;display:flex;align-items:center;justify-content:center;
  font-size:13px;color:var(--error);font-weight:700;
}
.mult-upp-line{width:100%;height:2px;background:var(--ink);margin:5px 0}
.mult-upp-ans{
  width:40px;height:46px;font-family:var(--mono);font-size:24px;font-weight:600;
  text-align:center;border:2px solid var(--c-metod);border-radius:var(--radius-sm);
  background:var(--primary-bg);color:var(--ink);outline:none;padding:0;
}
.mult-upp-ans:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(180,83,9,.15)}
.mult-upp-ans.correct{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.mult-upp-ans.wrong{background:var(--error-bg);border-color:var(--error);color:var(--error)}
.mult-upp-carrin{
  width:30px;height:24px;font-family:var(--mono);font-size:13px;font-weight:700;
  text-align:center;border:1.5px dashed var(--line);border-radius:4px;
  background:var(--bg-soft);color:var(--error);outline:none;padding:0;
}
.mult-upp-carrin:focus{border-color:var(--error);background:var(--error-bg)}
.mult-demo-steg{
  background:var(--bg-warm);border-radius:var(--radius-sm);padding:10px 14px;
  font-size:13px;line-height:1.6;color:var(--ink);margin-top:12px;min-height:20px;
}

/* ==== UPPSTÄLLNING: LAYOUT MED MINNESSIFFROR TILL HÖGER ==== */
.mult-upp-flex{display:flex;align-items:flex-start;gap:14px}
.mult-upp-rows-wrap{display:flex}
.mult-upp-rows{display:flex;flex-direction:column;gap:2px}
.mult-minne-panel{
  border:1px dashed var(--line);border-radius:var(--radius-sm);
  padding:8px 10px;background:var(--bg-soft);max-width:140px;
}
.mult-minne-rubrik{
  font-size:10px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-faint);margin-bottom:6px;text-align:center;
}
.mult-minne-rutor{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.mult-minne-ruta{
  width:30px;height:30px;font-family:var(--mono);font-size:15px;font-weight:700;
  text-align:center;border:1.5px dashed var(--line);border-radius:4px;
  background:#fff;color:var(--error);outline:none;padding:0;cursor:pointer;
}
.mult-minne-ruta:focus{border-color:var(--error);background:var(--error-bg)}
.mult-minne-ruta.struck{
  position:relative;color:var(--ink-faint);
  background:repeating-linear-gradient(135deg,transparent,transparent 9px,var(--error) 9px,var(--error) 11px);
}
.mult-minne-tips{font-size:10px;color:var(--ink-faint);margin-top:7px;line-height:1.4;text-align:center}
.mult-minne-demo-col{
  display:flex;align-items:center;min-width:34px;padding-top:44px;
}
.mult-minne-demo{
  width:30px;height:32px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:17px;font-weight:700;color:var(--error);
}
.mult-minne-demo.struck{
  position:relative;
}
.mult-minne-demo.struck::after{
  content:'';position:absolute;left:-1px;top:50%;width:calc(100% + 2px);height:2px;
  background:var(--error);transform:rotate(-22deg);
}

/* ==== DEL 5 – DIVISION ==== */
.div-delbar-prompt{
  font-size:16px;font-weight:500;color:var(--ink);text-align:center;
  margin:6px 0 14px;line-height:1.5;
}
.div-tal-grid{
  display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:4px 0 6px;
}
.div-tal-tagg{
  min-width:64px;padding:12px 16px;font-family:var(--mono);font-size:20px;font-weight:600;
  border:2px solid var(--line);border-radius:var(--radius-sm);background:#fff;color:var(--ink);
  cursor:pointer;transition:transform .08s,background .12s,border-color .12s;
}
.div-tal-tagg:hover:not(:disabled){border-color:var(--c-metod);transform:translateY(-1px)}
.div-tal-tagg.is-picked{background:var(--primary-bg);border-color:var(--primary);color:var(--ink)}
.div-tal-tagg:disabled{cursor:default}
.div-tal-tagg.tagg-correct{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.div-tal-tagg.tagg-missad{background:#fef3c7;border-color:#f59e0b;color:#92400e}
.div-tal-tagg.tagg-wrong{background:var(--error-bg);border-color:var(--error);color:var(--error)}
.div-gata-card{
  background:var(--bg-warm);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 20px;margin:6px 0 14px;
}
.div-gata-rubrik{
  font-size:10px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-faint);margin-bottom:8px;
}
.div-gata-lista{margin:0;padding-left:22px}
.div-gata-lista li{font-size:15px;line-height:1.7;color:var(--ink)}
.div-metod-steg{margin:14px 0 0;padding-left:22px}
.div-metod-steg li{font-size:14px;line-height:1.7;color:var(--ink);margin-bottom:4px}
/* Kort division */
.div-kort-box{
  display:inline-flex;align-items:center;gap:16px;
  font-family:var(--mono);padding:18px 24px;background:var(--bg-card);
  border:1px solid var(--line);border-radius:var(--radius);
}
.div-kort-frac{display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.div-frac-line{height:2px;background:var(--ink);margin:4px 0}
.div-kort-eq{font-size:26px;font-weight:700;color:var(--c-metod)}
.div-carry-demo{
  width:30px;height:24px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:14px;font-weight:700;color:var(--error);
}
.div-kort-digcell{position:relative;}
.div-kort-carry{
  position:absolute;left:-12px;top:-13px;
  width:21px;height:23px;
  font-family:var(--mono);font-size:13px;font-weight:700;text-align:center;
  color:var(--error);border:1.5px dashed var(--line);border-radius:4px;
  background:#fff;outline:none;padding:0;z-index:2;
}
.div-kort-carry:focus{border-color:var(--error);background:var(--error-bg)}
.div-kort-carry.correct{border-style:solid;border-color:var(--success);background:var(--success-bg);color:var(--success)}
.div-kort-carry.wrong{border-style:solid;border-color:var(--error);background:var(--error-bg);color:var(--error)}
.div-kort-carry-slot{
  position:absolute;left:-12px;top:-13px;
  width:21px;height:23px;line-height:1;
  font-family:var(--mono);font-size:14px;font-weight:700;text-align:center;
  color:var(--ink-faint);border:1.5px dashed var(--line);border-radius:4px;
  background:#fff;cursor:pointer;padding:0;z-index:2;
}
.div-kort-carry-slot:hover{border-color:var(--c-metod);color:var(--c-metod)}
.div-kort-carry-slot:disabled{opacity:.3;cursor:default}
.div-kort-carry-demo{
  position:absolute;left:-12px;top:-13px;
  width:21px;height:23px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:13px;font-weight:700;color:var(--error);
}
/* Lång division */
.div-lang-wall{border-left:2px solid var(--ink);font-weight:500}
/* Liggande stolen: vågrätt streck över HELA (täljare + nämnare), lodrätt streck mellan
   dem, och ett vågrätt streck under nämnaren → nämnaren omsluts (top+vänster+botten). */
.dl-stol{display:flex;align-items:stretch}
.dl-tal{display:flex;gap:2px;align-items:center;border-top:2px solid var(--ink)}
.dl-namn-box{width:40px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:26px;font-weight:500;color:var(--ink);
  border-top:2px solid var(--ink);border-left:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.div-step-line{height:2px;background:var(--line);margin:3px 0}

@media (max-width:600px){
  .layout{padding:16px 12px 100px}
  .header-card{padding:20px}
  .header-title{font-size:24px}
  .ko-card{padding:18px;gap:14px}
  .ko-num{width:40px;height:40px;font-size:22px}
  .ko-name{font-size:17px}
  .exercise-card{padding:20px}
  .formaga-grid{grid-template-columns:1fr}
  .mult-rad-input{min-width:150px}
  .tabell-fraga{font-size:36px}
}

/* ==== DEL 7: PRIORITERINGSREGELN OCH LAGAR ==== */
.prio-eq-rad{
  display:flex;align-items:center;justify-content:center;gap:8px;
  flex-wrap:wrap;margin:26px 0;
}
.prio-eq-part{
  font-family:var(--mono);font-size:30px;font-weight:600;color:var(--ink);
}
.prio-box-input{
  width:84px;height:60px;
  font-family:var(--mono);font-size:28px;font-weight:700;text-align:center;
  border:2.5px dashed var(--c-rakna);border-radius:var(--radius-sm);
  background:var(--c-rakna-bg);color:var(--c-rakna);outline:none;padding:0;
}
.prio-box-input:focus{background:#fff;box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.prio-box-input.correct{background:var(--success-bg);border-color:var(--success);border-style:solid;color:var(--success)}
.prio-box-input.wrong{background:var(--error-bg);border-color:var(--error);border-style:solid;color:var(--error)}
.prio-expr-stor{
  font-family:var(--mono);font-size:32px;font-weight:600;
  text-align:center;color:var(--ink);margin:26px 0 6px;
}
.prio-expr-eq{color:var(--ink-faint);}
.prio-metod-trappa{
  margin:22px 0;padding:20px 22px;
  background:var(--bg-warm);border:1px solid var(--line);border-radius:var(--radius);
  display:inline-flex;flex-direction:column;gap:10px;
}
.prio-uppgift-rad,.prio-steg{
  display:grid;
  grid-template-columns:minmax(170px,auto) 30px minmax(130px,auto);
  align-items:center;gap:10px;
}
.prio-uppgift-expr{font-family:var(--mono);font-size:25px;font-weight:600;color:var(--ink);text-align:right;white-space:nowrap;}
.prio-eq{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--ink-faint);text-align:center;}
.prio-vl,.prio-svar{
  height:46px;font-family:var(--mono);font-size:22px;text-align:center;
  border:2px dashed var(--line);border-radius:10px;background:var(--bg-soft);color:var(--ink);
}
.prio-vl{min-width:170px;}
.prio-svar{min-width:130px;}
.prio-vl:focus,.prio-svar:focus{outline:none;background:#fff;border-style:solid;box-shadow:0 0 0 3px rgba(22,163,74,.15);}
.prio-vl.correct,.prio-svar.correct{background:var(--success-bg);border-color:var(--success);border-style:solid;color:var(--success);}
.prio-vl.wrong,.prio-svar.wrong{background:var(--error-bg);border-color:var(--error);border-style:solid;color:var(--error);}
.prio-tom{display:inline-block;}
/* Beräkningar (prio · rakna): uttryck = [mellanled] = [svar] på EN rad, vänsterjusterat */
.prio-ber-rad{display:flex;align-items:center;justify-content:flex-start;gap:12px;flex-wrap:wrap;margin:16px 0 4px;}
.prio-ber-eq{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--ink);}
.prio-ber-in{text-align:left;padding:0 12px;}
.prio-ber-mellan{min-width:150px;max-width:230px;width:170px;}
.prio-ber-svar{min-width:96px;max-width:150px;width:110px;}
.prio-metod-trappa-GAMMAL{
  display:grid;
  grid-template-columns:minmax(0,max-content) max-content minmax(0,max-content);
  justify-content:center;align-items:center;
  column-gap:10px;row-gap:9px;
}
.prio-step-line{display:contents;}
.prio-step-lhs{
  display:flex;align-items:center;flex-wrap:wrap;gap:6px;justify-content:flex-end;
  font-family:var(--mono);font-size:24px;color:var(--ink);
}
.prio-step-eq{
  font-family:var(--mono);font-size:24px;font-weight:600;color:var(--ink-faint);
}
.prio-step-rhs{display:flex;align-items:center;}
.prio-step-expr .prio-step-lhs{font-size:26px;font-weight:600;}
.prio-step-expr .prio-step-eq{font-size:26px;}
.prio-step-fix{color:var(--ink);font-weight:500;}
.prio-step-input{
  width:62px;height:46px;
  font-family:var(--mono);font-size:21px;font-weight:700;text-align:center;
  border:2px solid var(--c-rakna);border-radius:var(--radius-sm);
  background:var(--c-rakna-bg);color:var(--c-rakna);outline:none;padding:0;
}
.prio-step-input:focus{background:#fff;box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.prio-step-input.correct{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.prio-step-input.wrong{background:var(--error-bg);border-color:var(--error);color:var(--error)}
.prio-step-answer{width:90px;height:50px;font-size:24px;border-width:2.5px;}
.prio-step-op{
  width:44px;border-color:var(--c-metod);
  background:var(--primary-bg);color:var(--c-metod);
}
.prio-step-op:focus{background:#fff;box-shadow:0 0 0 3px rgba(180,83,9,.15)}
.prio-rad{
  display:flex;align-items:center;flex-wrap:wrap;gap:7px;justify-content:center;
  margin:24px 0;padding:20px 22px;
  background:var(--bg-warm);border:1px solid var(--line);border-radius:var(--radius);
}
.prio-rad-expr{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--ink);}
.prio-rad-eq{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--ink-faint);}


/* ==== DEL 8: NEGATIVA TAL ==== */
.neg-fraga{text-align:left;margin:22px 0 6px;font-size:18px;color:var(--ink);line-height:1.5;}
.neg-expr{font-family:var(--mono);font-size:30px;font-weight:600;color:var(--ink);}
/* Del 4 — bråk-display (täljare över nämnare) + bråk-input i drillarna */
.bd-frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;font-family:var(--mono);font-weight:600;color:var(--ink);font-size:23px;}
.bd-tal{padding:0 9px 2px;line-height:1.05;}
.bd-strk{height:2px;background:currentColor;width:100%;min-width:26px;}
.bd-nmn{padding:2px 9px 0;line-height:1.05;}
.bd-fraga-rad{font-size:23px;align-items:center;}
.bd-eq{margin:0 8px;font-size:22px;color:var(--ink-soft);flex:0 0 auto;}
.bd-dec{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--ink);}
.bd-svarin{flex:0 0 auto;width:110px;text-align:center;}
.bd-frac-in{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;}
.bd-cellin{width:58px;height:36px;text-align:center;font-family:var(--mono);font-size:19px;font-weight:600;border:2px solid var(--c-rakna,#16a34a);border-radius:6px;background:#fff;color:var(--ink);outline:none;padding:0;margin:2px 0;}
.bd-cellin:focus{box-shadow:0 0 0 3px rgba(22,163,74,.18);}
.bd-cellin.correct{border-color:var(--success,#16a34a);background:var(--success-bg,#dcfce7);color:var(--success,#15803d);}
.bd-cellin.wrong{border-color:var(--error,#dc2626);background:var(--error-bg,#fee2e2);color:var(--error,#b91c1c);}
.bd-frac-in .bd-strk{min-width:52px;background:var(--ink);}
.neg-hint{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);text-align:center;margin:18px 0 8px;}
.neg-seq{display:flex;align-items:center;justify-content:flex-start;flex-wrap:wrap;gap:10px;margin:22px 0;}
.neg-seq-term{
  min-width:54px;height:50px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:22px;font-weight:600;color:var(--ink);
  background:var(--bg-warm);border:1px solid var(--line);border-radius:var(--radius-sm);padding:0 10px;
}
.neg-seq-input{
  width:74px;height:50px;
  font-family:var(--mono);font-size:21px;font-weight:700;text-align:center;
  border:2.5px dashed var(--c-rakna);border-radius:var(--radius-sm);
  background:var(--c-rakna-bg);color:var(--c-rakna);outline:none;padding:0;
}
.neg-seq-input:focus{background:#fff;box-shadow:0 0 0 3px rgba(22,163,74,.15);}
.neg-seq-input.correct{background:var(--success-bg);border-style:solid;border-color:var(--success);color:var(--success);}
.neg-seq-input.wrong{background:var(--error-bg);border-style:solid;border-color:var(--error);color:var(--error);}
.neg-chip-row,.neg-order-row{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:11px;margin:6px 0;}
.neg-chip{
  min-width:56px;height:48px;padding:0 14px;
  font-family:var(--mono);font-size:20px;font-weight:600;
  border:2px solid var(--c-metod);border-radius:var(--radius-sm);
  background:#fff;color:var(--ink);cursor:pointer;transition:transform .08s,opacity .12s;
}
.neg-chip:hover:not([disabled]){transform:translateY(-1px);}
.neg-chip.is-placed{opacity:.3;cursor:default;}
.neg-slot{
  position:relative;min-width:62px;height:52px;padding:0 12px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:20px;font-weight:600;border-radius:var(--radius-sm);
}
.neg-slot.is-empty{border:2px dashed var(--line);background:var(--bg-soft);color:var(--ink-faint);}
.neg-slot.is-filled{border:2px solid var(--c-metod);background:var(--primary-bg);color:var(--ink);cursor:pointer;}
.neg-slot.is-right{border-color:var(--success);background:var(--success-bg);color:var(--success);}
.neg-slot.is-wrong{border-color:var(--error);background:var(--error-bg);color:var(--error);}
.neg-slot-badge{
  position:absolute;top:-9px;left:-9px;width:20px;height:20px;border-radius:50%;
  background:var(--ink);color:#fff;font-family:var(--sans);font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}


/* ==== DEL 9: AVRUNDNING OCH ÖVERSLAGSRÄKNING ==== */
.avr-fraga{text-align:left;margin:22px 0 6px;font-size:18px;color:var(--ink);line-height:1.6;}
.avr-expr{font-family:var(--mono);font-size:28px;font-weight:600;color:var(--ink);}
.avr-opt-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:11px;margin:22px 0;
}
.avr-opt{
  height:58px;
  font-family:var(--mono);font-size:21px;font-weight:600;
  border:2px solid var(--c-metod);border-radius:var(--radius-sm);
  background:#fff;color:var(--ink);cursor:pointer;transition:transform .08s,background .12s;
}
.avr-opt:hover:not([disabled]){transform:translateY(-1px);background:var(--bg-soft);}
.avr-opt.is-correct{border-color:var(--success);background:var(--success-bg);color:var(--success);}
.avr-opt.is-wrong{border-color:var(--error);background:var(--error-bg);color:var(--error);}
.avr-opt[disabled]{cursor:default;}

/* ==== REPETITIONS-BANNER (startsidan) ==== */
.rep-banner{
  display:flex;align-items:center;gap:20px;
  margin:0 0 28px;padding:20px 24px;
  background:linear-gradient(135deg, var(--c-rakna-bg) 0%, var(--bg-card) 100%);
  border:1px solid var(--line);border-left:4px solid var(--c-rakna);
  border-radius:var(--radius);
  animation:fadeUp .4s ease both;
}
.rep-banner-icon{
  font-size:30px;flex-shrink:0;
  width:56px;height:56px;border-radius:50%;
  background:#fff;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
}
.rep-banner-text{flex:1;min-width:0;}
.rep-banner-eyebrow{
  font-family:var(--mono);font-size:10px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--c-rakna);
  margin-bottom:4px;
}
.rep-banner-title{
  font-family:var(--serif);font-size:19px;font-weight:500;
  letter-spacing:-.005em;color:var(--ink);line-height:1.35;margin-bottom:3px;
}
.rep-banner-sub{font-size:13px;color:var(--ink-soft);line-height:1.5;}
.rep-banner-btn{
  flex-shrink:0;
  background:var(--c-rakna);color:#fff;border:none;
  padding:11px 22px;border-radius:var(--radius-sm);
  font-family:var(--sans);font-size:14px;font-weight:600;
  cursor:pointer;transition:background .15s, transform .12s;
  white-space:nowrap;
}
.rep-banner-btn:hover{background:#15803d;transform:translateY(-1px);}
.rep-banner-skip{
  background:none;border:none;color:var(--ink-faint);
  font-family:var(--sans);font-size:12px;cursor:pointer;
  padding:8px 12px;text-decoration:underline;text-underline-offset:3px;
  transition:color .15s;flex-shrink:0;
}
.rep-banner-skip:hover{color:var(--ink-soft);}
@media(max-width:640px){
  .rep-banner{flex-wrap:wrap;gap:14px;}
  .rep-banner-btn{width:100%;}
}
/* ── Positionssystemet ── */
.pos-markerad{display:inline-block;background:var(--primary,#B45309);color:#fff;border-radius:5px;padding:0 6px;font-weight:700;}
.pos-tl-svarsrad{display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-start;margin:8px 0 4px;}
.pos-tl-svar{display:inline-flex;align-items:center;gap:7px;}
.pos-tl-bok{font-family:var(--cinzel,'Cinzel');font-weight:700;color:#b91c1c;}
.pos-tl-in{border:2px solid var(--primary,#B45309);border-radius:6px;height:34px;text-align:center;font-size:17px;font-weight:600;}
.pos-tl-in.correct{border-color:#16a34a;background:#ecfdf5;}
.pos-tl-in.wrong{border-color:#dc2626;background:#fef2f2;}
.pos-jamfor-rad{display:flex;align-items:center;justify-content:flex-start;gap:16px;font-size:26px;font-weight:600;margin:14px 0;flex-wrap:wrap;}
.pos-jamfor-knappar{display:inline-flex;gap:8px;}
.pos-jamfor-btn{font-family:'Source Serif 4',Georgia,serif;width:48px;height:48px;font-size:22px;font-weight:700;
  cursor:pointer;border:2px solid var(--line,#d8cfc0);border-radius:9px;background:#fff;color:var(--ink,#12110f);
  transition:background .15s,border-color .15s,color .15s;}
.pos-jamfor-btn:hover{border-color:var(--primary,#B45309);}
.pos-jamfor-btn.is-vald{background:var(--primary,#B45309);border-color:var(--primary,#B45309);color:#fff;}
.pos-jamfor-btn.correct{background:#16a34a;border-color:#16a34a;color:#fff;}
.pos-jamfor-btn.wrong{background:#dc2626;border-color:#dc2626;color:#fff;}
.ovn-mark{font-weight:700;margin-left:6px;font-size:17px;}
.ovn-mark.ok{color:#16a34a;} .ovn-mark.fel{color:#dc2626;}
.ovn-fasit{font-size:13px;color:var(--ink-faint,#7a6e65);margin-left:6px;font-style:italic;}
.ova-konfetti-lager{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9999;}
.tu-knapp-rad{display:flex;gap:12px;justify-content:flex-start;flex-wrap:wrap;margin:14px 0;}
.tu-knapp{font-family:'Source Serif 4',Georgia,serif;min-width:96px;padding:12px 26px;font-size:18px;font-weight:600;
  cursor:pointer;border:2px solid var(--line,#d8cfc0);border-radius:10px;background:#fff;color:var(--ink,#12110f);
  transition:background .15s,border-color .15s,color .15s,transform .1s;}
.tu-knapp:hover:not(:disabled){border-color:var(--primary,#B45309);transform:translateY(-1px);}
.tu-knapp:disabled{cursor:default;}
.tu-knapp.correct{background:#16a34a;border-color:#16a34a;color:#fff;}
.tu-knapp.wrong{background:#dc2626;border-color:#dc2626;color:#fff;}
.ova-konfetti{position:absolute;width:10px;height:14px;top:-30px;border-radius:2px;opacity:0;animation:ova-konfetti-fall linear forwards;}
@keyframes ova-konfetti-fall{0%{transform:translateY(0) rotate(0deg);opacity:1;}100%{transform:translateY(110vh) rotate(720deg);opacity:1;}}

function isPrime(n){
  if(n<2)return false;
  if(n===2)return true;
  if(n%2===0)return false;
  for(let i=3;i*i<=n;i+=2)if(n%i===0)return false;
  return true;
}
function primeFactorize(n){
  const f=[];let x=n;
  for(let p=2;p*p<=x;p++){while(x%p===0){f.push(p);x/=p}}
  if(x>1)f.push(x);
  return f;
}
function sortAsc(a){return [...a].sort((x,y)=>x-y)}
function randPick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rInt(a,b){return Math.floor(Math.random()*(b-a+1))+a}          // slumpheltal [a,b]
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;} // för enklaste form (gcd=1)
function komma(x){return String(x).replace('.',',')}                    // 0.04 → "0,04" (svensk decimal)
function avr(x,d){const p=Math.pow(10,d==null?3:d);return Math.round(x*p)/p}// avrunda bort flyttalsbrus

const state = {
  currentDel: null,
  currentKO: null,
  currentFormaga: null,
  // Tutor's "verdict" per (ko, formaga)
  tutorScores: {}, // {ko: {formaga: {correct: n, total: m}}}
  // Self-assessment storage

};

function getTutorScore(koId, formagaKey){
  if(!state.tutorScores[koId])state.tutorScores[koId]={};
  if(!state.tutorScores[koId][formagaKey])state.tutorScores[koId][formagaKey]={correct:0,total:0,score:0};
  var raw = state.tutorScores[koId][formagaKey];
  // Returnera en proxy som även för in repetitions-bokföring.
  // Befintliga övningar gör t.ex. "ts.total++; if(ok) ts.correct++;" – båda
  // sker i samma "turn". Vi skjuter upp registreringen till nästa mikrotask
  // så att vi hunnit se eventuell correct-ökning innan vi avgör rätt/fel.
  if(typeof repRegister !== 'function') return raw;
  if(raw.__proxied) return raw.__proxy;
  var lastTotal = raw.total, lastCorrect = raw.correct, pending = false;
  function flush(){
    pending = false;
    if(raw.total > lastTotal){
      var blevRatt = raw.correct > lastCorrect;
      lastTotal = raw.total; lastCorrect = raw.correct;
      try{ repRegister(koId, formagaKey, blevRatt); } catch(e){}
    }
  }
  var p = new Proxy(raw, {
    set: function(obj, prop, val){
      obj[prop] = val;
      if((prop === 'total' || prop === 'correct') && !pending){
        pending = true;
        Promise.resolve().then(flush);
      }
      return true;
    }
  });
  raw.__proxied = true;
  raw.__proxy = p;
  return p;
}

const VERDICT_TEXT = {kan:'Kan', osaker:'Osäker', kanej:'Kan ej'};

function tutorVerdictFor(koId, formagaKey){
  const ts = state.tutorScores[koId] && state.tutorScores[koId][formagaKey];
  if(!ts || ts.total === 0) return null;
  if(formagaKey === 'resonera'){
    const avg = (ts.score||0)/ts.total;
    if(avg >= 0.75) return 'kan';
    if(avg >= 0.4) return 'osaker';
    return 'kanej';
  }
  const ratio = ts.correct/ts.total;
  if(ratio >= 0.8) return 'kan';
  if(ratio >= 0.5) return 'osaker';
  return 'kanej';
}

function getSummaryCopy(right, total){
  if(right === total){
    const msgs = [
      'Helt galet bra – alla rätt! Du har full koll på det här.',
      'Imponerande! Inte ett enda fel.',
      'Fullt hus! Du behärskar verkligen det här.',
      'Felfritt! Du har stenkoll.',
      'Wow, alla rätt! Snyggt jobbat.'
    ];
    return {emoji:'🌟', title:'Alla rätt!', message: randPick(msgs), celebration:true};
  }
  if(right >= total - 1){
    return {emoji:'🎉', title:'Riktigt bra jobbat!', message:'Nästan alla rätt – bara ett misstag. Du är på god väg!', celebration:true};
  }
  if(right >= Math.ceil(total * 0.75)){
    return {emoji:'👍', title:'Bra jobbat!', message:'De flesta rätt. Med lite mer träning sitter det.', celebration:false};
  }
  if(right >= Math.ceil(total * 0.5)){
    return {emoji:'💪', title:'Bra ansträngning!', message:'Du har koll på en del. Träna lite till så blir det säkrare.', celebration:false};
  }
  return {emoji:'🌱', title:'Bra att du försöker!', message:'Här finns lite att jobba på. Titta på förklaringarna och försök igen – det här kommer!', celebration:false};
}

/**
 * Returns HTML for a summary card. Caller wires up the button onclick.
 * level: 1, 2, 3 or null
 * levelChange: 'up' | 'down' | null
 */
function renderSummaryCard(opts){
  const {right, total, level, levelChange, nextLabel='Ny omgång'} = opts;
  const summary = getSummaryCopy(right, total);
  // Alla rätt → konfettiregn (fyras när sammanfattningen målats).
  if(total > 0 && right === total && typeof ovaKonfetti === 'function') setTimeout(ovaKonfetti, 150);
  let levelMsg = '';
  if(levelChange === 'up') levelMsg = `↑ Nivå upp till ${level} – nu blir det svårare!`;
  else if(levelChange === 'down') levelMsg = `↓ Nivå ner till ${level} – vi tar det lite lugnare.`;
  return `
    <div class="summary-card ${summary.celebration?'celebration':''}">
      <div class="summary-emoji bounce">${summary.emoji}</div>
      <h3 class="summary-title ${summary.celebration?'celebration':''}">${summary.title}</h3>
      <div class="summary-score">${right} / ${total}</div>
      <p class="summary-message">${summary.message}</p>
      ${levelMsg ? `<div class="summary-level-change ${levelChange==='down'?'down':''}">${levelMsg}</div>` : ''}
      <div class="summary-actions">
        <button class="btn primary" id="summary-next-btn">${nextLabel}</button>
        <button class="btn" onclick="navTo('ko',{koId:'${state.currentKO}'})">Tillbaka</button>
      </div>
    </div>
  `;
}

/**
 * Adaptive level adjustment: ≥(total-1) right = level up, ≤floor(total/3) = level down
 * Returns new {level, change}
 */
function ramMaxNiva(){ return (typeof RAM_MAXNIVA === 'number' && RAM_MAXNIVA >= 1) ? RAM_MAXNIVA : 3; }
function adjustLevel(level, right, total){
  // Nivå-modell: klättrar men sjunker ALDRIG. Svårigheten går upp när eleven
  // bemästrar; på en miss faller den inte tillbaka – man får fler uppgifter på
  // samma nivå tills det sitter. Nuvarande nivå = golv (högsta uppnådda).
  // Taket är färdighetens verkliga nivå-antal (RAM_MAXNIVA, satt av ?maxniva=N;
  // default 3). En enkel-nivå-färdighet (max 1) klättrar aldrig.
  if(right >= total - 1 && level < ramMaxNiva()) return {level: level+1, change: 'up'};
  return {level, change: null};
}

const RESONERA_FRAGOR = [
  {q:'Varför är talet 27 inte ett primtal? Förklara med egna ord.',
   rubric:'Eleven ska visa att 27 går att skriva som en produkt av tal större än 1 (t.ex. 3 · 9 eller 3 · 3 · 3). Bra svar förklarar att 27 har fler delare än bara 1 och 27, eller hänvisar till siffersumman 9 (delbart med 3).'},
  {q:'En elev säger: "Talet 1 måste vara ett primtal eftersom det bara är delbart med 1 och sig självt." Vad svarar du?',
   rubric:'Eleven ska känna till regeln att primtal är heltal STÖRRE ÄN 1. Bra svar pekar ut att definitionen utesluter 1, gärna med en motivering.'},
  {q:'Varför är 2 det enda jämna primtalet?',
   rubric:'Eleven ska förklara att alla andra jämna tal är delbara med 2 (förutom 2 självt), så de har minst tre delare: 1, 2 och sig själva. Därför är de sammansatta.'},
  {q:'Två elever delar upp 36 olika i sina faktorträd. Anna börjar med 4·9 och Berit med 6·6. Får de samma primfaktorer i slutet? Varför?',
   rubric:'Eleven ska förklara att även om vägen är olika så är primfaktorerna alltid samma (här 2·2·3·3). Det kallas att faktoriseringen är entydig. Mindre bra svar säger bara "ja samma" utan motivering.'},
  {q:'Är talet 91 ett primtal? Förklara hur du tänker.',
   rubric:'91 är INTE ett primtal: 91 = 7·13. Bra svar visar att eleven testat delbarhet (kanske med 7) eller hittat faktoriseringen. Vanlig felaktighet är att stanna efter delbarhetsregler för 2, 3, 5 och säga "ja det är primtal".'}
];

function renderPrimtalResonera(body){
  let currentQ = randPick(RESONERA_FRAGOR);
  let omgangResults = []; // array of scores
  const OMGANG_SIZE = 3;
  let answered = false;

  function render(){
    body.innerHTML = `
      <div class="exercise-card">
        ${exerciseHeader('Resonera · förklara med egna ord', `Fråga ${omgangResults.length + 1} av ${OMGANG_SIZE} · tutorn ger återkoppling.`)}
        <div class="res-task">
          <div class="res-question">${currentQ.q}</div>
          <textarea class="res-textarea" id="res-input" placeholder="Skriv din förklaring..."></textarea>
          <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;">
            <button class="btn primary" id="res-submit">Skicka till tutorn</button>
            <button class="btn" id="res-next" style="display:none;">${omgangResults.length + 1 >= OMGANG_SIZE ? 'Se resultat' : 'Nästa fråga'}</button>
            <button class="btn subtle" onclick="navTo('ko',{koId:'primtal'})">Tillbaka</button>
          </div>
          <div class="res-loading" id="res-loading" style="display:none;">Tutorn läser ditt svar...</div>
          <div class="res-feedback" id="res-fb"></div>
        </div>
      </div>
    `;
    answered = false;
    document.getElementById('res-submit').onclick = submitAnswer;
    document.getElementById('res-next').onclick = ()=>{
      if(omgangResults.length >= OMGANG_SIZE){
        showSummary();
      } else {
        currentQ = randPick(RESONERA_FRAGOR.filter(f=>f.q!==currentQ.q));
        render();
      }
    };
  }

  async function submitAnswer(){
    if(answered) return;
    const text = document.getElementById('res-input').value.trim();
    if(!text){ alert('Skriv något i rutan först.'); return; }
    const btn = document.getElementById('res-submit');
    const loading = document.getElementById('res-loading');
    const fb = document.getElementById('res-fb');
    btn.disabled = true;
    loading.style.display = 'block';
    fb.classList.remove('show');

    try{
      const r = await assessReasoning(currentQ.q, currentQ.rubric, text);
      fb.innerHTML = `<strong>Tutorns återkoppling</strong>${r.feedback}`;
      fb.classList.add('show');
      const ts = getTutorScore('primtal','resonera');
      ts.total++;
      ts.score = (ts.score||0) + r.score;
      if(r.score >= 0.7) ts.correct++;
      omgangResults.push(r.score);
      answered = true;
      document.getElementById('res-next').style.display = 'inline-flex';
      btn.style.display = 'none';
    }catch(e){
      fb.innerHTML = `<strong>Tutorns återkoppling</strong>Kunde inte få återkoppling just nu (${e.message}). Försök igen om en stund.`;
      fb.classList.add('show');
      btn.disabled = false;
    }finally{
      loading.style.display = 'none';
    }
  }

  function showSummary(){
    const right = omgangResults.filter(s => s >= 0.7).length;
    const total = omgangResults.length;
    body.innerHTML = `
      <div class="exercise-card">
        ${exerciseHeader('Resonera · förklara med egna ord', `Tutorn bedömde ${right} av ${total} svar som godkända.`)}
        ${renderSummaryCard({right, total})}
      </div>
    `;
    document.getElementById('summary-next-btn').onclick = ()=>{
      omgangResults = [];
      currentQ = randPick(RESONERA_FRAGOR);
      render();
    };
  }

  render();
}

async function assessReasoning(question, rubric, answer){
  const systemPrompt = `Du är en vänlig matematiklärare för svenska högstadieelever (åk 7). Bedöm elevens resonemang om primtal och delbarhet.

Du får tre saker:
1. Frågan eleven besvarade
2. En rubric som beskriver vad ett bra svar innehåller
3. Elevens svar

Ge konstruktiv återkoppling på 2-4 meningar. Lyft fram det eleven gör bra och peka på något som kan utvecklas. Var uppmuntrande men ärlig. Skriv på svenska.

Avsluta med en JSON-rad EXAKT så här: \`\`\`json
{"score": 0.85}
\`\`\`
där score är 0.0–1.0 baserat på hur väl svaret motsvarar rubricen.`;

  const userMsg = `Fråga: ${question}\n\nRubric: ${rubric}\n\nElevens svar: "${answer}"\n\nGe återkoppling och poäng.`;

  const res = await aiFetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 600,
      system: systemPrompt,
      messages: [{role:'user', content: userMsg}]
    })
  });
  if(!res.ok) throw new Error(`API ${res.status}`);
  const data = await res.json();
  const text = data.content.map(c=>c.text||'').join('').trim();
  const scoreMatch = text.match(/```json\s*\{\s*"score"\s*:\s*([\d.]+)\s*\}\s*```/);
  const score = scoreMatch ? parseFloat(scoreMatch[1]) : 0.5;
  const feedback = text.replace(/```json[\s\S]*?```/g,'').trim();
  return {feedback: `<p style="margin:0;white-space:pre-wrap;">${feedback}</p>`, score};
}

function exerciseHeader(title, sub, level){
  const MAXNIVA = ramMaxNiva();
  // Klättrande stege visas bara för flernivå-färdigheter (max ≥ 2). En enkel-nivå-
  // färdighet (max 1) visar ingen segment-stege – bara drillen.
  const visaStege = level && MAXNIVA >= 2;
  const niva = Math.min(level || 1, MAXNIVA);
  // NIVÅBRYGGA (B3): exponera aktuell drill-nivå så mastery-hooken kan logga den. Additivt.
  if(typeof window !== 'undefined') window.__aktuellNiva = visaStege ? niva : null;
  const levelLabel = visaStege ? `Nivå ${niva} av ${MAXNIVA}` : '';
  const dots = visaStege ? Array.from({length:MAXNIVA}).map((_,i)=>`<i class="${i<niva?'filled':''}${i===niva-1?' aktuell':''}"></i>`).join('') : '';
  return `
    <div class="exercise-header">
      <div>
        <h2 class="exercise-title">${title}</h2>
        <p class="exercise-sub">${sub}</p>
      </div>
      ${visaStege?`<div class="difficulty-badge">${levelLabel} <span class="dots stege">${dots}</span></div>`:''}
    </div>
  `;
}

      <p class="header-sub">Gå igenom kunskaperna i hela kapitlet och kryssa i. När du är klar visar tutorn sin bedömning baserad på dina övningar så att du kan jämföra.</p>
    </div>

    ${sections.map((s, sIdx)=>`
      <div class="exercise-card" style="margin-bottom:18px;">
        <h3 style="font-family:var(--serif);font-weight:500;font-size:19px;margin:0 0 14px;letter-spacing:-0.01em;color:var(--ink);display:flex;align-items:center;gap:10px;">
          <span style="display:inline-flex;width:30px;height:30px;background:var(--primary-bg);color:var(--primary);border-radius:50%;align-items:center;justify-content:center;font-size:14px;font-weight:600;">${s.ko.nr}</span>
          ${s.ko.titel}
        </h3>
        <div class="skattning-list">
          ${s.fragor.map((f, fIdx)=>{
            const globalIdx = allQuestions.findIndex(q=>q.koId===s.ko.id && q.text===f.text);
            return `
              <div class="skattning-row" data-gi="${globalIdx}" data-koid="${s.ko.id}" data-fkey="${f.key}">
                <div class="skattning-text">${f.text}</div>
                <div class="skattning-buttons">
                  <button class="skattning-btn" data-value="kan">Kan</button>
                  <button class="skattning-btn" data-value="osaker">Osäker</button>
                  <button class="skattning-btn" data-value="kanej">Kan ej</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `).join('')}

    <div id="skattning-progress-card" class="exercise-card" style="text-align:center;background:var(--bg-warm);">
      <p style="margin:0 0 10px;color:var(--ink-soft);font-size:14px;" id="skattning-progress-text">Du har svarat på 0 av ${allQuestions.length} punkter.</p>
      <button class="btn primary" id="show-comparison-btn" disabled>Visa tutorns bedömning</button>
    </div>

    <div id="comparison-block" style="display:none;"></div>

  const answers = {};

  body.querySelectorAll('.skattning-row').forEach(row=>{
    const gi = parseInt(row.dataset.gi);
    row.querySelectorAll('.skattning-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        row.querySelectorAll('.skattning-btn').forEach(b=>b.classList.remove('is-selected'));
        btn.classList.add('is-selected');
        row.classList.add('is-answered');
        answers[gi] = btn.dataset.value;
        updateProgress();
      });
    });
  });

  function updateProgress(){
    const count = Object.keys(answers).length;
    const total = allQuestions.length;
    document.getElementById('skattning-progress-text').textContent = `Du har svarat på ${count} av ${total} punkter.`;
    const showBtn = document.getElementById('show-comparison-btn');
    showBtn.disabled = count < total;
    if(count === total){
      showBtn.onclick = ()=> showKapitelComparison(allQuestions, answers);
    }
  }

  showView('skattning');
  updateTutorContext();
}

function showKapitelComparison(allQuestions, answers){
  const block = document.getElementById('comparison-block');
  block.style.display = 'block';

  let matches = 0, mismatches = 0, untested = 0;

  // Gruppera comparison också per ko
  const sectionsHtml = KUNSKAPSOMRADEN.map(ko=>{
    const fragor = SKATTNINGSFRAGOR[ko.id] || [];
    if(fragor.length === 0) return '';
    const rows = fragor.map(f=>{
      const gi = allQuestions.findIndex(q=>q.koId===ko.id && q.text===f.text);
      const self = answers[gi];
      const tutor = tutorVerdictFor(ko.id, f.key);
      let match = false;
      if(!tutor) untested++;
      else if(tutor === self){ matches++; match = true; }
      else mismatches++;
      return `
        <div class="comparison-row ${tutor?(match?'is-match':'is-mismatch'):''}">
          <div class="comparison-text">${f.text}</div>
          <div class="comparison-cell">
            <div class="comparison-label">Du</div>
            <div class="comparison-value ${self}">${VERDICT_TEXT[self]}</div>
          </div>
          <div class="comparison-cell">
            <div class="comparison-label">Tutorn</div>
            <div class="comparison-value ${tutor||''}">${tutor?VERDICT_TEXT[tutor]:'Ej testat'}</div>
          </div>
        </div>
      `;
    }).join('');
    return `
      <div class="exercise-card" style="margin-bottom:16px;">
        <h3 style="font-family:var(--serif);font-weight:500;font-size:17px;margin:0 0 14px;letter-spacing:-0.01em;color:var(--ink);display:flex;align-items:center;gap:10px;">
          <span style="display:inline-flex;width:26px;height:26px;background:var(--primary-bg);color:var(--primary);border-radius:50%;align-items:center;justify-content:center;font-size:13px;font-weight:600;">${ko.nr}</span>
          ${ko.titel}
        </h3>
        ${rows}
      </div>
    `;
  }).join('');

  let summary = '';
  if(matches > 0 && mismatches === 0 && untested === 0){
    summary = 'Din skattning stämmer väl med hur du faktiskt löste uppgifterna. Bra självkännedom!';
  } else {
    if(mismatches > 0) summary = `Du och tutorn skattade dig olika på ${mismatches} ${mismatches===1?'punkt':'punkter'}. Det är värdefullt att prata med din lärare om var skillnaden ligger. `;
    if(untested > 0) summary += `${untested} ${untested===1?'rad':'rader'} har inte testats än – gör övningarna för att få tutorns bedömning där också.`;
  }

  block.innerHTML = `
    <div class="header-card" style="margin-bottom:18px;">
      <h2 style="font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 8px;letter-spacing:-.01em;">Din skattning vs tutorns bedömning</h2>
      <p style="margin:0;color:var(--ink-soft);font-size:14px;">${summary || 'Gör övningarna för att få tutorns bedömning.'}</p>
    </div>
    ${sectionsHtml}
    <div style="text-align:center;margin-top:16px;">
      <button class="btn" onclick="navTo('kapitel')">Tillbaka till kapitlet</button>
    </div>
  `;

  block.scrollIntoView({behavior:'smooth', block:'start'});
}

const tutorFab = document.getElementById('tutor-fab');
const tutorPanel = document.getElementById('tutor-panel');
const tutorClose = document.getElementById('tutor-close');
const tutorMessages = document.getElementById('tutor-messages');
const tutorInput = document.getElementById('tutor-input');
const tutorSend = document.getElementById('tutor-send');
const tutorContextEl = document.getElementById('tutor-context');
let tutorHistory = [];
let tutorWelcomed = false;

function updateTutorContext(){
  let label = 'Kapitel 1 · Taluppfattning';
  if(state.currentKO){
    const ko = [...KUNSKAPSOMRADEN, ...Object.values(DELAR_KO).flat()].find(k=>k.id===state.currentKO);
    if(ko) label = `Område ${ko.nr}: ${ko.titel}`;
    if(state.currentFormaga){
      label += ` · ${FORMAGOR[state.currentFormaga].label}`;
    }
  }
  tutorContextEl.textContent = label;
}

function getTutorScope(){
  if(state.currentKO){
    const ko = [...KUNSKAPSOMRADEN, ...Object.values(DELAR_KO).flat()].find(k=>k.id===state.currentKO);
    return `Eleven jobbar just nu med "${ko.titel}". Begränsa din hjälp till det här ämnet. Om eleven frågar om annat: säg vänligt att du bara hjälper med just det här avsnittet.`;
  }
  return 'Eleven jobbar med kapitel 1 om taluppfattning. Hjälp med ämnen som rör positionssystemet, primtal, faktorträd, delbarhet, eller liknande.';
}

tutorFab.addEventListener('click', ()=>{
  tutorPanel.classList.add('is-open');
  if(!tutorWelcomed){
    appendTutor('assistant','Hej! Jag hjälper dig med kapitel 1. Fastnar du på något kan du fråga mig. Jag ger inte direkta svar på övningarna, men jag ger ledtrådar och förklarar begrepp.');
    tutorWelcomed = true;
  }
});
tutorClose.addEventListener('click', ()=> tutorPanel.classList.remove('is-open'));
tutorInput.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendTutor(); }
});
tutorSend.addEventListener('click', sendTutor);

async function sendTutor(){
  const msg = tutorInput.value.trim();
  if(!msg) return;
  tutorInput.value = '';
  appendTutor('user', msg);
  tutorHistory.push({role:'user', content: msg});
  tutorSend.disabled = true;
  const loadingEl = appendTutor('assistant','...');
  try{
    const res = await aiFetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 500,
        system: `Du är en vänlig matematiktutor för svenska högstadieelever (åk 7). ${getTutorScope()}

Pedagogiska principer:
- Ge inte direkta svar på övningsuppgifter. Hjälp eleven tänka genom motfrågor eller ledtrådar.
- Använd svenska matematiska begrepp: primtal, sammansatt tal, primfaktor, faktorträd, delbarhet, siffersumma.
- Gångertecken skrivs alltid som · (mittpunktsprick), inte × eller *.
- Svara kort (1-3 meningar) om eleven inte behöver längre förklaring.
- Var uppmuntrande men inte överdrivet beröm-givande.`,
        messages: tutorHistory
      })
    });
    if(!res.ok) throw new Error(`API ${res.status}`);
    const data = await res.json();
    const reply = data.content.map(c=>c.text||'').join('').trim();
    loadingEl.textContent = reply;
    tutorHistory.push({role:'assistant', content: reply});
  } catch(e){
    loadingEl.classList.add('error');
    loadingEl.textContent = `Kunde inte nå tutorn (${e.message}).`;
  } finally {
    tutorSend.disabled = false;
    tutorMessages.scrollTop = tutorMessages.scrollHeight;
  }
}

function appendTutor(role, text){
  const el = document.createElement('div');
  el.className = `tutor-msg ${role}`;
  el.textContent = text;
  tutorMessages.appendChild(el);
  tutorMessages.scrollTop = tutorMessages.scrollHeight;
  return el;
}

// Hjälp: visa tal med komma
function posKomma(x){ return String(Math.round(x*1e6)/1e6).replace('.', ','); }
// Jämför elevsvar mot facit (tillåt komma/punkt, mellanslag, unicode-minus)
function jamforTal(a, b){
  if(a == null) return false;
  var s = String(a).replace(/\s/g,'').replace(/\u2212/g,'-').replace(',', '.');
  if(s === '') return false;
  var n = parseFloat(s);
  if(isNaN(n)) return false;
  return Math.abs(n - b) < 1e-9;
}
// Konfetti-regn (vid högst ett fel)
function ovaKonfetti(){
  var gammal=document.querySelector('.ova-konfetti-lager'); if(gammal) gammal.remove();
  var lager=document.createElement('div'); lager.className='ova-konfetti-lager'; document.body.appendChild(lager);
  var farger=['#16a34a','#dc2626','#f59e0b','#3b82f6','#a855f7','#ec4899','#06b6d4'];

function posRandTal(intMin, intMax, dec){
  // slumpa ett tal med 'dec' decimaler
  var heltal = d3RandInt(intMin, intMax);
  if(!dec) return heltal;
  var d = d3RandInt(0, Math.pow(10,dec)-1);
  return Math.round((heltal + d/Math.pow(10,dec))*1e6)/1e6;
}

// ---- Tallinje-ritare (samma som plugg-till-prov) ----
function posRitaTallinje(cfg){
  var W = 680, H = 120, mLeft=40, mRight=40, lineY=78;
  var x0=mLeft, x1=W-mRight;
  function px(v){ return x0 + (v-cfg.start)/(cfg.slut-cfg.start)*(x1-x0); }
  var svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:680px;height:auto;font-family:\'Source Serif 4\',Georgia,serif;">';
  svg+='<line x1="'+(x0-10)+'" y1="'+lineY+'" x2="'+(x1+14)+'" y2="'+lineY+'" stroke="#12110f" stroke-width="2"/>';
  svg+='<polygon points="'+(x1+14)+','+lineY+' '+(x1+6)+','+(lineY-5)+' '+(x1+6)+','+(lineY+5)+'" fill="#12110f"/>';
  if(cfg.delstreck && cfg.huvudsteg){
    var litet=cfg.huvudsteg/cfg.delstreck;
    var antal=Math.round((cfg.slut-cfg.start)/litet);
    for(var i=0;i<=antal;i++){
      var varde=cfg.start+i*litet, x=px(varde);
      var arHuvud=Math.abs(Math.round((varde-cfg.start)/cfg.huvudsteg)*cfg.huvudsteg-(varde-cfg.start))<1e-9;
      if(arHuvud){
        svg+='<line x1="'+x+'" y1="'+(lineY-9)+'" x2="'+x+'" y2="'+(lineY+9)+'" stroke="#12110f" stroke-width="2"/>';
        if(cfg.visaTal!==false) svg+='<text x="'+x+'" y="'+(lineY+26)+'" text-anchor="middle" font-size="13" fill="#3d3630">'+posKomma(varde)+'</text>';
      } else {
        svg+='<line x1="'+x+'" y1="'+(lineY-5)+'" x2="'+x+'" y2="'+(lineY+5)+'" stroke="#7a6e65" stroke-width="1"/>';
      }
    }
  } else if(cfg.utsatta){
    cfg.utsatta.forEach(function(u){
      var x=px(u);
      svg+='<line x1="'+x+'" y1="'+(lineY-9)+'" x2="'+x+'" y2="'+(lineY+9)+'" stroke="#12110f" stroke-width="2"/>';
      svg+='<text x="'+x+'" y="'+(lineY+26)+'" text-anchor="middle" font-size="13" fill="#3d3630">'+posKomma(u)+'</text>';
    });
  }
  if(cfg.markeringar){
    cfg.markeringar.forEach(function(m){
      var x=px(m.varde);
      svg+='<line x1="'+x+'" y1="28" x2="'+x+'" y2="'+(lineY-12)+'" stroke="#b91c1c" stroke-width="2"/>';
      svg+='<polygon points="'+x+','+(lineY-10)+' '+(x-5)+','+(lineY-18)+' '+(x+5)+','+(lineY-18)+'" fill="#b91c1c"/>';
      svg+='<circle cx="'+x+'" cy="18" r="13" fill="#b91c1c"/>';
      svg+='<text x="'+x+'" y="23" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">'+m.bok+'</text>';
    });
  }
  svg+='</svg>';
  return svg;
}

// HJÄLPFUNKTIONER FÖR ADD/SUB
// ============================================================
function genAddTask(level){
  // level 1: 2-siffriga + 2-siffriga (inga minnessiffror garanterade)
  // level 2: 3-siffriga + 3-siffriga
  // level 3: 4-siffriga + 3-siffriga (mer komplex, minnessiffror)
  const ranges = [[10,99],[100,999],[1000,9999]];
  const [lo, hi] = ranges[Math.min(level-1, 2)];
  const bHi = level === 3 ? 999 : hi;
  const a = lo + Math.floor(Math.random() * (hi - lo + 1));
  const b = (level === 3 ? 100 : lo) + Math.floor(Math.random() * (bHi - (level===3?100:lo) + 1));
  return {a, b, answer: a + b, op:'+'};
}

function genSubTask(level){
  const ranges = [[10,99],[100,999],[1000,9999]];
  const [lo, hi] = ranges[Math.min(level-1, 2)];
  const a = lo + Math.floor(Math.random() * (hi - lo + 1));
  const b = lo + Math.floor(Math.random() * (a - lo + 1)); // b <= a
  return {a, b, answer: a - b, op:'-'};
}

// Bryt ner ett tal i tusen/hundra/tiotal/ental
function breakDown(n){
  const parts = [];
  const t = Math.floor(n/1000); if(t) parts.push({v:t*1000, label:`${t}·1000`});
  const h = Math.floor((n%1000)/100); if(h) parts.push({v:h*100, label:`${h}·100`});
  const ti = Math.floor((n%100)/10); if(ti) parts.push({v:ti*10, label:`${ti}·10`});
  const e = n%10; if(e) parts.push({v:e, label:`${e}`});
  return parts;
}

      const self = answers[i];
      const tutor = tutorVerdictFor(rad.ko, rad.key);

      if(!tutor){ untested++; }
      else if(tutor === self){ match++; cls = 'is-match'; }
      else { mismatch++; cls = 'is-mismatch'; }

        + '<div class="matris-ai-body" id="matris-ai-body">Tutorn läser igenom din skattning …</div>'
      + '</div>';

    block.scrollIntoView({behavior:'smooth', block:'start'});
    fetchTutorDiskussion(match, mismatch, untested);
  }

  async function fetchTutorDiskussion(match, mismatch, untested){
    const aiBody = document.getElementById('matris-ai-body');

    const punkter = MULT_MATRIS.map(function(rad, i){
      const tutor = tutorVerdictFor(rad.ko, rad.key);
      const tutorTxt = tutor ? VERDICT_TEXT[tutor] : 'ej testat';
      return '- ' + rad.text + ' | elevens skattning: ' + VERDICT_TEXT[answers[i]] + ' | tutorns bedömning: ' + tutorTxt;
    }).join('\n');

    const userPrompt = 'Här är en elevs självskattning för multiplikation, jämförd med tutorns bedömning (byggd på elevens övningsresultat).\n\n'
      + punkter + '\n\n'
      + 'Skriv en kort, uppmuntrande genomgång på svenska riktad direkt till eleven (åk 7). '
      + 'Lyft först kort det som stämmer bra. Fokusera sedan på raderna där elevens skattning och tutorns bedömning skiljer sig: '
      + 'förklara vänligt vad skillnaden kan bero på och ge ett konkret tips på vad eleven kan träna på. '
      + 'Nämn också om något inte testats än. Håll det till 4–7 meningar, inga punktlistor.';

    try{
      const res = await aiFetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 500,
          system: 'Du är en vänlig matematiktutor för svenska högstadieelever (åk 7). '
            + 'Du hjälper eleven förstå sin egen självskattning i multiplikation. '
            + 'Var konkret, snäll och uppmuntrande utan överdrivet beröm. '
            + 'Gångertecken skrivs alltid som · (mittpunktsprick). Svara på svenska i löpande text.',
          messages: [{role:'user', content: userPrompt}]
        })
      });
      if(!res.ok) throw new Error('API ' + res.status);
      const data = await res.json();
      const reply = data.content.map(function(c){ return c.text || ''; }).join('').trim();
      aiBody.textContent = reply || 'Tutorn hade inget att tillägga just nu.';
    } catch(e){
      aiBody.classList.add('error');
      aiBody.textContent = 'Kunde inte hämta tutorns genomgång (' + e.message + '). '
        + 'Jämförelsen ovan visar ändå var din skattning och tutorns bedömning skiljer sig.';
    }
  }

  render();
  showView('skattning');
  updateTutorContext();
}

// --- Tiokompisar och hundrakompisar ---
function renderKompisar(body, backFn){
  let omgang = [];
  let idx = 0;
  let results = [];

  function genOmgang(){
    const tio = [];
    shuffle([1,2,3,4,5,6,7,8,9]).slice(0,4).forEach(function(x){
      tio.push({typ:'tio', x:x, svar:10 - x});
    });
    const hundra = [];
    const huKand = [];
    for(let n=11; n<=89; n++){ if(n % 10 !== 0) huKand.push(n); }
    shuffle(huKand).slice(0,4).forEach(function(x){
      hundra.push({typ:'hundra', x:x, svar:100 - x});
    });
    return tio.concat(hundra);
  }

  function renderSummary(){
    const right = results.filter(function(x){ return x; }).length;
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Tiokompisar och hundrakompisar', 'Du klarade ' + right + ' av ' + results.length + '.')
      + renderSummaryCard({right:right, total:results.length, nextLabel:'Kör igen'})
      + '<div style="margin-top:-8px;text-align:center;"><button class="btn subtle" id="kompis-back">Tillbaka</button></div>'
    + '</div>';
    document.getElementById('summary-next-btn').onclick = function(){
      omgang = genOmgang(); idx = 0; results = []; renderFraga();
    };
    document.getElementById('kompis-back').onclick = backFn;
  }

  function renderFraga(){
    if(idx >= omgang.length){ renderSummary(); return; }
    const t = omgang[idx];
    const right = results.filter(function(x){ return x; }).length;
    const fragetext = t.typ === 'tio'
      ? 'Vilket tal är tiokompis till ' + t.x + '?'
      : 'Vilket tal är hundrakompis till ' + t.x + '?';
    const hint = t.typ === 'tio'
      ? 'Tiokompisar är två tal som tillsammans blir 10.'
      : 'Hundrakompisar är två tal som tillsammans blir 100.';
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader('Tiokompisar och hundrakompisar', hint)
      + '<div class="rakna-tal">' + fragetext + '</div>'
      + '<div class="rakna-svar-rad"><input type="text" class="rakna-svar-input" id="kompis-input" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="?"></div>'
      + '<div class="tabell-feedback" id="kompis-fb"></div>'
      + keypadHTML([])
      + '<div class="tabell-progress">Tal ' + (idx+1) + ' av ' + omgang.length + ' · ' + right + ' rätt'
        + '<div class="tabell-progress-bar"><div class="tabell-progress-fill" style="width:' + Math.round((idx/omgang.length)*100) + '%"></div></div>'
      + '</div>'
      + '<div style="margin-top:14px;text-align:center;">'
        + '<button class="btn primary" id="kompis-svara">Svara</button>'
        + '<button class="btn subtle" id="kompis-back">Tillbaka</button>'
      + '</div>'
    + '</div>';
    const card = body.querySelector('.exercise-card');
    bindKeypad(card);
    const input = document.getElementById('kompis-input');
    setTimeout(function(){ input.focus(); }, 50);
    let done = false;

    function advance(correct){
      if(done) return;
      done = true;
      results.push(correct);
      const ts = getTutorScore('add-begrepp','rakna');
      const tsG = getTutorScore('add-begrepp','kompisar');
      ts.total++; tsG.total++;
      if(correct){ ts.correct++; tsG.correct++; }
      const fb = document.getElementById('kompis-fb');
      input.disabled = true;
      document.getElementById('kompis-svara').disabled = true;
      if(correct){
        input.classList.add('correct');
        fb.className = 'tabell-feedback correct';
        fb.textContent = 'Rätt!';
        setTimeout(function(){ idx++; renderFraga(); }, 400);
      } else {
        input.classList.add('wrong');
        fb.className = 'tabell-feedback wrong';
        fb.textContent = t.x + ' + ' + t.svar + ' = ' + (t.typ==='tio'?'10':'100');
        setTimeout(function(){ idx++; renderFraga(); }, 1300);
      }
    }
    function matches(){
      const v = parseInt(input.value, 10);
      return !isNaN(v) && v === t.svar;
    }
    input.addEventListener('input', function(){ if(matches()) advance(true); });
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); if(input.value.trim() !== '') advance(matches()); }
    });
    document.getElementById('kompis-svara').onclick = function(){
      if(input.value.trim() !== '') advance(matches());
    };
    document.getElementById('kompis-back').onclick = backFn;
  }

  omgang = genOmgang();
  renderFraga();
}

      const delar = raw.split('+').map(function(s){ return s.trim(); }).filter(function(s){ return s !== ''; });
      let res;
      if(!raw){
        res = {ok:false, msg:'Skriv dina termer på raden, t.ex. 7 + 5.'};
      } else if(delar.length !== t.antal){
        res = {ok:false, msg:'Du ska skriva exakt ' + ordAntal + ' termer med + emellan.'};
      } else {
        let summa = 0, fel = null;
        for(let i=0; i<delar.length; i++){
          const v = Number(delar[i]);
          if(!Number.isInteger(v) || v < 0){ fel = '"' + delar[i] + '" är inte ett helt tal.'; break; }
          if(v <= 3){ fel = 'Termen ' + v + ' är inte godkänd – talen 1, 2 och 3 får inte användas.'; break; }
          summa += v;
        }
        if(fel) res = {ok:false, msg:fel};
        else if(summa !== t.mal) res = {ok:false, msg:'Termerna blir tillsammans ' + summa + ', men de ska bli ' + t.mal + '.'};
        else res = {ok:true};
      }

      input.disabled = true;
      document.getElementById('delaupp-check').disabled = true;
      const ts = getTutorScore('add-begrepp','rakna');
      const tsG = getTutorScore('add-begrepp','delaupp');
      ts.total++; tsG.total++;
      if(res.ok){
        input.classList.add('correct');
        fb.classList.add('correct');
        fb.textContent = 'Rätt! ' + t.mal + ' = ' + raw + '  ✓';
        ts.correct++; tsG.correct++;
      } else {
        input.classList.add('wrong');
        fb.classList.add('wrong');
        fb.textContent = res.msg;
      }
      results.push(res.ok);
      setTimeout(function(){ idx++; render(); }, res.ok ? 1800 : 2800);
    }
  }

  omgang = genOmgang();
  render();
}

    document.getElementById('kf-back').onclick = backFn;

// ============================================================
// DEL 4 — Bråkform och decimalform. Fyra drillar (en per Öva-avdelning), samma
// tal som Öva-bladen (delad källa: js/motor/metod/metod-brak-decimal.js,
// window.BrakDecimalGen). Varje drill loggar till sin egen nod → färgar kartan.
// ============================================================
function bdFracHTML(t, n){
  return '<span class="bd-frac"><span class="bd-tal">' + t + '</span>'
    + '<span class="bd-strk"></span><span class="bd-nmn">' + n + '</span></span>';
}
function bdDec(x){ return String(x).replace('.', ','); }
// Bråk med två inmatningsrutor (täljare/nämnare)
function bdFracInHTML(){
  return '<span class="bd-frac-in"><input class="bd-cellin" id="bd-t" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="?">'
    + '<span class="bd-strk"></span>'
    + '<input class="bd-cellin" id="bd-n" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="?"></span>';
}
function bdSummary(right, total){
  var allt = right === total;
  if(allt && typeof visaKonfetti === 'function') setTimeout(visaKonfetti, 120);
  return '<div style="text-align:center;margin-top:20px;">'
    + '<div style="font-size:22px;font-weight:600;color:var(--ink);">' + right + ' <span style="font-size:15px;color:var(--ink-faint);font-weight:400;">av ' + total + ' rätt</span></div>'
    + '<div style="font-size:14px;color:var(--ink-soft);margin:6px 0 16px;">' + (allt ? 'Alla rätt – snyggt jobbat!' : 'Bra – fortsätt öva.') + '</div>'
    + '<button class="btn primary" id="bd-next">Fortsätt</button></div>';
}
// Delad drill-motor. cfg: {title, sub, koId, ops, gen, fraga(task), check(task, card)→{ok,facit}}
function renderBdDrill(body, cfg){
  var omgang = [], idx = 0, results = [], OMG = cfg.OMG || 8;
  function genOmgang(){ var a = []; for(var i = 0; i < OMG; i++) a.push(cfg.gen()); return a; }
  function render(){
    if(idx >= omgang.length){
      var right = results.filter(function(x){ return x; }).length, total = results.length;
      body.innerHTML = '<div class="exercise-card">' + exerciseHeader(cfg.title, 'Du klarade ' + right + ' av ' + total + '.')
        + bdSummary(right, total) + '</div>';
      var nb = document.getElementById('bd-next');
      if(nb) nb.onclick = function(){ omgang = genOmgang(); idx = 0; results = []; render(); };
      return;
    }
    var task = omgang[idx];
    body.innerHTML = '<div class="exercise-card">'
      + exerciseHeader(cfg.title, cfg.sub)
      + renderScoreBarSimple(results.filter(function(x){ return x; }).length, results.filter(function(x){ return !x; }).length, omgang.length, idx)
      + '<div class="rakna-svar-rad bd-fraga-rad">' + cfg.fraga(task) + '</div>'
      + '<div class="rakna-uppdela-feedback" id="bd-fb"></div>'
      + keypadHTML(cfg.ops || [','])
      + '<div style="margin-top:16px;text-align:center;"><button class="btn primary" id="bd-check">Kontrollera</button></div>'
    + '</div>';
    var card = body.querySelector('.exercise-card');
    bindKeypad(card);
    var inputs = card.querySelectorAll('input');
    if(inputs[0]) setTimeout(function(){ inputs[0].focus(); }, 50);
    inputs.forEach(function(inp, i){ inp.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); if(i + 1 < inputs.length) inputs[i+1].focus(); else check(); } }); });
    document.getElementById('bd-check').onclick = check;
    function check(){
      var fb = document.getElementById('bd-fb');
      fb.className = 'rakna-uppdela-feedback show';
      inputs.forEach(function(i){ i.disabled = true; });
      document.getElementById('bd-check').disabled = true;
      var ts = getTutorScore(cfg.koId, 'rakna'); ts.total++;
      var res = cfg.check(task, card);
      inputs.forEach(function(i){ i.classList.add(res.ok ? 'correct' : 'wrong'); });
      if(res.ok){ fb.classList.add('correct'); fb.textContent = 'Rätt! ' + res.facit; ts.correct++; }
      else { fb.classList.add('wrong'); fb.textContent = 'Inte rätt. ' + res.facit; }
      results.push(res.ok);
      setTimeout(function(){ idx++; render(); }, res.ok ? 1700 : 2600);
    }
  }
  omgang = genOmgang();
  render();
}
// Hjälp: läs bråk-input (täljare/nämnare) och kolla värde + enklaste form
function bdCheckFrac(card, mal){
  var t = parseInt(card.querySelector('#bd-t').value, 10), n = parseInt(card.querySelector('#bd-n').value, 10);
  return !isNaN(t) && !isNaN(n) && n !== 0 && Math.abs(t / n - mal) < 1e-9 && window.BrakDecimalGen.gcd(t, n) === 1;
}

// 1 · Bråk → decimal

    title:'Bråk → decimal', sub:'Skriv bråket i decimalform. Använd komma för decimaltecken.', koId:'bd-vaxla', ops:[','],

// 4 · Förläng till hundradelar och skriv som decimaltal
function renderForlangDec(body){
  renderBdDrill(body, {
    title:'Förläng till hundradelar', sub:'Förläng bråket till hundradelar och skriv decimaltalet.', koId:'bd-forlang', ops:[','],

    fraga:function(t){ return bdFracHTML(t.t, t.n) + '<span class="bd-eq">=</span>'

      + '<span class="bd-eq">=</span><input type="text" class="rakna-svar-input bd-svarin" id="bd-a" inputmode="decimal" maxlength="10" autocomplete="off" placeholder="?">'; },
