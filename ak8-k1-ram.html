  --primary:#B45309; --primary-soft:#FED7AA; --primary-bg:#FFF7ED;
  --success:#16a34a; --success-bg:#dcfce7; --error:#dc2626; --error-bg:#fee2e2;
  --line:#e5e0d8; --bg-card:#ffffff; --bg-soft:#f9f5f0; --bg-warm:#fdf6ec;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06); --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05); --shadow-lg:0 8px 24px rgba(0,0,0,.1);
  --radius:10px; --radius-sm:6px; --radius-lg:14px;
  --nav-bg:#0f1e2e; --nav-gold:#c49a40; --paper:#f6f1e8; --paper-lt:#faf7f1; --paper-dk:#ede6d6;

  --c-metod:#B45309; --c-metod-bg:#FFF7ED; --c-kommunikation:#7c3aed; --c-kommunikation-bg:#f5f3ff;
  --c-resonera:#be185d; --c-resonera-bg:#fdf2f8; --c-problem:#d97706; --c-problem-bg:#fffbeb;

  --cinzel:'Cinzel','Times New Roman',serif; --display:'Cormorant Garamond',Georgia,serif;

html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}

<!-- Åk 8: delad taxonomi (k1+k2, single-source) + delad logg + delad provbyggar-modul. Motorn/taxonomin orörda. -->
<script src="js/data/k1-taxonomi.js"></script>
<script src="js/data/k2-taxonomi.js"></script>
<script src="js/data/ak8-k1-bok.js"></script>
<script src="js/mastery.js"></script>
<script src="js/mastery-k2.js"></script>
<script src="js/provbyggare/provbyggar-motor.js"></script>
<script>
(function(){
  var hs = location.search || '';

  // ── OPTION 3: syntetisera en åk8-PROVBYGGAR-TAXONOMI ur boken (projektion, källtaxonomin orörd) ──
  // AK8_K1_BOK mappar delkapitel → noder (inverterat mot k1/k2). Vi klonar de refererade noderna och
  // stämplar varje klon med visning.utbudslista = 'ak8d'+nr och grupp = delkapitlets titel, så modulens
  // utbudslista-drivna gruppering visar exakt bokens delkapitel. Belief-noder (resonera + visuella figurer)
  // utesluts — de bor i självskattningen, inte i provbyggaren.
  var K1 = (window.K1_TAXONOMI && (window.K1_TAXONOMI.noder || window.K1_TAXONOMI)) || [];
  var K2 = (window.K2_TAXONOMI && (window.K2_TAXONOMI.noder || window.K2_TAXONOMI)) || [];
  var BY_ID = {}; K1.concat(K2).forEach(function(n){ if(!BY_ID[n.id]) BY_ID[n.id] = n; });

  var BELIEF_FIGUR = { 'andel-figur:rakna':1, 'andel-tallinje:begrepp':1, 'pot-begrepp:figur':1 };
  function isBelief(n){ return n.formaga === 'RESONERA' || !!BELIEF_FIGUR[n.id]; }

  var BOK = (window.AK8_K1_BOK && window.AK8_K1_BOK.delkapitel || []).slice().sort(function(a,b){ return a.nr - b.nr; });
  var AK8_BOK_DELKAPITEL = BOK.map(function(d){ return { del: 'ak8d' + d.nr, titel: d.titel }; });

  var seen = {}, AK8_NODER = [];
  BOK.forEach(function(d){
    var rad = 0;
    d.blad.forEach(function(b){
      (b.noder || []).forEach(function(nid){
        if(seen[nid]) return;                 // en färdighet visas en gång, i sitt första delkapitel
        var src = BY_ID[nid]; if(!src) return; // okänt id → hoppa (rapporteras ej här; scan fångar det)
        if(isBelief(src)){ seen[nid] = true; return; }  // belief → självskattningen, ej provbyggaren
        seen[nid] = true;
        var vis = src.visning || {};
        AK8_NODER.push(Object.assign({}, src, {
          visning: {
            utbudslista: 'ak8d' + d.nr,
            grupp: d.titel,
            gruppordning: 0,
            radordning: rad++,
            titel: (vis.titel || src.namn),
            etikett: (vis.etikett || ''),
            formagaKey: (vis.formagaKey || String(src.formaga || '').toLowerCase()),
            niva: null
          }
        }));
      });
    });
  });
  var AK8_TAXONOMI = { kapitel: 'ak8-k1', noder: AK8_NODER };

  // Kombinerad mastery (k1 + k2). lasMatris slås ihop; masteryState + loggaForsok routas per nod
  // (bråk → MasteryK2, övrigt → Mastery). Delas byte-identiskt från de befintliga loggarna.
  var K2_IDS = {}; K2.forEach(function(n){ K2_IDS[n.id] = 1; });
  function ak8MastFor(nod){ return (K2_IDS[nod] ? window.MasteryK2 : window.Mastery); }
  var AK8_MASTERY = {
    lasMatris: function(){
      var m1 = (window.Mastery && window.Mastery.lasMatris) ? window.Mastery.lasMatris() : {};
      var m2 = (window.MasteryK2 && window.MasteryK2.lasMatris) ? window.MasteryK2.lasMatris() : {};
      return Object.assign({}, m1, m2);
    },
    masteryState: function(cell, a, b, c){
      var fn = (window.Mastery && window.Mastery.masteryState) || (window.MasteryK2 && window.MasteryK2.masteryState);
      try { return fn ? fn(cell, a, b, c) : 0; } catch(e){ return 0; }
    },
    loggaForsok: function(nod, res){                 // parity: prov → rätt logg (k1/k2) → färgar rätt kart-cell
      var m = ak8MastFor(nod); if(m && m.loggaForsok) m.loggaForsok(nod, res);
    }
  };

  // ── ÅTTAN TEST-GENERATORER (Väg A, bundna till karta-synliga noder via GEN_NOD) ──
  // Content i åttans ram; mekanismen (ProvbyggarMotor) orörd. Facit speglar drillens matematik
  // (potens-drill.js) — drillmotorn INTE anropad. Hjälpare lokala (undvik global-krock).
  var G = ProvbyggarMotor.gen;
  function ri(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
  var AK8_TEST_GENERATORS = {
    // Del 8 · Potenser — kärnan (rent åttan-innehåll)
    'pot-begrepp:skriva': { snabb: [ G.numeric('gt-pot-skriva', 'Skriv som potens', 'pot-begrepp:skriva', function(){
      var b = ri(2, 9), e = ri(2, 6), mult = []; for(var i = 0; i < e; i++) mult.push(b);
      return { key:'skriv'+b+'_'+e, prompt:'Skriv som en potens med basen '+b+' — vilken exponent?    '+mult.join(' · ')+' = '+b+'^▢', ans:e, expl:mult.join(' · ')+' = '+b+'^'+e+'.' };
    }) ] },
    'pot-begrepp:evaluera': { snabb: [ G.numeric('gt-pot-eval', 'Beräkna potensens värde', 'pot-begrepp:evaluera', function(){
      var b, e, v; do { b = ri(2, 9); e = ri(2, 4); v = Math.pow(b, e); } while(v > 1000);
      return { key:'eval'+b+'_'+e, prompt:'Beräkna:    '+b+'^'+e, ans:v, expl:b+'^'+e+' = '+v+'.' };
    }) ] },
    'pot-multdiv:rakna': { snabb: [ G.mellanledNum('gt-pot-multdiv', 'Exponent-lagen (mult och div)', 'pot-multdiv:rakna', function(){
      var b = ri(2, 6), typ = pick(['mult', 'div', 'blandat']);
      if(typ === 'mult'){
        var m = ri(2, 7), n = ri(2, 7); while(m + n > 12){ m = ri(2, 7); n = ri(2, 7); } var res = m + n;
        return { key:'m'+b+'_'+m+'_'+n, prompt:'Räkna ut med exponent-lagen:    '+b+'^'+m+' · '+b+'^'+n,
          led:[ { fraga:'lägg ihop exponenterna: '+m+' + '+n, varde:res, facit:String(res) } ],
          slutVarde:res, slutHint:'svarets exponent, '+b+'^▢', expl:b+'^'+m+' · '+b+'^'+n+' = '+b+'^('+m+'+'+n+') = '+b+'^'+res+'.' };
      }
      if(typ === 'div'){
        var mm = ri(5, 12), nn = ri(2, mm - 1); if(mm - nn > 9) nn = mm - ri(1, 9); var res2 = mm - nn;
        return { key:'d'+b+'_'+mm+'_'+nn, prompt:'Räkna ut med exponent-lagen:    '+b+'^'+mm+' / '+b+'^'+nn,
          led:[ { fraga:'dra bort exponenterna: '+mm+' − '+nn, varde:res2, facit:String(res2) } ],
          slutVarde:res2, slutHint:'svarets exponent, '+b+'^▢', expl:b+'^'+mm+' / '+b+'^'+nn+' = '+b+'^('+mm+'−'+nn+') = '+b+'^'+res2+'.' };
      }
      var p = ri(2, 6), q = ri(2, 6), r = ri(2, Math.min(p + q - 1, 8)); var s1 = p + q, res3 = s1 - r;
      return { key:'bl'+b+'_'+p+'_'+q+'_'+r, prompt:'Räkna ut med exponent-lagen:    ('+b+'^'+p+' · '+b+'^'+q+') / '+b+'^'+r,
        led:[ { fraga:'täljarens exponent: '+p+' + '+q, varde:s1, facit:String(s1) }, { fraga:'dela — dra bort '+r+': '+s1+' − '+r, varde:res3, facit:String(res3) } ],
        slutVarde:res3, slutHint:'svarets exponent, '+b+'^▢', expl:'('+b+'^'+p+' · '+b+'^'+q+') / '+b+'^'+r+' = '+b+'^('+p+'+'+q+'−'+r+') = '+b+'^'+res3+'.' };
    }) ] }
  };
  var AK8_GEN_NOD = {
    'gt-pot-skriva':'pot-begrepp:skriva', 'gt-pot-eval':'pot-begrepp:evaluera', 'gt-pot-multdiv':'pot-multdiv:rakna'
  };

  // ── PROVBYGGAR-HOST (egen ram → per-instans-state, ingen krock med k1/k2) ──
  var app = document.getElementById('app');
  var PB_SHELL = false;
  function pbShell(){
    if(PB_SHELL) return;
    app.innerHTML = '<div id="pb-host">'
      + '<section class="pb-view" data-pbv="test-config"><div id="test-config-body"></div></section>'
      + '<section class="pb-view" data-pbv="test-take" hidden><a href="#" class="hero-back" id="test-take-back">← Tillbaka till inställningar</a><div id="test-take-body"></div></section>'
      + '<section class="pb-view" data-pbv="test-result" hidden><div id="test-result-body"></div></section>'
      + '</div>';
    PB_SHELL = true;
  }
  function pbShow(v){ var h = document.getElementById('pb-host'); if(!h) return;
    h.querySelectorAll('.pb-view').forEach(function(el){ el.hidden = (el.dataset.pbv !== v); }); }
  function pbNav(view){
    if(view === 'test-config' || view === 'test-take' || view === 'test-result'){
      pbShell();
      if(view === 'test-config') PB.render.config();
      else if(view === 'test-take') PB.render.take();
      else PB.render.result();
    }
  }

  var PB = ProvbyggarMotor.montera({
    taxonomi: function(){ return AK8_TAXONOMI; },     // lat (samma mönster som k1/k2)
    mastery:  function(){ return AK8_MASTERY; },
    bokDelkapitel: AK8_BOK_DELKAPITEL,                // 10 delkapitel ur AK8_K1_BOK
    generators: AK8_TEST_GENERATORS, genNod: AK8_GEN_NOD,   // batch 1: potensernas kärna (3 noder byggbara)
    eyebrow: 'Åk 8 · Taluppfattning — tal, räkning och bråk',   // bråk ÄR tal → ingår i taluppfattningen
    nav: { navTo: pbNav, showView: pbShow, updateTutorContext: function(){} }
  });

  // Deeplink: ?view=test-config[&del=ak8dN] (från delkapitlens "Visa vad du kan"-flik)
  if(/[?&]view=test-config/i.test(hs)){
    var mdel = hs.match(/[?&]del=([a-z0-9]+)/i);
    PB.setDel(mdel ? mdel[1] : null);
    pbNav('test-config');
  } else {
    pbNav('test-config');   // ramen har bara provbyggaren → öppna konfigvyn direkt
  }

  // Embed (om delkapitel-sidan bäddar in provbyggaren i iframe)
  if(/[?&]embed=1\b/.test(hs)){
    document.body.classList.add('embed');
    (function(){
      var sist = 0;
      function rap(){ var h = Math.max(document.body.scrollHeight, document.body.offsetHeight) + 4; if(h && Math.abs(h - sist) > 2){ sist = h; try { parent.postMessage({ __fardHeight: h }, '*'); } catch(e){} } }
      if(window.ResizeObserver){ try { new ResizeObserver(rap).observe(document.body); } catch(e){} }
      window.addEventListener('load', rap); setTimeout(rap, 60); setTimeout(rap, 300);
    })();
  }
})();
</script>
