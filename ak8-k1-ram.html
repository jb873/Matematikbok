<!-- Åk 8: delad taxonomi (k1+k2, single-source) + delad logg + delad provbyggar-modul. Motorn/taxonomin orörda. -->

<script>
(function(){
  var hs = location.search || '';

  // ── OPTION 3: syntetisera en åk8-PROVBYGGAR-TAXONOMI ur boken (projektion, källtaxonomin orörd) ──
  // AK8_K1_BOK mappar delkapitel → noder (inverterat mot k1/k2). Vi klonar de refererade noderna och
  // stämplar varje klon med visning.utbudslista = 'ak8d'+nr och grupp = delkapitlets titel, så modulens
  // utbudslista-drivna gruppering visar exakt bokens delkapitel. Belief-noder (resonera + visuella figurer)
  // utesluts — de bor i självskattningen, inte i provbyggaren.
  var K1 = (window.K1_TAXONOMI && (window.K1_TAXONOMI.noder || window.K1_TAXONOMI)) || [];
  var K2 = (window.K2_TAXONOMI && (window.K2_TAXONOMI.noder || window.K2_TAXONOMI)) || [];
  var BY_ID = {}; K1.concat(K2).forEach(function(n){ if(!BY_ID[n.id]) BY_ID[n.id] = n; });

  var BELIEF_FIGUR = { 'andel-figur:rakna':1, 'andel-tallinje:begrepp':1, 'pot-begrepp:figur':1 };
  function isBelief(n){ return n.formaga === 'RESONERA' || !!BELIEF_FIGUR[n.id]; }

  var BOK = (window.AK8_K1_BOK && window.AK8_K1_BOK.delkapitel || []).slice().sort(function(a,b){ return a.nr - b.nr; });
  var AK8_BOK_DELKAPITEL = BOK.map(function(d){ return { del: 'ak8d' + d.nr, titel: d.titel }; });

  var seen = {}, AK8_NODER = [];
  BOK.forEach(function(d){
    var rad = 0;
    d.blad.forEach(function(b){
      (b.noder || []).forEach(function(nid){
        if(seen[nid]) return;                 // en färdighet visas en gång, i sitt första delkapitel
        var src = BY_ID[nid]; if(!src) return; // okänt id → hoppa (rapporteras ej här; scan fångar det)
        if(isBelief(src)){ seen[nid] = true; return; }  // belief → självskattningen, ej provbyggaren
        seen[nid] = true;
        var vis = src.visning || {};
        AK8_NODER.push(Object.assign({}, src, {
          visning: {
            utbudslista: 'ak8d' + d.nr,
            grupp: d.titel,
            gruppordning: 0,
            radordning: rad++,
            titel: (vis.titel || src.namn),
            etikett: (vis.etikett || ''),
            formagaKey: (vis.formagaKey || String(src.formaga || '').toLowerCase()),
            niva: null
          }
        }));
      });
    });
  });
  var AK8_TAXONOMI = { kapitel: 'ak8-k1', noder: AK8_NODER };

  // Kombinerad mastery (k1 + k2). lasMatris slås ihop; masteryState + loggaForsok routas per nod
  // (bråk → MasteryK2, övrigt → Mastery). Delas byte-identiskt från de befintliga loggarna.
  var K2_IDS = {}; K2.forEach(function(n){ K2_IDS[n.id] = 1; });
  function ak8MastFor(nod){ return (K2_IDS[nod] ? window.MasteryK2 : window.Mastery); }
  var AK8_MASTERY = {
    lasMatris: function(){
      var m1 = (window.Mastery && window.Mastery.lasMatris) ? window.Mastery.lasMatris() : {};
      var m2 = (window.MasteryK2 && window.MasteryK2.lasMatris) ? window.MasteryK2.lasMatris() : {};
      return Object.assign({}, m1, m2);
    },
    masteryState: function(cell, a, b, c){
      var fn = (window.Mastery && window.Mastery.masteryState) || (window.MasteryK2 && window.MasteryK2.masteryState);
      try { return fn ? fn(cell, a, b, c) : 0; } catch(e){ return 0; }
    },
    loggaForsok: function(nod, res){                 // parity: prov → rätt logg (k1/k2) → färgar rätt kart-cell
      var m = ak8MastFor(nod); if(m && m.loggaForsok) m.loggaForsok(nod, res);
    }
  };

  // ── ÅTTAN TEST-GENERATORER (Väg A, bundna till karta-synliga noder via GEN_NOD) ──
  // Content i åttans ram; mekanismen (ProvbyggarMotor) orörd. Facit speglar drillens matematik
  // (potens-drill.js) — drillmotorn INTE anropad. Hjälpare lokala (undvik global-krock).
  var G = ProvbyggarMotor.gen;
  function ri(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
  // Grundpotens-hjälpare — speglar potens-drillens gp-lager BYTE-TROGET (facit = drillens).
  function gpRound(x){ return Math.round(x * 1e9) / 1e9; }
  function gpKoeff(){ return pick([1, 2, 3, 4, 5, 6, 7, 8, 9, 1.5, 2.5, 3.5, 4.5, 7.5]); }
  function gpVal(k, e){ return k * Math.pow(10, e); }
  function dec(x){ return String(x).replace('.', ','); }
  function normalisera(k, e){ var f = 0; while(k >= 10){ k = gpRound(k / 10); e++; f++; } while(k > 0 && k < 1){ k = gpRound(k * 10); e--; f++; } return { koeff:k, exp:e, normaliserad:f > 0 }; }
  // ── Mirror av k2:s bråk-hjälpare (byte-troget ur ak7-k2-ram.html; facit = k2:s) ──
  function rI(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
  function rP(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function gcd2(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=b; b=a%b; a=t; } return a||1; }
  function multBB(){   // bråk · bråk
    var n1=rP([2,3,4,5]), n2=rP([2,3,4,5]), t1=rI(1,n1-1), t2=rI(1,n2-1);
    var talj=t1*t2, namn=n1*n2, g=gcd2(talj,namn), T=talj/g, N=namn/g;
    return { key:'bb:'+t1+'/'+n1+'*'+t2+'/'+n2, prompt:'Räkna ut steg för steg:    '+t1+'/'+n1+' · '+t2+'/'+n2,
      led:[ { fraga:t1+'·'+t2+' / '+n1+'·'+n2, varde: talj/namn, facit: talj+'/'+namn } ],
      slutTalj:T, slutNamn:N, expl:t1+'/'+n1+' · '+t2+'/'+n2+' = '+talj+'/'+namn+' = '+T+'/'+N+'.' };
  }
  function multHB(){   // heltal · bråk
    var h=rI(2,6), n=rP([2,3,4,5,6]), t=rI(1,n-1);
    var talj=h*t, namn=n, g=gcd2(talj,namn), T=talj/g, N=namn/g;
    return { key:'hb:'+h+'*'+t+'/'+n, prompt:'Räkna ut steg för steg:    '+h+' · '+t+'/'+n,
      led:[ { fraga:h+'·'+t+' / '+n, varde: talj/namn, facit: talj+'/'+namn } ],
      slutTalj:T, slutNamn:N, expl:h+' · '+t+'/'+n+' = '+talj+'/'+namn+' = '+T+'/'+N+'.' };
  }
  function multBlandad(){   // blandad · bråk: omvandla blandad → oäkta (led 1), multiplicera (led 2), förkorta
    var hel=rI(1,3), n1=rP([2,3,4]), t1=rI(1,n1-1), n2=rP([2,3,4,5]), t2=rI(1,n2-1);
    var ot1=hel*n1+t1;
    var talj=ot1*t2, namn=n1*n2, g=gcd2(talj,namn), T=talj/g, N=namn/g;
    return { key:'bl:'+hel+'_'+t1+'/'+n1+'*'+t2+'/'+n2,
      prompt:'Räkna ut steg för steg:    '+hel+' '+t1+'/'+n1+' · '+t2+'/'+n2,
      led:[ { fraga:'skriv '+hel+' '+t1+'/'+n1+' som oäkta bråk', varde: ot1/n1, facit: ot1+'/'+n1 },
            { fraga:ot1+'·'+t2+' / '+n1+'·'+n2, varde: talj/namn, facit: talj+'/'+namn } ],
      slutTalj:T, slutNamn:N,
      expl:hel+' '+t1+'/'+n1+' · '+t2+'/'+n2+' = '+ot1+'/'+n1+' · '+t2+'/'+n2+' = '+talj+'/'+namn+' = '+T+'/'+N+'.' };
  }
  function multStora(){   // stora tal med korsförkortning
    var p1=rI(1,3), q1=rI(2,4), p2=rI(1,3), q2=rI(2,4), g1=rP([2,3,4]), g2=rP([2,3,4]);
    var t1=p1*g1, n1=q1*g2, t2=p2*g2, n2=q2*g1;
    var talj=t1*t2, namn=n1*n2, g=gcd2(talj,namn), T=talj/g, N=namn/g;
    return { key:'st:'+t1+'/'+n1+'*'+t2+'/'+n2,
      prompt:'Räkna ut steg för steg (förkorta gärna först):    '+t1+'/'+n1+' · '+t2+'/'+n2,
      led:[ { fraga:t1+'·'+t2+' / '+n1+'·'+n2, varde: talj/namn, facit: talj+'/'+namn } ],
      slutTalj:T, slutNamn:N, expl:t1+'/'+n1+' · '+t2+'/'+n2+' = '+talj+'/'+namn+' = '+T+'/'+N+'.' };
  }
  function multVariant(opts){
    var v = (opts && opts.variant) || 'alla';
    if(v === 'alla') v = rP(['hb','bb','blandad','stora']);
    if(v === 'hb') return multHB();
    if(v === 'blandad') return multBlandad();
    if(v === 'stora') return multStora();
    return multBB();
  }
  // ── Mirror av k1:s hjälpare (byte-troget ur ak7-k1-ram.html; behövs av k1-generatorerna) ──
function isPrime(n){
  if(n<2)return false;
  if(n===2)return true;
  if(n%2===0)return false;
  for(let i=3;i*i<=n;i+=2)if(n%i===0)return false;
  return true;
}
function primeFactorize(n){
  const f=[];let x=n;
  for(let p=2;p*p<=x;p++){while(x%p===0){f.push(p);x/=p}}
  if(x>1)f.push(x);
  return f;
}
function randPick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rInt(a,b){return Math.floor(Math.random()*(b-a+1))+a}          // slumpheltal [a,b]
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;} // för enklaste form (gcd=1)
function komma(x){return String(x).replace('.',',')}                    // 0.04 → "0,04" (svensk decimal)
function avr(x,d){const p=Math.pow(10,d==null?3:d);return Math.round(x*p)/p}// avrunda bort flyttalsbrus
  var AK8_TEST_GENERATORS = {
    // Del 8 · Potenser — kärnan (rent åttan-innehåll)
    'pot-begrepp:skriva': { snabb: [ G.numeric('gt-pot-skriva', 'Skriv som potens', 'pot-begrepp:skriva', function(){
      var b = ri(2, 9), e = ri(2, 6), mult = []; for(var i = 0; i < e; i++) mult.push(b);
      return { key:'skriv'+b+'_'+e, prompt:'Skriv som en potens med basen '+b+' — vilken exponent?    '+mult.join(' · ')+' = '+b+'^▢', ans:e, expl:mult.join(' · ')+' = '+b+'^'+e+'.' };
    }) ] },
    'pot-begrepp:evaluera': { snabb: [ G.numeric('gt-pot-eval', 'Beräkna potensens värde', 'pot-begrepp:evaluera', function(){
      var b, e, v; do { b = ri(2, 9); e = ri(2, 4); v = Math.pow(b, e); } while(v > 1000);
      return { key:'eval'+b+'_'+e, prompt:'Beräkna:    '+b+'^'+e, ans:v, expl:b+'^'+e+' = '+v+'.' };
    }) ] },
    'pot-multdiv:rakna': { snabb: [ G.mellanledNum('gt-pot-multdiv', 'Exponent-lagen (mult och div)', 'pot-multdiv:rakna', function(){
      var b = ri(2, 6), typ = pick(['mult', 'div', 'blandat']);
      if(typ === 'mult'){
        var m = ri(2, 7), n = ri(2, 7); while(m + n > 12){ m = ri(2, 7); n = ri(2, 7); } var res = m + n;
        return { key:'m'+b+'_'+m+'_'+n, prompt:'Räkna ut med exponent-lagen:    '+b+'^'+m+' · '+b+'^'+n,
          led:[ { fraga:'lägg ihop exponenterna: '+m+' + '+n, varde:res, facit:String(res) } ],
          slutVarde:res, slutHint:'svarets exponent, '+b+'^▢', expl:b+'^'+m+' · '+b+'^'+n+' = '+b+'^('+m+'+'+n+') = '+b+'^'+res+'.' };
      }
      if(typ === 'div'){
        var mm = ri(5, 12), nn = ri(2, mm - 1); if(mm - nn > 9) nn = mm - ri(1, 9); var res2 = mm - nn;
        return { key:'d'+b+'_'+mm+'_'+nn, prompt:'Räkna ut med exponent-lagen:    '+b+'^'+mm+' / '+b+'^'+nn,
          led:[ { fraga:'dra bort exponenterna: '+mm+' − '+nn, varde:res2, facit:String(res2) } ],
          slutVarde:res2, slutHint:'svarets exponent, '+b+'^▢', expl:b+'^'+mm+' / '+b+'^'+nn+' = '+b+'^('+mm+'−'+nn+') = '+b+'^'+res2+'.' };
      }
      var p = ri(2, 6), q = ri(2, 6), r = ri(2, Math.min(p + q - 1, 8)); var s1 = p + q, res3 = s1 - r;
      return { key:'bl'+b+'_'+p+'_'+q+'_'+r, prompt:'Räkna ut med exponent-lagen:    ('+b+'^'+p+' · '+b+'^'+q+') / '+b+'^'+r,
        led:[ { fraga:'täljarens exponent: '+p+' + '+q, varde:s1, facit:String(s1) }, { fraga:'dela — dra bort '+r+': '+s1+' − '+r, varde:res3, facit:String(res3) } ],
        slutVarde:res3, slutHint:'svarets exponent, '+b+'^▢', expl:'('+b+'^'+p+' · '+b+'^'+q+') / '+b+'^'+r+' = '+b+'^('+p+'+'+q+'−'+r+') = '+b+'^'+res3+'.' };
    }) ] },
    // Batch 2 — potens-familjens övriga räkne-noder
    'pot-addsub:rakna': { snabb: [ G.mellanledNum('gt-pot-addsub', 'Addition och subtraktion med potenser', 'pot-addsub:rakna', function(){
      // EVALUERA-SEDAN-OPERERA (speglar genAddsub): led = de evaluerade potenserna, slut = resultatet.
      var b1 = ri(2, 6), e1 = ri(2, 3), b2 = ri(2, 6), e2 = ri(2, 3);
      while(Math.pow(b1, e1) > 130) e1 = ri(2, 3);
      while(Math.pow(b2, e2) > 130) e2 = ri(2, 3);
      var v1 = Math.pow(b1, e1), v2 = Math.pow(b2, e2), op = pick(['+', '−']);
      var res = op === '+' ? v1 + v2 : v1 - v2;
      return { key:'as'+b1+'_'+e1+op+b2+'_'+e2, prompt:'Räkna ut steg för steg:    '+b1+'^'+e1+' '+op+' '+b2+'^'+e2,
        led:[ { fraga:b1+'^'+e1, varde:v1, facit:String(v1) }, { fraga:b2+'^'+e2, varde:v2, facit:String(v2) } ],
        slutVarde:res, slutHint:v1+' '+op+' '+v2, expl:b1+'^'+e1+' '+op+' '+b2+'^'+e2+' = '+v1+' '+op+' '+v2+' = '+res+'.' };
    }) ] },
    'pot-multdiv:losut': { snabb: [ G.numeric('gt-pot-losut', 'Lös ut basen eller exponenten', 'pot-multdiv:losut', function(){
      // Speglar genLosut (svar='varde'): x^e = V → basen, eller b^x = V → exponenten.
      if(Math.random() < 0.5){

    'div-dec-sma':'div-rakna:sma', 'div-dec-stora':'div-rakna:storasma', 'mult-dec-dec':'mult-rakna:sma',
    // öva-täckning Negativa (dk3): lös ut okänt tal, dubbeltecken, jämför storlek
    'neg-losut-as':'neg-rakna:addsub', 'neg-losut-md':'neg-rakna:multdiv', 'neg-dubbel':'neg-rakna:addsub', 'neg-jmf':'neg-begrepp:begrepp',
    // öva-täckning bråk dk4/dk5: decimal↔bråk, min→decimaltimmar, bråk±decimal
    'dec-brak':'brak-blandad:rakna', 'dec-blandad':'brak-blandad:rakna', 'tid-dec':'brak-tid:rakna', 'add-dec-brak':'brak-add:rakna',
    // öva-täckning potens dk8/dk10: decimalbas→värde, bråkbas→bråksvar, gp→vanligt tal, x-i-nämnaren
    'pot-eval-dec':'pot-begrepp:evaluera', 'pot-eval-brak':'pot-begrepp:evaluera', 'gp-avkoda':'gp-rakna:skriva', 'gp-losut-namn':'gp-rakna:losut',
    'nym-sma':'mult-rakna:sma', 'nyd-sma':'div-rakna:sma',
    'nym-storasma':'mult-rakna:storasma', 'nyd-storasma':'div-rakna:storasma',
    'ny-lana':'brak-lana:rakna', 'ny-mforkorta':'brak-mult-forkorta:rakna', 'ny-reciprok':'brak-div-reciprok:rakna'
  };

  // ── PROVBYGGAR-HOST (egen ram → per-instans-state, ingen krock med k1/k2) ──
  var app = document.getElementById('app');
  var PB_SHELL = false;
  function pbShell(){
    if(PB_SHELL) return;
    app.innerHTML = '<div id="pb-host">'
      + '<section class="pb-view" data-pbv="test-config"><div id="test-config-body"></div></section>'
      + '<section class="pb-view" data-pbv="test-take" hidden><a href="#" class="hero-back" id="test-take-back">← Tillbaka till inställningar</a><div id="test-take-body"></div></section>'
      + '<section class="pb-view" data-pbv="test-result" hidden><div id="test-result-body"></div></section>'
      + '</div>';
    PB_SHELL = true;
  }
  function pbShow(v){ var h = document.getElementById('pb-host'); if(!h) return;
    h.querySelectorAll('.pb-view').forEach(function(el){ el.hidden = (el.dataset.pbv !== v); }); }
  function pbNav(view){
    if(view === 'test-config' || view === 'test-take' || view === 'test-result'){
      pbShell();
      if(view === 'test-config') PB.render.config();
      else if(view === 'test-take') PB.render.take();
      else PB.render.result();
    }
  }

  var PB = ProvbyggarMotor.montera({
    taxonomi: function(){ return AK8_TAXONOMI; },     // lat (samma mönster som k1/k2)
    mastery:  function(){ return AK8_MASTERY; },
    bokDelkapitel: AK8_BOK_DELKAPITEL,                // 10 delkapitel ur AK8_K1_BOK
    generators: AK8_TEST_GENERATORS, genNod: AK8_GEN_NOD,   // hela boken: potens/tio/gp + mirror av k1/k2 + luckor
    varianter: {   // mult-noden erbjuder variant-val (mirror av k2:s OPT2)
      'brak-mult-rakna:rakna': { titel: 'Sorts multiplikation', alternativ: [
        {key:'alla', label:'Alla (blandat)'}, {key:'hb', label:'Heltal × bråk'}, {key:'bb', label:'Bråk × bråk'},
        {key:'blandad', label:'Blandad form'}, {key:'stora', label:'Stora tal'}
      ] }
    },
    eyebrow: 'Åk 8 · Taluppfattning — tal, räkning och bråk',   // bråk ÄR tal → ingår i taluppfattningen
    rikTestUX: true,   // åttan: keypad (AK8_UI) i test-take + konfetti vid alla rätt. k1/k2 sätter ej flaggan → byte-identiska.
    nav: { navTo: pbNav, showView: pbShow, updateTutorContext: function(){} }
  });

  // Deeplink: ?view=test-fardigt&del=ak8dN&test=M — FÄRDIGT delkapitel-test (förvalt urval via
  // AK8_FARDIGA) → PB.byggFardigt bygger + går direkt till take. Möter eleven direkt.
  if(/[?&]view=test-fardigt/i.test(hs)){
    var mnr = hs.match(/[?&]del=ak8d([0-9]+)/i), mt = hs.match(/[?&]test=([0-9]+)/i);
    var tester = (window.AK8_FARDIGA && AK8_FARDIGA.tester(mnr ? parseInt(mnr[1], 10) : 0)) || [];
    var t = tester[mt ? (parseInt(mt[1], 10) - 1) : 0] || tester[0];
    if(t){ PB.byggFardigt({ nodes: t.nodes, antal: t.antal }); }
    else { pbNav('test-config'); }
  // Deeplink: ?view=test-config[&del=ak8dN] (från delkapitlens "Visa vad du kan"-flik)
  } else if(/[?&]view=test-config/i.test(hs)){
    var mdel = hs.match(/[?&]del=([a-z0-9]+)/i);
    PB.setDel(mdel ? mdel[1] : null);
    pbNav('test-config');
  } else {
    pbNav('test-config');   // ramen har bara provbyggaren → öppna konfigvyn direkt
  }

  // Embed (om delkapitel-sidan bäddar in provbyggaren i iframe)
  if(/[?&]embed=1\b/.test(hs)){
    document.body.classList.add('embed');
    (function(){
      var sist = 0;
      function rap(){ var h = Math.max(document.body.scrollHeight, document.body.offsetHeight) + 4; if(h && Math.abs(h - sist) > 2){ sist = h; try { parent.postMessage({ __fardHeight: h }, '*'); } catch(e){} } }
      if(window.ResizeObserver){ try { new ResizeObserver(rap).observe(document.body); } catch(e){} }
      window.addEventListener('load', rap); setTimeout(rap, 60); setTimeout(rap, 300);
    })();
  }
})();
</script>
<script src="js/elevfeedback.js" defer></script>
</body>
</html>
