<script>
(function(){
  var ROT = '../../../', FK = window.ForfattadKalla, AY = window.Arbetsyta;
  var q = AY.retur();
  if(!FK) return;
  var b = FK.delaBank(q.get('bank')), K = b.K;
  if(!K) return;
  var D = K.delkapitel || {};
  // Utan ?retur=: Tillbaka till delkapitlets momentsida. Brödsmulan: årskurs › kapitel › delkapitlet.
  if(!q.get('retur') && D.adress) document.getElementById('nf-tillbaka').href = ROT + D.adress;
  var dk = document.getElementById('fk-delkapitel'); dk.textContent = D.namn || ''; if(D.adress) dk.href = ROT + D.adress;
  if(D.arskurs){ document.getElementById('fk-ar').textContent = 'Åk ' + D.arskurs; var ak = document.getElementById('fk-arskurs'); ak.textContent = 'Årskurs ' + D.arskurs; ak.href = ROT + 'ak' + D.arskurs + '.html'; }
  if(D.arskurs && D.kapitel){ var kk = document.getElementById('fk-kapitel'); kk.textContent = 'Kapitel ' + D.kapitel; kk.href = ROT + 'ak' + D.arskurs + '-k' + D.kapitel + '.html'; }
  document.getElementById('fk-fot').textContent = D.namn || 'Metodträning';

  var yta = document.getElementById('nf-yta'), verktyg = document.getElementById('nf-verktyg');
  // ELEVTEXT som fält (elevtext-låset ser fältnamnen): samma ord som ramens drill.
  var TEXT = { nytt: { titel: 'Nytt blad' } };
  var nytt = document.createElement('button'); nytt.type = 'button'; nytt.className = 'blad-nav-btn fk-nytt-blad';
  nytt.textContent = TEXT.nytt.titel; nytt.setAttribute('data-action', 'nytt-blad'); nytt.hidden = true;
  verktyg.appendChild(nytt);
  var mount = document.createElement('div'); mount.className = K.montering || 'ovn-wrap nf-mount'; mount.id = 'nf-drill';
  mount.setAttribute('data-bank', q.get('bank'));
  yta.appendChild(mount);

  // Källans stilar FÖRE skalets (arbetsyta.css), som på uppgiftssidan — annars skriver t.ex. keypad.css över
  // skalets placering av knappsatsen. En fil som redan är länkad laddas inte igen.
  var skal = document.querySelector('link[href$="arbetsyta/arbetsyta.css"]');
  (K.css || []).forEach(function(h){
    var finns = [].some.call(document.querySelectorAll('link[rel=stylesheet]'), function(l){ return l.getAttribute('href') === ROT + h; });
    if(finns) return;
    var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = ROT + h;
    if(skal) skal.parentNode.insertBefore(l, skal); else document.head.appendChild(l);
  });
  FK.laddaSkript((K.krav || []).concat(K.skript || []).map(function(s){ return ROT + s; }), function(ok){
    var kalla = ok ? K.hamta(b.ref) : null;
    if(!kalla || !kalla.instanser || !kalla.instanser.length) return;
    document.title = 'Matematik · ' + (D.namn ? D.namn + ' · ' : '') + 'Metodträning · ' + kalla.titel;
    function instans(i){ return kalla.nasta ? kalla.nasta(i) : (kalla.instanser[i] || null); }
    var nu = 0, onskad = (q.get('blad') || '').toUpperCase();
    for(var s = 0; s < 60 && onskad; s++){ var x = instans(s); if(!x) break; if(x.bokstav === onskad){ nu = s; break; } }
    function visa(i){
      nu = i;
      var inst = instans(i);
      kalla.rita(mount, K.arbetsyta ? K.arbetsyta(inst.blad) : inst.blad);
      mount.setAttribute('data-blad', inst.bokstav);
      nytt.hidden = !instans(i + 1);                 // inget nästa blad → ingen knapp
      try { var u = new URLSearchParams(location.search); u.set('blad', inst.bokstav); history.replaceState(null, '', '?' + u.toString()); } catch(e){}
    }
    nytt.addEventListener('click', function(){
      if(!instans(nu + 1)) return;
      visa(nu + 1);
      var r = document.documentElement, sb = r.style.scrollBehavior; r.style.scrollBehavior = 'auto'; window.scrollTo(0, 0); r.style.scrollBehavior = sb;
    });
    visa(nu);
    var kp = K.knappsats && K.knappsats();
    if(kp) AY.placera({ keypad: kp, knapprader: K.knapprader || '.nf-yta .ovn-kontroll-rad' });
    // Bladet öppnas överst (som uppgiftssidan): ingen fokus-rullning ned.
    var r0 = document.documentElement; r0.style.scrollBehavior = 'auto'; window.scrollTo(0, 0); r0.style.scrollBehavior = '';
  });
})();
</script>
