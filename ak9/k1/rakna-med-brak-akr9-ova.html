<!-- Loggen: k2-noder → MasteryK2 (k2.brak-store). K1-lån (byta form, bd-tillbrak:rakna) → Mastery (k1-store).
     Två stores medvetet: en lånad nod loggas i EXAKT en store (sin hemvist), annars skriver unionen över per nyckel. -->

<script>
(function(){
  'use strict';
  var API = window.AK9_K2_AKR9_OVA, UI = window.AK8_UI, LR = window.Likhetsrattare;
  var k = API._intern.k, gcd = API._intern.gcd, lcm = API._intern.lcm, BR = API._intern.BR;
  var ANTAL_DOK = 4;   // Dok 1 (orig) + 3 varianter — INTERN gräns, döljs för eleven (samma som E-spåret/dk1).
  var DOKS = [
    { id:'ova1', namn:'Öva 1', sub:'Grunder, addition och subtraktion', byggd:true },
    { id:'ova2', namn:'Öva 2', sub:'Multiplikation och division', byggd:true }
  ];
  function docNamn(id){ for(var i=0;i<DOKS.length;i++){ if(DOKS[i].id===id) return DOKS[i].namn; } return ''; }

  // ── Elev-lokal sekvens-store (delad modul OvaSekvens; localStorage, lämnar aldrig enheten) ──
  var _seq = OvaSekvens('k2.rakna-med-brak-akr9.ovavariant.v1', ANTAL_DOK);
  var posFor = _seq.posFor, framflytta = _seq.framflytta;

  // ── Talformat + bråk-cell (bcellHTML/bread speglade byte-troget ur E-spårets öva-sida) ──
  function pNum(s){ if(s == null) return NaN; s = ('' + s).replace(/[\s ]/g, '').replace(/−/g, '-').replace(',', '.'); return s === '' ? NaN : parseFloat(s); }
  function nara(a, b){ return isFinite(a) && isFinite(b) && Math.abs(a - b) < 1e-9; }
  function ev(s){ return UI.evalArith(s); }
  function bcellHTML(role){ return '<span class="ovn-brak ak8-bc" data-r="' + role + '"><span class="ovn-brak-taljare"><input class="ak8-in fr-ruta ak8-bt" inputmode="text" autocomplete="off"></span><span class="ovn-brak-strecket"></span><span class="ovn-brak-namnare"><input class="ak8-in fr-ruta ak8-bn" inputmode="text" autocomplete="off"></span></span>'; }
  function bread(scope, role){ var c = scope.querySelector('.ak8-bc[data-r="' + role + '"]'); if(!c) return { num:NaN }; var t = ev(c.querySelector('.ak8-bt').value), n = ev(c.querySelector('.ak8-bn').value); return { t:t, n:n, num:(isFinite(t) && isFinite(n) && n !== 0) ? t / n : NaN }; }
  function mcellHTML(role){ return '<span class="ak8-mc" data-mr="' + role + '"><input class="ak8-in ak8-mh" inputmode="text" autocomplete="off">' + bcellHTML(role) + '</span>'; }
  function mhEl(scope, role){ var box = scope.querySelector('.ak8-mc[data-mr="' + role + '"]'); return box ? box.querySelector('.ak8-mh') : scope.querySelector('.ak8-mh'); }
  function mread(scope, role){ var el = mhEl(scope, role), mh = pNum(el ? el.value : ''), b = bread(scope, role); var h = isFinite(mh) ? mh : 0; return { hel:h, t:b.t, n:b.n, num:(isFinite(b.num)) ? h + b.num : NaN }; }

  function finCellHTML(form){ return (form === 'blandad') ? mcellHTML('fin')
    : (form === 'tal') ? '<span class="ak8-fc"><input class="ak8-in ak8-ft" inputmode="text" autocomplete="off"></span>'
    : bcellHTML('fin'); }
  function markEl(el, ok){ if(el){ el.classList.remove('ak8-ok', 'ak8-fel'); el.classList.add(ok ? 'ak8-ok' : 'ak8-fel'); } }
  function markBc(rad, role, ok){ var c = rad.querySelector('.ak8-bc[data-r="' + role + '"]'); if(c) c.querySelectorAll('.ak8-in').forEach(function(i){ i.classList.remove('ak8-ok','ak8-fel'); i.classList.add(ok ? 'ak8-ok' : 'ak8-fel'); }); }
  function markInputs(scope, ok){ scope.querySelectorAll('.ak8-in').forEach(function(i){ i.classList.remove('ak8-ok','ak8-fel'); i.classList.add(ok ? 'ak8-ok' : 'ak8-fel'); }); }
  function finBesvarad(rad, form){
    if(form === 'tal'){ var ft = rad.querySelector('.ak8-ft'); return !!ft && ft.value.trim() !== ''; }
    var fc = rad.querySelector('.ak8-bc[data-r="fin"]'); return !!fc && fc.querySelector('.ak8-bt').value.trim() !== '' && fc.querySelector('.ak8-bn').value.trim() !== '';
  }
  function rattaSvar(rad, sf){   // canonical rättning av svarscellen (enklaste form) → { ok, facit }
    if(sf.form === 'blandad'){
      var mm = mread(rad, 'fin'), mal = sf.hel + sf.t / sf.n;
      var ok = nara(mm.num, mal) && nara(mm.hel, sf.hel) && isFinite(mm.t) && isFinite(mm.n) && mm.t > 0 && mm.t < mm.n && gcd(Math.round(mm.t), Math.round(mm.n)) === 1;
      markEl(mhEl(rad, 'fin'), ok); markBc(rad, 'fin', ok); return { ok:ok, facit: sf.hel + ' ' + sf.t + '/' + sf.n };
    }
    if(sf.form === 'tal'){ var vv = pNum(rad.querySelector('.ak8-ft').value), ok2 = nara(vv, sf.v); markEl(rad.querySelector('.ak8-ft'), ok2); return { ok:ok2, facit: k(sf.v) }; }
    var bb = bread(rad, 'fin'), ok3 = nara(bb.num, sf.t / sf.n) && isFinite(bb.t) && isFinite(bb.n) && gcd(Math.round(bb.t), Math.round(bb.n)) === 1;
    markBc(rad, 'fin', ok3); return { ok:ok3, facit: sf.t + '/' + sf.n };
  }

  // BRAK(täljare)(nämnare) → stående bråk (REKURSIV: klarar komplex-bråk via balanserad parentes-scanning).
  function esc(s){ return ('' + s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function fracWrap(numH, denH){ return '<span class="ovn-brak"><span class="ovn-brak-taljare">' + numH + '</span><span class="ovn-brak-strecket"></span><span class="ovn-brak-namnare">' + denH + '</span></span>'; }
  function lasBrak(str, i){
    var j = i + 5, depth = 1, a = '';
    while(j < str.length){ var ch = str[j]; if(ch === '(') depth++; else if(ch === ')'){ depth--; if(depth === 0){ j++; break; } } a += ch; j++; }
    if(str[j] !== '(') return null;
    var kk = j + 1, d2 = 1, b = '';
    while(kk < str.length){ var c2 = str[kk]; if(c2 === '(') d2++; else if(c2 === ')'){ d2--; if(d2 === 0){ kk++; break; } } b += c2; kk++; }
    return { a:a, b:b, slut:kk };
  }
  function uttryckHTML(str){ str = '' + str; var out = '', i = 0;
    while(i < str.length){
      if(str.substr(i, 5) === 'BRAK('){ var r = lasBrak(str, i); if(r){ out += fracWrap(uttryckHTML(r.a), uttryckHTML(r.b)); i = r.slut; continue; } }
      out += esc(str[i]); i++;
    }
    return out; }
  function finText(fin){ return fin.k === 'dec' ? k(fin.x) : fin.k === 'br' ? fin.t + '/' + fin.n : fin.h + ' ' + fin.t + '/' + fin.n; }

  function typAv(u){ return u.facit.form; }
  var vy = { dokId:null, viewIdx:0, doc:null, loggat:false };
  var hubEl = document.getElementById('hub'), docEl = document.getElementById('doc'), docBody = document.getElementById('doc-body');

  function fracBtn(p){ return '<button type="button" class="ak8-tal ak8-korval" data-i="' + p.i + '">' + uttryckHTML(BR(p.tn[0], p.tn[1])) + '</button>'; }
  function radHTML(u, ui, gidx){
    var typ = typAv(u), f = u.facit;
    var label = '<span class="ovn-label">' + String.fromCharCode(97 + (ui % 26)) + ')</span>';
    // ── FRI equality-kedja (låna / förkorta / förenkla) — kedjeceller (ledWrap) + "+ led", speglat ur kedjaRadHTML ──
    if(typ === 'kedja'){
      var celler = '';
      for(var kk = 0; kk < 4; kk++) celler += AK8_UI.ledWrap('L' + kk, kk >= 2 ? 'ak8-extra' : '');
      return '<div class="ak8-rad ak8-rad-kedja ak8-lana" data-typ="kedja" data-ui="' + ui + '" data-idx="' + gidx + '">'
        + label + '<span class="ak8-q">' + uttryckHTML(u.prompt) + '</span>' + celler
        + '<button type="button" class="ak8-mer" data-mer>+ led</button></div>';
    }
    // ── Storleksordna — klicka i ordning, minsta först ──
    if(typ === 'ordna'){
      var btns2 = '<span class="ak8-ordna">' + f.lista.map(function(p, i){ return '<button type="button" class="ak8-tal" data-i="' + i + '">' + uttryckHTML(BR(p[0], p[1])) + '<span class="ak8-ordnr"></span></button>'; }).join('') + '</span>';
      return '<div class="ak8-rad" data-typ="ordna" data-ui="' + ui + '">' + label + '<span class="ak8-q">Minsta först:</span>' + btns2 + '</div>';
    }
    // ── Tecken (> eller <) — tvåvägs ──
    if(typ === 'tecken'){
      var teckenBtns = '<span class="ak8-ordna">' + ['<', '>'].map(function(s){ return '<button type="button" class="ak8-tal ak8-korval" data-sign="' + s + '">' + s + '</button>'; }).join('') + '</span>';
      return '<div class="ak8-rad" data-typ="tecken" data-ui="' + ui + '">' + label
        + '<span class="ak8-q">' + uttryckHTML(BR(f.a[0], f.a[1])) + '</span>' + teckenBtns
        + '<span class="ak8-q">' + uttryckHTML(BR(f.b[0], f.b[1])) + '</span></div>';
    }
    // ── MGN — skriv båda bråken med minsta gem. nämnare (två celler) ──
    if(typ === 'mgn'){
      return '<div class="ak8-rad" data-typ="mgn" data-ui="' + ui + '">' + label
        + '<span class="ak8-q">' + uttryckHTML(BR(f.a[0], f.a[1])) + '</span><span class="ak8-eq">=</span>' + bcellHTML('mga')
        + '<span class="ovn-label" style="margin-left:16px">och</span>'
        + '<span class="ak8-q">' + uttryckHTML(BR(f.b[0], f.b[1])) + '</span><span class="ak8-eq">=</span>' + bcellHTML('mgb') + '</div>';
    }
    // ── Add/sub oliknämnigt: mellanled = MINSTA gem. nämnare (celler), svar-cell efter svar.form ──
    if(typ === 'addsub'){
      return '<div class="ak8-rad" data-typ="addsub" data-svarform="' + f.svar.form + '" data-ui="' + ui + '">' + label
        + '<span class="ak8-q">' + uttryckHTML(u.prompt) + '</span>'
        + bcellHTML('mel1') + '<span class="ak8-eq">' + f.op + '</span>' + bcellHTML('mel2')
        + '<span class="ak8-eq">=</span>' + finCellHTML(f.svar.form) + '</div>';
    }
    // ── Decimal + bråk (byta form): direkt svar (form-styrd cell), inget mellanled ──
    if(typ === 'decbrak'){
      return '<div class="ak8-rad" data-typ="decbrak" data-svarform="' + f.svar.form + '" data-ui="' + ui + '">' + label
        + '<span class="ak8-q">' + uttryckHTML(u.prompt) + '</span>'
        + '<span class="ak8-eq">=</span>' + finCellHTML(f.svar.form) + '</div>';
    }
    // ── Multiplikation (heltal·bråk / bråk·bråk): mellanled = OFÖRKORTAD produkt, svar enklaste form ──
    if(typ === 'multheltal' || typ === 'multbrak'){
      return '<div class="ak8-rad" data-typ="' + typ + '" data-svarform="' + f.svar.form + '" data-ui="' + ui + '">' + label
        + '<span class="ak8-q">' + uttryckHTML(u.prompt) + '</span>'
        + bcellHTML('mel') + '<span class="ak8-eq">=</span>' + finCellHTML(f.svar.form) + '</div>';
    }
    // ── Komplex-bråk ÷ (direkt svar, inget mellanled) ──
    if(typ === 'komplexdiv'){
      return '<div class="ak8-rad ak8-rad-kdiv" data-typ="komplexdiv" data-svarform="' + f.svar.form + '" data-ui="' + ui + '">' + label
        + '<span class="ak8-q">' + uttryckHTML(u.prompt) + '</span>'
        + '<span class="ak8-eq">=</span>' + finCellHTML(f.svar.form) + '</div>';
    }
    // ── Bråk ÷ bråk: mellanled = produktbråk (värde-rättat), svar enklaste form ──
    if(typ === 'divbrak'){
      return '<div class="ak8-rad ak8-rad-kdiv" data-typ="divbrak" data-svarform="' + f.svar.form + '" data-ui="' + ui + '">' + label
        + '<span class="ak8-q">' + uttryckHTML(u.prompt) + '</span>'
        + '<span class="ak8-eq">=</span>' + bcellHTML('mel') + '<span class="ak8-eq">=</span>' + finCellHTML(f.svar.form) + '</div>';
    }
    // ── Inverterade talet (reciprok): svar = swap av täljare/nämnare (sträng) ──
    if(typ === 'reciprok'){
      return '<div class="ak8-rad" data-typ="reciprok" data-ui="' + ui + '">' + label
        + '<span class="ak8-q">' + uttryckHTML(u.prompt) + '</span>'
        + '<span class="ak8-eq">=</span>' + bcellHTML('sv') + '</div>';
    }
    return '<div class="ak8-rad" data-typ="okänd" data-ui="' + ui + '">' + label + '<span class="ak8-q">' + esc(typ) + '?</span></div>';
  }

  function renderHub(){
    var html = DOKS.map(function(d){
      var attr = d.byggd ? ' data-dok="' + d.id + '"' : ' disabled';
      return '<button type="button" class="ova-kort"' + attr + '><span class="k-vanster"><span class="k-titel">' + d.namn + '</span><span class="k-sub">' + esc(d.sub) + (d.byggd ? '' : ' · byggs') + '</span></span><span class="k-oppna">' + (d.byggd ? 'Öppna →' : '') + '</span></button>';
    }).join('');
    document.getElementById('kort-rad').innerHTML = html;
    document.querySelectorAll('.ova-kort[data-dok]').forEach(function(b){
      b.addEventListener('click', function(){ hubEl.classList.add('hidden'); docEl.classList.remove('hidden'); renderDoc(b.dataset.dok, posFor(b.dataset.dok).pos); });
    });
  }

  function renderDoc(dokId, viewIdx){
    vy.dokId = dokId; vy.viewIdx = viewIdx; vy.loggat = false;
    var st = posFor(dokId), pos = st.pos, varv = st.varv;
    var doc = vy.doc = API.genereraDokument(dokId, viewIdx);
    var origflagga = viewIdx === 0 ? 'Originaluppgifterna' : 'Samma uppgifter och metoder – andra tal';
    var varvHTML = (viewIdx === 0 && varv > 0)
      ? '<div class="varv-banner"><span>💡</span><div>Fokusera på <em>hur</em> du räknar – inte på att minnas svaret.</div></div>' : '';

    var gidx = 0;
    var sheet = '<div class="ovn-sheet">';
    doc.grupper.forEach(function(g, gi){
      sheet += '<div class="ovn-grupp"><div class="ovn-grupp-rubrik">' + (gi + 1) + '. ' + esc(g.rubrik) + '</div>';
      var not = g.uppgifter.length && g.uppgifter[0].loggSkal;
      if(not) sheet += '<div class="ovn-grupp-not"><span>🛈</span><span>' + esc(g.uppgifter[0].loggSkal) + '</span></div>';
      g.uppgifter.forEach(function(u, ui){ sheet += radHTML(u, ui, gidx++); });
      sheet += '</div>';
    });
    sheet += '<div class="ovn-kontroll-rad">'
      + '<button type="button" class="btn btn-facit" data-facit-btn>Kontrollera</button>'
      + '<button type="button" class="btn btn-vidare" data-vidare disabled>Klar – nästa</button>'
      + '<div class="navrad"><button type="button" class="navpil" data-bak>‹ Föregående</button>'
      + '<button type="button" class="navpil" data-fram>Nästa ›</button></div>'
      + UI.printKnappHTML() + '</div></div>';

    var head = '<div class="ovn-wrap"><div class="doc-topp"><button type="button" class="tillbaka" data-tillbaka>‹ Alla övningar</button></div>'
      + '<span class="doc-eyebrow">' + esc(docNamn(dokId)) + '</span>'
      + '<span class="doc-titel">' + esc(doc.titel) + '</span>'
      + '<span class="doc-origflagga">' + origflagga + '</span>' + varvHTML + sheet + '</div>';

    docBody.innerHTML = '';
    var c = document.createElement('div'); c.innerHTML = head + UI.keypadHTML({ ops:['+', '−', '·', '/', ','], builders:true });
    docBody.appendChild(c);
    UI.bindSheet(c);
    // Ordna = klicka-i-ordning; tecken = enkel-val (korval) — speglat ur E-spårets öva-sida.
    c.querySelectorAll('.ak8-rad[data-typ="tecken"] .ak8-ordna').forEach(function(grid){
      grid.querySelectorAll('.ak8-korval').forEach(function(btn){ btn.onclick = function(){ grid.querySelectorAll('.ak8-korval').forEach(function(b){ b.classList.toggle('sel', b === btn); b.classList.remove('ak8-ok','ak8-fel'); }); uppdateraKlar(); }; });
    });
    c.querySelectorAll('.ak8-rad[data-typ="ordna"] .ak8-ordna').forEach(function(grid){
      grid.querySelectorAll('.ak8-tal').forEach(function(btn){ btn.onclick = function(){
        if(btn.classList.contains('sel')){ btn.classList.remove('sel'); btn.querySelector('.ak8-ordnr').textContent = '';
          [].slice.call(grid.querySelectorAll('.ak8-tal.sel')).sort(function(a, b){ return (+a.querySelector('.ak8-ordnr').textContent) - (+b.querySelector('.ak8-ordnr').textContent); }).forEach(function(t, i){ t.querySelector('.ak8-ordnr').textContent = (i + 1); });
        } else { btn.classList.add('sel'); btn.querySelector('.ak8-ordnr').textContent = grid.querySelectorAll('.ak8-tal.sel').length; }
        uppdateraKlar();
      }; });
    });
    c.addEventListener('input', function(e){ if(e.target.classList && e.target.classList.contains('ak8-in')) uppdateraKlar(); });
    c.querySelector('[data-facit-btn]').addEventListener('click', function(){ kontrollera(c); });
    c.querySelector('[data-vidare]').addEventListener('click', function(){ var ny = framflytta(vy.dokId); renderDoc(vy.dokId, ny.pos); });
    c.querySelector('[data-bak]').addEventListener('click', function(){ if(vy.viewIdx > 0) renderDoc(vy.dokId, vy.viewIdx - 1); });
    c.querySelector('[data-fram]').addEventListener('click', function(){ var s = posFor(vy.dokId); if(vy.viewIdx < s.pos) renderDoc(vy.dokId, vy.viewIdx + 1); });
    c.querySelector('[data-tillbaka]').addEventListener('click', function(){ docEl.classList.add('hidden'); hubEl.classList.remove('hidden'); renderHub(); window.scrollTo(0, 0); });
    c.querySelector('[data-bak]').disabled = viewIdx <= 0;
    c.querySelector('[data-fram]').disabled = viewIdx >= pos;
    uppdateraKlar();
    window.scrollTo(0, 0);
  }

  // ── Svarsstatus (raden besvarad) ──
  function bcFilled(rad, role){ var c = rad.querySelector('.ak8-bc[data-r="' + role + '"]'); return !!c && c.querySelector('.ak8-bt').value.trim() !== '' && c.querySelector('.ak8-bn').value.trim() !== ''; }
  function radBesvarad(rad){
    var typ = rad.dataset.typ;
    if(typ === 'kedja'){ return AK8_UI.kedjaCeller(rad).some(function(e){ return LR.fylld(e); }); }
    if(typ === 'tecken'){ return !!rad.querySelector('.ak8-korval.sel'); }
    if(typ === 'ordna'){ var g = rad.querySelector('.ak8-ordna'); return g.querySelectorAll('.ak8-tal.sel').length === g.querySelectorAll('.ak8-tal').length; }
    if(typ === 'mgn'){ return bcFilled(rad, 'mga') && bcFilled(rad, 'mgb'); }
    if(typ === 'addsub'){ return bcFilled(rad, 'mel1') && bcFilled(rad, 'mel2') && finBesvarad(rad, rad.dataset.svarform); }
    if(typ === 'multheltal' || typ === 'multbrak' || typ === 'divbrak'){ return bcFilled(rad, 'mel') && finBesvarad(rad, rad.dataset.svarform); }
    if(typ === 'komplexdiv' || typ === 'decbrak'){ return finBesvarad(rad, rad.dataset.svarform); }
    if(typ === 'reciprok'){ return bcFilled(rad, 'sv'); }
    return false;
  }
  function allaBesvarade(c){ var rader = c.querySelectorAll('.ak8-rad'); if(!rader.length) return false;
    for(var i = 0; i < rader.length; i++){ if(!radBesvarad(rader[i])) return false; } return true; }
  function uppdateraKlar(){ var c = docBody.firstChild; if(!c) return;
    var st = posFor(vy.dokId), påPos = vy.viewIdx === st.pos;
    c.querySelector('[data-vidare]').disabled = !(påPos && allaBesvarade(c)); }

  // ── RÄTTA en rad ──
  function rattaRad(rad, u){
    var typ = rad.dataset.typ, f = u.facit;
    if(typ === 'kedja'){
      var res = LR.provaKedja(AK8_UI.kedjaCeller(rad), f.v, f.fin);
      return { ok: res.ok, facit: finText(f.fin) };
    }
    if(typ === 'ordna'){
      var ideal = f.lista.map(function(p, i){ return { i:i, v:p[0] / p[1] }; }).sort(function(a, b){ return a.v - b.v; }).map(function(x){ return x.i; });
      var valda = [].slice.call(rad.querySelectorAll('.ak8-tal.sel')).sort(function(a, b){ return (+a.querySelector('.ak8-ordnr').textContent) - (+b.querySelector('.ak8-ordnr').textContent); });
      var ok = valda.length === f.lista.length && valda.every(function(b, kk){ return (+b.dataset.i) === ideal[kk]; });
      valda.forEach(function(b){ b.classList.add(ok ? 'ratt' : 'fel'); });
      return { ok:ok, facit: ideal.map(function(i){ return f.lista[i][0] + '/' + f.lista[i][1]; }).join(' < ') };
    }
    if(typ === 'tecken'){ var s = rad.querySelector('.ak8-korval.sel'); var ok = !!s && s.dataset.sign === f.ratt; if(s) s.classList.add(ok ? 'ratt' : 'fel'); return { ok:ok, facit: f.ratt }; }
    if(typ === 'mgn'){
      var g1 = bread(rad, 'mga'), g2 = bread(rad, 'mgb'), av = f.a[0] / f.a[1], bv = f.b[0] / f.b[1];
      var ok1 = nara(g1.num, av) && Math.round(g1.n) === f.L, ok2 = nara(g2.num, bv) && Math.round(g2.n) === f.L;
      markBc(rad, 'mga', ok1); markBc(rad, 'mgb', ok2);
      return { ok: ok1 && ok2, facit: (f.a[0] * f.L / f.a[1]) + '/' + f.L + ' och ' + (f.b[0] * f.L / f.b[1]) + '/' + f.L };
    }
    if(typ === 'addsub'){
      var m1 = bread(rad, 'mel1'), m2 = bread(rad, 'mel2'), av = f.a[0] / f.a[1], bv = f.b[0] / f.b[1];
      var L = lcm(f.a[1], f.b[1]);   // minsta gem. nämnare (mgn:true ⇒ krävs i mellanledet, ej valfri gemensam)
      var melOk = isFinite(m1.n) && isFinite(m2.n) && Math.round(m1.n) === Math.round(m2.n) && nara(m1.num, av) && nara(m2.num, bv)
        && (!f.mgn || (Math.round(m1.n) === L && Math.round(m2.n) === L));
      markBc(rad, 'mel1', melOk); markBc(rad, 'mel2', melOk);
      var sv = rattaSvar(rad, f.svar);
      var melText = f.m[0][0] + '/' + f.m[0][1] + ' ' + f.op + ' ' + f.m[1][0] + '/' + f.m[1][1];
      return { ok: melOk && sv.ok, facit: melText + ' = ' + sv.facit };
    }
    if(typ === 'decbrak'){ var sv = rattaSvar(rad, f.svar); return { ok: sv.ok, facit: sv.facit }; }
    if(typ === 'multheltal'){
      var mel = bread(rad, 'mel'), melOk = nara(mel.t, f.m.t) && nara(mel.n, f.m.n);
      markBc(rad, 'mel', melOk); var sv = rattaSvar(rad, f.svar);
      return { ok: melOk && sv.ok, facit: f.m.t + '/' + f.m.n + ' = ' + sv.facit };
    }
    if(typ === 'multbrak'){
      var c = rad.querySelector('.ak8-bc[data-r="mel"]');
      var tRaw = c.querySelector('.ak8-bt').value.replace(/\s/g, ''), nRaw = c.querySelector('.ak8-bn').value.replace(/\s/g, '');
      var melOk = /^\d+$/.test(tRaw) && /^\d+$/.test(nRaw) && +tRaw === f.m.t && +nRaw === f.m.n;
      markBc(rad, 'mel', melOk); var sv = rattaSvar(rad, f.svar);
      return { ok: melOk && sv.ok, facit: f.m.t + '/' + f.m.n + ' = ' + sv.facit };
    }
    if(typ === 'komplexdiv'){ var sv = rattaSvar(rad, f.svar); return { ok: sv.ok, facit: sv.facit }; }
    if(typ === 'divbrak'){
      var mel = bread(rad, 'mel'), melOk = nara(mel.num, f.m.t / f.m.n);
      markBc(rad, 'mel', melOk); var sv = rattaSvar(rad, f.svar);
      return { ok: melOk && sv.ok, facit: f.m.t + '/' + f.m.n + ' = ' + sv.facit };
    }
    if(typ === 'reciprok'){
      var c = rad.querySelector('.ak8-bc[data-r="sv"]');
      var tv = c.querySelector('.ak8-bt').value.replace(/\s/g, ''), nv = c.querySelector('.ak8-bn').value.replace(/\s/g, '');
      var ok = tv === ('' + f.tSvar) && nv === ('' + f.nSvar);
      markBc(rad, 'sv', ok); return { ok:ok, facit: f.tSvar + '/' + f.nSvar };
    }
    return { ok:false, facit:'' };
  }

  function kontrollera(c){
    var uppg = []; vy.doc.grupper.forEach(function(g){ g.uppgifter.forEach(function(u){ uppg.push(u); }); });
    c.querySelectorAll('.ak8-rad').forEach(function(rad, i){
      var u = uppg[i]; if(!u) return;
      var gammal = rad.querySelector('.ak8-fasit'); if(gammal) gammal.remove();
      var besvarad = radBesvarad(rad);
      var res = rattaRad(rad, u);
      if(besvarad && !res.ok){ var fEl = document.createElement('span'); fEl.className = 'ak8-fasit'; fEl.textContent = 'rätt: ' + res.facit; rad.appendChild(fEl); }
      // EVIDENS: bara besvarade + loggade rader, en gång/visning. STORE-ROUTING: k1-lån → Mastery, k2 → MasteryK2.
      if(!vy.loggat && u.logg && besvarad){
        var mod = (u.loggStore === 'k1') ? window.Mastery : window.MasteryK2;
        if(mod && mod.loggaForsok) mod.loggaForsok(u.logg, res.ok ? 'ratt' : 'fel');
      }
    });
    vy.loggat = true;
  }

  renderHub();
})();
</script>
</body>
</html>
