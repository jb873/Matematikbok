<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matematik · Åk 9 · Kapitel 1</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../js/kapitel/navsida.css">
<link rel="stylesheet" href="../../js/fot/kapitel-fot.css">
</head>
<body>

<script src="../../js/data/ak9-k1-bok.js"></script>
<script src="../../js/kapitel/kapitel-lista.js"></script>
<script src="../../js/kapitel/kapitelsida.js"></script>
<script src="../../js/fot/kapitel-fot.js"></script>
<script>
// NIANS KAPITEL 1 — kapitelsidan som DATA, på den delade renderaren (order 2026-09-29).
//
// ORDNINGEN OCH TITLARNA BOR I BOKEN (js/data/ak9-k1-bok.js) och delas med delkapitel-sidorna.
//
// STATUSEN HÄRLEDS UR INNEHÅLLET. Nians delkapitel-sidor är tunna skal: AK9_UTBUD ritar raderna
// ur bokens utbud, så ett delkapitel HAR innehåll när dess utbud har rader. Förr stod
// status:'skelett' för hand på alla nio, och alla nio korten var klickbara — sju av dem ledde in
// i ett tomt skal. Nu är två öppna och sju tonade, ärligt märkta och utan länk.
// fil står kvar i boken: delkapitel-sidorna slår upp sig själva på den.
//
// ⚠️ BESKRIVNINGARNA SAKNAS. Namnet står ensamt tills Joachim satt dem. Ingen maskinskriven
//    mening sätts i deras ställe.
// ⚠️ BYGG-BANNERN BORTTAGEN: den sa att alla nio går att klicka in i och att inget innehåll finns.
//    Båda delarna är osanna nu. Joachim avgör om något ska stå i dess ställe.
(function(){
  var bok = window.AK9_K1_BOK || { delkapitel: [] };
  function harInnehall(d){
    var u = d.utbud || {};
    return ((u.nian || []).length + (u.repetition || []).length) > 0;
  }
  var delar = (bok.delkapitel || []).slice().sort(function(a, b){ return a.nr - b.nr; })
    .map(function(d){
      return { nr: d.nr, titel: d.titel, sub: d.beskrivning || '',
               fil: harInnehall(d) ? d.fil : null,
               typ: d.typ || 'avsnitt' };
    });

  Kapitelsida.montera({
    arskurs: 9,
    kapitel: 1,
    bas: '../../',
    arskursSida: '../index.html',
    // Rubriken är ett enda ord. Sjuans mönster — delen efter "och" i guld kursiv — har inget
    // att gripa tag i här, så rubriken står odelad.
    titel: bok.titel || 'Kapitel 1',
    ingress: 'Välj ett delkapitel för att komma till dess föreläsningar och övningar.',
    delkapitel: delar,
    // Nian: kartan live; provbyggare och självskattning kommer.
    fot: {
      kunskapslage:   { href: 'karta/index.html', status: 'live' },
      skapaTest:      { status: 'kommer' },
      sjalvskattning: { status: 'kommer' }
    }
  });
})();
</script>

<script src="../../js/elevfeedback.js" defer></script>
</body>
</html>
