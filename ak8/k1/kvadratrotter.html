<head>
<meta charset="utf-8">

<title>Matematik · Åk 8 · Kvadratrötter</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
  :root{ --ink:#12110f; --ink-soft:#3d3630; --ink-faint:#7a6e65; --paper:#f7f3ea; --paper-lt:#faf7f1; --paper-dk:#ede6d6; --navy:#0f1e2e; --gold:#9a7228; --gold-lt:#c49a40; --blue:#2f6ea0; --serif:'Source Serif 4',Georgia,serif; --cinzel:'Cinzel','Times New Roman',serif; }
  *{ box-sizing:border-box; } body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--serif); }
  .topnav{ background:var(--navy); color:#fff; padding:13px 26px; font-size:13px; display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .topnav a{ color:rgba(255,255,255,.8); text-decoration:none; } .topnav .sep{ opacity:.5; margin:0 8px; }
  .topnav .brand{ font-family:var(--cinzel); letter-spacing:.06em; }
  .nav-crumbs{ display:flex; align-items:center; gap:8px; } .nav-crumbs a:hover{ color:var(--gold-lt); }
  .nav-crumbs .crumb-sep{ opacity:.35; } .nav-crumbs .crumb-current{ color:rgba(255,255,255,.85); }
  @media(max-width:560px){ .nav-crumbs .crumb-hem{ display:none; } }
  .hero{ background:var(--navy); color:#fff; padding:24px 26px 40px; text-align:center; }
  .hero .eyebrow{ font-family:var(--cinzel); font-size:12px; letter-spacing:.16em; color:var(--gold-lt); text-transform:uppercase; }
  .hero h1{ font-family:var(--serif); font-size:38px; font-weight:500; margin:8px 0 6px; } .hero h1 em{ color:var(--gold-lt); font-style:italic; }
  .hero p{ max-width:560px; margin:0 auto; color:rgba(255,255,255,.75); font-size:15px; line-height:1.6; }
  .tab-row{ display:flex; gap:4px; max-width:920px; margin:0 auto; padding:22px 24px 0; flex-wrap:wrap; }
  .tab-btn{ font-family:var(--cinzel); font-size:12.5px; letter-spacing:.04em; color:var(--ink-faint); background:none; border:0; border-bottom:2px solid transparent; padding:10px 16px; cursor:pointer; }
  .tab-btn.is-active{ color:var(--navy); border-bottom-color:var(--navy); }
  .tab-panel{ display:none; } .tab-panel.is-active{ display:block; }
  .ovn-wrap{ max-width:920px; margin:0 auto; padding:20px 24px 12px; }
  .platshall{ max-width:920px; margin:24px auto; padding:28px; background:var(--paper-lt); border:1px solid var(--paper-dk); border-left:4px solid var(--gold); border-radius:6px; text-align:center; color:var(--ink-soft); }
  .platshall h3{ font-family:var(--cinzel); font-size:20px; color:var(--ink); margin-bottom:8px; }
  .platshall p{ font-size:14px; line-height:1.6; max-width:480px; margin:0 auto; }
  /* Kvadratrötter-specifik notation + svarsceller (egen, delkapitel-lokal) */
  .kv-rot{ display:inline-flex; align-items:flex-start; white-space:nowrap; }
  .kv-rad{ border-top:2px solid currentColor; padding:1px 3px 0; margin-left:-1px; }
  .kv-enhet{ margin-left:8px; color:var(--ink-faint); font-size:15px; }
  .kv-och{ margin:0 9px; color:var(--ink-faint); }
  .kv-fig{ display:inline-block; margin:6px 0 2px 4px; }
  .kv-sidasvar{ display:block; margin-top:2px; }
  .kv-sidalabel{ margin-right:7px; color:var(--ink-soft); }
  /* Färdighetsträning (samma mönster som övriga delkapitel) */
  .fard-layout{ max-width:920px; margin:0 auto; padding:18px 24px 44px; display:grid; grid-template-columns:280px 1fr; gap:22px; align-items:start; }
  .fard-lista{ display:flex; flex-direction:column; gap:6px; }
  .fard-skill{ display:flex; flex-direction:column; gap:2px; text-align:left; background:var(--paper-lt); border:1px solid var(--paper-dk); border-radius:7px; padding:10px 14px; cursor:pointer; font-family:inherit; }
  .fard-skill.is-active{ background:var(--navy); border-color:var(--navy); } .fard-skill.is-active *{ color:#fff !important; }
  .fard-skill-titel{ font-size:15.5px; font-weight:600; color:var(--ink); }
  .fard-skill-formaga{ font-family:var(--cinzel); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); }
  .fard-scen{ position:sticky; top:14px; background:var(--paper-lt); border:1px solid var(--paper-dk); border-radius:12px; overflow:hidden; min-height:520px; }
  .fard-tom{ display:flex; align-items:center; justify-content:center; min-height:520px; color:var(--ink-faint); }
  .fard-frame{ width:100%; height:640px; border:0; display:none; background:#fff; } .fard-scen.har-drill .fard-tom{ display:none; } .fard-scen.har-drill .fard-frame{ display:block; }
  @media(max-width:720px){ .fard-layout{ grid-template-columns:1fr; } }
  footer{ text-align:center; padding:28px; color:var(--ink-faint); font-size:12px; border-top:1px solid var(--paper-dk); }
  .konfetti-lager{ position:fixed; inset:0; pointer-events:none; z-index:9999; overflow:hidden; } .konfetti{ position:absolute; top:-20px; animation:kfall linear forwards; }
  @keyframes kfall{ to{ transform:translateY(105vh) rotate(540deg); opacity:.3; } }
</style>
<link rel="stylesheet" href="../../js/motor/blad/ak8-blad-ui.css">
</head>
<body>

  <span class="brand">Matematik · Åk 8</span>
  <div class="nav-crumbs">
    <a class="crumb-hem" href="../../index.html">Matematikbok</a>
    <span class="crumb-sep">›</span>
    <a href="../index.html">Årskurs 8</a>
    <span class="crumb-sep">›</span>

    <span class="crumb-sep">›</span>
    <span class="crumb-current">Kvadratrötter</span>
  </div>
</nav>
<header class="hero">
  <div class="eyebrow" id="del-eyebrow">Kapitel 1</div>
  <h1><em>Kvadratrötter</em></h1>
  <p>Kvadrera sidor och tal, och beräkna kvadratrötter — exakt, uppskattat och med räknare. En introduktion inför nian.</p>
</header>

<div class="tab-row" id="tab-row">
  <button class="tab-btn" data-tab="forelasning">Föreläsning</button>
  <button class="tab-btn is-active" data-tab="ova">Öva</button>
  <button class="tab-btn" data-tab="fardighet">Färdighetsträning</button>
  <button class="tab-btn" data-tab="test">Test</button>
</div>

<section class="tab-panel" data-panel="forelasning"></section>

<section class="tab-panel is-active" data-panel="ova">
  <div class="ovn-wrap" id="sheet-kvrot"></div>
</section>

<section class="tab-panel" data-panel="fardighet">
  <div class="fard-layout">
    <div class="fard-lista" id="fard-lista"></div>
    <div class="fard-scen" id="fard-scen">
      <div class="fard-tom"><p>Välj en färdighet till vänster</p></div>
      <iframe class="fard-frame" id="fard-frame" title="Färdighetsdrill" loading="lazy"></iframe>
    </div>
  </div>
</section>

<section class="tab-panel" data-panel="test"></section>

<footer id="del-footer">Digitalt läromedel i matematik · Åk 8 · Kapitel 1</footer>

<script src="../../js/data/ak8-k1-bok.js"></script>
<script src="../../js/data/ak8-fardiga-test.js"></script>
<script src="../../js/data/forelasningar.js"></script>
<script src="../../js/data/k1-taxonomi.js"></script>
<script src="../../js/motor/blad/ak8-blad-ui.js"></script>
<script src="../../js/motor/blad/blad-ak8-kvrot.js"></script>
<script src="../../js/mastery.js"></script>
<script>
(function(){
  // Delkapitel-numret data-drivet ur bok-filen (matchar på filnamn).
  var me = location.pathname.split('/').pop();
  var dk = ((window.AK8_K1_BOK && AK8_K1_BOK.delkapitel) || []).filter(function(x){ return x.fil === me; })[0];
  if(dk){
    var eb = document.getElementById('del-eyebrow'); if(eb) eb.textContent = 'Delkapitel ' + dk.nr + ' · Kapitel 1';
    var ft = document.getElementById('del-footer'); if(ft) ft.textContent = 'Digitalt läromedel i matematik · Åk 8 · Kapitel 1 · Delkapitel ' + dk.nr;
    // TEST: färdigt samlingstest (auto-assemblerat ur delkapitlets byggbara noder) via delad AK8_FARDIGA.
    var tp = document.querySelector('.tab-panel[data-panel="test"]');
    if(tp && window.AK8_FARDIGA){ AK8_FARDIGA.renderTestFlik(tp, dk.nr, "../../ak8-k1-ram.html"); }
    // FÖRELÄSNING: monteras ur registret (js/data/forelasningar.js). Sidan skriver ingen egen text.
    var fp = document.querySelector('.tab-panel[data-panel="forelasning"]');
    if(fp && window.AK8_FOREL){ AK8_FOREL.renderForelFlik(fp, dk.nr); }
  }
  // konfetti (delad definition med övriga delkapitel)
  window.visaAk8Konfetti = function(){ var g=document.querySelector('.konfetti-lager'); if(g) g.remove(); var l=document.createElement('div'); l.className='konfetti-lager'; document.body.appendChild(l); var f=['#16a34a','#dc2626','#f59e0b','#3b82f6','#a855f7','#ec4899']; for(var i=0;i<70;i++){ var b=document.createElement('span'); b.className='konfetti'; b.style.left=(Math.random()*100)+'vw'; b.style.background=f[Math.floor(Math.random()*f.length)]; b.style.animationDuration=(2.5+Math.random()*2)+'s'; b.style.width=(6+Math.random()*8)+'px'; b.style.height=(10+Math.random()*8)+'px'; l.appendChild(b);} setTimeout(function(){ if(l) l.remove(); },5000); };

  // ÖVA — dokument 1 (Joachims PDF). Föreläsning/Färdighet/Test wiras i FAS 5.
  var mount = document.getElementById('sheet-kvrot');
  if(window.BLAD_AK8_KVROT && mount) BLAD_AK8_KVROT.renderBlad(mount);

  // FÄRDIGHETSTRÄNING: 8 noder → drill-renderaren (ak7-k1-ram) via ?ko=&formaga=rakna&embed=1
  var RAM = '../../ak7-k1-ram.html';
  var DRILLS = [
    { titel:'Area från sidan', ko:'kvadrat-area' },
    { titel:'Kvadrera talet', ko:'kvadrat-rakna' },
    { titel:'Skala ett kvadrattal', ko:'kvadrat-skala' },
    { titel:'Sidan från arean', ko:'rot-sida' },
    { titel:'Beräkna kvadratroten', ko:'rot-berakna' },
    { titel:'Mellan vilka heltal', ko:'rot-uppskatta' },
    { titel:'Kvadratrot ur decimaltal', ko:'rot-decimal' },
    { titel:'Närmevärde med räknare', ko:'rot-narmevarde' }
  ];
  var flista = document.getElementById('fard-lista'), fframe = document.getElementById('fard-frame'), fscen = document.getElementById('fard-scen'), falla = [];
  DRILLS.forEach(function(d){
    var b = document.createElement('button'); b.type = 'button'; b.className = 'fard-skill';
    b.innerHTML = '<span class="fard-skill-titel">' + d.titel + '</span><span class="fard-skill-formaga">Räkna</span>';
    b.onclick = function(){ falla.forEach(function(x){ x.classList.remove('is-active'); }); b.classList.add('is-active'); fframe.src = RAM + '?ko=' + encodeURIComponent(d.ko) + '&formaga=rakna&embed=1'; fscen.classList.add('har-drill'); };
    flista.appendChild(b); falla.push(b);
  });
  // Ramen postar innehållshöjd i inbäddat läge → iframen växer utan intern scroll.
  window.addEventListener('message', function(e){ if(!fframe || !e || !e.data || typeof e.data.__fardHeight !== 'number') return; fframe.style.height = Math.max(320, Math.min(e.data.__fardHeight, 2200)) + 'px'; });

  // flikväxling
  var tabRow = document.getElementById('tab-row');
  tabRow.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.onclick = function(){
      tabRow.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('is-active', b === btn); });
      document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.toggle('is-active', p.dataset.panel === btn.dataset.tab); });
      window.scrollTo({ top:0, behavior:'smooth' });
    };
  });
})();
</script>
