<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matematik · Åk 8 · Kapitel 1</title>
<!-- Sidan saknade fonts.css. Cormorant och Cinzel fanns därför inte, och rubriken föll tillbaka
     på Source Serif — det var inte ett designval utan en saknad rad. -->
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../js/kapitel/navsida.css">
<link rel="stylesheet" href="../../js/fot/kapitel-fot.css">
</head>
<body>

<script src="../../js/data/ak8-k1-bok.js"></script>
<script src="../../js/kapitel/kapitel-lista.js"></script>
<script src="../../js/kapitel/kapitelsida.js"></script>
<script src="../../js/fot/kapitel-fot.js"></script>
<script>
// ÅTTANS KAPITEL 1 — kapitelsidan som DATA, på den delade renderaren (order 2026-09-29).
//
// ORDNINGEN OCH TITLARNA BOR I BOKEN (js/data/ak8-k1-bok.js) och delas med delkapitel-sidorna,
// ramen, föreläsningsregistret och delkapitel-grinden. Sidan läser därifrån i stället för att
// hålla en andra lista — enkällsprincipen gäller också navigationen.
//
// STATUSEN HÄRLEDS UR fil. Förr stod status:'bygger' i boken på alla elva, och alla elva var
// byggda och i bruk: chipet sa BYGGER på en öppen dörr. Fältet är borttaget ur boken.
//
// ⚠️ BESKRIVNINGARNA SAKNAS. Förr listades bladnamnen under titeln ("Division, blad 1 · Division,
//    blad 2") — en innehållsförteckning, inte en beskrivning. Tills Joachim satt beskrivningarna
//    står namnet ensamt. Ingen maskinskriven mening sätts i deras ställe.
(function(){
  var bok = window.AK8_K1_BOK || { delkapitel: [] };
  var delar = (bok.delkapitel || []).slice().sort(function(a, b){ return a.nr - b.nr; })
    .map(function(d){
      return { nr: d.nr, titel: d.titel, sub: d.beskrivning || '', fil: d.fil || null,
               typ: d.typ || 'avsnitt' };
    });

  Kapitelsida.montera({
    arskurs: 8,
    kapitel: 1,
    bas: '../../',
    arskursSida: '../index.html',
    // Rubriken är bokens titel, med klammern som markerar den guld kursiva delen.
    titel: bok.titel || 'Kapitel 1',
    // Sjuans ingress ordagrant — åttans egen var maskinskriven. Väntar på Joachims besked.
    ingress: 'Välj ett delkapitel för att komma till dess föreläsningar och övningar.',
    delkapitel: delar,
    // Åttan: karta (live), provbyggaren (live), självskattning (live — taxonomi-driven, union k1+k2).
    fot: {
      kunskapslage:   { href: 'karta/index.html', status: 'live' },
      skapaTest:      { href: '../../ak8-k1-ram.html?view=test-config', status: 'live' },
      sjalvskattning: { href: 'sjalvskattning/index.html', status: 'live' }
    }
  });
})();
</script>

<script src="../../js/elevfeedback.js" defer></script>
</body>
</html>
