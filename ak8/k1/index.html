<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matematik · Åk 8 · Kapitel 1</title>
<style>
  :root{ --ink:#12110f; --ink-soft:#3d3630; --ink-faint:#7a6e65; --paper:#f7f3ea; --paper-lt:#faf7f1; --paper-dk:#ede6d6; --navy:#0f1e2e; --gold:#9a7228; --gold-lt:#c49a40; --blue:#2f6ea0; --serif:'Source Serif 4',Georgia,serif; --cinzel:'Cinzel','Times New Roman',serif; }
  *{ box-sizing:border-box; } body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--serif); }
  .topnav{ background:var(--navy); color:#fff; padding:14px 26px; display:flex; align-items:center; gap:14px; font-size:13px; }
  .topnav .brand{ font-family:var(--cinzel); letter-spacing:.06em; }
  .topnav a{ color:rgba(255,255,255,.8); text-decoration:none; } .topnav .sep{ opacity:.5; }
  .hero{ background:var(--navy); color:#fff; padding:26px 26px 46px; text-align:center; }
  .hero .eyebrow{ font-family:var(--cinzel); font-size:12px; letter-spacing:.18em; color:var(--gold-lt); }
  .hero h1{ font-family:var(--serif); font-size:40px; font-weight:500; margin:8px 0 6px; } .hero h1 em{ color:var(--gold-lt); font-style:italic; }
  .hero p{ max-width:560px; margin:0 auto; color:rgba(255,255,255,.75); font-size:15px; line-height:1.6; }
  .wrap{ max-width:860px; margin:0 auto; padding:28px 24px 60px; }
  .karta-lank{ display:inline-flex; align-items:center; gap:8px; margin:0 0 22px; padding:10px 18px; background:var(--paper-lt); border:1px solid var(--paper-dk); border-left:4px solid var(--gold); border-radius:8px; color:var(--ink-soft); text-decoration:none; font-size:14px; }
  .karta-lank:hover{ border-color:var(--gold-lt); }
  .del{ display:flex; align-items:flex-start; gap:16px; padding:16px 18px; background:var(--paper-lt); border:1px solid var(--paper-dk); border-radius:10px; margin-bottom:12px; text-decoration:none; color:inherit; }
  .del.open:hover{ border-color:var(--gold-lt); box-shadow:0 3px 12px rgba(0,0,0,.05); }
  .del.kommer{ opacity:.6; }
  .del-nr{ flex-shrink:0; width:38px; height:38px; border-radius:50%; background:var(--navy); color:#fff; font-family:var(--cinzel); display:flex; align-items:center; justify-content:center; font-size:16px; }
  .del.kommer .del-nr{ background:var(--paper-dk); color:var(--ink-faint); }
  .del-titel{ font-size:20px; font-weight:600; }
  .del-blad{ margin-top:4px; color:var(--ink-faint); font-size:13.5px; }
  .del-badge{ margin-left:auto; align-self:center; font-family:var(--cinzel); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); }
  .kommer-not{ margin-top:18px; padding:14px 16px; border:1px dashed var(--paper-dk); border-radius:8px; color:var(--ink-faint); font-size:13.5px; font-style:italic; }
  footer{ text-align:center; padding:30px; color:var(--ink-faint); font-size:12px; border-top:1px solid var(--paper-dk); }
</style>
</head>
<body>
<nav class="topnav">
  <span class="brand">Matematik · Åk 8</span><span class="sep">›</span><span>Kapitel 1</span>
</nav>
<header class="hero">
  <div class="eyebrow">Årskurs 8 · Kapitel 1</div>
  <h1 id="hero-titel">Tal</h1>
  <p>Kapitlets delkapitel. Öva-bladen och färdighetsträningen delar noder med årskurs 7 – du fortsätter på samma färdigheter, på högre nivå.</p>
</header>
<div class="wrap">
  <a class="karta-lank" href="karta/index.html">🗺️ Öppna begreppskartan (åk 8)</a>
  <div id="del-lista"></div>
  <div class="kommer-not" id="kommer-not"></div>
</div>
<footer>Digitalt läromedel i matematik · Åk 8 · Kapitel 1</footer>

<script src="../../js/data/ak8-k1-bok.js"></script>
<script>
(function(){
  var bok = window.AK8_K1_BOK || { delkapitel: [] };
  document.getElementById('hero-titel').textContent = bok.titel || 'Kapitel 1';
  var lista = document.getElementById('del-lista');
  var byggda = {}; (bok.delkapitel || []).forEach(function(d){ byggda[d.nr] = d; });
  // Rendera 10 slottar; boken driver ordning/titel (single-source på nr).
  for(var nr = 1; nr <= 10; nr++){
    var d = byggda[nr];
    if(d && d.fil){
      // byggd/byggande sida → öppen länk
      var a = document.createElement('a'); a.className = 'del open'; a.href = d.fil;
      var blad = (d.blad || []).map(function(b){ return b.titel; }).join(' · ');
      a.innerHTML = '<div class="del-nr">' + nr + '</div>'
        + '<div><div class="del-titel">' + d.titel + '</div><div class="del-blad">' + blad + '</div></div>'
        + '<div class="del-badge">' + (d.status === 'bygger' ? 'bygger' : 'öppen') + '</div>';
      lista.appendChild(a);
    } else if(d){
      // titelsatt men ingen sida än (t.ex. stöd-delkapitel som väntar på blad)
      var div = document.createElement('div'); div.className = 'del kommer';
      div.innerHTML = '<div class="del-nr">' + nr + '</div>'
        + '<div><div class="del-titel">' + d.titel + '</div><div class="del-blad">byggs senare</div></div>'
        + '<div class="del-badge">' + (d.roll === 'stod' ? 'stöd · kommer' : 'kommer') + '</div>';
      lista.appendChild(div);
    } else {
      // ingen post → generisk kommer-slot
      var div = document.createElement('div'); div.className = 'del kommer';
      div.innerHTML = '<div class="del-nr">' + nr + '</div>'
        + '<div><div class="del-titel">Delkapitel ' + nr + '</div><div class="del-blad">titel fastställs</div></div>'
        + '<div class="del-badge">kommer</div>';
      lista.appendChild(div);
    }
  }
  document.getElementById('kommer-not').textContent =
    'Delkapitlens titlar och nod-indelning fylls i i js/data/ak8-k1-bok.js allteftersom de fastställs. '
    + 'Noderna är gemensamma med åk 7 (single-source) – ingen åk8-kopia skapas.';
})();
</script>
</body>
</html>
