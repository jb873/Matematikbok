<script>
/* ── VAD SOM VISAS: ?moment=<id>&blad=<nr><variant>, t.ex. ?moment=andelen&blad=3A. Utan moment: Procent och byta
   form (så länkarna ?blad=2B fungerar som förut). Bladen kommer ur datafilen; sidan väljer bara vilket.
   Skalet (Arbetsyta) bär Tillbaka, växeln, Föreläsning och placeringen av knappsatsen och knappraden. ── */
(function(){
  var AY = window.Arbetsyta;
  var q = AY.retur();
  var MOMENTEN = { byta: window.BLAD_K4_D1_PROCENT, andelen: window.BLAD_K4_D1_ANDELEN, delen: window.BLAD_K4_D1_DELEN, hela: window.BLAD_K4_D1_HELA };
  var momentId = MOMENTEN[q.get('moment')] ? q.get('moment') : 'byta', DATA = MOMENTEN[momentId];
  // Tillbaka utan ?retur=: till momentsidan med DETTA moment öppet.
  if(!q.get('retur') && momentId !== 'byta') document.getElementById('nf-tillbaka').href = 'index.html?moment=' + momentId;
  var yta = document.getElementById('nf-yta'), nav = document.getElementById('nf-bladnav');
  if(!DATA || !window.bygg_blad) return;
  /* TEST (?test=test1, KONVENTIONER "Arbetssidan", TEST): Joachims författade test (blad-k4-d1-test.js), ett blad utan
     växel — som k3:s test. Tillbaka: momentsidan. */
  var TESTEN = window.BLAD_K4_D1_TEST;
  if(q.get('test') && TESTEN){
    var tb = TESTEN.test(q.get('test')) || TESTEN.test('test1');
    nav.hidden = true;
    document.title = 'Matematik · Procent · Procent · ' + tb.titel;
    AY.vaxel({ nav: nav, yta: yta, varianter: [''], start: '',
      id: function(){ return 'sheet-' + q.get('test'); }, etikett: function(){ return tb.titel; },
      rita: function(mnt){ window.bygg_blad(mnt, tb); },
      vidVisa: function(){
        window.NF_BLAD = q.get('test');
        var kp0 = document.getElementById('ovn-keypad-shared');
        if(kp0 && window.AK8_UI && AK8_UI.keypadBokstaver) AK8_UI.keypadBokstaver(kp0, window.bladBokstaver(tb));
      } });
    var kpT = document.getElementById('ovn-keypad-shared');
    if(kpT) AY.placera({ keypad: kpT, knapprader: '.nf-yta .ovn-kontroll-rad' });
    return;
  }
  /* STÖDDOKUMENTET (?stod=byta-form, Joachim 2026-11-28): Joachims text (blad-k4-stod.js), ett blad utan växel och
     utan rutor — kontrollknapparna och knappsatsen döljs (body.nf-stod). Tillbaka: momentet man kom från (?moment=),
     eller ?retur= från åk 8 och 9. */
  var STODEN = window.BLAD_K4_STOD, sb = q.get('stod') && STODEN ? STODEN.blad(q.get('stod')) : null;
  if(sb){
    nav.hidden = true;
    document.body.classList.add('nf-stod');
    document.title = 'Matematik · Procent · ' + sb.titel;
    AY.vaxel({ nav: nav, yta: yta, varianter: [''], start: '',
      id: function(){ return 'sheet-stod-' + q.get('stod'); }, etikett: function(){ return sb.titel; },
      rita: function(mnt){ window.bygg_blad(mnt, sb); },
      vidVisa: function(){ window.NF_BLAD = 'stod-' + q.get('stod'); } });
    return;
  }
  var MO = DATA.MOMENT, NR = window.NivaRad;
  var m = /^(\d)([A-Za-z])?$/.exec(q.get('blad') || '') || [];
  var info = MO.blad.filter(function(b){ return String(b.nr) === m[1]; })[0] || MO.blad[0];
  var start = (m[2] || 'A').toUpperCase(), data = {};
  if(MO.varianter.indexOf(start) < 0) start = MO.varianter[0];
  /* SPÄRREN (NivaRad, KONVENTIONER §3): en direktlänk till ett låst blad öppnar inte bladet — den skickar till
     momentsidan (dit Tillbaka leder), där eleven ser låset i sitt sammanhang. */
  if(NR && MO.nivaPrefix && !NR.nadd(MO.nivaPrefix, MO.nivaId, info.nr)){ location.replace(document.getElementById('nf-tillbaka').href); return; }
  document.title = 'Matematik · Procent · ' + MO.titel + ' · ' + info.titel;
  // Bara en variant än: ingen växel (bokstaven bara vid flera varianter, K-A). B läggs till i datan → växeln syns.
  if(MO.varianter.length < 2) nav.hidden = true;
  AY.vaxel({ nav: nav, yta: yta, varianter: MO.varianter, start: start,
    id: function(b){ return 'sheet-' + info.nr + b; },
    rita: function(mnt, b){
      data[b] = DATA.blad(info.nr + b);
      // Varje Kontrollera: rätta rutor av alla → NivaRad, som låser upp nästa blad när kravet nås (80 % på rutor).
      data[b].onResultat = function(ratt, totalt){
        if(NR && MO.nivaPrefix) NR.klarade(MO.nivaPrefix, MO.nivaId, info.nr, MO.blad.length, ratt, totalt, MO.nivaKrav);
      };
      window.bygg_blad(mnt, data[b]);
    },
    vidVisa: function(b){
      window.NF_BLAD = info.nr + b;
      var kp = document.getElementById('ovn-keypad-shared');
      if(kp && window.AK8_UI && AK8_UI.keypadBokstaver) AK8_UI.keypadBokstaver(kp, window.bladBokstaver(data[b]));
      try { var r = q.get('retur'); history.replaceState(null, '', '?' + (momentId !== 'byta' ? 'moment=' + momentId + '&' : '') + 'blad=' + info.nr + b + (r ? '&retur=' + encodeURIComponent(r) : '')); } catch(e){}
    } });
  /* FÖRELÄSNING: bladfilmen är dold tills en film finns — skalet visar knappen först då. */
  AY.film({ knapp: document.getElementById('nf-genomgang'), yta: document.getElementById('nf-film'), video: null });
  var kp = document.getElementById('ovn-keypad-shared');
  if(kp) AY.placera({ keypad: kp, knapprader: '.nf-yta .ovn-kontroll-rad' });
})();
</script>
