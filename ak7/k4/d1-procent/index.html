<script>
/* MOMENTSIDAN: skalet (js/motor/arbetsyta/momentsida.js) bär märket, de fällbara sektionerna och ramen; här står
   delkapitlets innehåll — momenten och bladen. Tillbaka: Arbetsyta.retur (?retur=, annars kapitelsidan). */
(function(){
'use strict';
var M = window.Momentsida, el = M.el;
var TAX = (window.K4_TAXONOMI && window.K4_TAXONOMI.noder) || [];
var ELEVENS_AR = 7;
var BYTA = window.BLAD_K4_D1_PROCENT;
if(window.Arbetsyta) window.Arbetsyta.retur();

/* ── MOMENTEN (Joachim 2026-11-26): sju moment. 1–4 hör till sjuan (märket 7), 5–7 till åttan (märket F i sjuan).
   Moment 1 har Blad 1–5 (variant A); moment 2–7 står som "Kommer senare". Föreläsningar, Metodträning, Dagens
   träning och Test står som "Kommer senare" tills innehållet finns. ── */
var MOMENT = [
  { titel: 'Procent och byta form', ar: 7, roll: 'karna', id: 'byta', bladen: BYTA ? BYTA.MOMENT.blad : [],
    niva: BYTA ? { prefix: BYTA.MOMENT.nivaPrefix, id: BYTA.MOMENT.nivaId } : null },
  { titel: 'Andelen', ar: 7, roll: 'karna', id: 'andelen', kommer: true },
  { titel: 'Delen', ar: 7, roll: 'karna', id: 'delen', kommer: true },
  { titel: 'Det hela', ar: 7, roll: 'karna', id: 'hela', kommer: true },
  { titel: 'Andel, del och hela med miniräknare', ar: 7, roll: 'fordjupning', id: 'miniraknare', kommer: true },
  { titel: 'Förändring', ar: 7, roll: 'fordjupning', id: 'forandring', kommer: true },
  { titel: 'Procentenheter och jämförelser', ar: 7, roll: 'fordjupning', id: 'procentenheter', kommer: true }
];

var scen = document.getElementById('scen-moment');

function visaMoment(m){
  scen.innerHTML = '';
  // Ordning och inträdesläge som referenssidan: Uppgifter ÖPPEN, Föreläsningar och Metodträning "Kommer senare".
  var S1 = M.sektion(scen, 'Uppgifter');
  M.sektionKommer(scen, 'Föreläsningar');
  M.metodtraning(scen, null);
  // UPPGIFTER — ett blad per rad. SPÄRREN (NivaRad, §3): ett blad som inte är nått står med 🔒, utan länk.
  var l1 = el('div', 'nf-lista');
  m.bladen.forEach(function(b){
    var oppet = !window.NivaRad || !m.niva || window.NivaRad.nadd(m.niva.prefix, m.niva.id, b.nr);
    var a = el(oppet && !b.kommer ? 'a' : 'span', 'nf-blad' + (b.kommer ? ' is-kommer' : oppet ? '' : ' is-locked'));
    if(oppet && !b.kommer) a.href = 'uppgift.html?blad=' + b.nr + 'A';
    else a.setAttribute('aria-disabled', 'true');
    a.appendChild(el('span', 'nf-nr', 'Blad ' + b.nr)); a.appendChild(el('span', null, b.titel + (oppet || b.kommer ? '' : ' 🔒')));
    if(b.kommer) a.appendChild(el('span', 'nf-chip soon', 'Kommer senare'));
    l1.appendChild(a);
  });
  S1.body.appendChild(l1);
  S1.satt(true);
}

var moment = MOMENT.map(function(m){
  // Ett moment utan innehåll än står med samma "Kommer senare" som Dagens träning (inte bara grått).
  return { titel: M.horisont(m, TAX, ELEVENS_AR) + m.titel + (m.kommer ? '<span class="nf-chip soon">Kommer senare</span>' : ''),
           id: m.id, kommer: !!m.kommer, valj: m.kommer ? null : function(){ visaMoment(m); } };
});

// TEST: inga författade test än → skalet skriver "Kommer senare".
M.montera({ vard: document.getElementById('navram'), rubrik: 'Procent', moment: moment, tester: [], mina: [] });
})();
</script>
