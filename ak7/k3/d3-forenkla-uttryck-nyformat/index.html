<script>
/* MOMENTSIDAN: skalet (js/motor/arbetsyta/momentsida.js) bär märket, de fällbara sektionerna, Metodträningens träd,
   Test och ramen; här står delkapitlets innehåll — momenten, bladen och trädets löv. */
(function(){
'use strict';
var M = window.Momentsida, el = M.el;
var TAX = (window.K3_TAXONOMI && window.K3_TAXONOMI.noder) || [];
var ELEVENS_AR = 7;
var SAMMA = window.BLAD_K3_D3_SAMMA, NEGATIVA = window.BLAD_K3_D3_NEGATIVA, SIFFER = window.BLAD_K3_D3_SIFFER,
    TILLAMPNING = window.BLAD_K3_D3_TILLAMPNING;
if(window.Arbetsyta) window.Arbetsyta.retur();

/* ── MOMENTEN (Joachim 2026-11-24, KONVENTIONER "Arbetssidan" MOMENT OCH BLAD): fyra moment, märket 7 på alla. Avsnittets
   steg fördelas på bladen (A och B):
     1 Samma variabel                   Blad 1 steg 1 · Blad 2 steg 2 plus och minus · Blad 3 steg 2 gånger och delat
     2 Negativa tal                     Blad 1–3 steg 3 (repetition)
     3 Siffertermer och två variabler   Blad 1–2 steg 4 · Blad 3–4 steg 5 · Blad 5–6 steg 6
     4 Negativa termer och tillämpning  Blad 1–2 steg 7 · Blad 3–4 steg 8
   Spärren (NivaRad, §3): Blad 1 och 2 alltid öppna, varje blad från Blad 3 vid 80 % på bladet före. Elevtexten godkänd
   av Joachim. ── */
var MOMENT = [
  { id: 'samma', titel: { titel: 'Samma variabel' }.titel, ar: 7, roll: 'karna', bladen: SAMMA ? SAMMA.MOMENT.blad : [],
    niva: SAMMA ? { prefix: SAMMA.MOMENT.nivaPrefix, id: SAMMA.MOMENT.nivaId } : null },
  { id: 'negativa', titel: { titel: 'Negativa tal' }.titel, ar: 7, roll: 'karna', bladen: NEGATIVA ? NEGATIVA.MOMENT.blad : [],
    niva: NEGATIVA ? { prefix: NEGATIVA.MOMENT.nivaPrefix, id: NEGATIVA.MOMENT.nivaId } : null },
  { id: 'siffer', titel: { titel: 'Siffertermer och två variabler' }.titel, ar: 7, roll: 'karna', bladen: SIFFER ? SIFFER.MOMENT.blad : [],
    niva: SIFFER ? { prefix: SIFFER.MOMENT.nivaPrefix, id: SIFFER.MOMENT.nivaId } : null },
  { id: 'tillampning', titel: { titel: 'Negativa termer och tillämpning' }.titel, ar: 7, roll: 'karna', bladen: TILLAMPNING ? TILLAMPNING.MOMENT.blad : [],
    niva: TILLAMPNING ? { prefix: TILLAMPNING.MOMENT.nivaPrefix, id: TILLAMPNING.MOMENT.nivaId } : null }
];

/* METODTRÄNING (KONVENTIONER "Arbetssidan"): trädet med momenten som kategorier och deras blad som löv. Inga banker är
   författade än — ett löv utan bank står utan länk (Joachim 2026-11-24). Lövens nod: alg-samla:rakna (k3-taxonomins
   "Förenkla uttryck"). */
var METOD = { rot: { id: 'nf-d3', namn: 'Förenkla uttryck' }, arskursRelevans: { ak7: 'mal' }, arskurs: 'ak7',
  prefKey: 'k3.d3.nyformat.pref.v1', utfalld: ['nf-d3'], rotNamn: 'Algebra', orsakFramtid: 'åk 8',
  kategorier: MOMENT.map(function(m){
    return { id: 'nf-d3-' + m.id, namn: m.titel, lov: [1, 2, 3].map(function(nr){
      return { id: 'nf-d3-' + m.id + '-' + nr, namn: 'Blad ' + nr, nod: 'alg-samla:rakna', formaga: 'RAKNA' }; }) };
  }) };

var scen = document.getElementById('scen-moment');

function visaMoment(m){
  scen.innerHTML = '';
  // Som referenssidan: Uppgifter ÖPPEN, Föreläsningar ("Kommer senare" — ingen film än) och Metodträning ihopfälld.
  var S1 = M.sektion(scen, 'Uppgifter');
  M.sektionKommer(scen, 'Föreläsningar');
  var S3 = M.metodtraning(scen, METOD);
  // UPPGIFTER — ett blad per rad; Blad A/B väljs med växeln på uppgiftssidan. Som Tolka och teckna: ett blad som inte
  // är byggt står med "Kommer senare"; SPÄRREN (NivaRad, §3) — ett blad som inte är nått står med 🔒, utan länk.
  var l1 = el('div', 'nf-lista');
  m.bladen.forEach(function(b){
    var oppet = !window.NivaRad || !m.niva || window.NivaRad.nadd(m.niva.prefix, m.niva.id, b.nr);
    var a = el(oppet && !b.kommer ? 'a' : 'span', 'nf-blad' + (b.kommer ? ' is-kommer' : oppet ? '' : ' is-locked'));
    if(oppet && !b.kommer) a.href = 'uppgift.html?moment=' + m.id + '&blad=' + b.nr + 'A';
    else a.setAttribute('aria-disabled', 'true');
    a.appendChild(el('span', 'nf-nr', 'Blad ' + b.nr)); a.appendChild(el('span', null, b.titel + (oppet || b.kommer ? '' : ' 🔒')));
    if(b.kommer) a.appendChild(el('span', 'nf-chip soon', 'Kommer senare'));
    l1.appendChild(a);
  });
  S1.body.appendChild(l1);
  S1.satt(true); if(S3) S3.satt(false);
}

var moment = MOMENT.map(function(m){
  // Ett moment utan innehåll än står med "Kommer senare", grått och utan länk.
  return { titel: M.horisont(m, TAX, ELEVENS_AR) + m.titel + (m.kommer ? '<span class="nf-chip soon">Kommer senare</span>' : ''),
           id: m.id, kommer: !!m.kommer, valj: m.kommer ? null : function(){ visaMoment(m); } };
});

/* TEST: inga författade test än → skalet visar Test med "Kommer senare". */
M.montera({
  vard: document.getElementById('navram'), rubrik: 'Förenkla uttryck', moment: moment, tester: [],
  mina: [ { titel: 'Kunskapsläge', sub: '', vy: 'mv-kunskapslage' },
          { titel: 'Självskattning', sub: '', vy: 'mv-sjalvskattning' } ]
});
})();
</script>
