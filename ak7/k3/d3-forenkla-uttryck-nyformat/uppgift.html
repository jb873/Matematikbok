<script>
/* ── VAD SOM VISAS: ?moment=<id>&blad=<nr><variant>, t.ex. ?moment=samma&blad=1B. Bladen kommer ur datafilen;
   sidan väljer bara vilket. Skalet (Arbetsyta) bär Tillbaka, växeln, Föreläsning och placeringen av knappsatsen och
   knappraden. Knappsatsen (bladkärnans delade, #ovn-keypad-shared) visar det synliga bladets egna bokstäver. ── */
(function(){
  var AY = window.Arbetsyta;
  var q = AY.retur();
  var MOMENTEN = { samma: window.BLAD_K3_D3_SAMMA };
  var momentId = MOMENTEN[q.get('moment')] ? q.get('moment') : 'samma', DATA = MOMENTEN[momentId];
  // Tillbaka utan ?retur=: till momentsidan med DETTA moment öppet.
  if(!q.get('retur')) document.getElementById('nf-tillbaka').href = 'index.html?moment=' + momentId;
  var yta = document.getElementById('nf-yta'), nav = document.getElementById('nf-bladnav');
  if(!DATA || !window.bygg_blad) return;
  var m = /^(\d)([A-Za-z])?$/.exec(q.get('blad') || '') || [];
  var info = DATA.MOMENT.blad.filter(function(b){ return String(b.nr) === m[1]; })[0] || DATA.MOMENT.blad[0];
  var start = (m[2] || 'A').toUpperCase(), data = {}, MO = DATA.MOMENT, NR = window.NivaRad;
  /* SPÄRREN (NivaRad, KONVENTIONER §3, som i Tolka och teckna): en direktlänk till ett låst blad — eller ett blad som
     inte är byggt — öppnar inte bladet; den skickar till momentsidan, där eleven ser läget i sitt sammanhang. */
  if(info.kommer || (NR && MO.nivaPrefix && !NR.nadd(MO.nivaPrefix, MO.nivaId, info.nr))){ location.replace(document.getElementById('nf-tillbaka').href); return; }
  document.title = 'Matematik · Algebra · Förenkla uttryck · ' + MO.titel + ' · ' + (info.titel || 'Blad ' + info.nr);
  AY.vaxel({ nav: nav, yta: yta, varianter: MO.varianter, start: start,
    id: function(b){ return 'sheet-' + info.nr + b; },
    rita: function(mnt, b){
      data[b] = DATA.blad(info.nr + b);
      // Varje Kontrollera: rätta rutor av alla → NivaRad, som låser upp nästa blad när kravet nås (80 % på rutor).
      data[b].onResultat = function(ratt, totalt){
        if(NR && MO.nivaPrefix) NR.klarade(MO.nivaPrefix, MO.nivaId, info.nr, MO.blad.length, ratt, totalt, MO.nivaKrav);
      };
      window.bygg_blad(mnt, data[b]);
    },
    vidVisa: function(b){
      window.NF_BLAD = info.nr + b;
      var kp = document.getElementById('ovn-keypad-shared');
      if(kp && window.AK8_UI && AK8_UI.keypadBokstaver) AK8_UI.keypadBokstaver(kp, window.bladBokstaver(data[b]));
      try { var r = q.get('retur'); history.replaceState(null, '', '?moment=' + momentId + '&blad=' + info.nr + b + (r ? '&retur=' + encodeURIComponent(r) : '')); } catch(e){}
    } });
  /* FÖRELÄSNING: dold tills en film finns. */
  AY.film({ knapp: document.getElementById('nf-genomgang'), yta: document.getElementById('nf-film'), video: null });
  var kp = document.getElementById('ovn-keypad-shared');
  if(kp) AY.placera({ keypad: kp, knapprader: '.nf-yta .ovn-kontroll-rad' });
})();
</script>
