<!DOCTYPE html>
<html lang="sv">

<style>
/* Sidspecifika + isärdrivna regler (kvar efter css-flytten 2026-09-19). Det delade ligger i ak7-delkapitel-kanon.css + ak7-k1blad-kanon.css, länkade ovan. */
:root{
  --ink:#12110f; --ink-soft:#3d3630; --ink-faint:#7a6e65;
  --paper:#f6f1e8; --paper-lt:#faf7f1; --paper-dk:#ede6d6;
  --navy:#0f1e2e; --navy-mid:#1a3045;
  --gold:#9a7228; --gold-lt:#c49a40;
  --blue:#1b4b8a; --blue-lt:#2560a8;
  --green:#2d6a4f;

  --serif:'Cormorant Garamond', Georgia, serif;
  --cinzel:'Cinzel', 'Times New Roman', serif;
  --body:'Source Serif 4', Georgia, serif;
}
/* Variabler som motorns CSS refererar till (.ovn-in, .ovn-sammanf.delvis, .ovn-in.enhet.correct m.fl.) men som saknades
   i den här sidfamiljen — bråksidorna fick dem 2025, k1-sidorna aldrig: .ovn-in hade INGEN kant här (border: none).
   Samma block som i bråksidorna. Rättat 2026-09-20. */
:root{
  --c-rakna:#16a34a;
  --success:#16a34a; --success-bg:#dcfce7;
  --error:#dc2626;   --error-bg:#fee2e2;
  --bg-warm:#f3ecdd;
  --mono:'Source Serif 4',Georgia,serif;
  --rod:#b23b2e; --rod-lt:#c0392b;
  --las:#9a9388;
}

.placeholder-note{
  display:flex;gap:13px;align-items:flex-start;
  background:var(--paper-dk);border-radius:5px;padding:15px 17px;
  font-size:13px;color:var(--ink-soft);line-height:1.6;
}
.placeholder-note .pn-icon{font-size:17px;flex-shrink:0;}
/* ── FLIKRAD (delkapitlets undersidor) ── */.tab-row{
  max-width:920px;margin:0 auto;padding:28px 28px 0;
  display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;
  border-bottom:1px solid var(--paper-dk);
  -webkit-overflow-scrolling:touch;
}
.tab-btn{
  flex-shrink:0;
  font-family:var(--cinzel);font-size:12px;font-weight:500;letter-spacing:.06em;
  color:var(--ink-faint);background:none;border:none;cursor:pointer;
  padding:13px 17px;border-bottom:3px solid transparent;
  transition:color .15s, border-color .15s;white-space:nowrap;
}
@keyframes panelIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(18px)}
  to{opacity:1;transform:translateY(0)}
}
.ovn-grupp-rubrik{
  font-family:'Source Serif 4',Georgia,serif;
  font-size:21px;font-weight:700;
  color:var(--ink);margin-bottom:14px;
  letter-spacing:-.005em;
}
.ovn-in{
  width:90px;height:42px;text-align:center;
  font-family:'Source Serif 4',Georgia,serif;font-size:20px;font-weight:600;
  border:2px solid var(--c-rakna);border-radius:6px;
  background:#fff;color:var(--c-rakna);outline:none;padding:0 6px;
  font-feature-settings:'tnum';
  transition:background .2s, border-color .2s, color .2s;
}
/* Pulserande blink när rättning sker */@keyframes ovn-pulse{
  0%   { transform:scale(1);   }
  40%  { transform:scale(1.08);}
  100% { transform:scale(1);   }
}
@keyframes ovn-mark-in{
  from{ transform:scale(0); opacity:0; }
  to  { transform:scale(1); opacity:1; }
}
/* Skärmtangentbord – samma stil som öva-delen */
/* Delad AK8_UI-keypad (migrerad från egen .ovn-keypad). ALLTID fixed nedtill; keypad-clearance.js
   sätter mätt body-padding. Universella nav-paletten (--paper-lt m.fl.) finns i sidans :root. */.keypad{position:fixed;left:0;right:0;bottom:0;z-index:100;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:8px 12px;background:var(--paper-lt);border-top:1px solid var(--paper-dk);box-shadow:0 -3px 14px rgba(15,30,46,.08);}
.keypad-hidden{display:none !important;}
.keypad-digits{display:grid;grid-template-columns:repeat(3,42px);gap:4px;}
.keypad-ops{display:grid;grid-template-columns:repeat(2,42px);gap:4px;align-content:start;}
.keypad-build{display:grid;grid-template-columns:42px;gap:4px;align-content:start;}
.keypad-vars{display:grid;grid-template-columns:repeat(2,42px);gap:4px;align-content:start;}
.kp-key.varkey{color:var(--navy,#0f1e2e);font-style:italic;}
@media (max-width:430px){ /* keypad-smal: allt ryms på EN rad även på telefon */ .keypad{gap:4px;padding:8px 6px;} .keypad-vars{grid-template-columns:repeat(2,40px);} }
.kp-inactive{opacity:.5;pointer-events:none;cursor:default;}
.kp-key{height:40px;border:1.5px solid var(--paper-dk);border-radius:8px;background:#fff;font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink);cursor:pointer;transition:transform .08s,background .1s;display:flex;align-items:center;justify-content:center;user-select:none;}
.kp-key:hover{background:var(--paper-dk);}
.kp-key:active{transform:scale(.92);}
.kp-key.op{color:var(--gold);font-weight:700;}
.kp-key.util{background:var(--paper);color:var(--ink-faint);font-size:15px;}
.kp-key.span2{grid-column:span 2;}
.kp-key.span3{grid-column:span 3;}
.kp-fracbtn, .kp-potbtn{color:var(--navy);}
.kp-frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1;gap:1px;}
.kp-frac-t, .kp-frac-n{width:15px;height:9px;border:1.4px solid currentColor;border-radius:2px;}
.kp-frac-l{width:19px;height:2px;background:currentColor;}
.kp-pot{display:inline-flex;align-items:flex-start;}
.kp-pot-b{width:14px;height:14px;border:1.6px solid currentColor;border-radius:2px;}
.kp-pot-e{width:8px;height:8px;border:1.6px solid currentColor;border-radius:2px;margin-left:1px;margin-top:-4px;}
.kp-kbrakbtn{color:var(--navy);}
.kp-kbrak{display:inline-flex;flex-direction:column;align-items:center;line-height:1;gap:1.5px;}
.kp-kbrak-f{width:13px;height:7px;border:1.4px solid currentColor;border-radius:2px;}
.kp-kbrak-l{width:18px;height:2.5px;background:currentColor;}
@keyframes konfetti-fall{
  0%   { transform:translateY(0) rotate(0deg);   opacity:1; }
  100% { transform:translateY(110vh) rotate(720deg); opacity:1; }
}
@media print{
  .topnav,.hero,.tab-row,.lecture-list,.lecture-player,footer,
    .keypad,.ovn-keypad,.ovn-kontroll-rad,.ovn-skriv-ut,
    .konfetti-lager,.ovn-mark{display:none !important;}
}
.ovn-ordna-in{width:56px;text-align:center;}
.ovn-foljd-in{width:60px;text-align:center;}
.valruta-grid{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
.valruta-btn{font-family:var(--serif,'Cormorant Garamond');font-size:20px;font-weight:600;padding:10px 22px;cursor:pointer;border:2px solid var(--line,#e5e0d8);border-radius:10px;background:#fff;color:var(--ink,#12110f);transition:background .15s,border-color .15s,color .15s;}
.valruta-btn:hover{border-color:var(--gold-lt,#c49a40);}
/* Bladnavigering (A/B/C) — samma regler som k1-sidornas, som ännu inte flyttats till kanon-CSS:en. */
.blad-nav-btn{display:inline-flex;align-items:center;gap:9px;font-family:var(--cinzel,'Cinzel');font-size:12.5px;letter-spacing:.03em;color:var(--ink-soft,#3d3630);background:var(--paper-lt,#faf7f1);border:1px solid var(--paper-dk,#ede6d6);border-radius:8px;padding:9px 15px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,box-shadow .15s;}
.blad-nav-btn:hover{border-color:var(--gold-lt,#c49a40);color:var(--ink,#12110f);}
.blad-nav-nr{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;flex-shrink:0;background:var(--paper-dk,#ede6d6);color:var(--ink-faint,#7a6e65);font-family:var(--cinzel,'Cinzel');font-size:11px;font-weight:600;transition:background .15s,color .15s;}
.blad-nav-btn.is-active{background:var(--navy,#0f1e2e);border-color:var(--navy,#0f1e2e);color:#fff;box-shadow:0 3px 10px rgba(15,30,46,.18);}
.blad-nav-btn.is-active .blad-nav-nr{background:var(--gold-lt,#c49a40);color:var(--navy,#0f1e2e);}

/* ── EKVATIONSKEDJAN (balansmetoden). Raderna staplas, likhetstecknen under varandra, lösningen
   växer nedåt. Rutnätet (VL | = | HL | status) är det som håller likhetstecknen i linje. ── */
:root{ --red:#b3261e; --red-dk:#8f1d17; --green:#2d6a4f; --green-dk:#26543f; }
.eq-kort{max-width:920px;margin:0 auto;padding:6px 28px 30px;}
.uppgift{padding:16px 0 18px;border-top:1px solid var(--paper-dk);}
.uppgift:first-of-type{border-top:none;}
.uppg-etikett{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--gold);margin-bottom:4px;}
.eq-grid{display:grid;grid-template-columns:1fr auto 1fr auto;align-items:baseline;gap:8px 10px;max-width:560px;font-feature-settings:'tnum';}
.eq-vl{justify-self:end;text-align:right;}
.eq-eq{justify-self:center;color:var(--ink-faint);font-size:21px;padding:0 2px;}
.eq-hl{justify-self:start;text-align:left;}
.eq-status{justify-self:start;font-size:17px;width:24px;text-align:center;}
.eq-uppg-vl{justify-self:end;text-align:right;font-family:var(--serif);font-size:23px;font-weight:600;padding-right:6px;}
.eq-uppg-hl{justify-self:start;text-align:left;font-family:var(--serif);font-size:23px;font-weight:600;padding-left:6px;}
.eq-uppg-eq{justify-self:center;font-size:21px;font-weight:600;color:var(--ink-soft);padding:0 2px;}
.eq-uppg-vl .x, .eq-uppg-hl .x{font-style:italic;}
.sida{display:inline-flex;align-items:center;gap:0;flex-wrap:nowrap;}
.sida-vl{justify-content:flex-end;} .sida-hl{justify-content:flex-start;}
.eq-vl .sida,.eq-hl .sida{border-bottom:2px solid var(--paper-dk);padding:2px 4px;min-height:34px;align-items:center;}
.rad-ok .sida{border-bottom-color:var(--green);}
.rad-fel .sida{border-bottom-color:var(--red);}
.seg-text{font-family:var(--serif);font-size:21px;font-weight:500;color:var(--ink);border:none;background:transparent;padding:2px 2px;outline:none;text-align:center;width:auto;min-width:1.5ch;}
.seg-text:focus{background:rgba(154,114,40,.06);border-radius:4px;}
.seg-brak{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;}
.brak-tal{font-family:var(--serif);font-size:16px;font-weight:500;color:var(--ink);border:none;background:transparent;outline:none;text-align:center;width:auto;min-width:1.5ch;}
.brak-tal:focus{background:rgba(154,114,40,.06);border-radius:4px;}
.brak-streck{height:2px;width:100%;min-width:38px;background:var(--ink);margin:1px 0;}
.uppg-verktyg{display:flex;gap:8px;margin-top:10px;}
.mini-btn{font-family:var(--body);font-size:13.5px;color:var(--ink-soft);background:var(--paper-lt);border:1px solid var(--paper-dk);border-radius:7px;padding:5px 11px;cursor:pointer;}
.mini-btn:hover{border-color:var(--gold-lt);background:#fff;}
.mini-brak{display:inline-flex;flex-direction:column;align-items:center;font-size:8px;line-height:1;color:var(--gold);}
.mini-streck{height:1.5px;width:10px;background:var(--gold);margin:1px 0;}
.uppg-klar{color:var(--green-dk);font-size:14px;margin-top:8px;display:none;}
.uppg-klar.show{display:block;}
.uppg-forfa{color:var(--red-dk);font-size:14px;margin-top:8px;display:none;max-width:52ch;}
.uppg-forfa.show{display:block;}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 6px;}
.btn{font-family:var(--cinzel);font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:none;border-radius:10px;padding:11px 18px;cursor:pointer;}
.btn:active{transform:translateY(1px);}
.btn.primary{background:linear-gradient(180deg,var(--gold-lt),var(--gold));color:#fff;box-shadow:0 2px 0 #6f521c;}
.btn.subtle{background:var(--paper-dk);color:var(--ink-soft);}
.global-hint{font-size:14.5px;color:var(--ink-faint);margin:2px 0 6px;min-height:20px;max-width:60ch;}
.global-hint.ok{color:var(--green-dk);} .global-hint.fel{color:var(--red-dk);}
.niva-rubrik{font-family:var(--serif);font-size:24px;font-weight:600;margin:10px 0 8px;}
@media (max-width:560px){ .eq-kort{padding:6px 16px 24px;} .eq-grid{gap:6px;} }

/* ── PROBLEMLÖSNINGENS BLAD: metoden är formen. Stegen står under varandra i ETT rutnät, så att
   likhetstecknen är i linje hela vägen ner och stegen ändå syns som tre skilda ting. ── */
.prob-kort{max-width:920px;margin:0 auto;padding:6px 28px 30px;}
.prob-uppg{padding:20px 0 22px;border-top:1px solid var(--paper-dk);}
.prob-uppg:first-of-type{border-top:none;}
.prob-fraga{font-size:16.5px;line-height:1.55;color:var(--ink);margin:2px 0 14px;max-width:62ch;}
.prob-grid{margin-left:2px;row-gap:6px;}
.prob-steg-rub{font-family:var(--cinzel);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gold);margin:10px 0 2px;padding-top:8px;border-top:1px dashed var(--paper-dk);}
.prob-grid > .prob-steg-rub:first-child{margin-top:0;padding-top:0;border-top:none;}
.prob-knapprad{margin:2px 0 0;}
.prob-svarrad{display:flex;align-items:center;gap:10px;}
.prob-svar{display:inline-flex;align-items:center;min-height:42px;background:#fff;
  border:2px solid var(--gold-lt);border-radius:8px;padding:2px 12px;min-width:200px;}
.prob-svar:focus-within{box-shadow:0 0 0 3px rgba(196,154,64,.18);}
.prob-svar .seg-text{font-size:21px;text-align:left;min-width:8ch;}
.prob-svar.ratt{border-color:var(--green);color:var(--green-dk);}
.prob-svar.fel{border-color:var(--red);color:var(--red-dk);}
.prob-svar-status{font-size:18px;}
.uppg-besked{color:var(--red-dk);font-size:14.5px;margin-top:10px;max-width:60ch;}
</style>
</head>
