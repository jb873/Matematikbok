<style>
:root{
  --ink:#12110f; --ink-soft:#3d3630; --ink-faint:#7a6e65;
  --paper:#f6f1e8; --paper-lt:#faf7f1; --paper-dk:#ede6d6;
  --navy:#0f1e2e; --navy-mid:#1a3045;
  --gold:#9a7228; --gold-lt:#c49a40;
  --blue:#1b4b8a; --blue-lt:#2560a8;
  --green:#2d6a4f;
  --serif:'Cormorant Garamond', Georgia, serif;
  --cinzel:'Cinzel', 'Times New Roman', serif;
  --body:'Source Serif 4', Georgia, serif;
}
/* SLIMMAT SIDHUVUD på elevnivå — den stora heron hör till kapitelsidan. */
.nf-huvud{max-width:1180px;margin:0 auto;padding:18px 28px 6px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
.nf-huvud h1{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--ink);margin:0;}
.nf-huvud .nf-kapitel{font-family:var(--cinzel);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);}
/* TVÅ FLIKAR UTAN UNDERTEXT: ramens undertexter (.nr-mini, .nr-sub) visas inte i det nya formatet. */
.nr-lager .nr-mini, .nr-mrad .nr-sub{display:none;}
/* HORISONT-BADGE framför namnet: bokstaven bär, färgen förstärker. Ingen teckenförklaring. */
.hz{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 5px;margin-right:8px;
  border-radius:6px;font-family:var(--cinzel);font-size:11px;font-weight:600;letter-spacing:.02em;vertical-align:middle;}
.hz-nu{background:var(--navy);color:#fff;}
.hz-f{background:var(--gold-lt);color:var(--navy);}
.hz-ff{background:var(--paper-dk);color:var(--ink-faint);border:1px dashed #c9bfa9;}
.hz-r{background:#e3ece6;color:var(--green);}
/* Dagens träning + Test UNDER momenten — en egen grupp, avskild från momenten. */
.nr-spalt .nr-grp + .nr-grp{margin-top:14px;padding-top:12px;border-top:1px solid var(--paper-dk);}
/* MITTENSEKTIONEN: Uppgifter → Föreläsningar → Metodträning */
.nf-sek{margin:0 0 24px;}
.nf-sek-h{font-family:var(--cinzel);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0 0 10px;}
.nf-lista{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none;}
.nf-blad{display:flex;align-items:baseline;gap:10px;padding:11px 14px;border:1px solid var(--paper-dk);border-radius:8px;
  background:#fff;color:var(--ink);text-decoration:none;font-family:var(--serif);font-size:18px;}
a.nf-blad:hover{border-color:var(--gold-lt);}
.nf-blad .nf-nr{font-family:var(--cinzel);font-size:13px;letter-spacing:.04em;color:var(--ink-soft);min-width:58px;}
.nf-blad.is-kommer{color:var(--ink-faint);background:var(--paper-lt);cursor:default;}
.nf-metodknapp{font-family:var(--cinzel);font-size:12.5px;letter-spacing:.06em;color:var(--ink);background:var(--paper-lt);
  border:1px solid var(--paper-dk);border-radius:8px;padding:10px 16px;cursor:pointer;}
.nf-metodknapp[aria-expanded="true"]{background:var(--navy);border-color:var(--navy);color:#fff;}
.nf-trad{width:100%;height:560px;border:1px solid var(--paper-dk);border-radius:8px;margin-top:10px;background:#fff;}
.nr-karta-frame{width:100%;height:760px;border:0;}
/* Föreläsningsmodulens yta i mittensektionen: vänsterställd, utan modulens egen sidmarginal. */
.nf-forel .forel-wrap{max-width:none;margin:0;padding:0;}
.nf-forel .lecture-list{max-width:none;margin:0;padding:0;}   /* kanonens kortlista bär egen sidmarginal */

<!-- Vyerna byggs här och flyttas in i ramens ytor (samma mönster som piloten ak7/k1/d1). -->

  <div class="nr-scen" id="scen-moment"></div>

<script src="../../../js/data/k3-taxonomi.js"></script>

<script>
(function(){
'use strict';
var TAX = (window.K3_TAXONOMI && window.K3_TAXONOMI.noder) || [];
var ELEVENS_AR = 7;

/* ── BLADEN (åk7, Nivå 1): de fem typerna ur banken (js/motor/problemlosning/prob-bank-ak7.js), med
   Joachims namn. Varje typ har Blad A och B; växeln sitter på uppgiftssidan. ── */
var BANK = window.ProbBankAk7;
var BLADEN = (BANK ? BANK.TYPER : []).map(function(t, i){ return { nr: i + 1, titel: t.titel, id: t.id, nod: t.nod }; });

/* ── MOMENTEN (Joachims beslut 2026-11-18): moment = Nivå. Nivå 1 = åk7, byggd. Nivå 2–4 = FF, byggs inte
   nu — exakt årskurs per nivå avgörs när de byggs, så badgen står som FF utan årskurs. ── */
var MOMENT = [
  { titel: 'Nivå 1', blad: BLADEN },
  { titel: 'Nivå 2', ff: true, kommer: true },
  { titel: 'Nivå 3', ff: true, kommer: true },
  { titel: 'Nivå 4', ff: true, kommer: true }
];

// Taxonomin bär ingen årskurs per nod, bara arskursRelevans {ak7:'mal', …}. Årskursen = första år med 'mal'.
function nod(id){ return TAX.filter(function(n){ return n.id === id; })[0] || null; }
function arUrNod(n){
  var r = (n && n.arskursRelevans) || {};
  for(var a = 7; a <= 9; a++) if(r['ak' + a] === 'mal') return a;
  for(var b = 7; b <= 9; b++) if(r['ak' + b]) return b;
  return null;
}
function horisontFor(m){
  if(m.ff) return '<span class="hz hz-ff">FF</span>';
  var ar = m.ar, roll = m.roll;
  if(m.blad){   // härleds: lägsta årskurs bland bladens noder; kärna om någon nod är kärna
    var noder = m.blad.map(function(b){ return nod(b.nod); }).filter(Boolean);
    ar = Math.min.apply(null, noder.map(arUrNod).filter(function(x){ return x; }));
    roll = noder.some(function(n){ return n.roll === 'karna'; }) ? 'karna' : (noder[0] && noder[0].roll);
  }
  return badge(ar, roll);
}
/* HORISONT-BADGEN (KONVENTIONER, nov 2026): doc-år = elevens + kärna → 7/8/9 (Nu); doc-år = elevens +
   fördjupning → F; doc-år > elevens → FF; doc-år < elevens → R. */
function badge(ar, roll){
  if(!ar) return '';
  if(ar > ELEVENS_AR) return '<span class="hz hz-ff">FF</span>';
  if(ar < ELEVENS_AR) return '<span class="hz hz-r">R</span>';
  if(roll === 'fordjupning') return '<span class="hz hz-f">F</span>';
  return '<span class="hz hz-nu">' + ar + '</span>';
}

var scen = document.getElementById('scen-moment');
function el(tagg, klass, text){ var e = document.createElement(tagg); if(klass) e.className = klass; if(text != null) e.textContent = text; return e; }

function visaMoment(m){
  scen.innerHTML = '';
  // UPPGIFTER — ett blad per typ; Blad A/B väljs med växeln på uppgiftssidan
  var s1 = el('section', 'nf-sek'); s1.appendChild(el('h2', 'nf-sek-h', 'Uppgifter'));
  var l1 = el('div', 'nf-lista');
  m.blad.forEach(function(b){
    var a = el('a', 'nf-blad');
    a.href = 'uppgift.html?typ=' + encodeURIComponent(b.id) + '&blad=A';
    a.appendChild(el('span', 'nf-nr', 'Blad ' + b.nr)); a.appendChild(el('span', null, b.titel));
    l1.appendChild(a);
  });
  s1.appendChild(l1); scen.appendChild(s1);
  // FÖRELÄSNINGAR — samma namn som typerna, ingen längd. Föreläsningsmodulens egen yta (js/data/forelasningar.js,
  // nyckeln ak7-k3-d5); YouTube laddas först när eleven klickar play.
  var s2 = el('section', 'nf-sek nf-forel'); s2.appendChild(el('h2', 'nf-sek-h', 'Föreläsningar'));
  var p2 = el('div'); s2.appendChild(p2); scen.appendChild(s2);
  if(window.FOREL) window.FOREL.renderFlik(p2, 'ak7-k3-d5');
  // METODTRÄNING — en knapp; färdighetsträningens träd (kartans komponent, KartaMotor) fälls ut UNDER den.
  var s3 = el('section', 'nf-sek'); s3.appendChild(el('h2', 'nf-sek-h', 'Metodträning'));
  var kn = el('button', 'nf-metodknapp', 'Metodträning'); kn.type = 'button'; kn.setAttribute('aria-expanded', 'false');
  var trad = null;
  kn.addEventListener('click', function(){
    var oppen = kn.getAttribute('aria-expanded') === 'true';
    if(!trad){ trad = el('iframe', 'nf-trad'); trad.title = 'Metodträning'; trad.src = 'metodtraning.html'; s3.appendChild(trad); }
    trad.hidden = oppen; kn.setAttribute('aria-expanded', oppen ? 'false' : 'true');
  });
  s3.appendChild(kn); scen.appendChild(s3);
}

var moment = MOMENT.map(function(m){
  return { titel: horisontFor(m) + m.titel, kommer: !!m.kommer, valj: m.kommer ? null : function(){ visaMoment(m); } };
});

/* TEST — de två testen ur Joachims dokument ("blandade uppgifter 1 och 2"), ur banken. Samma lista som
   bladen; testet öppnas på uppgiftssidan. */
function visaTest(){
  scen.innerHTML = '';
  var s = el('section', 'nf-sek'); s.appendChild(el('h2', 'nf-sek-h', 'Test'));
  var l = el('div', 'nf-lista');
  (BANK ? BANK.TEST : []).forEach(function(t){
    var a = el('a', 'nf-blad'); a.href = 'uppgift.html?test=' + encodeURIComponent(t.id);
    a.appendChild(el('span', null, t.titel)); l.appendChild(a);
  });
  s.appendChild(l); scen.appendChild(s);
}

/* VÄNSTERSPALTEN, moment-först: momenten, och UNDER dem Dagens träning + Test. Dagens träning finns inte
   byggd för Problemlösning — den står utan länk. */
var ram = window.NavRam && window.NavRam.montera({
  vard: document.getElementById('navram'),
  arbeta: [ { rubrik: 'Problemlösning', grupper: [
    { rubrik: null, varianter: moment },
    { rubrik: null, varianter: [ { titel: 'Dagens träning', kommer: true }, { titel: 'Test', valj: visaTest } ] }
  ] } ],
  mina: [ { titel: 'Kunskapsläge', sub: '', vy: 'mv-kunskapslage' },
          { titel: 'Självskattning', sub: '', vy: 'mv-sjalvskattning' } ],
  niva: null
});
if(ram){
  var s = document.getElementById('scen-moment'); s.classList.add('is-on'); ram.ytaArbeta.appendChild(s);
  ['mv-kunskapslage', 'mv-sjalvskattning'].forEach(function(id){ var e = document.getElementById(id); if(e) ram.ytaMina.appendChild(e); });
  var hall = document.getElementById('scener'); if(hall) hall.remove();
}
})();
</script>
