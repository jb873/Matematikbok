<script src="../../../js/data/k3-taxonomi.js"></script>

<script>
/* MOMENTSIDAN: skalet (js/motor/arbetsyta/momentsida.js) bär märket, de fällbara sektionerna och ramen;
   här står problemlösningens innehåll — nivåerna, bladen ur banken, blandade och testen. */
(function(){
'use strict';
var M = window.Momentsida, el = M.el;
var TAX = (window.K3_TAXONOMI && window.K3_TAXONOMI.noder) || [];
var ELEVENS_AR = 7;

/* ── BLADEN (åk7, Nivå 1): de fem typerna ur banken (js/motor/problemlosning/prob-bank-ak7.js), med
   Joachims namn. Varje typ har Blad A och B; växeln sitter på uppgiftssidan. ── */
var BANK = window.ProbBankAk7;
var BLADEN = (BANK ? BANK.TYPER : []).map(function(t, i){ return { nr: i + 1, titel: t.titel, id: t.id, nod: t.nod }; });

/* ── MOMENTEN (Joachims beslut 2026-11-18): moment = Nivå. Nivå 1 = åk7, byggd. Nivå 2–4 = FF, byggs inte
   nu — exakt årskurs per nivå avgörs när de byggs, så badgen står som FF utan årskurs. ── */
var MOMENT = [
  { titel: 'Nivå 1', blad: BLADEN, blandade: 1 },
  { titel: 'Nivå 2', ff: true, kommer: true },
  { titel: 'Nivå 3', ff: true, kommer: true },
  { titel: 'Nivå 4', ff: true, kommer: true }
];

var scen = document.getElementById('scen-moment');

function visaMoment(m){
  scen.innerHTML = '';
  // Ordning och inträdesläge: Uppgifter ÖPPEN, Föreläsningar och Metodträning ihopfällda.
  var S1 = M.sektion(scen, 'Uppgifter'), S2 = M.sektion(scen, 'Föreläsningar'), S3 = M.sektion(scen, 'Metodträning', function(body){
    // METODTRÄNING — färdighetsträningens träd (kartans komponent, KartaMotor), fälls ut under rubriken.
    var trad = el('iframe', 'nf-trad'); trad.title = 'Metodträning'; trad.src = 'metodtraning.html'; body.appendChild(trad);
  });
  // UPPGIFTER — ett blad per typ; Blad A/B väljs med växeln på uppgiftssidan
  var l1 = el('div', 'nf-lista');
  m.blad.forEach(function(b){
    var a = el('a', 'nf-blad');
    a.href = 'uppgift.html?typ=' + encodeURIComponent(b.id) + '&blad=A';
    a.appendChild(el('span', 'nf-nr', 'Blad ' + b.nr)); a.appendChild(el('span', null, b.titel));
    l1.appendChild(a);
  });
  /* BLANDADE UPPGIFTER (order 2026-11-21): sjätte posten, efter typerna. Nivåns författade blandade blad,
     serverade ett i taget på uppgiftssidan (?blandade=<nivå>). Inget märke per blad — 7:an sitter på nivån i
     vänsterspalten. Finns bladen inte ännu står posten tonad, utan länk. */
  var bl = m.blandade && BANK && BANK.blandade ? BANK.blandade(m.blandade) : null;
  if(bl){
    var harBlad = bl.blad.length > 0, p = el(harBlad ? 'a' : 'div', 'nf-blad' + (harBlad ? '' : ' is-kommer'));
    if(harBlad) p.href = 'uppgift.html?blandade=' + encodeURIComponent(bl.niva);
    p.setAttribute('data-blandade', bl.niva);
    p.appendChild(el('span', 'nf-nr', 'Blad ' + bl.nr)); p.appendChild(el('span', null, bl.titel));
    l1.appendChild(p);
  }
  S1.body.appendChild(l1);
  // FÖRELÄSNINGAR — samma namn som typerna, ingen längd. Föreläsningsmodulens egen yta (js/data/forelasningar.js,
  // nyckeln ak7-k3-d5); YouTube laddas först när eleven klickar play.
  S2.body.parentNode.classList.add('nf-forel');
  var p2 = el('div'); S2.body.appendChild(p2);
  if(window.FOREL) window.FOREL.renderFlik(p2, 'ak7-k3-d5');
  S1.satt(true); S2.satt(false); S3.satt(false);
}

var moment = MOMENT.map(function(m){
  return { titel: M.horisont(m, TAX, ELEVENS_AR) + m.titel, kommer: !!m.kommer, valj: m.kommer ? null : function(){ visaMoment(m); } };
});

/* TEST — de två testen ur Joachims dokument ("blandade uppgifter 1 och 2"), ur banken. Samma lista som
   bladen; testet öppnas på uppgiftssidan. */
function visaTest(){
  scen.innerHTML = '';
  var s = el('section', 'nf-sek'); s.appendChild(el('h2', 'nf-sek-h', 'Test'));
  var l = el('div', 'nf-lista');
  (BANK ? BANK.TEST : []).forEach(function(t){
    var a = el('a', 'nf-blad'); a.href = 'uppgift.html?test=' + encodeURIComponent(t.id);
    a.appendChild(el('span', null, t.titel)); l.appendChild(a);
  });
  s.appendChild(l); scen.appendChild(s);
}

M.montera({
  vard: document.getElementById('navram'), rubrik: 'Problemlösning', moment: moment, test: visaTest,
  mina: [ { titel: 'Kunskapsläge', sub: '', vy: 'mv-kunskapslage' },
          { titel: 'Självskattning', sub: '', vy: 'mv-sjalvskattning' } ]
});
})();
</script>
