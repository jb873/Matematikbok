<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metodträning · Problemlösning</title>
<!-- PILOT (2026-11-18): METODTRÄNING = färdighetsträningens träd. Inget parallellt träd: det är kartans
     komponent (js/karta/karta-motor.js + karta.css, samma som ../kunskapslage/), monterad med Problemlösningens
     typer och varianter ur banken. Visas i en iframe under knappen "Metodträning" på arbetssidan. -->
<link rel="stylesheet" href="../../../fonts/fonts.css">
<link rel="stylesheet" href="../../../js/karta/karta.css">
<style>
  .wrap{padding-top:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="meter" id="meter"></div>
  <div class="controls">
    <span class="seg" id="mal-seg">
      <button data-mal="godkant">Godkänt (kärna)</button>
      <button data-mal="allt">Allt</button>
    </span>
    <span class="controls-note" id="scope-note"></span>
  </div>
  <div class="karta"><div class="cols" id="cols"></div></div>
  <p class="privacy" id="privacy"></p>
</div>

<script src="../../../js/mastery-karna.js"></script>
<script src="../../../js/mastery-k3.js"></script>
<script src="../../../js/motor/problemlosning/prob-bank-ak7.js"></script>
<script src="../../../js/karta/karta-motor.js"></script>
<script>
(function(){
  /* TRÄDET (order 2026-11-18, forts.): Problemlösning → de fem typerna → deras sex varianter. Noderna
     läses ur banken (js/motor/problemlosning/prob-bank-ak7.js) — varianterna finns inte i k3-taxonomin.
     Komponenten är kartans (KartaMotor).

     DRILLEN (order 2026-11-19): varje variant är ett löv med en FÖRFATTAD BANK i stället för en generator —
     bank: 'prob-ak7:<typ>/<variant>'. Kartan länkar lövet till ramens drill (ak7-k3-ram.html?bank=…), som
     serverar variantens uppgift ur Blad A, B, C, D i den ordningen (js/motor/ovamer/k3-forfattad-kalla.js).
     Horisonten är typens: Nivå 1 = åk7 (arskursRelevans ak7: mal). */
  var BANK = window.ProbBankAk7, AR = { ak7: 'mal' }, NODER = [];
  NODER.push({ id: 'nf-prob', namn: 'Problemlösning', parent: null, niva: 'omrade', arskursRelevans: AR, roll: 'karna',
               formaga: null, generator: null, grupp: 'algebra', implemented: true });
  (BANK ? BANK.TYPER : []).forEach(function(t){
    NODER.push({ id: 'nf-prob-' + t.id, namn: t.titel, parent: 'nf-prob', niva: 'deldoman', arskursRelevans: AR,
                 roll: 'karna', formaga: null, generator: null, visning: null });
    t.varianter.forEach(function(v, i){
      NODER.push({ id: 'nf-prob-' + t.id + '-v' + (i + 1), namn: v.titel, parent: 'nf-prob-' + t.id, niva: 'lovnod',
                   arskursRelevans: AR, roll: 'karna', formaga: 'PROBLEM', generator: null, nod: t.nod,
                   bank: 'prob-ak7:' + t.id + '/' + (i + 1) });
    });
  });
  // Egen pref-nyckel: utfällningen här ska inte skriva över kunskapslägets. Första besöket: grenen
  // Problemlösning är utfälld, så att de fem typerna syns direkt (elevens eget val minns sedan av kartan).
  var PREF = 'k3.prob.nyformat.pref.v1';
  try { if(!localStorage.getItem(PREF)) localStorage.setItem(PREF, JSON.stringify({ mal: 'allt', expanded: ['nf-prob'] })); } catch(e){}
  window.KartaMotor.montera({ taxonomi: { noder: NODER }, mastery: window.MasteryK3, arskurs: 'ak7', minNiva: null,
    prefKey: 'k3.prob.nyformat.pref.v1', ramPath: '../../../ak7-k3-ram.html', rotNamn: 'Algebra', orsakFramtid: 'åk 8' });
})();
</script>
</body>
</html>
