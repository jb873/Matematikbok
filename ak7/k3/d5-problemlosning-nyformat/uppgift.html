/* ── VAD SOM VISAS: ?typ=<typ>&blad=A|B (ett uppgiftsblad) eller ?test=test1|test2 (ett test).
   Uppgifterna kommer ur banken (js/motor/problemlosning/prob-bank-ak7.js); sidan väljer bara vilka.
   Tillbaka går till sidan man kom från: en relativ retur-adress, annars arbetssidan (Arbetsyta.retur). ── */
(function(){

  window.NF_VAL = { typ: q.get('typ') || q.get('blad'), blad: (q.get('blad') || '').toUpperCase(), test: q.get('test'),
                    blandade: q.get('blandade') };
})();
</script>

<script>
/* ── MONTERINGEN. Bladkomponenterna är de befintliga: ProbBlad.render (Följa instruktion — talet ÄR x,
   inga delar att namnge) och ProbBlad2.render (femstegsformen). Båda bladen A och B ritas, var i sin
   montering; växeln visar ett i taget, så det eleven skrivit på A finns kvar när hon går till B och tillbaka.
   Ett test ritas med ProbBlad2.render: testet blandar typerna i ett blad, och bara femstegsformen bär
   alla fem (se ANTAGANDEN i leveransen). ── */
(function(){
  var BANK = window.ProbBankAk7, val = window.NF_VAL, yta = document.getElementById('nf-yta');
  var nav = document.getElementById('nf-bladnav'), gk = document.getElementById('nf-genomgang'), film = document.getElementById('nf-film');
  if(!BANK) return;
  var AY = window.Arbetsyta;
  function montering(id){ return AY.montering(yta, id); }
  // ARBETSYTAN (KONVENTIONER "Uppgiftssidan (arbetsytan)"): bladkomponentens egna val — numrering 'tal'
  // ("1." på frågans rad, som i boken) och arbetsyta (mindre rutor som växer, likhetstecknen under varandra,
  // beräkningsrutan i Sätt in värdet). Utan dem ritar komponenten som förut (ramens drill).
  function medNummer(b){ var c = {}; Object.keys(b || {}).forEach(function(k){ c[k] = b[k]; }); c.numrering = 'tal'; c.arbetsyta = true; return c; }

  if(val.test){
    var tb = BANK.testBlad(val.test) || BANK.testBlad('test1');
    document.title = 'Matematik · Algebra · Problemlösning · ' + tb.titel;
    nav.hidden = true;
    window.ProbBlad2.render(montering('nf-sheet-' + tb.id), medNummer(tb));
    window.NF_BLAD = tb.id;
    return;
  }

  /* BLANDADE UPPGIFTER (?blandade=<nivå>): nivåns författade blandade blad, ett i taget i kö
     (js/motor/problemlosning/prob-blandade.js). Ritas som testet — ProbBlad2.render, Följa instruktion i
     ekvationsformen per uppgift. "Nästa blad" står där växeln annars står. */
  if(val.blandade){
    var cfg = BANK.blandade && BANK.blandade(parseInt(val.blandade, 10));
    nav.hidden = true;
    if(cfg && window.ProbBlandade){
      document.title = 'Matematik · Algebra · Problemlösning · ' + cfg.titel;
      var pb = window.ProbBlandade.montera(yta, cfg, { rita: function(m, b){ return window.ProbBlad2.render(m, medNummer(b)); },
                                                     knappYta: document.getElementById('nf-verktyg') });
      window.NF_BLAD = pb ? cfg.id : null;
    }
    return;
  }

  var typ = BANK.typ(val.typ) || BANK.TYPER[0];
  document.title = 'Matematik · Algebra · Problemlösning · ' + typ.titel;
  AY.vaxel({ nav: nav, yta: yta, varianter: BANK.UPPGIFTSBLAD, start: val.blad,
    id: function(b){ return 'nf-sheet-' + typ.id + '-' + b; },
    rita: function(m, b){ BANK.rita(m, medNummer(BANK.blad(typ.id, b)), typ.form); },
    vidVisa: function(b){
      window.NF_BLAD = typ.id + '-' + b;
      try { history.replaceState(null, '', '?typ=' + typ.id + '&blad=' + b + (new URLSearchParams(location.search).get('retur') ? '&retur=' + encodeURIComponent(new URLSearchParams(location.search).get('retur')) : '')); } catch(e){}
    } });

  /* FÖRELÄSNING: typens film ur föreläsningsregistret (nyckeln ak7-k3-d5), via skalet (Arbetsyta.film). */
  var F = window.FOREL, f = F && F.videorFor('ak7-k3-d5').filter(function(x){ return x.id === typ.film; })[0];
  AY.film({ knapp: gk, yta: film, video: f });
})();
</script>

<!-- Keypaden: en delad, fast — bankens montering (samma i ramens drill); fälten bär data-vars per uppgift -->

  window.Arbetsyta.placera({ keypad: kp, knapprader: '.nf-yta .prob-kort .actions' });
})();
</script>
