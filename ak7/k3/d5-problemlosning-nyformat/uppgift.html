<!DOCTYPE html>

<head>

<title>Matematik · Algebra · Problemlösning · Uppgifter</title>
<!-- PILOT (2026-11-18): UPPGIFTSSIDAN i det nya formatet (doc/KONVENTIONER.md, nov 2026). En typ per sida,
     Blad A/B som växel: ?typ=instruktion|foljd|delar|omkrets|vinklar&blad=A|B — eller ett test: ?test=test1|test2.
     Uppgifterna: js/motor/problemlosning/prob-bank-ak7.js (Joachims dokument). Bladet, rättaren och knappsatsen
     är de BEFINTLIGA komponenterna (ProbBlad/ProbBlad2.render, ProbRattare, AK8_UI). Hero borta → Tillbaka-knapp. -->
<link rel="stylesheet" href="../../../fonts/fonts.css">
<link rel="stylesheet" href="../../../js/motor/blad/ak7-delkapitel-kanon.css">
<link rel="stylesheet" href="../../../js/motor/blad/ak7-k1blad-kanon.css">
<link rel="stylesheet" href="../../../js/motor/keypad.css">
<style>
:root{
  --ink:#12110f; --ink-soft:#3d3630; --ink-faint:#7a6e65;
  --paper:#f6f1e8; --paper-lt:#faf7f1; --paper-dk:#ede6d6;
  --navy:#0f1e2e; --navy-mid:#1a3045;
  --gold:#9a7228; --gold-lt:#c49a40;
  --blue:#1b4b8a; --blue-lt:#2560a8;
  --green:#2d6a4f;
  --serif:'Cormorant Garamond', Georgia, serif;
  --cinzel:'Cinzel', 'Times New Roman', serif;
  --body:'Source Serif 4', Georgia, serif;
  --c-rakna:#16a34a;
  --success:#16a34a; --success-bg:#dcfce7;
  --error:#dc2626;   --error-bg:#fee2e2;
  --bg-warm:#f3ecdd;
  --mono:'Source Serif 4',Georgia,serif;
  --rod:#b23b2e; --rod-lt:#c0392b;
  --las:#9a9388;
}

/* ── UPPGIFTSSIDAN (nytt format): Tillbaka-knapp i stället för hero, full bredd, knappsats och
   Kontrollera NERE TILL HÖGER. ── */
.nf-topp{padding:16px 28px 0;}
.nf-tillbaka{display:inline-flex;align-items:center;gap:6px;font-family:var(--cinzel);font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-soft);text-decoration:none;border:1px solid var(--paper-dk);border-radius:8px;
  padding:8px 14px;background:var(--paper-lt);}
.nf-tillbaka:hover{border-color:var(--gold-lt);color:var(--ink);}
/* FULL BREDD: bladet vänsterställt över hela sidan (plats för flera mellanled) — kanonens .ovn-wrap
   (max 920 px, centrerad) och bladets eget .prob-kort-mått släpps här. */
.nf-yta .ovn-wrap{max-width:none;margin:0;padding:8px 0 12px;}
.nf-yta .prob-kort{max-width:none;margin:0;}
/* Knappsatsen i hörnet: bredden följer knapparna (en rad grupper), inte sidans bredd. */
#prob-keypad{left:auto;right:16px;bottom:16px;width:max-content;max-width:calc(100vw - 32px);border:1px solid var(--paper-dk);
  border-radius:12px;box-shadow:0 6px 22px rgba(15,30,46,.14);}
/* TIPSA-knappen (elevfeedback.js) står annars i samma hörn som knappsatsen — den flyttas till vänster här. */
body .feedback-knapp{right:auto;left:20px;}
.nf-yta .prob-kort .actions{position:fixed;right:16px;z-index:101;margin:0;}
/* Växeln Blad A/B (kanonens .blad-nav) och "Visa genomgång" på en rad överst; filmen fälls ut under raden. */
.nf-verktyg{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 28px 0;}
.nf-yta .blad-nav{max-width:none;margin:0;padding:0;}
.nf-film{padding:0 28px;}
.nf-film .forel-wrap{max-width:820px;margin:0;padding:12px 0 4px;}
.nf-film .lecture-list{max-width:none;margin:0;padding:0;}   /* kanonens kortlista bär egen sidmarginal */
@media (max-width:640px){
  #prob-keypad{left:0;right:0;bottom:0;max-width:none;border-radius:0;}
  .nf-yta .prob-kort .actions{position:static;}
}

/* ── Bladens egen formgivning: ORDAGRANT samma regler som den gamla sidan (../d5-problemlosning/index.html),
   som bär dem inline. De finns inte i någon delad fil än — se ANTAGANDEN i leveransen. ── */
/* ── EKVATIONSKEDJAN (balansmetoden). Raderna staplas, likhetstecknen under varandra, lösningen
   växer nedåt. Rutnätet (VL | = | HL | status) är det som håller likhetstecknen i linje. ── */
:root{ --red:#b3261e; --red-dk:#8f1d17; --green:#2d6a4f; --green-dk:#26543f; }
.eq-kort{max-width:920px;margin:0 auto;padding:6px 28px 30px;}
.uppgift{padding:16px 0 18px;border-top:1px solid var(--paper-dk);}
.uppgift:first-of-type{border-top:none;}
.uppg-etikett{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--gold);margin-bottom:4px;}
.eq-grid{display:grid;grid-template-columns:1fr auto 1fr auto;align-items:baseline;gap:8px 10px;max-width:560px;font-feature-settings:'tnum';}
.eq-vl{justify-self:end;text-align:right;}
.eq-eq{justify-self:center;color:var(--ink-faint);font-size:21px;padding:0 2px;}
.eq-hl{justify-self:start;text-align:left;}
.eq-status{justify-self:start;font-size:17px;width:24px;text-align:center;}
.eq-uppg-vl{justify-self:end;text-align:right;font-family:var(--serif);font-size:23px;font-weight:600;padding-right:6px;}
.eq-uppg-hl{justify-self:start;text-align:left;font-family:var(--serif);font-size:23px;font-weight:600;padding-left:6px;}
.eq-uppg-eq{justify-self:center;font-size:21px;font-weight:600;color:var(--ink-soft);padding:0 2px;}
.eq-uppg-vl .x, .eq-uppg-hl .x{font-style:italic;}
.sida{display:inline-flex;align-items:center;gap:0;flex-wrap:nowrap;}
.sida-vl{justify-content:flex-end;} .sida-hl{justify-content:flex-start;}
/* Kedjans rutor ser ut som bladets andra svarsrutor: vit botten, ram, rundade hörn — annars är
   de svåra att se innan man skrivit i dem, och ser ut som en annan sorts fält. */
.eq-vl .sida,.eq-hl .sida{background:#fff;border:2px solid var(--paper-dk);border-radius:8px;
  padding:2px 10px;min-height:38px;min-width:96px;align-items:center;}
.eq-vl .sida{justify-content:flex-end;} .eq-hl .sida{justify-content:flex-start;}
.eq-vl .sida:focus-within,.eq-hl .sida:focus-within{border-color:var(--gold-lt);box-shadow:0 0 0 3px rgba(196,154,64,.15);}
.rad-ok .sida{border-color:var(--green);}
.rad-fel .sida{border-color:var(--red);}
.seg-text{font-family:var(--serif);font-size:21px;font-weight:500;color:var(--ink);border:none;background:transparent;padding:2px 2px;outline:none;text-align:center;width:auto;min-width:1.5ch;}
.seg-text:focus{background:rgba(154,114,40,.06);border-radius:4px;}
.seg-brak{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;}
.brak-tal{font-family:var(--serif);font-size:16px;font-weight:500;color:var(--ink);border:none;background:transparent;outline:none;text-align:center;width:auto;min-width:1.5ch;}
.brak-tal:focus{background:rgba(154,114,40,.06);border-radius:4px;}
.brak-streck{height:2px;width:100%;min-width:38px;background:var(--ink);margin:1px 0;}
.uppg-verktyg{display:flex;gap:8px;margin-top:10px;}
.mini-btn{font-family:var(--body);font-size:13.5px;color:var(--ink-soft);background:var(--paper-lt);border:1px solid var(--paper-dk);border-radius:7px;padding:5px 11px;cursor:pointer;}
.mini-btn:hover{border-color:var(--gold-lt);background:#fff;}
.mini-brak{display:inline-flex;flex-direction:column;align-items:center;font-size:8px;line-height:1;color:var(--gold);}
.mini-streck{height:1.5px;width:10px;background:var(--gold);margin:1px 0;}
.uppg-klar{color:var(--green-dk);font-size:14px;margin-top:8px;display:none;}
.uppg-klar.show{display:block;}
.uppg-forfa{color:var(--red-dk);font-size:14px;margin-top:8px;display:none;max-width:52ch;}
.uppg-forfa.show{display:block;}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 6px;}
.btn{font-family:var(--cinzel);font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:none;border-radius:10px;padding:11px 18px;cursor:pointer;}
.btn:active{transform:translateY(1px);}
.btn.primary{background:linear-gradient(180deg,var(--gold-lt),var(--gold));color:#fff;box-shadow:0 2px 0 #6f521c;}
.btn.subtle{background:var(--paper-dk);color:var(--ink-soft);}
.global-hint{font-size:14.5px;color:var(--ink-faint);margin:2px 0 6px;min-height:20px;max-width:60ch;}
.global-hint.ok{color:var(--green-dk);} .global-hint.fel{color:var(--red-dk);}
.niva-rubrik{font-family:var(--serif);font-size:24px;font-weight:600;margin:10px 0 8px;}
@media (max-width:560px){ .eq-kort{padding:6px 16px 24px;} .eq-grid{gap:6px;} }

/* ── PROBLEMLÖSNINGENS BLAD: metoden är formen. Stegen står under varandra i ETT rutnät, så att
   likhetstecknen är i linje hela vägen ner och stegen ändå syns som tre skilda ting. ── */
.prob-kort{max-width:920px;margin:0 auto;padding:6px 28px 30px;}
.prob-uppg{padding:20px 0 22px;border-top:1px solid var(--paper-dk);}
.prob-uppg:first-of-type{border-top:none;}
.prob-fraga{font-size:16.5px;line-height:1.55;color:var(--ink);margin:2px 0 14px;max-width:62ch;}
.prob-grid{margin-left:2px;row-gap:6px;}
.prob-steg-rub{font-family:var(--cinzel);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gold);margin:10px 0 2px;padding-top:8px;border-top:1px dashed var(--paper-dk);}
.prob-grid > .prob-steg-rub:first-child{margin-top:0;padding-top:0;border-top:none;}
.prob-knapprad{margin:2px 0 0;}
.prob-svarrad{display:flex;align-items:center;gap:10px;}
.prob-svar{display:inline-flex;align-items:center;min-height:42px;background:#fff;
  border:2px solid var(--gold-lt);border-radius:8px;padding:2px 12px;min-width:200px;}
.prob-svar:focus-within{box-shadow:0 0 0 3px rgba(196,154,64,.18);}
.prob-svar .seg-text{font-size:21px;text-align:left;min-width:8ch;}
.prob-svar.ratt{border-color:var(--green);color:var(--green-dk);}
.prob-svar.fel{border-color:var(--red);color:var(--red-dk);}
.prob-svar-status{font-size:18px;}
.uppg-besked{color:var(--red-dk);font-size:14.5px;margin-top:10px;max-width:60ch;}

/* ── FEMSTEGSFORMEN (variant 2): steg 1 och steg 4 bredvid varandra — samma rader, först
   uttrycken och sedan värdena. Raderna är inte förtryckta; knappen lägger till fler. ── */
.prob-tvakol{display:grid;grid-template-columns:minmax(260px,1fr) minmax(200px,1fr);gap:10px 28px;align-items:start;margin:4px 0 14px;}
.prob-delrad,.prob-insattrad,.prob-svarrad2{display:flex;align-items:center;gap:8px;min-height:42px;}
.prob-namn{font-family:var(--body);font-size:16px;color:var(--ink);background:#fff;border:1.5px solid var(--paper-dk);
  border-radius:7px;padding:5px 9px;width:110px;outline:none;}
.prob-namn:focus{border-color:var(--gold-lt);}
.prob-kolon{color:var(--ink-faint);font-size:18px;}
.prob-uttryck,.prob-varde{display:inline-flex;align-items:center;min-height:38px;background:#fff;
  border:2px solid var(--paper-dk);border-radius:8px;padding:2px 10px;min-width:120px;}
.prob-uttryck:focus-within,.prob-varde:focus-within{border-color:var(--gold-lt);box-shadow:0 0 0 3px rgba(196,154,64,.15);}
.prob-uttryck.ratt,.prob-varde.ratt,.prob-svar.ratt{border-color:var(--green);}
.prob-uttryck.fel,.prob-varde.fel,.prob-svar.fel{border-color:var(--red);}
.prob-eko{font-family:var(--serif);font-size:19px;color:var(--ink-soft);min-width:96px;text-align:right;}
.prob-lika{color:var(--ink-faint);font-size:19px;}
.prob-nydel{margin-top:6px;}
.prob-svarlista{display:flex;flex-direction:column;gap:8px;margin:2px 0 6px;}
.prob-svarrad2 .prob-eko{text-align:left;min-width:110px;}
/* FIGUREN (varianterna 4 och 5): ritad ur data, schematisk. Den visar formen och de kända
   talen — de okända sidorna och vinklarna är omärkta, för att namnge dem är steg 1. */
.prob-figur{margin:6px 0 12px;}
.prob-figur .af-svg{width:100%;max-width:250px;height:auto;}
.prob-figur .af-yta{fill:var(--paper-lt,#faf7f1);}
.prob-figur .af-kant{stroke:var(--ink-soft,#3d3630);stroke-width:2;fill-opacity:.7;}
.prob-figur .af-matt{font-family:var(--serif);font-size:15px;fill:var(--ink,#12110f);}
.prob-figur .af-horn{font-family:var(--serif);font-size:15px;font-weight:600;fill:var(--ink-soft,#3d3630);}
.prob-figur .af-under{font-family:var(--body);font-size:14px;fill:var(--ink-soft,#3d3630);}

/* FÖLJDFRÅGAN: arean är ingen ekvationsrad utan en multiplikation — egen rad mellan
   balansmetoden och svaret, med sin etikett framför rutan. */
.prob-foljdrad{display:flex;align-items:center;gap:10px;margin:10px 0 4px;}
.prob-foljd-etikett{font-family:var(--cinzel,'Cinzel');font-size:13px;letter-spacing:.04em;color:var(--ink-faint);min-width:64px;}
.prob-foljd{display:inline-flex;align-items:center;min-height:40px;background:#fff;
  border:2px solid var(--paper-dk);border-radius:8px;padding:2px 12px;min-width:160px;}
.prob-foljd:focus-within{border-color:var(--gold-lt);box-shadow:0 0 0 3px rgba(196,154,64,.15);}
.prob-foljd.ratt{border-color:var(--green);}
.prob-foljd.fel{border-color:var(--red);}
@media (max-width:640px){ .prob-tvakol{grid-template-columns:1fr;} .prob-eko{min-width:70px;} }
@media print{ .topnav,.nf-topp,.keypad,.actions,footer{display:none !important;} }
</style>

<script>
/* ── VAD SOM VISAS: ?typ=<typ>&blad=A|B (ett uppgiftsblad) eller ?test=test1|test2 (ett test).
   Uppgifterna kommer ur banken (js/motor/problemlosning/prob-bank-ak7.js); sidan väljer bara vilka.
   Tillbaka går till sidan man kom från: en relativ retur-adress, annars arbetssidan. ── */
(function(){
  var q = new URLSearchParams(location.search);
  window.NF_VAL = { typ: q.get('typ') || q.get('blad'), blad: (q.get('blad') || '').toUpperCase(), test: q.get('test') };
  var retur = q.get('retur');
  if(retur && !/^[a-z][a-z0-9+.\-]*:|^\/|^\\/i.test(retur.replace(/[\u0000- ]/g, ''))) document.getElementById('nf-tillbaka').href = retur;
})();
</script>

<script>
/* ── MONTERINGEN. Bladkomponenterna är de befintliga: ProbBlad.render (Följa instruktion — talet ÄR x,
   inga delar att namnge) och ProbBlad2.render (femstegsformen). Båda bladen A och B ritas, var i sin
   montering; växeln visar ett i taget, så det eleven skrivit på A finns kvar när hon går till B och tillbaka.
   Ett test ritas med ProbBlad2.render: testet blandar typerna i ett blad, och bara femstegsformen bär
   alla fem (se ANTAGANDEN i leveransen). ── */
(function(){
  var BANK = window.ProbBankAk7, val = window.NF_VAL, yta = document.getElementById('nf-yta');
  var nav = document.getElementById('nf-bladnav'), gk = document.getElementById('nf-genomgang'), film = document.getElementById('nf-film');
  if(!BANK) return;
  function montering(id){ var m = document.createElement('div'); m.className = 'ovn-wrap nf-mount'; m.id = id; yta.appendChild(m); return m; }

  if(val.test){
    var tb = BANK.testBlad(val.test) || BANK.testBlad('test1');
    document.title = 'Matematik · Algebra · Problemlösning · ' + tb.titel;
    nav.hidden = true;
    window.ProbBlad2.render(montering('nf-sheet-' + tb.id), tb);
    window.NF_BLAD = tb.id;
    return;
  }

  var typ = BANK.typ(val.typ) || BANK.TYPER[0];
  var render = (typ.form === 'instruktion') ? window.ProbBlad.render : window.ProbBlad2.render;
  document.title = 'Matematik · Algebra · Problemlösning · ' + typ.titel;
  var mounts = {}, knappar = {};
  BANK.UPPGIFTSBLAD.forEach(function(b){
    var m = montering('nf-sheet-' + typ.id + '-' + b); m.setAttribute('data-blad', b);
    render(m, BANK.blad(typ.id, b));
    mounts[b] = m;
    var kn = document.createElement('button'); kn.type = 'button'; kn.className = 'blad-nav-btn'; kn.setAttribute('role', 'tab');
    kn.innerHTML = '<span class="blad-nav-nr">' + b + '</span>Blad ' + BANK.nr(typ.id) + b;
    kn.addEventListener('click', function(){ visa(b); });
    nav.appendChild(kn); knappar[b] = kn;
  });
  function visa(b){
    Object.keys(mounts).forEach(function(k){
      mounts[k].hidden = (k !== b);
      knappar[k].classList.toggle('is-active', k === b); knappar[k].setAttribute('aria-selected', k === b ? 'true' : 'false');
    });
    window.NF_BLAD = typ.id + '-' + b;
    try { history.replaceState(null, '', '?typ=' + typ.id + '&blad=' + b + (new URLSearchParams(location.search).get('retur') ? '&retur=' + encodeURIComponent(new URLSearchParams(location.search).get('retur')) : '')); } catch(e){}
  }
  visa(mounts[val.blad] ? val.blad : BANK.UPPGIFTSBLAD[0]);

  /* VISA GENOMGÅNG: typens film ur föreläsningsregistret (nyckeln ak7-k3-d5). Föreläsningsmodulens egen
     yta — YouTube laddas först när eleven klickar play (noll nätväg tills dess). */
  var F = window.FOREL, f = F && F.videorFor('ak7-k3-d5').filter(function(x){ return x.id === typ.film; })[0];
  if(f && F.renderFilmer){
    gk.hidden = false;
    gk.addEventListener('click', function(){
      var oppen = gk.getAttribute('aria-expanded') === 'true';
      if(!oppen && !film.firstChild) F.renderFilmer(film, [f]);
      film.hidden = oppen; gk.setAttribute('aria-expanded', oppen ? 'false' : 'true');
    });
  }
})();
</script>

<!-- Keypaden: en delad, fast — samma montering som den gamla sidan (fälten bär data-vars per uppgift) -->
<script>
(function(){
  if(!(window.AK8_UI && AK8_UI.keypadHTML) || document.getElementById('prob-keypad')) return;
  var w = document.createElement('div'); w.innerHTML = AK8_UI.keypadHTML({ vars: 'x' });
  var kp = w.firstChild; if(!kp) return;
  kp.id = 'prob-keypad'; document.body.appendChild(kp);
  AK8_UI.bindKeypad(document.body, { byggare: window.EkvKedja && EkvKedja.byggare });
  /* KONTROLLERA NERE TILL HÖGER, ovanför knappsatsen: bladets egen knapprad (Kontrollera, Börja om)
     placeras fast över knappsatsen. Komponenten är oförändrad — bara platsen. */
  function placera(){
    var h = (kp.getBoundingClientRect().height + 28) + 'px';
    Array.prototype.forEach.call(document.querySelectorAll('.nf-yta .prob-kort .actions'), function(a){ a.style.bottom = h; });
  }
  placera(); window.addEventListener('resize', placera);
  new MutationObserver(placera).observe(document.getElementById('nf-yta'), { childList: true, subtree: true });
})();
