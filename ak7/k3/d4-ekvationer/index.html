<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekvationer med balansmetoden</title>
<link rel="stylesheet" href="../../../fonts/fonts.css">
<style>
:root{
  --ink:#1c140d; --ink-soft:#4a3d30; --ink-faint:#8a7860;
  --paper:#e8dcc4; --paper-lt:#f1e8d4; --paper-dk:#d8c9aa;
  --gold:#8a5e1e; --gold-lt:#b8893a; --blood:#7a1818;
  --green:#3f7d3a; --green-dk:#2f6a2c; --red:#b3261e; --red-dk:#8f1d17;
  --serif:'Cormorant Garamond', Georgia, serif;
  --cinzel:'Cinzel', 'Times New Roman', serif;
  --body:'Source Serif 4', Georgia, serif;
  --radius:14px;
}
*{box-sizing:border-box;}
body{background:var(--paper);background-image:radial-gradient(ellipse at top, #ece1ca 0%, var(--paper) 60%, #ddcfb2 100%);background-attachment:fixed;color:var(--ink);font-family:var(--body);line-height:1.6;margin:0;padding:0 20px 60px;}
.wrap{max-width:780px;margin:0 auto;}
header{padding:34px 0 6px;}
.proto-flag{display:inline-block;font-family:var(--cinzel);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--gold);border-radius:20px;padding:3px 12px;margin-bottom:10px;}
.eyebrow{font-family:var(--cinzel);font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);}
h1{font-family:var(--serif);font-weight:500;font-size:33px;margin:6px 0 2px;letter-spacing:.01em;}
.lede{color:var(--ink-soft);font-size:16.5px;max-width:62ch;}
.niva-rad{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 4px;}
.niva-btn{font-family:var(--cinzel);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--paper-dk);background:var(--paper-lt);color:var(--ink-soft);border-radius:9px;padding:9px 14px;cursor:pointer;transition:all .15s;}
.niva-btn.aktiv{border-color:var(--gold);background:#fff;color:var(--gold);box-shadow:0 1px 0 var(--gold-lt);}
/* flikrad */
.flik-rad{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch;margin:22px 0 4px;}
.flik{font-family:var(--cinzel);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--paper-dk);background:var(--paper-lt);color:var(--ink-soft);border-radius:9px 9px 0 0;padding:9px 13px;cursor:pointer;transition:all .15s;position:relative;border-bottom:2px solid transparent;}
.flik:hover{background:#fff;}
.flik.aktiv{border-color:var(--paper-dk);border-bottom:2px solid var(--gold);background:#fff;color:var(--gold);}
.flik.last{opacity:.55;cursor:not-allowed;}
.flik.last:hover{background:var(--paper-lt);}
.flik .flik-las{margin-left:4px;font-size:10px;}
.flik.test-flik{color:var(--blood);} .flik.test-flik.aktiv{border-bottom-color:var(--blood);}
.flik.fordjup{color:#5a4a8a;} .flik.fordjup.aktiv{border-bottom-color:#5a4a8a;}
.flik-avd{align-self:center;font-family:var(--cinzel);font-size:9px;letter-spacing:.1em;color:var(--ink-faint);padding:0 4px;text-transform:uppercase;border-left:1px dashed var(--paper-dk);margin-left:2px;}
.niva-undertitel{font-size:13px;color:var(--ink-faint);margin:-2px 0 14px;}
.card{background:var(--paper-lt);border:1px solid var(--paper-dk);border-radius:var(--radius);padding:22px 26px 8px;margin-top:14px;box-shadow:0 4px 18px rgba(60,40,15,.10);}
.niva-titel{font-family:var(--cinzel);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:2px;}
.niva-rubrik{font-family:var(--serif);font-size:24px;font-weight:500;margin-bottom:6px;}
.niva-info{font-size:14px;color:var(--ink-faint);margin:0 0 14px;}
.uppgift{padding:14px 0 16px;border-top:1px solid var(--paper-dk);}
.uppgift:first-of-type{border-top:none;}
.uppg-etikett{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--gold);margin-bottom:4px;}
.eq-grid{display:grid;grid-template-columns:1fr auto 1fr auto;align-items:baseline;gap:8px 10px;max-width:540px;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1,'tnum' 1;}
.eq-vl{justify-self:end;text-align:right;}
.eq-eq{justify-self:center;color:var(--ink-faint);font-size:21px;padding:0 2px;}
.eq-hl{justify-self:start;text-align:left;}
.eq-status{justify-self:start;font-size:17px;width:24px;text-align:center;}
.eq-uppg-vl{justify-self:end;text-align:right;font-family:var(--serif);font-size:22px;font-weight:500;padding-right:6px;}
.eq-uppg-hl{justify-self:start;text-align:left;font-family:var(--serif);font-size:22px;font-weight:500;padding-left:6px;}
.eq-uppg-eq{justify-self:center;font-size:21px;font-weight:500;color:var(--ink-faint);padding:0 2px;}
.eq-uppg-vl .x{font-style:italic;}
.sida{display:inline-flex;align-items:center;gap:0;flex-wrap:nowrap;}
.sida-vl{justify-content:flex-end;} .sida-hl{justify-content:flex-start;}
.eq-vl .sida,.eq-hl .sida{border-bottom:2px solid var(--paper-dk);padding:2px 4px;min-height:32px;align-items:center;}
.rad-ok .sida{border-bottom-color:var(--green);}
.rad-fel .sida{border-bottom-color:var(--red);}
.seg-text{font-family:var(--serif);font-size:21px;font-weight:500;color:var(--ink);border:none;background:transparent;padding:2px 2px;outline:none;text-align:center;width:auto;min-width:0;field-sizing:content;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1,'tnum' 1;}
.seg-text:focus{background:rgba(154,114,40,.05);border-radius:4px;}
.seg-brak{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;}
.brak-tal{font-family:var(--serif);font-size:16px;font-weight:500;color:var(--ink);border:none;background:transparent;outline:none;text-align:center;width:auto;min-width:26px;field-sizing:content;padding:1px 2px;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1,'tnum' 1;}
.brak-tal:focus{background:rgba(154,114,40,.06);border-radius:4px;}
.brak-streck{height:2px;width:100%;min-width:38px;background:var(--ink);margin:1px 0;}
.uppg-verktyg{display:flex;gap:8px;margin-top:8px;}
.mini-btn{font-family:var(--body);font-size:13.5px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--paper-dk);border-radius:7px;padding:4px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .12s;}
.mini-btn:hover{border-color:var(--gold-lt);background:#fff;}
.mini-brak{display:inline-flex;flex-direction:column;align-items:center;font-size:8px;line-height:1;color:var(--gold);}
.mini-streck{height:1.5px;width:10px;background:var(--gold);margin:1px 0;}
.uppg-klar{color:var(--green-dk);font-size:14px;margin-top:6px;display:none;}
.uppg-klar.show{display:block;}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 6px;}
.btn{font-family:var(--cinzel);font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:none;border-radius:10px;padding:11px 18px;cursor:pointer;transition:transform .1s;}
.btn:active{transform:translateY(1px);}
.btn.primary{background:linear-gradient(180deg,var(--gold-lt),var(--gold));color:#fff;box-shadow:0 2px 0 #6f521c;}
.btn.subtle{background:var(--paper-dk);color:var(--ink-soft);}
.global-hint{font-size:14.5px;color:var(--ink-faint);margin:2px 0 6px;min-height:20px;}
.global-hint.ok{color:var(--green-dk);} .global-hint.fel{color:var(--red-dk);}
.del-sekt{margin-bottom:8px;}
.del-sekt + .del-sekt{border-top:2px solid var(--paper-dk);padding-top:16px;margin-top:8px;}
.del-last{opacity:.7;}
.del-laskt{font-size:15px;color:var(--ink-faint);background:var(--paper-dk);border-radius:9px;padding:14px 16px;margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Kapitel 3 · Algebra</div>
    <h1>Lös ekvationerna med balansmetoden</h1>
    <p class="lede">Bygg din egen lösning – skriv en ny rad i taget. Det spelar ingen roll hur många mellanled du tar, så länge varje rad har <em>samma värde på båda sidor</em> och leder mot lösningen. Använd Bråk-knappen när du vill dela.</p>
  </header>
  <div class="flik-rad" id="flikRad"></div>
  <div class="card" id="card"></div>
  <div class="global-hint" id="ghint"></div>
  <div class="actions" id="actions"></div>
</div>
<script src="../../../js/motor/ekvationer-balans/ekvationer-balans.js"></script>
<!-- MasteryK3-loggning (elev-lokal) + deeplink-router. Observerar .uppg-klar; rör ej balansmetoden. -->
<script src="../../../js/mastery-k3.js"></script>
<script src="../../../js/motor/ekvationer-balans/k3-balans-wiring.js"></script>
<script src="../../../js/motor/keypad-clearance.js"></script>
<script src="../../../js/elevfeedback.js" defer></script>
</body>
</html>
