<script>
/* MOMENTSIDAN: skalet (js/motor/arbetsyta/momentsida.js) bär märket, de fällbara sektionerna och ramen; här står
   delkapitlets innehåll — momenten, bladen och testet. Tillbaka: Arbetsyta.retur (?retur=, annars kapitelsidan). */
(function(){
'use strict';
var M = window.Momentsida, el = M.el;
var TAX = (window.K3_TAXONOMI && window.K3_TAXONOMI.noder) || [];
var ELEVENS_AR = 7;
var DATA = window.BLAD_K3_D1_TOLKA;
if(window.Arbetsyta) window.Arbetsyta.retur();

/* ── MOMENTEN (Joachims beslut 2026-11-21): tre moment i den här ordningen, märket 7 på alla tre.
   Tolka och teckna uttryck har blad 1–3 (A och B på uppgiftssidan). Prioriteringsregeln (fyra blad i två nivåer)
   och Räkna med uttryck är inte byggda — de står som "Kommer senare". ── */
var MOMENT = [
  { titel: 'Tolka och teckna uttryck', ar: 7, roll: 'karna', bladen: DATA ? DATA.MOMENT.blad : [],
    niva: DATA ? { prefix: DATA.MOMENT.nivaPrefix, id: DATA.MOMENT.nivaId } : null },
  { titel: 'Prioriteringsregeln', ar: 7, roll: 'karna', kommer: true },
  { titel: 'Räkna med uttryck', ar: 7, roll: 'karna', kommer: true }
];

var scen = document.getElementById('scen-moment');

function visaMoment(m){
  scen.innerHTML = '';
  // Ordning och inträdesläge som problemlösningens momentsida: Uppgifter ÖPPEN; Föreläsningar och Metodträning
  // finns inte än för d1 — rubriken med "Kommer senare", inte klickbar.
  var S1 = M.sektion(scen, 'Uppgifter');
  M.sektionKommer(scen, 'Föreläsningar');
  M.sektionKommer(scen, 'Metodträning');
  // UPPGIFTER — ett blad per rad; Blad A/B väljs med växeln på uppgiftssidan.
  // SPÄRREN (NivaRad, §3): ett blad som inte är nått står med 🔒, utan länk — samma tecken som nivåraden, ingen text.
  var l1 = el('div', 'nf-lista');
  m.bladen.forEach(function(b){
    var oppet = !window.NivaRad || !m.niva || window.NivaRad.nadd(m.niva.prefix, m.niva.id, b.nr);
    var a = el(oppet ? 'a' : 'span', 'nf-blad' + (oppet ? '' : ' is-locked'));
    if(oppet) a.href = 'uppgift.html?blad=' + b.nr + 'A'; else a.setAttribute('aria-disabled', 'true');
    a.appendChild(el('span', 'nf-nr', 'Blad ' + b.nr)); a.appendChild(el('span', null, b.titel + (oppet ? '' : ' 🔒')));
    l1.appendChild(a);
  });
  S1.body.appendChild(l1);
  S1.satt(true);
}

var moment = MOMENT.map(function(m){
  // Ett moment utan innehåll än står med samma "Kommer senare" som Dagens träning (inte bara grått).
  return { titel: M.horisont(m, TAX, ELEVENS_AR) + m.titel + (m.kommer ? '<span class="nf-chip soon">Kommer senare</span>' : ''),
           kommer: !!m.kommer, valj: m.kommer ? null : function(){ visaMoment(m); } };
});

/* TEST — d1:s befintliga test (Joachim: "peka på d1:s test tills vidare"): de färdiga delkapitel-testen ur
   js/data/k3-fardiga-test.js, samma lista och samma inbäddade prov som den gamla sidans Test-flik. */
function visaTest(){
  scen.innerHTML = '';
  // Testlistan bär sin egen rubrik "Test" (renderTestFlik) — ingen sektionsrubrik till.
  var s = el('section', 'nf-sek'), panel = el('div', 'nf-test'); s.appendChild(panel); scen.appendChild(s);
  if(window.K3_FARDIGA) window.K3_FARDIGA.renderTestFlik(panel, 'k3d1', '../../../ak7-k3-ram.html');
}

M.montera({
  vard: document.getElementById('navram'), rubrik: 'Algebraiska uttryck', moment: moment, test: visaTest,
  mina: [ { titel: 'Kunskapsläge', sub: '', vy: 'mv-kunskapslage' },
          { titel: 'Självskattning', sub: '', vy: 'mv-sjalvskattning' } ]
});
})();
</script>
