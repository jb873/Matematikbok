<script>
/* MOMENTSIDAN: skalet (js/motor/arbetsyta/momentsida.js) bär märket, de fällbara sektionerna och ramen; här står
   delkapitlets innehåll — momenten, bladen och testet. Tillbaka: Arbetsyta.retur (?retur=, annars kapitelsidan). */
(function(){
'use strict';
var M = window.Momentsida, el = M.el;
var TAX = (window.K3_TAXONOMI && window.K3_TAXONOMI.noder) || [];
var ELEVENS_AR = 7;
var DATA = window.BLAD_K3_D1_TOLKA, PRIO = window.BLAD_K3_D1_PRIO, RAKNA = window.BLAD_K3_D1_RAKNA;
/* METODTRÄNING och TEST (Joachim 2026-11-24; KONVENTIONER "Arbetssidan"): sidan lämnar bara datan — trädets löv med
   bankernas id (blad-k3-d1-metod.js) och de författade testen (blad-k3-d1-test.js). Skalet (momentsida.js) bär resten. */
var METOD = window.BLAD_K3_D1_METOD ? window.BLAD_K3_D1_METOD.trad() : null;
var TESTER = window.BLAD_K3_D1_TEST ? window.BLAD_K3_D1_TEST.TESTER : [];
if(window.Arbetsyta) window.Arbetsyta.retur();

/* ── MOMENTEN (Joachims beslut 2026-11-21): tre moment i den här ordningen, märket 7 på alla tre.
   Tolka och teckna uttryck har blad 1–3 (A och B på uppgiftssidan). Prioriteringsregeln (fyra blad i två nivåer)
   och Räkna med uttryck är inte byggda — de står som "Kommer senare". Sedan dess byggda: Prioriteringsregeln
   (2026-11-22) och Räkna med uttryck (2026-11-24), två blad var, ingen spärr (§3). ── */
var MOMENT = [
  { titel: 'Tolka och teckna uttryck', ar: 7, roll: 'karna', bladen: DATA ? DATA.MOMENT.blad : [],
    id: 'tolka', niva: DATA ? { prefix: DATA.MOMENT.nivaPrefix, id: DATA.MOMENT.nivaId } : null },
  { titel: 'Prioriteringsregeln', ar: 7, roll: 'karna', id: 'prio', bladen: PRIO ? PRIO.MOMENT.blad : [] },
  { titel: 'Räkna med uttryck', ar: 7, roll: 'karna', id: 'rakna', bladen: RAKNA ? RAKNA.MOMENT.blad : [] }
];

var scen = document.getElementById('scen-moment');

function visaMoment(m){
  scen.innerHTML = '';
  // Ordning och inträdesläge som problemlösningens momentsida: Uppgifter ÖPPEN, Föreläsningar (finns inte än för d1 —
  // rubriken med "Kommer senare") och Metodträning ihopfälld; trädet är detsamma under alla tre momenten.
  var S1 = M.sektion(scen, 'Uppgifter');
  M.sektionKommer(scen, 'Föreläsningar');
  var S3 = M.metodtraning(scen, METOD);
  // UPPGIFTER — ett blad per rad; Blad A/B väljs med växeln på uppgiftssidan.
  // SPÄRREN (NivaRad, §3): ett blad som inte är nått står med 🔒, utan länk — samma tecken som nivåraden, ingen text.
  var l1 = el('div', 'nf-lista');
  m.bladen.forEach(function(b){
    // Ett blad som inte är byggt färdigt (b.kommer) står med "Kommer senare", som en sektion som inte finns än.
    var oppet = !window.NivaRad || !m.niva || window.NivaRad.nadd(m.niva.prefix, m.niva.id, b.nr);
    var a = el(oppet && !b.kommer ? 'a' : 'span', 'nf-blad' + (b.kommer ? ' is-kommer' : oppet ? '' : ' is-locked'));
    if(oppet && !b.kommer) a.href = 'uppgift.html?' + (m.id !== 'tolka' ? 'moment=' + m.id + '&' : '') + 'blad=' + b.nr + 'A';
    else a.setAttribute('aria-disabled', 'true');
    a.appendChild(el('span', 'nf-nr', 'Blad ' + b.nr)); a.appendChild(el('span', null, b.titel + (oppet || b.kommer ? '' : ' 🔒')));
    if(b.kommer) a.appendChild(el('span', 'nf-chip soon', 'Kommer senare'));
    l1.appendChild(a);
  });
  S1.body.appendChild(l1);
  S1.satt(true); if(S3) S3.satt(false);
}

var moment = MOMENT.map(function(m){
  // Ett moment utan innehåll än står med samma "Kommer senare" som Dagens träning (inte bara grått).
  return { titel: M.horisont(m, TAX, ELEVENS_AR) + m.titel + (m.kommer ? '<span class="nf-chip soon">Kommer senare</span>' : ''),
           id: m.id, kommer: !!m.kommer, valj: m.kommer ? null : function(){ visaMoment(m); } };
});

/* TEST: Joachims sex författade test (TESTER ovan), listade av skalet och öppnade på uppgiftssidan (?test=<id>).
   Aldrig länkar till gamla test eller provbyggaren. */
M.montera({
  vard: document.getElementById('navram'), rubrik: 'Algebraiska uttryck', moment: moment, tester: TESTER,
  mina: [ { titel: 'Kunskapsläge', sub: '', vy: 'mv-kunskapslage' },
          { titel: 'Självskattning', sub: '', vy: 'mv-sjalvskattning' } ]
});
/* ?moment=<id> och ?metod=1 (Tillbaka från uppgiftssidan och från metodträningens drill): skalet öppnar momentet
   och fäller ut Metodträning (Momentsida.montera). */
})();
</script>
