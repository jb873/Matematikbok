<!-- Förhandsvisning av mönsterfigurerna: figur 1–3 per familj, för jämförelse med dokumentets
     bilder till FORMEN. Antalet mäts av verktyg/monster-fuzz.js; formen måste man se. -->
<!DOCTYPE html><html lang="sv"><head><meta charset="UTF-8">
<style>
 :root{--blue:#1b4b8a;--gold:#9a7228;--rod:#c0392b;--ink:#12110f;--paper:#f6f1e8;}
 body{background:#fff;font-family:Georgia,serif;margin:16px;color:var(--ink);}
 h2{font-size:15px;margin:14px 0 4px;color:var(--gold);}
 .monster-rad{display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap;}
 .monster-figur{margin:0;text-align:center;}
 figcaption{font-size:11px;color:#7a6e65;margin-top:3px;}
</style></head><body>
<div id="ut"></div>
<script src="../js/motor/figur/svg-monster.js"></script>
<script>
var ut = document.getElementById('ut');
Object.keys(SvgMonster.FAMILJER).forEach(function(namn){
  var f = SvgMonster.FAMILJER[namn];
  ut.innerHTML += '<h2>' + namn + ' — ' + f.uttryck + '</h2>' + SvgMonster.treForsta(namn);
});
</script></body></html>
